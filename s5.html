oint, so g decreases with depth (for a roughly uniform-density Earth).", "type": "mcq", "options": ["smaller", "larger", "zero everywhere below the surface", "exactly equal"], "answer": 0}, {"q": "A satellite moves in a circular orbit of radius r around the Earth (mass M). Equating gravitational force to centripetal force gives an orbital speed of", "explanation": "GMm/r² = mv²/r leads to v² = GM/r, so v = √(GM/r).", "type": "mcq", "options": ["v = √(GM/r)", "v = GM/r²", "v = √(GMr)", "v = GM/r"], "answer": 0}, {"q": "For a satellite in circular orbit, Kepler's third law relates the orbital period T and orbital radius r as", "explanation": "From GMm/r² = m(4π²/T²)r, we get T² = 4π²r³/GM, i.e. T² ∝ r³.", "type": "mcq", "options": ["T ∝ r²", "T ∝ r³", "T² ∝ r³", "T² ∝ r"], "answer": 2}, {"q": "The time period of a satellite in a circular orbit of radius r about the Earth (mass M) is given by", "explanation": "Derived from T² = 4π²r³/(GM): T = 2π√(r³/GM).", "type": "mcq", "options": ["T = 2π√(r³/GM)", "T = 2πr/√(GM)", "T = 2π√(r/GM)", "T = 2π√(GM/r³)"], "answer": 0}, {"q": "The orbital period of a satellite around the Earth depends on the mass of the satellite itself.", "explanation": "In T² = 4π²r³/GM, the satellite's own mass cancels out; the period depends only on orbital radius r and the Earth's mass M.", "type": "tf", "answer": false}, {"q": "A geostationary satellite is one that", "explanation": "A geostationary satellite orbits in the equatorial plane, moving in the same direction as Earth's rotation with a period equal to Earth's rotation period (about 24 h), so it stays above the same point on the equator.", "type": "mcq", "options": ["has the shortest possible orbital period of any satellite", "orbits in the equatorial plane with a period of 24 hours, appearing stationary relative to a point on Earth", "orbits over the poles once every hour", "remains stationary in space while the Earth rotates beneath it"], "answer": 1}, {"q": "For a satellite to be geostationary, it must orbit", "explanation": "A geostationary orbit must lie in the equatorial plane and move west-to-east (same sense as Earth's spin) to stay fixed above one point on the equator.", "type": "mcq", "options": ["directly above the equator, from west to east", "directly above one of the poles", "in any plane, provided its period is 24 hours", "from east to west above the equator"], "answer": 0}, {"q": "The approximate altitude of a geostationary satellite above the Earth's surface is", "explanation": "Using T = 24 h and Kepler's third law with Earth's GM, the orbital radius from Earth's centre is about 42,300 km, an altitude of about 36,000 km above the surface.", "type": "mcq", "options": ["20,000 km", "36,000 km", "400 km", "1,000 km"], "answer": 1}, {"q": "Geostationary satellites are especially useful for", "explanation": "Because they appear fixed in the sky, ground antennas do not need to track them, making them ideal for continuous communication and broadcasting links.", "type": "mcq", "options": ["telecommunications and TV broadcasting, since a receiving dish can stay pointed at a fixed direction", "studying the Sun's core", "mapping the Earth's poles in detail", "close-up imaging of small surface features, since they orbit very low"], "answer": 0}, {"q": "A satellite that passes over (or near) both of the Earth's poles on each orbit is called a ______ satellite.", "explanation": "Polar satellites have orbital planes that pass near the poles, allowing them to scan the whole Earth's surface as it rotates beneath them.", "type": "fill", "answer": "polar"}, {"q": "Given Earth's mass M = 6.0 × 10²⁴ kg and G = 6.67 × 10⁻¹¹ N·m²/kg², estimate the orbital speed of a satellite at r = 7.0 × 10⁶ m.", "explanation": "v = √(GM/r) = √((6.67×10⁻¹¹ × 6.0×10²⁴)/7.0×10⁶) = √(5.72×10⁷) ≈ 7.6×10³ m/s.", "type": "mcq", "options": ["≈ 7.6 × 10³ m/s", "≈ 1.1 × 10⁴ m/s", "≈ 3.8 × 10³ m/s", "≈ 9.8 × 10² m/s"], "answer": 0}, {"q": "Two satellites A and B orbit the Earth with radii rA and rB = 4rA. According to Kepler's third law, the ratio of their periods TB/TA is", "explanation": "T² ∝ r³, so TB/TA = (rB/rA)^(3/2) = 4^(3/2) = 8.", "type": "mcq", "options": ["16", "2", "8", "4"], "answer": 2}, {"q": "The escape velocity from a planet of mass M and radius R is given by", "explanation": "Escape velocity is found by equating kinetic energy to the magnitude of gravitational potential energy: ½mv_e² = GMm/R, giving v_e = √(2GM/R).", "type": "mcq", "options": ["v_e = 2√(GM/R)", "v_e = √(2GM/R)", "v_e = √(GM/2R)", "v_e = √(GM/R)"], "answer": 1}, {"q": "The escape velocity from the Earth's surface does not depend on the mass of the object being launched.", "explanation": "In v_e = √(2GM/R), the mass of the escaping object cancels out, so escape velocity is the same for all objects at a given location.", "type": "tf", "answer": true}, {"q": "Estimate the escape velocity from Earth's surface, given M = 6.0 × 10²⁴ kg, R = 6.4 × 10⁶ m, and G = 6.67 × 10⁻¹¹ N·m²/kg².", "explanation": "v_e = √(2GM/R) = √((2×6.67×10⁻¹¹×6.0×10²⁴)/6.4×10⁶) = √(1.25×10⁸) ≈ 1.12×10⁴ m/s.", "type": "mcq", "options": ["≈ 2.2 × 10⁴ m/s", "≈ 5.6 × 10³ m/s", "≈ 7.9 × 10³ m/s", "≈ 1.1 × 10⁴ m/s"], "answer": 3}, {"q": "Gravitational potential energy of a mass m at distance r from mass M is usually written as U = −GMm/r. The negative sign indicates that", "explanation": "The zero of potential energy is conventionally chosen at infinite separation; since gravity does positive work as masses approach, the potential energy becomes negative (lower) at finite separation.", "type": "mcq", "options": ["gravitational potential energy is taken to be zero at infinite separation and decreases (becomes more negative) as masses get closer", "the masses are moving apart", "the calculation has an error and should be positive", "the gravitational force is repulsive"], "answer": 0}, {"q": "Which statement about the direction of the gravitational field of a uniform spherical mass is correct?", "explanation": "For a uniform sphere, the external gravitational field is identical to that of a point mass at the centre, always directed toward that centre.", "type": "mcq", "options": ["The field is directed tangentially around the sphere", "Outside the sphere, the field behaves as though all the mass were concentrated at the centre, directed radially inward", "The field points radially outward from the sphere's surface", "The field has no definite direction outside a sphere"], "answer": 1}, {"q": "According to Newton's law of gravitation, the force between two masses acts along the line ______ the two masses.", "explanation": "Gravitational force is a central force, acting along the straight line joining the centres of the two masses.", "type": "fill", "answer": "joining (connecting)"}, {"q": "A 60 kg astronaut orbits Earth at a height where g = 8.7 m/s². Their apparent weight (as measured by a scale in the spacecraft) would read approximately", "explanation": "In orbit, both astronaut and spacecraft are in free fall under gravity providing the centripetal force, so there is no normal contact force — the astronaut experiences apparent weightlessness even though gravity (≈522 N) still acts on them.", "type": "mcq", "options": ["588 N, their weight on Earth's surface", "zero, because they are in free fall together with the spacecraft", "60 N", "522 N, the same as the gravitational force on them"], "answer": 1}, {"q": "For two satellites orbiting the same planet, the one in the larger orbit moves with a greater orbital speed.", "explanation": "Since v = √(GM/r), orbital speed decreases as orbital radius increases; the outer satellite moves slower.", "type": "tf", "answer": false}, {"q": "A key assumption used to derive g = g₀(1 − d/R) for the variation of gravity with depth is that", "explanation": "This simple linear model treats the Earth as a uniform-density sphere, so only the mass enclosed within radius (R − d) contributes to g at that depth.", "type": "mcq", "options": ["the Earth is a perfect point mass at all depths", "gravity is unaffected by the presence of mass above the point", "the Earth's density is uniform throughout its volume", "the Earth's mass is entirely concentrated at its centre"], "answer": 2}, {"q": "If Earth's mass were to suddenly double while its radius stayed the same, the surface value of g would", "explanation": "g = GM/R²; if M doubles and R is unchanged, g doubles proportionally.", "type": "mcq", "options": ["quadruple", "halve", "stay the same", "double"], "answer": 3}]}, {"unit": 6, "title": "Unit 6: Atomic Models", "questions": [{"q": "Thomson's 'plum pudding' model of the atom described the atom as", "explanation": "Thomson pictured the atom as a uniform sphere of positive charge with negatively charged electrons distributed throughout it, resembling plums embedded in a pudding.", "type": "mcq", "options": ["a collection of neutrons and protons with no electrons at all", "a sphere of uniformly distributed positive charge with electrons embedded in it, like plums in a pudding", "a tiny, dense, positively charged nucleus orbited by electrons in fixed shells", "a cloud of negative charge with a small positive nucleus at its centre"], "answer": 1}, {"q": "The alpha-particle scattering experiment that led to Rutherford's nuclear model was performed by", "explanation": "Geiger and Marsden fired alpha particles at thin gold foil under Rutherford's supervision; the results overturned Thomson's model.", "type": "mcq", "options": ["Chadwick and Rutherford together in 1932", "Bohr and Planck", "Geiger and Marsden, under Rutherford's direction", "Thomson and Millikan"], "answer": 2}, {"q": "In the gold foil experiment, most alpha particles passed straight through the foil with little deflection. This suggested that", "explanation": "Since the vast majority of alpha particles passed through undeflected, most of the volume of an atom must be empty space.", "type": "mcq", "options": ["the atom is a solid, uniformly dense sphere", "the nucleus fills almost the whole atom", "most of the atom is empty space", "electrons are heavier than alpha particles"], "answer": 2}, {"q": "A small fraction of alpha particles in Rutherford's experiment were deflected through very large angles, some almost straight back. This showed that", "explanation": "Large-angle deflections required a concentrated positive charge and mass — the nucleus — since Thomson's spread-out charge model could not produce such strong repulsion.", "type": "mcq", "options": ["the atom contains a small, dense, positively charged nucleus", "alpha particles are negatively charged", "the atom has no positive charge at all", "electrons are positively charged"], "answer": 0}, {"q": "Rutherford's nuclear model could not be explained by Thomson's plum pudding model.", "explanation": "The plum pudding model, with charge spread throughout the atom, predicts only small deflections and cannot account for the occasional large-angle scattering observed.", "type": "tf", "answer": true}, {"q": "In Rutherford's nuclear model of the atom, most of the atom's mass is concentrated in", "explanation": "Rutherford's model places almost all the mass and all the positive charge in a very small central nucleus.", "type": "mcq", "options": ["empty space surrounding the atom", "a diffuse cloud filling the whole atom", "a tiny central nucleus", "the outer electron shells"], "answer": 2}, {"q": "In Rutherford's model, the negatively charged ______ orbit the positively charged nucleus.", "explanation": "Rutherford proposed that electrons orbit a small, dense, positive nucleus, similar to planets orbiting the Sun.", "type": "fill", "answer": "electrons"}, {"q": "A major weakness of Rutherford's classical nuclear model was that it could not explain", "explanation": "Classical electromagnetism predicts that an accelerating (orbiting) charge should radiate energy continuously, causing electrons to spiral into the nucleus almost instantly — contrary to the observed stability of atoms.", "type": "mcq", "options": ["why orbiting electrons do not continuously radiate energy and spiral into the nucleus", "why atoms have any mass at all", "why the nucleus is positively charged", "why alpha particles are deflected by gold foil"], "answer": 0}, {"q": "Bohr's model improved on Rutherford's model by proposing that", "explanation": "Bohr postulated quantised, stable orbits (stationary states) in which electrons do not radiate energy, resolving the stability problem of Rutherford's model.", "type": "mcq", "options": ["the nucleus is negatively charged", "electrons can only occupy certain discrete, stable energy levels (orbits) without radiating energy", "atoms have no internal structure", "electrons move in continuously changing, non-fixed orbits"], "answer": 1}, {"q": "According to Bohr's model, an atom emits a photon of light when", "explanation": "A photon is emitted when an electron makes a transition from a higher-energy level to a lower-energy level, with photon energy equal to the difference in energy levels.", "type": "mcq", "options": ["the nucleus splits into two smaller nuclei", "an electron absorbs a photon and stays in the same level", "two electrons collide within the same orbit", "an electron falls from a higher energy level to a lower one"], "answer": 3}, {"q": "The energy of a photon emitted or absorbed during an electron transition between two atomic energy levels E1 and E2 is given by", "explanation": "By conservation of energy, the photon's energy hf exactly equals the magnitude of the energy difference between the two levels.", "type": "mcq", "options": ["hf = |E2 − E1|", "hf = E1/E2", "hf = E1 + E2", "hf = E1 × E2"], "answer": 0}, {"q": "Atomic energy levels are described as 'quantised' because", "explanation": "Quantisation means only discrete energy values are allowed for a bound electron, in contrast to a classical continuous range.", "type": "mcq", "options": ["electrons can have any continuous range of energy", "only the ground state has a defined energy", "energy levels are always equally spaced in every atom", "an electron in an atom can only have certain specific, discrete energy values, not any value"], "answer": 3}, {"q": "The lowest energy level of an atom, in which it is most stable, is called the ______ state.", "explanation": "The ground state is the lowest possible energy level an electron can occupy in an atom.", "type": "fill", "answer": "ground"}, {"q": "An electron in an atom that has absorbed energy and moved to a higher energy level is said to be in a(n)", "explanation": "When an electron gains energy and jumps to a higher allowed level, the atom is said to be excited.", "type": "mcq", "options": ["ionised state only", "excited state", "ground state", "neutral state"], "answer": 1}, {"q": "For the hydrogen atom, the Bohr model gives the energy of level n as En = −13.6/n² eV. The energy of the electron in the n = 2 level is", "explanation": "En = −13.6/n² eV; for n = 2, E2 = −13.6/4 = −3.4 eV.", "type": "mcq", "options": ["−1.51 eV", "−6.8 eV", "−13.6 eV", "−3.4 eV"], "answer": 3}, {"q": "Using En = −13.6/n² eV for hydrogen, the energy needed to ionise a hydrogen atom from its ground state (n = 1) is", "explanation": "Ionisation energy is the energy to raise the electron from n = 1 (E1 = −13.6 eV) to n = ∞ (E = 0), which equals 13.6 eV.", "type": "mcq", "options": ["13.6 eV", "3.4 eV", "1.51 eV", "10.2 eV"], "answer": 0}, {"q": "A hydrogen electron falls from n = 3 (E3 = −1.51 eV) to n = 2 (E2 = −3.4 eV). The energy of the emitted photon is approximately", "explanation": "ΔE = E3 − E2 = −1.51 − (−3.4) = 1.89 eV, which is released as a photon.", "type": "mcq", "options": ["3.4 eV", "1.89 eV", "4.91 eV", "1.51 eV"], "answer": 1}, {"q": "The set of spectral lines produced by hydrogen electron transitions ending at n = 1 is known as the", "explanation": "Transitions ending on the n = 1 (ground) level produce the Lyman series, which lies in the ultraviolet region.", "type": "mcq", "options": ["Paschen series", "Brackett series", "Balmer series", "Lyman series"], "answer": 3}, {"q": "The Balmer series of hydrogen spectral lines corresponds to electron transitions that end at", "explanation": "The Balmer series consists of transitions from higher levels down to n = 2, and its lines lie mainly in the visible part of the spectrum.", "type": "mcq", "options": ["n = 4", "n = 1", "n = 3", "n = 2"], "answer": 3}, {"q": "Which spectral series of hydrogen lies mainly in the visible region of the electromagnetic spectrum?", "explanation": "The Balmer series (transitions ending at n = 2) produces lines with wavelengths in the visible range, historically the first hydrogen series discovered.", "type": "mcq", "options": ["Brackett series", "Paschen series", "Balmer series", "Lyman series"], "answer": 2}, {"q": "The Paschen series of hydrogen spectral lines results from transitions ending at", "explanation": "The Paschen series consists of transitions from higher levels down to n = 3, and lies in the infrared region.", "type": "mcq", "options": ["n = 5", "n = 2", "n = 3", "n = 1"], "answer": 2}, {"q": "The Lyman series of hydrogen lines lies in the ultraviolet region of the spectrum, while the Paschen series lies in the infrared.", "explanation": "Larger energy transitions (ending at n = 1, Lyman) give higher-frequency UV photons, while smaller energy transitions (ending at n = 3, Paschen) give lower-frequency infrared photons.", "type": "tf", "answer": true}, {"q": "The existence of discrete spectral lines in atomic spectra is direct evidence that atomic energy levels are ______ rather than continuous.", "explanation": "Since only specific photon energies (and hence specific line wavelengths) are observed, the underlying energy levels must be discrete/quantised.", "type": "fill", "answer": "quantised (discrete)"}, {"q": "The Rydberg formula for hydrogen spectral lines is 1/λ = R(1/n1² − 1/n2²). The Rydberg constant R has an approximate value of", "explanation": "The Rydberg constant is approximately R = 1.097 × 10⁷ m⁻¹, used to calculate hydrogen spectral line wavelengths.", "type": "mcq", "options": ["6.63 × 10⁻³⁴ m⁻¹", "1.097 × 10⁷ m⁻¹", "9.11 × 10⁻³¹ m⁻¹", "3.00 × 10⁸ m⁻¹"], "answer": 1}, {"q": "Emission line spectra are produced when", "explanation": "An emission spectrum consists of discrete bright lines produced when electrons in excited atoms fall to lower energy levels, releasing photons of specific energies.", "type": "mcq", "options": ["a solid is heated until it becomes a continuous glowing spectrum", "white light passes through a cool gas and certain wavelengths are absorbed", "electrons are permanently removed from all atoms in a sample", "excited atoms of a gas emit photons as electrons fall to lower energy levels"], "answer": 3}, {"q": "Absorption spectra appear as", "explanation": "When continuous-spectrum light passes through a cooler gas, atoms absorb photons matching their energy-level differences, producing dark lines in the transmitted spectrum at those exact wavelengths.", "type": "mcq", "options": ["randomly scattered bright and dark patches with no pattern", "dark lines at specific wavelengths against an otherwise continuous bright background spectrum", "a smooth, unbroken rainbow of colour with no lines", "bright lines on a completely dark background"], "answer": 1}, {"q": "One important application of atomic spectral analysis is", "explanation": "Each element has a unique set of spectral lines (a 'fingerprint'), allowing astronomers to identify elements present in stars and other distant sources through spectroscopy.", "type": "mcq", "options": ["producing sound waves for communication", "identifying the chemical elements present in stars from their spectral lines", "generating nuclear fusion reactions in the laboratory", "measuring the mass of the Earth directly"], "answer": 1}, {"q": "Thermionic emission is the process by which", "explanation": "Thermionic emission occurs when heating a metal (usually a filament) gives free electrons enough kinetic energy to escape the surface, overcoming the work function.", "type": "mcq", "options": ["electrons are emitted from the surface of a heated metal when they gain enough energy to overcome the work function", "electrons are emitted from a metal due to a strong externally applied electric field alone at room temperature", "electrons are knocked out of a metal surface by incident light photons", "protons are released from the nucleus of an atom"], "answer": 0}, {"q": "The work function of a metal is defined as", "explanation": "Work function φ is the minimum energy required to liberate an electron from a metal's surface into the surrounding vacuum.", "type": "mcq", "options": ["the minimum energy needed to remove an electron from the surface of the metal", "the total energy of all free electrons in the metal", "the energy released when an electron enters the metal", "the electrical resistance of the metal surface"], "answer": 0}, {"q": "Which of the following factors increases the rate of thermionic emission from a metal filament?", "explanation": "Thermionic emission increases strongly with temperature, since more electrons gain enough thermal energy to exceed the work function as temperature rises.", "type": "mcq", "options": ["Using a metal with a very high melting point but keeping temperature the same", "Increasing the work function of the metal", "Decreasing the temperature of the filament", "Increasing the temperature of the filament"], "answer": 3}, {"q": "A metal with a lower work function will, at the same temperature, generally show", "explanation": "A lower work function means less energy is needed for electrons to escape, so more electrons are emitted at a given temperature.", "type": "mcq", "options": ["a higher rate of thermionic emission", "the same emission rate as any other metal", "no thermionic emission at all", "a lower rate of thermionic emission"], "answer": 0}, {"q": "Which of the following is NOT typically listed as a factor affecting the rate of thermionic emission?", "explanation": "Thermionic emission depends on temperature, work function, and emitting surface area/condition; it is a thermal process and does not depend on the colour of any incident light (that describes the photoelectric effect instead).", "type": "mcq", "options": ["The surface area of the emitting filament", "The work function (material) of the emitting surface", "The colour of light shining on the filament", "The temperature of the filament"], "answer": 2}, {"q": "Increasing the surface area of a heated filament, while keeping temperature and material constant, increases the total thermionic emission current.", "explanation": "A larger emitting area provides more electrons at the surface with sufficient energy to escape, increasing the overall emission current at a given temperature.", "type": "tf", "answer": true}, {"q": "In a vacuum tube, the heated component that emits electrons by thermionic emission is called the ______.", "explanation": "The cathode (often a heated filament) is the electrode from which electrons are thermionically emitted in devices such as vacuum tubes and cathode ray tubes.", "type": "fill", "answer": "cathode (filament/heater)"}, {"q": "An applied electric field near a heated metal surface can increase thermionic emission by", "explanation": "A strong external electric field at the surface reduces the effective work function barrier, an effect known as the Schottky effect, enhancing thermionic emission.", "type": "mcq", "options": ["reversing the charge of emitted electrons", "lowering the effective potential barrier at the surface (the Schottky effect), helping electrons escape", "having no effect whatsoever on emission", "cooling the metal surface"], "answer": 1}, {"q": "Thomson's model correctly predicted the existence of a small, dense, positively charged nucleus at the centre of the atom.", "explanation": "Thomson's plum pudding model had positive charge spread throughout the whole atom; the concentrated nucleus was proposed later by Rutherford.", "type": "tf", "answer": false}, {"q": "Bohr's model successfully explained the line spectrum of which atom, matching experimental spectral line wavelengths closely?", "explanation": "Bohr's model gives an accurate quantitative account of the hydrogen atom's spectral lines, though it becomes far less accurate for multi-electron atoms.", "type": "mcq", "options": ["Uranium", "Helium", "Hydrogen", "Iron"], "answer": 2}, {"q": "A vacuum diode uses thermionic emission from a heated cathode; the emitted electrons are then accelerated toward the", "explanation": "Electrons emitted from the heated cathode are attracted to and collected by the positively charged anode, producing current flow through the tube.", "type": "mcq", "options": ["anode, which is held at a higher (positive) potential", "outer glass envelope of the tube", "cathode itself", "grid, which is always negative"], "answer": 0}, {"q": "The energy required to completely remove an electron from an atom, taking it from its ground state to infinity, is called the ______ energy.", "explanation": "Ionisation energy is the minimum energy needed to free a ground-state electron completely from the atom, corresponding to a transition from n = 1 to n = ∞.", "type": "fill", "answer": "ionisation"}, {"q": "Compared to Rutherford's classical model, Bohr's key new assumption was that", "explanation": "Bohr postulated that electron angular momentum is quantised, L = nh/2π (n = 1, 2, 3, ...), which restricts electrons to specific allowed orbits/energy levels.", "type": "mcq", "options": ["electrons have no mass", "the nucleus is negatively charged", "angular momentum of an orbiting electron is quantised in integer multiples of h/2π", "all electrons occupy exactly the same energy level"], "answer": 2}]}, {"unit": 7, "title": "Unit 7: Wave and Particle Nature of Light", "questions": [{"q": "A blackbody is best described as an object that", "explanation": "An ideal blackbody absorbs all incident radiation (reflecting none) and is also the most efficient possible emitter of thermal radiation at every wavelength.", "type": "mcq", "options": ["emits only radiation in the visible spectrum", "reflects all radiation incident on it perfectly", "is coloured completely black and never emits any radiation", "absorbs all electromagnetic radiation incident on it, at every wavelength"], "answer": 3}, {"q": "The Stefan-Boltzmann law for the total power radiated by a blackbody is given by", "explanation": "The Stefan-Boltzmann law states P = σAT⁴, where σ is the Stefan-Boltzmann constant, A is surface area, and T is absolute temperature.", "type": "mcq", "options": ["P = σA/T⁴", "P = σAT", "P = σAT⁴", "P = σAT²"], "answer": 2}, {"q": "In the Stefan-Boltzmann law P = σAT⁴, the symbol σ represents the ______ constant, with value approximately 5.67 × 10⁻⁸ W m⁻² K⁻⁴.", "explanation": "σ (sigma) is the Stefan-Boltzmann constant, σ ≈ 5.67 × 10⁻⁸ W/(m²K⁴).", "type": "fill", "answer": "Stefan-Boltzmann"}, {"q": "A blackbody of surface area 0.02 m² is at an absolute temperature of 500 K. Using σ = 5.67 × 10⁻⁸ W m⁻² K⁻⁴, its radiated power is approximately", "explanation": "P = σAT⁴ = 5.67×10⁻⁸ × 0.02 × (500)⁴ = 5.67×10⁻⁸ × 0.02 × 6.25×10¹⁰ ≈ 70.9 W.", "type": "mcq", "options": ["709 W", "7.09 W", "0.709 W", "70.9 W"], "answer": 3}, {"q": "According to the Stefan-Boltzmann law, if the absolute temperature of a blackbody doubles, the power it radiates increases by a factor of 16.", "explanation": "Since P ∝ T⁴, doubling T multiplies power by 2⁴ = 16.", "type": "tf", "answer": true}, {"q": "The classical (Rayleigh-Jeans) theory of blackbody radiation failed at short wavelengths, a problem historically known as the", "explanation": "Classical wave theory predicted infinite radiated energy at short (ultraviolet) wavelengths, a clear contradiction with experiment called the ultraviolet catastrophe.", "type": "mcq", "options": ["infrared collapse", "quantum tunnelling problem", "ultraviolet catastrophe", "photoelectric paradox"], "answer": 2}, {"q": "Planck resolved the ultraviolet catastrophe by proposing that", "explanation": "Planck's quantum hypothesis assumed oscillators in the blackbody could only have energies that are integer multiples of hf, successfully matching the observed spectrum.", "type": "mcq", "options": ["light travels only as a continuous wave with no minimum energy unit", "electromagnetic energy is emitted or absorbed only in discrete packets (quanta) of energy E = hf", "blackbodies do not actually emit radiation", "the speed of light varies with frequency"], "answer": 1}, {"q": "In Planck's quantum theory, the energy of one quantum of radiation of frequency f is given by", "explanation": "Planck proposed that radiant energy is quantised in units of E = hf, where h is Planck's constant.", "type": "mcq", "options": ["E = h/f", "E = hf", "E = hf²", "E = h²f"], "answer": 1}, {"q": "Planck's constant h has an approximate value of ______ J·s.", "explanation": "Planck's constant is h ≈ 6.63 × 10⁻³⁴ J s, relating a photon's energy to its frequency via E = hf.", "type": "fill", "answer": "6.63 × 10⁻³⁴"}, {"q": "According to the photon theory of light, a beam of light can be thought of as consisting of", "explanation": "Einstein's photon theory treats light as a stream of discrete energy quanta (photons), each with energy E = hf.", "type": "mcq", "options": ["sound-like pressure waves travelling through the ether", "only a classical electromagnetic wave with no particle behaviour", "discrete packets of energy called photons, each carrying energy E = hf", "a continuous stream of massive particles with no wave properties"], "answer": 2}, {"q": "Calculate the energy of a photon of light with frequency 6.0 × 10¹⁴ Hz, given h = 6.63 × 10⁻³⁴ J·s.", "explanation": "E = hf = 6.63×10⁻³⁴ × 6.0×10¹⁴ = 3.98×10⁻¹⁹ J.", "type": "mcq", "options": ["3.98 × 10⁻¹⁵ J", "3.98 × 10⁻¹⁹ J", "6.63 × 10⁻³⁴ J", "1.10 × 10⁻⁴⁸ J"], "answer": 1}, {"q": "The energy of a photon can also be written in terms of wavelength λ and the speed of light c as", "explanation": "Since c = fλ, substituting f = c/λ into E = hf gives E = hc/λ.", "type": "mcq", "options": ["E = hc/λ", "E = hλ/c", "E = hcλ", "E = h/(cλ)"], "answer": 0}, {"q": "A photon has a wavelength of 500 nm. Using h = 6.63 × 10⁻³⁴ J·s and c = 3.0 × 10⁸ m/s, its energy is approximately", "explanation": "E = hc/λ = (6.63×10⁻³⁴ × 3.0×10⁸)/(500×10⁻⁹) = (1.989×10⁻²⁵)/(5×10⁻⁷) ≈ 3.98×10⁻¹⁹ J.", "type": "mcq", "options": ["1.99 × 10⁻²⁵ J", "6.63 × 10⁻¹⁹ J", "3.98 × 10⁻¹⁶ J", "3.98 × 10⁻¹⁹ J"], "answer": 3}, {"q": "Wave-particle duality refers to the idea that", "explanation": "Wave-particle duality states that light and matter both display wave behaviour (interference, diffraction) and particle behaviour (photons, quantised energy), depending on how they are observed.", "type": "mcq", "options": ["only matter, not light, can show wave and particle behaviour", "light is always a wave and never behaves like a particle", "light is always made of particles and never behaves like a wave", "light (and matter) can exhibit both wave-like and particle-like properties, depending on the experiment"], "answer": 3}, {"q": "The principle of complementarity, introduced by Bohr, states that", "explanation": "Complementarity holds that wave and particle descriptions are both necessary and complementary, but a given experimental setup will reveal only one aspect at a time.", "type": "mcq", "options": ["the wave and particle aspects of light are complementary; a single experiment can reveal one aspect at a time but never both simultaneously", "light behaves only as a wave under all experimental conditions", "wave and particle models of light are entirely incompatible and one must be discarded", "particles have no associated wave properties at all"], "answer": 0}, {"q": "Interference and diffraction experiments demonstrate the wave nature of light, while the photoelectric effect demonstrates its particle nature.", "explanation": "Interference/diffraction patterns arise from superposition of waves, whereas the photoelectric effect is best explained by treating light as discrete photons.", "type": "tf", "answer": true}, {"q": "In the photoelectric effect, the threshold frequency is defined as", "explanation": "Threshold frequency f₀ is the minimum frequency needed so that a single photon has enough energy to overcome the work function; below f₀, no photoemission occurs no matter how intense the light.", "type": "mcq", "options": ["the frequency at which the maximum number of photoelectrons is emitted", "the frequency corresponding to red light in every metal", "the minimum frequency of incident light below which no photoelectrons are emitted, regardless of intensity", "the frequency of light that gives photoelectrons the least possible kinetic energy"], "answer": 2}, {"q": "Einstein's photoelectric equation is written as", "explanation": "Energy conservation gives the photon energy hf equal to the work function φ plus the maximum kinetic energy KE_max of the emitted electron.", "type": "mcq", "options": ["hf = φ × KE_max", "hf = φ + KE_max", "hf = φ − KE_max", "hf = φ/KE_max"], "answer": 1}, {"q": "The work function of a metal in the photoelectric effect is", "explanation": "The work function φ represents the minimum energy an electron must gain to escape the metal surface.", "type": "mcq", "options": ["the frequency of the incident light", "the minimum energy needed to eject an electron from the metal's surface", "the stopping potential of the photocell", "the total kinetic energy of all electrons ejected from the metal"], "answer": 1}, {"q": "In a photoelectric experiment, the stopping potential is the", "explanation": "The stopping potential V₀ is the minimum reverse voltage required to bring the photocurrent to zero, related to maximum kinetic energy by eV₀ = KE_max.", "type": "mcq", "options": ["reverse voltage needed to just stop the most energetic photoelectrons from reaching the collector", "potential difference across the light source", "voltage that produces the maximum photoelectric current", "voltage that increases the frequency of the incident light"], "answer": 0}, {"q": "A metal has a work function of 2.0 eV. Light of frequency 1.0 × 10¹⁵ Hz (energy ≈ 4.14 eV) is shone on it. The maximum kinetic energy of emitted photoelectrons is approximately", "explanation": "KE_max = hf − φ = 4.14 eV − 2.0 eV = 2.14 eV.", "type": "mcq", "options": ["2.14 eV", "2.0 eV", "4.14 eV", "6.14 eV"], "answer": 0}, {"q": "In the photoelectric effect, increasing the intensity of light (above the threshold frequency) while keeping frequency constant results in", "explanation": "Intensity controls the number of photons per second, hence the number of photoelectrons emitted, but each photon still carries the same energy hf, so maximum kinetic energy is unchanged.", "type": "mcq", "options": ["fewer photoelectrons emitted per second", "more photoelectrons emitted per second, but the same maximum kinetic energy per electron", "a higher maximum kinetic energy for each photoelectron", "no photoelectrons at all, regardless of frequency"], "answer": 1}, {"q": "According to Einstein's photoelectric theory, the maximum kinetic energy of photoelectrons increases with the frequency of incident light, not its intensity.", "explanation": "KE_max = hf − φ depends only on frequency (via hf) and the work function, not on light intensity, which affects only the number of photoelectrons.", "type": "tf", "answer": true}, {"q": "If the frequency of incident light on a metal surface is below the threshold frequency, then", "explanation": "Below threshold frequency, individual photons do not carry enough energy to overcome the work function, so no photoelectrons are emitted regardless of intensity.", "type": "mcq", "options": ["no photoelectrons are emitted no matter how intense the light is", "the metal emits electrons continuously regardless of frequency", "photoelectrons are emitted but with zero kinetic energy", "photoelectrons are emitted only if the light is very intense"], "answer": 0}, {"q": "The stopping potential V₀ is related to the maximum kinetic energy of photoelectrons by the equation KE_max = ______.", "explanation": "The work done against the stopping (retarding) potential equals the maximum kinetic energy: eV₀ = KE_max, where e is the electron's charge.", "type": "fill", "answer": "eV₀"}, {"q": "A photocell has a threshold wavelength of 600 nm. Using hc ≈ 1240 eV·nm, the work function of the metal is approximately", "explanation": "φ = hc/λ₀ = 1240 eV·nm / 600 nm ≈ 2.07 eV.", "type": "mcq", "options": ["0.60 eV", "1.24 eV", "3.10 eV", "2.07 eV"], "answer": 3}, {"q": "The photoelectric effect provided strong evidence for the", "explanation": "Classical wave theory could not explain the instantaneous emission, threshold frequency, or intensity-independence of kinetic energy seen in the photoelectric effect; Einstein's photon model explained all of these.", "type": "mcq", "options": ["purely wave nature of light", "idea that light has no energy at all", "existence of the ether", "particle (photon) nature of light"], "answer": 3}, {"q": "When a photon collides with a free electron and transfers some energy and momentum to it, causing the scattered photon to have a longer wavelength, this phenomenon is called", "explanation": "In Compton scattering, a photon transfers part of its energy and momentum to an electron, resulting in a scattered photon of lower energy (longer wavelength) — direct evidence of photon momentum.", "type": "mcq", "options": ["the photoelectric effect", "the Compton effect", "thermionic emission", "the Doppler effect"], "answer": 1}, {"q": "de Broglie proposed that particles of matter, such as electrons, have an associated wavelength given by", "explanation": "The de Broglie wavelength relates a particle's wave nature to its momentum: λ = h/p = h/(mv).", "type": "mcq", "options": ["λ = h/p (where p is the particle's momentum)", "λ = pE/h", "λ = hp", "λ = h/E"], "answer": 0}, {"q": "An electron of mass 9.11 × 10⁻³¹ kg moves at 2.0 × 10⁶ m/s. Using h = 6.63 × 10⁻³⁴ J·s, its de Broglie wavelength is approximately", "explanation": "λ = h/(mv) = 6.63×10⁻³⁴/(9.11×10⁻³¹ × 2.0×10⁶) = 6.63×10⁻³⁴/1.822×10⁻²⁴ ≈ 3.6×10⁻¹⁰ m.", "type": "mcq", "options": ["3.6 × 10⁻⁷ m", "7.3 × 10⁻¹⁰ m", "3.6 × 10⁻¹⁰ m", "1.8 × 10⁻¹⁰ m"], "answer": 2}, {"q": "The wave nature of matter, proposed by de Broglie, has been experimentally confirmed by electron diffraction experiments.", "explanation": "Davisson and Germer's electron diffraction experiment showed electrons producing diffraction patterns, confirming their wave-like behaviour as predicted by de Broglie.", "type": "tf", "answer": true}, {"q": "Because de Broglie's wavelength λ = h/p is inversely proportional to momentum, macroscopic (large, everyday) objects have de Broglie wavelengths that are", "explanation": "Since ordinary objects have large momentum, h/p becomes vanishingly small, far too tiny to produce observable wave effects, unlike for electrons or other subatomic particles.", "type": "mcq", "options": ["extremely small and undetectable, so their wave nature is not observed in daily life", "extremely large, easily observed as diffraction in daily life", "always equal to the wavelength of visible light", "exactly equal to their physical size"], "answer": 0}, {"q": "Which observation is best explained using the particle (photon) model of light rather than the wave model?", "explanation": "A threshold frequency, below which no photoemission occurs regardless of intensity, is naturally explained only if light energy comes in discrete photon packets of energy hf.", "type": "mcq", "options": ["Diffraction of light around obstacles", "The formation of interference fringes in Young's double-slit experiment", "Polarisation of light", "The existence of a sharp threshold frequency in the photoelectric effect"], "answer": 3}, {"q": "The energy carried by a single photon of electromagnetic radiation is directly proportional to its ______.", "explanation": "From E = hf, photon energy is directly proportional to the frequency of the radiation (and inversely proportional to its wavelength).", "type": "fill", "answer": "frequency"}, {"q": "As the temperature of a blackbody increases, the wavelength at which it emits most strongly (according to Wien's displacement law)", "explanation": "Wien's displacement law, λ_max T = constant, shows that as temperature increases, the peak emission wavelength shifts to shorter (bluer) wavelengths.", "type": "mcq", "options": ["stays exactly the same", "increases (shifts toward longer wavelengths)", "decreases (shifts toward shorter wavelengths)", "becomes infinite"], "answer": 2}, {"q": "A star's surface radiates approximately as a blackbody. If Star A has twice the absolute surface temperature of Star B but the same surface area, Star A radiates power that is", "explanation": "P ∝ T⁴, so doubling T multiplies radiated power by 2⁴ = 16, assuming equal surface areas.", "type": "mcq", "options": ["8 times that of Star B", "2 times that of Star B", "16 times that of Star B", "4 times that of Star B"], "answer": 2}, {"q": "Which of the following best explains why increasing the intensity of light below the threshold frequency still produces no photoelectrons?", "explanation": "In the photon model, each photoelectron interacts with (and absorbs) essentially one photon at a time; if a single photon's energy hf is below φ, emission cannot occur, however many such photons arrive.", "type": "mcq", "options": ["Higher intensity light has fewer photons", "Electrons absorb energy over long times until enough builds up, regardless of frequency", "Increasing intensity always increases photon frequency", "Each photon still carries insufficient energy (hf < φ), and electrons cannot combine energy from multiple photons"], "answer": 3}, {"q": "The graph of maximum kinetic energy of photoelectrons (KE_max) versus frequency (f) of incident light is a straight line whose gradient represents", "explanation": "Rearranging Einstein's equation gives KE_max = hf − φ, a straight line of the form y = mx + c with gradient h and y-intercept −φ.", "type": "mcq", "options": ["the speed of light, c", "the work function, φ", "Planck's constant, h", "the stopping potential, V₀"], "answer": 2}, {"q": "In the KE_max versus frequency graph for the photoelectric effect, the frequency-axis intercept represents", "explanation": "The line KE_max = hf − φ crosses the frequency axis (KE_max = 0) at f = φ/h, which is the threshold frequency f₀.", "type": "mcq", "options": ["the work function, φ, directly in joules", "the threshold frequency, f₀", "the stopping potential", "Planck's constant"], "answer": 1}, {"q": "Complementarity in quantum physics is closely linked to which idea?", "explanation": "Complementarity states that wave and particle descriptions apply under different experimental conditions, and a single measurement setup reveals only one of these aspects at a time.", "type": "mcq", "options": ["That no single experiment can simultaneously display both the fully wave-like and fully particle-like nature of light", "That measurement never affects a quantum system", "That light always behaves identically to sound waves", "That classical physics fully explains all quantum phenomena"], "answer": 0}]}, {"unit": 8, "title": "Unit 8: Signals and Communication Systems", "questions": [{"q": "Communication, in the context of physics and engineering, is best defined as", "explanation": "Communication is the transfer of information from a transmitting point to a receiving point via some form of signal carried through a channel.", "type": "mcq", "options": ["the process of generating electricity from mechanical energy", "the conversion of heat into mechanical work", "the storage of information in a computer memory", "the process of transferring information from one point (sender) to another (receiver) using a signal"], "answer": 3}, {"q": "Why is communication important in modern society?", "explanation": "Effective communication systems enable fast exchange of information essential for business, education, emergency services, governance and everyday social life.", "type": "mcq", "options": ["It replaces the need for transportation entirely", "It allows rapid, reliable sharing of information over long distances for business, education, safety and social connection", "It has no real practical importance beyond entertainment", "It only matters for military applications"], "answer": 1}, {"q": "Which of the following is an example of a wired (guided) communication system?", "explanation": "Wired systems use a physical medium such as copper cable or optical fibre to guide the signal, unlike radio, satellite or mobile systems which use free-space electromagnetic waves.", "type": "mcq", "options": ["Satellite communication", "Telephone communication over copper cables or optical fibre", "Radio broadcasting through the atmosphere", "Mobile phone communication via cell towers"], "answer": 1}, {"q": "Which of the following is an example of a wireless communication system?", "explanation": "Radio broadcasting transmits electromagnetic waves through free space (air) rather than along a physical conductor, making it a wireless system.", "type": "mcq", "options": ["Radio broadcasting", "Landline telephone using copper wire", "Fibre-optic internet cable", "Coaxial cable television"], "answer": 0}, {"q": "The three basic components shown in the block diagram of a general communication system are", "explanation": "Every communication system can be represented in block form as: information source → transmitter → channel (medium) → receiver → destination.", "type": "mcq", "options": ["modulator, demodulator, and filter only", "microphone, amplifier, and loudspeaker", "antenna, battery, and switch", "transmitter, channel, and receiver"], "answer": 3}, {"q": "In a communication system, the function of the transmitter is to", "explanation": "The transmitter takes the original message signal and processes it (e.g. amplifies, modulates) so that it can be efficiently sent through the communication channel.", "type": "mcq", "options": ["process and convert the input information signal into a form suitable for transmission through the channel", "store information indefinitely without transmitting it", "always convert digital data into printed text", "receive and decode the final message for the user"], "answer": 0}, {"q": "The channel in a communication system refers to", "explanation": "The channel is the medium — such as a cable, optical fibre, or free space — that carries the signal from the transmitter to the receiver.", "type": "mcq", "options": ["the physical medium through which the signal travels from transmitter to receiver", "the component that displays the final received message", "the battery that powers the transmitter", "the device that generates the original message"], "answer": 0}, {"q": "The function of the receiver in a communication system is to", "explanation": "The receiver detects the incoming signal and processes it (e.g. demodulates, amplifies) to reconstruct the original information for the destination.", "type": "mcq", "options": ["always encrypt the message further before delivery", "generate the original information signal", "pick up the transmitted signal from the channel and convert it back into a usable form of the original information", "amplify only the transmitter's power supply"], "answer": 2}, {"q": "In a block diagram of a communication system, information travels in the order: information source → ______ → channel → receiver → destination.", "explanation": "The standard block diagram places the transmitter between the information source and the channel, converting the message for transmission.", "type": "fill", "answer": "transmitter"}, {"q": "Noise is an unwanted disturbance that can be introduced into a signal as it passes through the communication channel.", "explanation": "Noise refers to random, unwanted signals that interfere with and can degrade the quality of the transmitted information as it travels through the channel.", "type": "tf", "answer": true}, {"q": "A signal, in communication systems, is defined as", "explanation": "A signal is a time-varying physical quantity, typically an electrical voltage or current, used to represent and carry information.", "type": "mcq", "options": ["a fixed constant value with no variation over time", "a physical quantity (such as voltage or current) that varies with time and carries information", "any object used to build a transmitter", "the noise present in a communication channel"], "answer": 1}, {"q": "An analogue signal is one that", "explanation": "An analogue signal is continuous, capable of taking any value over a range, in contrast to a digital signal which is restricted to discrete levels.", "type": "mcq", "options": ["can only take one of two discrete values, 0 or 1", "is always transmitted using light instead of electricity", "varies continuously in amplitude and time, taking any value within a range", "never carries any information"], "answer": 2}, {"q": "A digital signal is one that", "explanation": "Digital signals are represented using discrete levels, most commonly binary values of 0 and 1, unlike the continuously varying analogue signal.", "type": "mcq", "options": ["takes only discrete (usually two) distinct values, typically represented as 0s and 1s", "always has a sinusoidal waveform", "varies smoothly and continuously with time", "cannot be processed by computers"], "answer": 0}, {"q": "Digital signals are generally more resistant to noise than analogue signals, since small variations can often still be correctly interpreted as one of the discrete levels.", "explanation": "Because digital signals only need to be distinguished between a small number of discrete levels, minor noise-induced distortions are less likely to cause misinterpretation compared with continuous analogue signals.", "type": "tf", "answer": true}, {"q": "Which of the following is an example of an analogue signal?", "explanation": "A microphone converts continuously varying sound pressure into a continuously varying voltage, which is an analogue signal.", "type": "mcq", "options": ["A sequence of 0s and 1s stored in memory", "A binary computer data stream", "The output voltage of a microphone directly picking up sound", "A digital clock display signal"], "answer": 2}, {"q": "The process of converting a digital signal into an analogue signal is called", "explanation": "A Digital-to-Analogue Converter (DAC) transforms discrete digital data back into a continuously varying analogue signal, for example to drive a loudspeaker.", "type": "mcq", "options": ["Analog-to-Digital Conversion (ADC)", "Digital-to-Analogue Conversion (DAC)", "modulation only", "amplification"], "answer": 1}, {"q": "The process of converting an analogue signal into a digital signal is called", "explanation": "An Analog-to-Digital Converter (ADC) samples a continuous analogue signal and represents it as discrete digital values.", "type": "mcq", "options": ["demodulation", "Digital-to-Analogue Conversion (DAC)", "rectification", "Analog-to-Digital Conversion (ADC)"], "answer": 3}, {"q": "A device that converts an analogue signal into a digital signal is called a(n) ______.", "explanation": "An ADC samples and quantises a continuous analogue signal into discrete digital values for processing, storage or transmission.", "type": "fill", "answer": "ADC (Analog-to-Digital Converter)"}, {"q": "Why is signal conversion (ADC/DAC) important in modern communication systems?", "explanation": "Signal conversion lets real-world analogue signals (like sound) be processed digitally for benefits such as noise resistance, easy storage and compression, then converted back to analogue for output (e.g. sound from a speaker).", "type": "mcq", "options": ["It permanently destroys the original information", "It has no practical use in real systems", "It allows digital processing, storage and long-distance transmission of signals that originate as, or must be delivered as, analogue quantities", "It only matters for military communication"], "answer": 2}, {"q": "A CD or digital audio player must use a Digital-to-Analogue Converter (DAC) to convert stored digital audio data back into an analogue signal that a loudspeaker can reproduce as sound.", "explanation": "Digital audio is stored as binary data; a DAC reconstructs this into a continuously varying analogue voltage signal that drives the speaker.", "type": "tf", "answer": true}, {"q": "Modulation, in communication systems, is defined as", "explanation": "Modulation impresses the information signal onto a high-frequency carrier wave by varying one of the carrier's characteristics (amplitude, frequency, or phase).", "type": "mcq", "options": ["the conversion of a digital signal into binary code", "the process of amplifying a signal without changing any of its properties", "the complete removal of noise from a channel", "the process of varying a property (amplitude, frequency, or phase) of a high-frequency carrier wave in accordance with the information signal"], "answer": 3}, {"q": "The main reason a message (baseband) signal is modulated onto a high-frequency carrier before transmission is to", "explanation": "Low-frequency baseband signals would require impractically large antennas and cannot easily share a transmission medium; modulating onto a high-frequency carrier solves both problems by enabling practical antenna sizes and frequency-division of channels.", "type": "mcq", "options": ["convert the signal permanently into a digital format", "increase the noise in the channel deliberately", "make the signal completely silent", "allow efficient transmission over long distances using practically sized antennas, and to enable multiple signals to share the spectrum"], "answer": 3}, {"q": "In Amplitude Modulation (AM), the property of the carrier wave that is varied according to the information signal is its", "explanation": "In AM, the carrier's amplitude is made to vary in step with the instantaneous amplitude of the message signal, while its frequency stays constant.", "type": "mcq", "options": ["phase", "amplitude", "wavelength only", "frequency"], "answer": 1}, {"q": "In Frequency Modulation (FM), the property of the carrier wave that is varied according to the information signal is its", "explanation": "In FM, the carrier's frequency is varied in proportion to the instantaneous amplitude of the message signal, while the carrier's amplitude remains constant.", "type": "mcq", "options": ["DC offset only", "frequency", "wavelength of the message signal", "amplitude"], "answer": 1}, {"q": "FM (Frequency Modulation) broadcasting is generally less affected by amplitude-based noise and static than AM (Amplitude Modulation) broadcasting.", "explanation": "Since information in FM is carried in frequency variations rather than amplitude variations, amplitude-based noise (such as electrical interference) has much less effect on FM signal quality than on AM.", "type": "tf", "answer": true}, {"q": "Which type of modulation keeps the carrier wave's frequency constant but changes its amplitude to match the message signal?", "explanation": "AM varies carrier amplitude while frequency stays fixed; this is the defining feature that distinguishes it from FM and PM.", "type": "mcq", "options": ["Phase Modulation (PM)", "Pulse Code Modulation only", "Frequency Modulation (FM)", "Amplitude Modulation (AM)"], "answer": 3}, {"q": "The high-frequency wave onto which an information signal is impressed during modulation is called the ______ wave.", "explanation": "The carrier wave is the high-frequency signal that 'carries' the lower-frequency information signal after modulation.", "type": "fill", "answer": "carrier"}, {"q": "A radio communication system fundamentally consists of", "explanation": "A basic radio communication system has a transmitting station (with modulator and antenna), free space as the channel, and a receiving station (with antenna, demodulator, and output device).", "type": "mcq", "options": ["a keyboard and a computer monitor", "a single antenna with no transmitter or receiver", "a transmitter with antenna, a transmission channel (free space), and a receiver with antenna", "only a microphone and a loudspeaker connected directly by wire"], "answer": 2}, {"q": "In a radio receiver, the component that extracts the original information signal from the modulated carrier wave is called the", "explanation": "The demodulator (or detector) reverses the modulation process at the receiver, recovering the original message signal from the received modulated carrier.", "type": "mcq", "options": ["modulator", "oscillator only", "demodulator (detector)", "power amplifier only"], "answer": 2}, {"q": "The antenna in a radio communication system is used to", "explanation": "An antenna converts electrical signals into radiated electromagnetic waves for transmission, or captures incoming electromagnetic waves and converts them back into electrical signals for reception.", "type": "mcq", "options": ["radiate electromagnetic waves into space (transmitting antenna) or intercept them from space (receiving antenna)", "store electrical energy permanently", "amplify audio signals only", "convert sound directly into digital code"], "answer": 0}, {"q": "In early telecommunication history, Post, Telegraph and Telephone (PTT) organisations were often the state bodies responsible for postal services as well as telegraph and telephone networks.", "explanation": "Historically, many countries had a single government-run PTT authority that managed postal delivery alongside telegraph and telephone communication services before these were later separated or privatised.", "type": "tf", "answer": true}, {"q": "The telegraph, an early form of long-distance electrical communication, primarily transmitted messages using", "explanation": "The electrical telegraph sent messages as a series of on/off electrical pulses, commonly encoded using Morse code, along a wire connection between stations.", "type": "mcq", "options": ["coded electrical pulses (such as Morse code) sent along wires", "continuous analogue voice signals", "digital packets over the internet", "modulated radio waves through free space only"], "answer": 0}, {"q": "Compared to the telegraph, the telephone represented an advance because it allowed", "explanation": "The telephone converts sound (voice) directly into a varying electrical signal that can be transmitted and reconverted into sound, unlike the telegraph which sent coded pulses representing letters.", "type": "mcq", "options": ["direct transmission of the human voice as a continuously varying (analogue) electrical signal", "the elimination of all wires in communication", "transmission of only written text messages", "communication only within a single building"], "answer": 0}, {"q": "A key advantage of digital communication systems over analogue systems is that digital signals", "explanation": "Digital signals, being discrete, can be detected and regenerated cleanly at repeater stations, preventing the accumulation of noise that occurs in analogue systems over long distances.", "type": "mcq", "options": ["are never affected by any interference at all", "always require less bandwidth than analogue signals", "can be regenerated (cleaned up) at intervals along long transmission paths, reducing the buildup of noise", "cannot be stored or processed by computers"], "answer": 2}, {"q": "Which of the following is an example of a modern digital communication system?", "explanation": "Modern mobile networks convert voice and data into digital form for transmission, offering better noise resistance, security and efficient use of bandwidth.", "type": "mcq", "options": ["The original 19th century electrical telegraph", "Mobile (cellular) telephone networks using digital voice and data encoding", "An analogue vinyl record player", "Traditional analogue AM radio broadcasting"], "answer": 1}, {"q": "A device that converts sound waves into an electrical signal for transmission, such as in a telephone or radio microphone, is called a ______.", "explanation": "A microphone is a transducer that converts acoustic (sound) energy into an equivalent electrical signal for further processing or transmission.", "type": "fill", "answer": "microphone (transducer)"}, {"q": "In a basic communication system block diagram, the destination is the point where the original information is finally used or understood by the receiver of the message.", "explanation": "The destination represents the end-user or device that receives and makes use of the reconstructed information signal after it passes through the receiver.", "type": "tf", "answer": true}, {"q": "Bandwidth, in the context of communication systems, refers to", "explanation": "Bandwidth is the width of the frequency range that a signal occupies or that a communication channel is able to carry.", "type": "mcq", "options": ["the physical thickness of a transmission cable", "the range of frequencies that a channel or signal occupies or can carry", "the total distance a signal can travel", "the number of receivers connected to a channel"], "answer": 1}, {"q": "Compared to AM radio, FM radio generally requires", "explanation": "FM signals typically occupy a wider bandwidth than AM signals, but this trade-off provides greater resistance to noise and higher fidelity audio reproduction.", "type": "mcq", "options": ["a wider bandwidth, but can provide higher quality (less noisy) audio", "no bandwidth at all", "an identical bandwidth in all cases", "a narrower bandwidth and lower audio quality"], "answer": 0}, {"q": "Satellite communication systems are a modern type of communication system that primarily rely on", "explanation": "Communication satellites receive signals from a ground station, amplify them, and retransmit them to another location, enabling long-distance and remote-area communication that ground-based systems could not easily provide.", "type": "mcq", "options": ["hand-delivered written letters", "sound waves travelling through the atmosphere", "underground fibre-optic cables exclusively", "relaying signals via satellites orbiting the Earth to cover very long distances, including across oceans and remote areas"], "answer": 3}]}, {"unit": 9, "title": "Unit 9: Magnetic Field and Magnetic Forces", "questions": [{"q": "What is a magnetic field?", "explanation": "A magnetic field is the region around a magnet or current-carrying conductor in which a force is exerted on other magnets, magnetic materials, or moving charges.", "type": "mcq", "options": ["A region of space where an electric charge experiences a force due to its charge alone", "A region of space around a magnet or current-carrying conductor where a magnetic force can be detected on another magnet or moving charge", "The space occupied by a stationary magnet only", "A field that exists only inside conducting wires"], "answer": 1}, {"q": "Which of the following is NOT a property of magnetic field lines?", "explanation": "Magnetic field lines never intersect anywhere, since a crossing point would imply two directions of the field at the same point, which is impossible.", "type": "mcq", "options": ["They emerge from the north pole and enter the south pole outside the magnet", "They form closed loops", "They never intersect each other", "They can cross each other at points of zero field strength"], "answer": 3}, {"q": "Outside a bar magnet, magnetic field lines point:", "explanation": "By convention, magnetic field lines emerge from the north pole and travel through the external space to the south pole, then continue inside the magnet from south to north.", "type": "mcq", "options": ["From south pole to north pole", "From north pole to south pole", "Perpendicular to the magnet's axis only", "Randomly in all directions"], "answer": 1}, {"q": "According to the right-hand grip rule, if a straight wire carries current upward, the magnetic field lines around it form:", "explanation": "Gripping the wire with the right thumb pointing in the direction of current flow, the curled fingers give the direction of the circular field lines; viewed from above with current going up, they appear counter-clockwise.", "type": "mcq", "options": ["Straight lines parallel to the wire", "Radial lines pointing away from the wire", "Concentric circles in a plane perpendicular to the wire, counter-clockwise when viewed from above", "Concentric circles, clockwise when viewed from above"], "answer": 2}, {"q": "The magnetic field at a perpendicular distance r from a long straight current-carrying wire carrying current I is given by:", "explanation": "The magnetic field around an infinite straight conductor is B = μ₀I/(2πr), decreasing inversely with distance from the wire.", "type": "mcq", "options": ["B = μ₀Ir/(2π)", "B = μ₀nI", "B = μ₀I/(2r)", "B = μ₀I/(2πr)"], "answer": 3}, {"q": "A long straight wire carries a current of 10 A. What is the magnetic field at a perpendicular distance of 5 cm from the wire? (μ₀ = 4π×10⁻⁷ T·m/A)", "explanation": "B = μ₀I/(2πr) = (4π×10⁻⁷ × 10)/(2π × 0.05) = (2×10⁻⁶)/(0.05) = 4 × 10⁻⁵ T.", "type": "mcq", "options": ["4 × 10⁻⁴ T", "8 × 10⁻⁵ T", "4 × 10⁻⁵ T", "4 × 10⁻⁶ T"], "answer": 2}, {"q": "The magnetic field inside a long, tightly-wound solenoid carrying current I with n turns per unit length is given by:", "explanation": "For an ideal long solenoid, the field inside is uniform and given by B = μ₀nI, where n is the number of turns per unit length.", "type": "mcq", "options": ["B = μ₀n/I", "B = μ₀nI", "B = μ₀I²n", "B = μ₀I/(2πr)"], "answer": 1}, {"q": "A solenoid of length 0.5 m has 500 turns and carries a current of 2 A. Find the magnetic field inside it. (μ₀ = 4π×10⁻⁷ T·m/A)", "explanation": "n = N/l = 500/0.5 = 1000 turns/m. B = μ₀nI = 4π×10⁻⁷ × 1000 × 2 = 2.51 × 10⁻³ T.", "type": "mcq", "options": ["1.0 × 10⁻³ T", "5.0 × 10⁻³ T", "2.5 × 10⁻³ T", "2.5 × 10⁻⁴ T"], "answer": 2}, {"q": "Doubling the number of turns per unit length of a solenoid (keeping current constant) causes the magnetic field inside it to:", "explanation": "Since B = μ₀nI, the field is directly proportional to n, so doubling n doubles B.", "type": "mcq", "options": ["Quadruple", "Remain unchanged", "Halve", "Double"], "answer": 3}, {"q": "The magnetic field pattern inside a current-carrying solenoid closely resembles the field of:", "explanation": "A solenoid produces a fairly uniform field inside, similar in shape to the field of a bar magnet, with one end acting as a north pole and the other as a south pole.", "type": "mcq", "options": ["A point charge", "Two like poles facing each other", "A straight current-carrying wire", "A bar magnet"], "answer": 3}, {"q": "Magnetic flux through a surface of area A in a uniform field B, where θ is the angle between B and the normal to the surface, is given by:", "explanation": "Magnetic flux is Φ = BA cosθ, where θ is measured between the field direction and the normal (perpendicular) to the surface.", "type": "mcq", "options": ["Φ = BA tanθ", "Φ = BA cosθ", "Φ = BA/θ", "Φ = BA sinθ"], "answer": 1}, {"q": "Magnetic flux through a loop is maximum when:", "explanation": "Flux Φ = BA cosθ is maximum (Φ = BA) when θ = 0°, i.e. when B is along the normal to the loop, meaning B is perpendicular to the plane of the loop.", "type": "mcq", "options": ["The field is parallel to the plane of the loop", "The field is at 45° to the normal", "The loop area is zero", "The field is perpendicular to the plane of the loop (parallel to the normal)"], "answer": 3}, {"q": "The SI unit of magnetic flux is the:", "explanation": "Magnetic flux is measured in Weber (Wb), where 1 Wb = 1 T·m².", "type": "mcq", "options": ["Henry", "Weber", "Ampere-turn", "Tesla"], "answer": 1}, {"q": "The force on a straight current-carrying conductor of length L carrying current I in a uniform magnetic field B, making angle θ with the field, is:", "explanation": "The force on a current-carrying conductor in a magnetic field is F = BIL sinθ, where θ is the angle between the current direction and the field.", "type": "mcq", "options": ["F = BIL", "F = BI/L sinθ", "F = BIL sinθ", "F = BIL cosθ"], "answer": 2}, {"q": "A wire of length 0.3 m carrying a current of 5 A is placed perpendicular to a magnetic field of 0.2 T. Calculate the force on the wire.", "explanation": "Since the wire is perpendicular to B, θ = 90°, so F = BIL sinθ = 0.2 × 5 × 0.3 × 1 = 0.3 N.", "type": "mcq", "options": ["0.3 N", "0.4 N", "0.2 N", "0.1 N"], "answer": 0}, {"q": "The force on a current-carrying conductor placed in a magnetic field is maximum when the angle between the current and the field is:", "explanation": "Since F = BIL sinθ, the force is maximum when sinθ = 1, i.e. θ = 90°, meaning the conductor is perpendicular to the field.", "type": "mcq", "options": ["0°", "180°", "90°", "45°"], "answer": 2}, {"q": "The direction of the force on a current-carrying conductor in a magnetic field is best determined using:", "explanation": "Fleming's left-hand rule gives the direction of the force: with the thumb, first finger, and second finger mutually at right angles, the First finger points along the magnetic Field, the seCond finger along the Current, and the thuMb gives the direction of the resulting Motion (force).", "type": "mcq", "options": ["Fleming's left-hand rule", "Kirchhoff's law", "Fleming's right-hand rule", "Lenz's law"], "answer": 0}, {"q": "The magnetic force on a charge q moving with velocity v at angle θ to a magnetic field B is given by:", "explanation": "The magnetic force on a moving charge is F = qvB sinθ, where θ is the angle between the velocity vector and the magnetic field.", "type": "mcq", "options": ["F = qv/B sinθ", "F = qvB cosθ", "F = qvB sinθ", "F = qvB"], "answer": 2}, {"q": "An electron (q = 1.6×10⁻¹⁹ C) moves at 2×10⁶ m/s perpendicular to a magnetic field of 0.5 T. What is the magnitude of the magnetic force on it?", "explanation": "F = qvB sinθ = (1.6×10⁻¹⁹)(2×10⁶)(0.5)(sin90°) = 1.6 × 10⁻¹³ N.", "type": "mcq", "options": ["1.6 × 10⁻¹³ N", "8.0 × 10⁻¹⁴ N", "1.6 × 10⁻¹⁴ N", "3.2 × 10⁻¹³ N"], "answer": 0}, {"q": "A charged particle moving parallel to a magnetic field experiences:", "explanation": "Since F = qvB sinθ, when the velocity is parallel to B (θ = 0°), sinθ = 0, so the force is zero.", "type": "mcq", "options": ["Zero force", "Force perpendicular to both v and B always", "A force equal to qvB", "Maximum force"], "answer": 0}, {"q": "A charged particle moving in a uniform magnetic field, with velocity always perpendicular to B, moves in a:", "explanation": "When the magnetic force is always perpendicular to velocity, it acts as a centripetal force, causing the charge to move in a circle of radius r = mv/(qB).", "type": "mcq", "options": ["Straight line", "Parabolic path", "Elliptical path", "Circular path"], "answer": 3}, {"q": "An electron (m = 9.11×10⁻³¹ kg, q = 1.6×10⁻¹⁹ C) moves at 1×10⁶ m/s perpendicular to a 0.2 T field. Find the radius of its circular path.", "explanation": "r = mv/(qB) = (9.11×10⁻³¹ × 1×10⁶)/(1.6×10⁻¹⁹ × 0.2) = (9.11×10⁻²⁵)/(3.2×10⁻²⁰) ≈ 2.85 × 10⁻⁵ m.", "type": "mcq", "options": ["5.7 × 10⁻⁶ m", "2.85 × 10⁻⁵ m", "1.14 × 10⁻⁴ m", "9.11 × 10⁻⁵ m"], "answer": 1}, {"q": "In a simple DC motor, the split-ring commutator serves to:", "explanation": "The split-ring commutator reverses the current direction in the coil every half turn so that the torque produced always acts in the same rotational direction, allowing continuous rotation.", "type": "mcq", "options": ["Reduce friction between the coil and brushes", "Increase the strength of the magnetic field", "Store electrical energy", "Reverse the direction of current in the coil every half rotation, keeping the torque in the same rotational sense"], "answer": 3}, {"q": "In a DC motor, the carbon brushes function to:", "explanation": "Brushes are stationary conductors (often carbon) that press against the rotating commutator to maintain continuous electrical contact between the external circuit and the armature coil.", "type": "mcq", "options": ["Maintain electrical contact between the external circuit and the rotating commutator", "Convert AC to DC before it enters the motor", "Generate the magnetic field", "Provide mechanical support for the axle only"], "answer": 0}, {"q": "The basic structure of a simple DC motor includes all of the following EXCEPT:", "explanation": "A simple DC motor consists of a rotating coil, a magnetic field (from permanent or field magnets), and a split-ring commutator with brushes; a series capacitor is not part of its basic structure.", "type": "mcq", "options": ["A capacitor connected in series with the coil", "A split-ring commutator with brushes", "A coil (armature) of wire", "Permanent magnets or field magnets"], "answer": 0}, {"q": "The torque on a current-carrying rectangular coil of N turns, area A, carrying current I in a field B, when the plane of the coil is parallel to B, is given by:", "explanation": "Torque is τ = NBIA sinφ where φ is the angle between the plane of the coil and B; when the coil plane is parallel to B, φ = 90°, so τ = NBIA (maximum torque).", "type": "mcq", "options": ["τ = NBIA/2", "τ = 0", "τ = NBIA", "τ = NBI/A"], "answer": 2}, {"q": "A rectangular coil with N = 100 turns, area 0.02 m², carries a current of 2 A in a field of 0.1 T. Find the maximum torque on the coil.", "explanation": "Maximum torque: τ = NBIA = 100 × 0.1 × 2 × 0.02 = 0.4 N·m.", "type": "mcq", "options": ["0.2 N·m", "0.4 N·m", "0.04 N·m", "4.0 N·m"], "answer": 1}, {"q": "Increasing the number of turns in the coil of a DC motor (all else constant) will:", "explanation": "Since torque τ = NBIA sinφ, torque is directly proportional to the number of turns N, so increasing N increases the torque.", "type": "mcq", "options": ["Increase the torque produced", "Reverse the direction of rotation", "Decrease the torque produced", "Have no effect on torque"], "answer": 0}, {"q": "In a DC motor, the permanent (field) magnets are primarily responsible for:", "explanation": "The field magnets (permanent magnets or electromagnets) provide the magnetic field that interacts with the current in the coil to produce the force and hence the torque that rotates the motor.", "type": "mcq", "options": ["Producing the external uniform magnetic field in which the coil rotates", "Reducing electrical resistance in the circuit", "Converting mechanical energy into electrical energy", "Reversing the current every half cycle"], "answer": 0}, {"q": "A DC motor converts:", "explanation": "A DC motor operates on the principle that a current-carrying coil in a magnetic field experiences a torque, converting electrical energy into mechanical (rotational) energy.", "type": "mcq", "options": ["Magnetic energy into chemical energy", "Electrical energy into mechanical energy", "Mechanical energy into electrical energy", "Chemical energy into thermal energy"], "answer": 1}, {"q": "Magnetic field lines can intersect at points where the field strength is zero.", "explanation": "Magnetic field lines never intersect anywhere; a crossing point would imply two different field directions at the same location, which is physically impossible.", "type": "tf", "answer": false}, {"q": "A charged particle moving parallel to a magnetic field experiences zero magnetic force.", "explanation": "Since F = qvB sinθ, when θ = 0° (velocity parallel to B), sinθ = 0 and the force is zero.", "type": "tf", "answer": true}, {"q": "The magnetic field around a long straight wire decreases as the distance from the wire increases.", "explanation": "B = μ₀I/(2πr) shows that the field strength is inversely proportional to the perpendicular distance r from the wire.", "type": "tf", "answer": true}, {"q": "In a DC motor, the split-ring commutator reverses the direction of current in the coil every half rotation.", "explanation": "This reversal keeps the torque acting in the same rotational sense each half-turn, allowing the motor to continue rotating in one direction.", "type": "tf", "answer": true}, {"q": "Magnetic flux through a surface does not depend on the angle between the magnetic field and the normal to the surface.", "explanation": "Magnetic flux is Φ = BA cosθ, which clearly depends on the angle θ between the field and the normal to the surface.", "type": "tf", "answer": false}, {"q": "The device in a DC motor that reverses the direction of current in the coil every half rotation is called the ______.", "explanation": "The split-ring commutator reverses the current direction each half turn so the torque continues to act in the same rotational sense.", "type": "fill", "answer": "split-ring commutator"}, {"q": "The SI unit of magnetic flux is the ______.", "explanation": "Magnetic flux Φ = BA cosθ is measured in webers, where 1 Wb = 1 T·m².", "type": "fill", "answer": "weber (Wb)"}, {"q": "The magnetic field inside a long, ideal solenoid is ______ and directed along its axis.", "explanation": "Inside a long solenoid, the field is nearly uniform in magnitude and direction, unlike the field outside which is weak and non-uniform.", "type": "fill", "answer": "uniform"}, {"q": "The SI unit of magnetic field strength (magnetic flux density) is the ______.", "explanation": "Magnetic field strength B is measured in tesla, where 1 T = 1 Wb/m² = 1 N/(A·m).", "type": "fill", "answer": "tesla (T)"}, {"q": "The magnetic force on a moving charge is given by the equation F = ______.", "explanation": "The magnitude of the force on a charge q moving with speed v at angle θ to a field B is F = qvB sinθ.", "type": "fill", "answer": "qvB sinθ"}]}, {"unit": 10, "title": "Unit 10: Introduction to the Special Theory of Relativity", "questions": [{"q": "The theory of relativity is primarily concerned with:", "explanation": "Relativity studies how quantities such as time, length, mass, and simultaneity are measured differently by observers in relative motion to one another.", "type": "mcq", "options": ["How measurements of space, time, and motion depend on the relative motion of observers", "How chemical reactions proceed at high temperatures", "How electric charges interact at rest", "How sound waves travel through different media"], "answer": 0}, {"q": "An inertial reference frame is one that:", "explanation": "An inertial frame is a non-accelerating frame — one that is either at rest or moving with constant velocity — in which Newton's first law holds.", "type": "mcq", "options": ["Is always attached to the Earth's surface", "Rotates at constant angular speed", "Is at rest or moving with constant velocity (zero net acceleration)", "Is accelerating uniformly"], "answer": 2}, {"q": "According to the Galilean transformation, if frame S' moves with velocity v along the x-axis relative to frame S, the position x' in S' is given by:", "explanation": "The Galilean transformation gives x' = x − vt (and y' = y, z' = z, t' = t), relating coordinates in the moving frame to those in the stationary frame.", "type": "mcq", "options": ["x' = x − vt", "x' = vt − x", "x' = x + vt", "x' = x/vt"], "answer": 0}, {"q": "In the Galilean transformation, time is assumed to be:", "explanation": "Classical (Galilean) relativity assumes time is absolute — it flows the same way for all observers regardless of their relative motion, so t' = t.", "type": "mcq", "options": ["Dependent on the observer's velocity", "Undefined for moving frames", "Different in every reference frame", "Absolute and the same in all reference frames (t' = t)"], "answer": 3}, {"q": "According to the Galilean vel
