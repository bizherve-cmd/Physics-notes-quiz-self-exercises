<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>S5 Physics Quiz</title>
<style>
  :root{
    --bg:#f4f6f9;
    --surface:#ffffff;
    --surface-2:#eceff4;
    --text:#161b26;
    --text-dim:#5b6475;
    --border:#dde2ea;
    --accent:#0f7a73;
    --accent-ink:#ffffff;
    --accent-soft:#e3f3f1;
    --correct:#1c8a4b;
    --correct-soft:#e5f6ec;
    --incorrect:#c23b3b;
    --incorrect-soft:#fbe9e9;
    --shadow: 0 1px 2px rgba(20,24,34,.06), 0 8px 24px -12px rgba(20,24,34,.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e131b;
      --surface:#161d29;
      --surface-2:#1d2532;
      --text:#e9edf4;
      --text-dim:#95a0b3;
      --border:#2a3342;
      --accent:#3fd7c8;
      --accent-ink:#08211d;
      --accent-soft:#12312d;
      --correct:#4fce8a;
      --correct-soft:#123526;
      --incorrect:#ff8383;
      --incorrect-soft:#3a1c1e;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e131b;
    --surface:#161d29;
    --surface-2:#1d2532;
    --text:#e9edf4;
    --text-dim:#95a0b3;
    --border:#2a3342;
    --accent:#3fd7c8;
    --accent-ink:#08211d;
    --accent-soft:#12312d;
    --correct:#4fce8a;
    --correct-soft:#123526;
    --incorrect:#ff8383;
    --incorrect-soft:#3a1c1e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-inline:16px;
    padding-block:24px;
  }
  h1,h2,h3{font-family:"Sora", ui-sans-serif, system-ui, sans-serif; text-wrap:balance; margin:0;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}

  .wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:20px;}

  .app-header{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .app-header .eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:4px;}
  .app-header h1{font-size:22px; font-weight:700;}
  .byline{font-size:13px; color:var(--text-dim); margin-top:6px;}

  .score-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:6px 12px; font-size:13px; color:var(--text-dim); box-shadow:var(--shadow);
    white-space:nowrap;
  }
  .score-pill strong{color:var(--text); font-family:"IBM Plex Mono", monospace;}

  /* ---- unit list ---- */
  .unit-grid{display:flex; flex-direction:column; gap:10px;}
  .unit-card{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; box-shadow:var(--shadow); cursor:pointer; text-align:left;
    font:inherit; color:inherit; width:100%;
  }
  .unit-card:hover{border-color:var(--accent);}
  .unit-card .num{
    font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--accent);
    background:var(--accent-soft); border-radius:8px; padding:4px 8px; flex:none;
  }
  .unit-card .info{flex:1; min-width:0;}
  .unit-card .info .t{font-weight:600; font-size:15px;}
  .unit-card .info .s{font-size:12.5px; color:var(--text-dim); margin-top:2px;}
  .unit-card .badge{
    font-size:12px; font-family:"IBM Plex Mono",monospace; flex:none;
    padding:4px 9px; border-radius:999px; border:1px solid var(--border); color:var(--text-dim);
  }
  .unit-card .badge.done{color:var(--correct); border-color:var(--correct); background:var(--correct-soft);}

  /* ---- quiz view ---- */
  .quiz-header{display:flex; align-items:center; gap:10px;}
  .back-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:10px; padding:8px 10px; cursor:pointer; font-size:14px; line-height:1;
    flex:none;
  }
  .quiz-header .title{flex:1; min-width:0;}
  .quiz-header .title .t{font-weight:700; font-size:15px;}
  .quiz-header .title .s{font-size:12.5px; color:var(--text-dim);}

  .progress-track{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); border-radius:999px; transition:width .25s ease;}

  .qcard{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:16px;
  }
  .qmeta{font-size:12.5px; color:var(--text-dim); font-family:"IBM Plex Mono",monospace;}
  .qtext{font-size:17px; font-weight:600; line-height:1.45;}

  .options{display:flex; flex-direction:column; gap:9px;}
  .opt{
    display:flex; align-items:flex-start; gap:10px; text-align:left;
    background:var(--surface-2); border:1.5px solid var(--border); border-radius:12px;
    padding:11px 13px; cursor:pointer; font:inherit; color:inherit; font-size:14.5px; line-height:1.4;
    transition:border-color .12s ease, background .12s ease;
  }
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:disabled{cursor:default;}
  .opt .k{
    font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:13px; flex:none;
    width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
  }
  .opt.correct{background:var(--correct-soft); border-color:var(--correct);}
  .opt.correct .k{background:var(--correct); color:#fff; border-color:var(--correct);}
  .opt.incorrect{background:var(--incorrect-soft); border-color:var(--incorrect);}
  .opt.incorrect .k{background:var(--incorrect); color:#fff; border-color:var(--incorrect);}

  .fill-row{display:flex; gap:8px; flex-wrap:wrap;}
  .fill-row input{
    flex:1; min-width:160px; font:inherit; font-size:14.5px; padding:11px 13px;
    border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text);
  }
  .fill-row input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .btn{
    font:inherit; font-weight:600; font-size:14px; border-radius:12px; border:1px solid transparent;
    padding:11px 16px; cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:disabled{opacity:.5; cursor:default;}
  .btn-ghost{background:var(--surface); border-color:var(--border); color:var(--text);}

  .feedback{
    border-radius:12px; padding:13px 14px; font-size:14px; line-height:1.5; display:none;
    border:1px solid var(--border);
  }
  .feedback.show{display:block;}
  .feedback.correct{background:var(--correct-soft); border-color:var(--correct); color:var(--text);}
  .feedback.incorrect{background:var(--incorrect-soft); border-color:var(--incorrect); color:var(--text);}
  .feedback .verdict{font-weight:700; margin-bottom:4px;}
  .feedback .verdict.v-correct{color:var(--correct);}
  .feedback .verdict.v-incorrect{color:var(--incorrect);}

  .actions{display:flex; justify-content:flex-end; gap:8px;}

  .summary{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:26px 20px; text-align:center; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .summary .big{font-family:"IBM Plex Mono",monospace; font-size:40px; font-weight:700;}
  .summary .sub{color:var(--text-dim); font-size:14px;}
  .summary .actions2{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; justify-content:center;}

  [hidden]{display:none !important;}
  footer{text-align:center; font-size:12px; color:var(--text-dim); padding-top:8px;}
</style>

<div class="wrap">

  <div class="app-header">
    <div>
      <div class="eyebrow">Senior 5 Physics &middot; Self-Study Practice</div>
      <h1 id="pageTitle">Senior 5 Physics Quiz</h1>
      <div class="byline">Compiled by BIZIYAREMYE Donat, GS BYUMBA INYANGE &middot; 11 units &middot; 440 questions</div>
    </div>
    <div class="score-pill" id="overallScore">
      <span>Overall</span><strong id="overallScoreVal">0/0</strong>
    </div>
  </div>

  <div id="homeView">
    <div class="unit-grid" id="unitGrid"></div>
  </div>

  <div id="quizView" hidden>
    <div class="quiz-header">
      <button class="back-btn" id="backBtn" aria-label="Back to units">&larr;</button>
      <div class="title">
        <div class="t" id="quizUnitTitle">Unit</div>
        <div class="s" id="quizProgressLabel">Question 1 of 40</div>
      </div>
      <div class="score-pill"><span>Score</span><strong id="unitScoreVal">0/0</strong></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

    <div class="qcard">
      <div class="qmeta" id="qmeta">MCQ</div>
      <div class="qtext" id="qtext"></div>
      <div class="options" id="optionsWrap"></div>
      <div class="fill-row" id="fillWrap" hidden>
        <input id="fillInput" type="text" placeholder="Type your answer&hellip;" autocomplete="off">
        <button class="btn btn-primary" id="fillSubmit">Check</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="btn btn-ghost" id="skipBtn">Skip</button>
        <button class="btn btn-primary" id="nextBtn" disabled>Next</button>
      </div>
    </div>
  </div>

  <div id="summaryView" hidden>
    <div class="summary">
      <div class="eyebrow">Unit complete</div>
      <h2 id="summaryUnitTitle">Unit</h2>
      <div class="big" id="summaryScore">0/40</div>
      <div class="sub" id="summarySub">Nice work.</div>
      <div class="actions2">
        <button class="btn btn-ghost" id="retryBtn">Retry unit</button>
        <button class="btn btn-primary" id="toUnitsBtn">Choose another unit</button>
      </div>
    </div>
  </div>

  <footer>Self-study practice book &middot; tap an answer for instant feedback</footer>
</div>

<script>
(function(){
  "use strict";
  var LEVEL_KEY = "s5";
  var STORAGE_KEY = "physics-quiz-progress-" + LEVEL_KEY;
  var DATA = [{"unit": 1, "title": "Unit 1: Simple Harmonic Motion", "questions": [{"q": "Which of the following correctly defines simple harmonic motion (SHM)?", "explanation": "SHM is defined by a = -ω²x: acceleration is proportional to displacement but always directed opposite to it, i.e. towards the equilibrium position.", "type": "mcq", "options": ["Motion in which acceleration is proportional to displacement and acts in the same direction as displacement", "Motion in which the restoring force is constant in magnitude and direction", "Motion in which acceleration is proportional to displacement and always directed towards a fixed equilibrium point", "Motion in which velocity is constant and directed towards a fixed point"], "answer": 2}, {"q": "In SHM, the amplitude is best described as:", "explanation": "Amplitude (A) is the maximum displacement from the equilibrium (mean) position.", "type": "mcq", "options": ["The maximum displacement of the particle from its equilibrium position", "The time taken to complete one oscillation", "The number of oscillations completed per second", "The total distance travelled in one complete oscillation"], "answer": 0}, {"q": "The period (T) and frequency (f) of an oscillation are related by:", "explanation": "Frequency is the reciprocal of the period: f = 1/T, so T = 1/f.", "type": "mcq", "options": ["T = f", "T = 1/f", "T = 2f", "T = f²"], "answer": 1}, {"q": "In the equation x = A cos(ωt + φ), the quantity φ represents the:", "explanation": "φ is the phase constant, which fixes the state (position and direction of motion) of the oscillator at t = 0.", "type": "mcq", "options": ["Amplitude", "Angular frequency", "Period", "Phase constant (initial phase)"], "answer": 3}, {"q": "Which of the following is the best real-life example of (approximately) simple harmonic motion?", "explanation": "For small angular displacements, a simple pendulum's restoring force is approximately proportional to displacement, giving SHM.", "type": "mcq", "options": ["A stone falling freely under gravity", "A ball rolling down a straight incline", "A car accelerating uniformly from rest", "The small-angle oscillation of a simple pendulum"], "answer": 3}, {"q": "In x = A cos(ωt + φ), the symbol ω represents the:", "explanation": "ω is the angular frequency, related to frequency by ω = 2πf, with units rad/s.", "type": "mcq", "options": ["Angular frequency", "Linear frequency", "Phase angle", "Amplitude"], "answer": 0}, {"q": "A particle in SHM has amplitude 0.05 m and period 2 s. What is its maximum speed?", "explanation": "ω = 2π/T = 2π/2 = π rad/s. v_max = Aω = 0.05 × π ≈ 0.157 m/s.", "type": "mcq", "options": ["0.079 m/s", "0.314 m/s", "0.025 m/s", "0.157 m/s"], "answer": 3}, {"q": "A particle executing SHM has angular frequency 4 rad/s. When its displacement is 0.02 m from equilibrium, its acceleration is:", "explanation": "a = -ω²x = -(4)²(0.02) = -0.32 m/s²; the negative sign shows it is directed towards equilibrium.", "type": "mcq", "options": ["-1.28 m/s²", "-0.32 m/s²", "0.32 m/s²", "-0.08 m/s²"], "answer": 1}, {"q": "For a particle in SHM, the displacement–time graph is a cosine curve. The corresponding acceleration–time graph is:", "explanation": "Since a = -ω²x, when x follows a cosine curve, a follows an inverted cosine curve — 180° (π rad) out of phase with displacement.", "type": "mcq", "options": ["Exactly in phase with the velocity graph", "A cosine curve inverted (180° out of phase) with displacement", "In phase with the displacement graph", "A straight line"], "answer": 1}, {"q": "In SHM, the velocity–time graph is out of phase with the displacement–time graph by:", "explanation": "Differentiating x = A cos(ωt+φ) gives v = -Aω sin(ωt+φ), which is a sine function — 90° out of phase with the cosine displacement.", "type": "mcq", "options": ["90°", "180°", "45°", "0°"], "answer": 0}, {"q": "In SHM, at the equilibrium position (x = 0), the kinetic energy of the oscillator is:", "explanation": "At x = 0 the speed is maximum (v_max = Aω), so kinetic energy is maximum there, while potential energy is zero.", "type": "mcq", "options": ["Zero", "Equal to the potential energy", "Minimum but not zero", "Maximum"], "answer": 3}, {"q": "In SHM, the potential energy of the oscillator is maximum when:", "explanation": "At the extremes x = ±A, velocity is zero and all the mechanical energy is stored as potential energy.", "type": "mcq", "options": ["The particle is at the extreme positions (x = ±A)", "The particle is at the equilibrium position", "The particle has maximum speed", "The particle has zero acceleration"], "answer": 0}, {"q": "The total mechanical energy of an undamped SHM oscillator, E = ½mω²A², is:", "explanation": "In the absence of damping, mechanical energy continuously converts between kinetic and potential forms but the total remains constant.", "type": "mcq", "options": ["Maximum only at x = ±A", "Zero at all times", "Maximum only at x = 0", "Constant at all points of the motion"], "answer": 3}, {"q": "A 0.2 kg mass oscillates in SHM with angular frequency 5 rad/s and amplitude 0.1 m. Its total mechanical energy is:", "explanation": "E = ½mω²A² = 0.5 × 0.2 × 5² × 0.1² = 0.5 × 0.2 × 25 × 0.01 = 0.025 J.", "type": "mcq", "options": ["0.25 J", "0.05 J", "0.025 J", "0.0125 J"], "answer": 2}, {"q": "For an SHM oscillator of amplitude A, the kinetic energy when the displacement is x = A/2 is:", "explanation": "KE = ½mω²(A²-x²) = ½mω²(A² - A²/4) = (3/4)(½mω²A²) = 3/4 of the total energy E.", "type": "mcq", "options": ["3/4 of the total energy", "Equal to the total energy", "1/4 of the total energy", "1/2 of the total energy"], "answer": 0}, {"q": "The period of a simple pendulum of length l at a place with gravitational acceleration g is given by:", "explanation": "The standard formula for the period of a simple pendulum (small oscillations) is T = 2π√(l/g).", "type": "mcq", "options": ["T = 2π√(g/l)", "T = 2π√(l/g)", "T = 2π(l/g)", "T = 2πl/g"], "answer": 1}, {"q": "If the length of a simple pendulum is quadrupled while g stays constant, its period will:", "explanation": "Since T ∝ √l, quadrupling l multiplies T by √4 = 2, so the period doubles.", "type": "mcq", "options": ["Halve", "Quadruple", "Remain the same", "Double"], "answer": 3}, {"q": "A simple pendulum is taken to the Moon, where g is smaller than on Earth. Its period will:", "explanation": "Since T = 2π√(l/g), a smaller g gives a larger T, so the period increases on the Moon.", "type": "mcq", "options": ["Increase", "Stay exactly the same", "Become zero", "Decrease"], "answer": 0}, {"q": "The period of a mass–spring system with spring constant k and mass m is:", "explanation": "For a mass-spring oscillator, T = 2π√(m/k), derived from ω = √(k/m) and T = 2π/ω.", "type": "mcq", "options": ["T = 2π√(mk)", "T = 2π√(k/m)", "T = 2π√(m/k)", "T = 2πm/k"], "answer": 2}, {"q": "If the spring constant of a mass–spring system is made 4 times larger while the mass is unchanged, the period becomes:", "explanation": "T ∝ 1/√k, so increasing k by a factor of 4 reduces T by a factor of √4 = 2, i.e. the period is halved.", "type": "mcq", "options": ["4 times larger", "Half of the original value", "2 times larger", "One quarter of the original value"], "answer": 1}, {"q": "A mass-spring system has period 2 s and mass 0.5 kg. Its spring constant is approximately:", "explanation": "k = 4π²m/T² = 4π²(0.5)/(2²) = 4π²(0.5)/4 = π²(0.5) ≈ 4.93 N/m.", "type": "mcq", "options": ["9.87 N/m", "1.23 N/m", "4.93 N/m", "2.47 N/m"], "answer": 2}, {"q": "For small oscillations, the period of a simple pendulum depends on:", "explanation": "T = 2π√(l/g) shows the period depends only on the length l and g, not on the mass of the bob or (for small angles) the amplitude.", "type": "mcq", "options": ["The mass of the bob only", "The length of the pendulum and gravitational acceleration only", "Both the mass and the amplitude", "The amplitude of swing only"], "answer": 1}, {"q": "The fact that the period of a simple pendulum is (to a good approximation) independent of its amplitude, for small angles, is known as:", "explanation": "This property — equal periods regardless of (small) amplitude — is called isochronism.", "type": "mcq", "options": ["Isochronism", "Damping", "Superposition", "Resonance"], "answer": 0}, {"q": "The relationship between angular frequency ω and frequency f is:", "explanation": "Angular frequency ω = 2πf, since one full cycle (2π rad) corresponds to one period T = 1/f.", "type": "mcq", "options": ["ω = f/2π", "ω = 2πf", "ω = f", "ω = πf"], "answer": 1}, {"q": "A vibrating object has frequency 50 Hz. Its angular frequency is approximately:", "explanation": "ω = 2πf = 2π × 50 ≈ 314.16 rad/s.", "type": "mcq", "options": ["50 rad/s", "157 rad/s", "314 rad/s", "100 rad/s"], "answer": 2}, {"q": "In x = A cos(ωt + φ), the quantity (ωt + φ) is called the:", "explanation": "(ωt + φ) is the phase of the oscillation; it determines the exact state (position and direction) of the oscillator at time t.", "type": "mcq", "options": ["Angular frequency", "Restoring force", "Amplitude", "Phase of the motion"], "answer": 3}, {"q": "The restoring force in SHM is given by F = -kx. The negative sign shows that the force is:", "explanation": "The negative sign indicates the restoring force always acts opposite to the displacement, pulling the particle back to equilibrium.", "type": "mcq", "options": ["Constant in magnitude", "Always directed towards the equilibrium position, opposing displacement", "Independent of displacement", "Always directed away from equilibrium"], "answer": 1}, {"q": "A particle in SHM has amplitude 0.1 m and frequency 2 Hz. Its maximum acceleration is approximately:", "explanation": "ω = 2πf = 2π(2) ≈ 12.57 rad/s. a_max = ω²A = (12.57)² × 0.1 ≈ 15.8 m/s².", "type": "mcq", "options": ["7.9 m/s²", "3.9 m/s²", "15.8 m/s²", "31.6 m/s²"], "answer": 2}, {"q": "The graph of acceleration (a) against displacement (x) for an SHM oscillator is:", "explanation": "Since a = -ω²x, a plotted against x gives a straight line through the origin with slope -ω².", "type": "mcq", "options": ["A straight line through the origin with negative slope", "A straight line through the origin with positive slope", "A parabola", "A sine curve"], "answer": 0}, {"q": "Which of the following is NOT an example of (approximate) simple harmonic motion?", "explanation": "A ball rolling down an incline undergoes uniformly accelerated, non-oscillatory motion, so it is not SHM.", "type": "mcq", "options": ["A mass oscillating on an ideal spring", "A simple pendulum swinging through a small angle", "A ball rolling down a straight incline at constant acceleration", "The vibration of a tuning fork prong"], "answer": 2}, {"q": "In SHM, the acceleration of the particle is always directed towards the equilibrium position.", "explanation": "This follows directly from a = -ω²x: acceleration and displacement are oppositely directed, i.e. acceleration points towards equilibrium.", "type": "tf", "answer": true}, {"q": "The period of a simple pendulum depends on the mass of the bob.", "explanation": "T = 2π√(l/g) contains no mass term, so for an ideal simple pendulum the period is independent of the bob's mass.", "type": "tf", "answer": false}, {"q": "At the extreme positions of an SHM oscillation, the kinetic energy of the particle is maximum.", "explanation": "At the extremes (x = ±A) the speed is zero, so kinetic energy is zero and potential energy is maximum there.", "type": "tf", "answer": false}, {"q": "In the absence of damping, the total mechanical energy of an SHM oscillator remains constant throughout the motion.", "explanation": "With no resistive forces, energy simply converts between kinetic and potential forms, keeping the sum constant.", "type": "tf", "answer": true}, {"q": "In SHM, the velocity and displacement of the particle are always exactly in phase with each other.", "explanation": "Velocity leads displacement by 90° (a quarter cycle), since v = -Aω sin(ωt+φ) while x = A cos(ωt+φ).", "type": "tf", "answer": false}, {"q": "The maximum displacement of a particle from its equilibrium position during SHM is called the ______.", "explanation": "By definition, amplitude (A) is the largest displacement reached from the equilibrium position.", "type": "fill", "answer": "amplitude"}, {"q": "The time taken by an oscillating particle to complete one full cycle of motion is called the ______.", "explanation": "The period (T) is the time for one complete oscillation.", "type": "fill", "answer": "period"}, {"q": "In SHM, acceleration a = -ω²x shows that acceleration is directly proportional to ______ and directed towards the equilibrium point.", "explanation": "The defining relation of SHM is that acceleration is proportional to (and oppositely directed from) displacement.", "type": "fill", "answer": "displacement"}, {"q": "The period of a simple pendulum is given by the formula T = 2π√(______).", "explanation": "T = 2π√(l/g), where l is the pendulum length and g is the acceleration due to gravity.", "type": "fill", "answer": "l/g"}, {"q": "The period of a mass–spring system is given by the formula T = 2π√(______).", "explanation": "T = 2π√(m/k), where m is the oscillating mass and k is the spring constant.", "type": "fill", "answer": "m/k"}]}, {"unit": 2, "title": "Unit 2: Damped and Forced Oscillations", "questions": [{"q": "A damped oscillation is best described as one in which:", "explanation": "Damping is caused by resistive forces (friction, air resistance, viscosity) that remove energy from the system, so the amplitude decays with time.", "type": "mcq", "options": ["The amplitude increases steadily with time", "The amplitude decreases progressively with time due to resistive forces", "The period decreases to zero", "The frequency increases with time"], "answer": 1}, {"q": "Which of the following is a real-life example of a damped oscillation?", "explanation": "A car suspension oscillates and its amplitude dies away due to resistive (damping) forces from the shock absorber fluid.", "type": "mcq", "options": ["A car's suspension system settling after hitting a bump", "An ideal pendulum swinging forever in a vacuum with no friction", "A perfectly elastic collision between two balls", "The Earth orbiting the Sun"], "answer": 0}, {"q": "In a damped oscillator, the damping (resistive) force is generally modelled as being proportional to the object's:", "explanation": "Damping forces (such as viscous drag) are typically proportional to velocity, F = -bv, where b is the damping coefficient.", "type": "mcq", "options": ["Displacement", "Mass only", "Acceleration", "Velocity"], "answer": 3}, {"q": "The differential equation describing a damped oscillator of mass m, damping coefficient b, and spring constant k is:", "explanation": "The damped oscillator equation includes an inertial term, a damping term proportional to velocity, and a restoring term proportional to displacement.", "type": "mcq", "options": ["b(d²x/dt²) + m(dx/dt) = kx", "m(d²x/dt²) - kx = 0", "m(dx/dt) + kx² = 0", "m(d²x/dt²) + b(dx/dt) + kx = 0"], "answer": 3}, {"q": "For a lightly (under-) damped oscillator, the solution to the equation of motion has the general form:", "explanation": "Underdamped motion oscillates at a slightly reduced angular frequency ω' while its amplitude decays exponentially as e^{-bt/2m}.", "type": "mcq", "options": ["x = A e^{bt}, an exponentially increasing displacement", "x = A e^{-bt/2m} cos(ω't + φ), an oscillation with exponentially decaying amplitude", "x = A cos(ωt + φ), a constant-amplitude oscillation", "x = At, a linearly increasing displacement"], "answer": 1}, {"q": "Which type of damping allows a displaced system to return to equilibrium in the shortest possible time without oscillating at all?", "explanation": "Critical damping is the boundary case where the system returns to equilibrium as fast as possible without oscillating back and forth.", "type": "mcq", "options": ["Critical damping", "Underdamping (light damping)", "Overdamping (heavy damping)", "No damping"], "answer": 0}, {"q": "An overdamped system, when displaced and released, will:", "explanation": "In overdamping, resistive forces are so large that the system creeps back to equilibrium slowly and monotonically, without oscillating.", "type": "mcq", "options": ["Oscillate with constant amplitude forever", "Return to equilibrium slowly without any oscillation", "Overshoot equilibrium many times before settling", "Oscillate with slowly decreasing amplitude"], "answer": 1}, {"q": "In an underdamped (lightly damped) system, the displaced object:", "explanation": "Underdamping is characterised by repeated oscillations whose amplitude decays exponentially with time until the system comes to rest.", "type": "mcq", "options": ["Oscillates forever with constant amplitude", "Oscillates back and forth several times with amplitude decreasing exponentially before coming to rest", "Never returns to the equilibrium position", "Returns to equilibrium in one smooth motion without oscillating"], "answer": 1}, {"q": "Which of the following is a good real-life example of a system deliberately designed to be critically (or near-critically) damped?", "explanation": "Galvanometer needles and many measuring instrument pointers are designed close to critical damping so they settle on the correct reading quickly without oscillating.", "type": "mcq", "options": ["A satellite orbiting the Earth", "A swing pushed by a child", "A guitar string left to vibrate freely", "A pointer/needle in an analogue galvanometer that must settle quickly without overshooting"], "answer": 3}, {"q": "A door fitted with a hydraulic closer set too 'stiff' so that it closes very slowly without swinging back and forth is an example of:", "explanation": "A very stiff closer that prevents any oscillation but closes sluggishly is exhibiting overdamped behaviour.", "type": "mcq", "options": ["Overdamping", "Resonance", "Critical damping", "Underdamping"], "answer": 0}, {"q": "In forced oscillations, once steady state is reached, the oscillating system vibrates at:", "explanation": "After transients die away, a forced oscillator settles into vibrating at the same frequency as the periodic driving force applied to it.", "type": "mcq", "options": ["Zero frequency", "Its own natural frequency only", "A frequency exactly halfway between its natural frequency and the driving frequency", "The frequency of the external (driving) force"], "answer": 3}, {"q": "Resonance in a forced oscillating system occurs when:", "explanation": "Resonance occurs when the frequency of the applied periodic force matches the system's own natural frequency, producing maximum amplitude.", "type": "mcq", "options": ["The damping force is at its absolute maximum", "The amplitude of the driving force is zero", "The driving frequency is much greater than the natural frequency", "The driving frequency equals the natural frequency of the system"], "answer": 3}, {"q": "At resonance, the amplitude of a forced oscillator is:", "explanation": "The amplitude–frequency response of a forced oscillator peaks sharply at (or near) the natural frequency, giving maximum amplitude at resonance.", "type": "mcq", "options": ["At its maximum value (for a given damping)", "Independent of damping", "At its minimum value", "Zero"], "answer": 0}, {"q": "Regarding energy in a forced oscillation at steady state, which statement is correct?", "explanation": "At steady state the amplitude is constant, which requires the energy input from the driving force to exactly balance the energy dissipated by damping each cycle.", "type": "mcq", "options": ["Energy increases without limit indefinitely", "Energy is only lost, never supplied", "The energy supplied by the driving force per cycle equals the energy dissipated by damping per cycle", "No energy is supplied by the driving force"], "answer": 2}, {"q": "The collapse of the Tacoma Narrows Bridge in 1940 is often cited as a dramatic real-life example of:", "explanation": "Wind-induced periodic forces matched a natural vibration mode of the bridge, driving a resonant oscillation whose amplitude grew until the structure failed.", "type": "mcq", "options": ["Simple harmonic motion with no forcing", "Overdamping", "Destructive resonance", "Critical damping"], "answer": 2}, {"q": "In musical instruments such as a guitar, the hollow wooden body amplifies the sound of the vibrating string mainly because of:", "explanation": "The body/air cavity has natural frequencies that resonate with the string's vibrations, reinforcing and amplifying the sound produced.", "type": "mcq", "options": ["The body absorbing all the vibrational energy", "Critical damping of the sound box", "Resonance of the air/body cavity with the string's vibration", "Overdamping of the string"], "answer": 2}, {"q": "Soldiers marching across a bridge are traditionally ordered to break step. This is done to avoid:", "explanation": "If the soldiers' marching frequency matched the bridge's natural frequency, resonance could build up dangerously large oscillations.", "type": "mcq", "options": ["Increasing the bridge's natural frequency", "Overdamping the bridge", "Reducing air resistance", "Setting up resonant vibrations that could dangerously amplify the bridge's oscillation"], "answer": 3}, {"q": "Increasing the amount of damping in a forced oscillating system generally has what effect on the resonance peak?", "explanation": "More damping removes energy faster, reducing the maximum amplitude reached at resonance and broadening the frequency response curve.", "type": "mcq", "options": ["It decreases the peak amplitude and broadens (flattens) the resonance curve", "It increases the peak amplitude and sharpens the peak", "It has no effect on the resonance curve at all", "It shifts the resonant frequency to zero"], "answer": 0}, {"q": "For a damped oscillator, which quantity decreases exponentially with time (while damped oscillation continues)?", "explanation": "In underdamped motion the amplitude envelope decays as A0 e^{-bt/2m}, while the angular frequency and period change only slightly.", "type": "mcq", "options": ["The phase constant", "The period", "The amplitude", "The angular frequency"], "answer": 2}, {"q": "Compared with the natural (undamped) angular frequency ω0, the angular frequency ω' of a lightly damped oscillator is:", "explanation": "Light damping slightly reduces the oscillation frequency: ω' = √(ω0² - (b/2m)²), which is a little less than ω0.", "type": "mcq", "options": ["Slightly greater than ω0", "Exactly equal to ω0", "Exactly double ω0", "Slightly less than ω0"], "answer": 3}, {"q": "In the damping equation m(d²x/dt²) + b(dx/dt) + kx = 0, the constant b represents the:", "explanation": "b is the damping coefficient, quantifying how strongly the resistive force opposes the motion.", "type": "mcq", "options": ["Damping coefficient", "Mass of the oscillator", "Spring constant", "Natural angular frequency"], "answer": 0}, {"q": "Car shock absorbers are generally designed to be close to which type of damping, to give a smooth ride that settles quickly without excessive bouncing?", "explanation": "Shock absorbers aim for near-critical damping: enough to quickly kill oscillations from bumps without making the ride harsh and sluggish.", "type": "mcq", "options": ["Overdamped only", "Critically damped", "Undamped", "Underdamped only"], "answer": 1}, {"q": "As the degree of light damping in an oscillator increases (while it remains underdamped), the period of oscillation:", "explanation": "Since ω' = √(ω0² - (b/2m)²) decreases as damping (b) increases, and T' = 2π/ω', the period slightly increases with more damping.", "type": "mcq", "options": ["Becomes infinite", "Increases slightly", "Becomes exactly zero", "Decreases significantly"], "answer": 1}, {"q": "The mechanical energy of a freely (unforced) damped oscillator, over time, will:", "explanation": "Damping forces continuously convert mechanical energy into heat (via friction/viscous drag), so the total energy of a freely damped oscillator falls with time.", "type": "mcq", "options": ["Decrease continuously as it is dissipated as heat", "Oscillate between two fixed non-zero values forever", "Remain exactly constant", "Increase steadily"], "answer": 0}, {"q": "Which displacement–time graph best represents an underdamped oscillation?", "explanation": "Underdamped motion continues to oscillate about equilibrium, but with the peak amplitude shrinking exponentially over successive cycles.", "type": "mcq", "options": ["A curve that returns to zero in a single smooth motion with no oscillation", "A curve that rises smoothly to a peak and never returns to zero", "A curve that oscillates about zero with an amplitude that decays exponentially with time", "A straight horizontal line"], "answer": 2}, {"q": "Compared to overdamping, critical damping brings a displaced system back to equilibrium:", "explanation": "Critical damping is defined as the smallest amount of damping that just prevents oscillation, giving the fastest return to equilibrium of the non-oscillatory cases.", "type": "mcq", "options": ["Only after infinite time", "In the shortest possible time, without oscillating", "More slowly", "In exactly the same time"], "answer": 1}, {"q": "A pneumatic door closer adjusted so the door closes slowly and gently, without slamming or swinging back open, is behaving as a(n):", "explanation": "A door that creeps closed slowly with no oscillation, taking longer than the minimum possible time, is exhibiting overdamped behaviour.", "type": "mcq", "options": ["Overdamped system", "Undamped system", "Resonant system", "Underdamped system"], "answer": 0}, {"q": "The natural (resonant) frequency of a simple mass–spring oscillator mainly depends on:", "explanation": "The natural angular frequency of a mass-spring system is ω0 = √(k/m), depending on stiffness k and mass m, not on amplitude.", "type": "mcq", "options": ["The driving force amplitude only", "The colour of the spring", "The mass and the stiffness (spring constant) of the system", "Only the amplitude of oscillation"], "answer": 2}, {"q": "Which of these is NOT a genuine real-life example of resonance?", "explanation": "A ball coming to rest due to friction is simple energy dissipation, not resonance, which specifically requires a periodic driving force matching a natural frequency.", "type": "mcq", "options": ["A radio receiver tuned to pick up a particular broadcast frequency", "An opera singer's voice shattering a wine glass at a matching frequency", "A ball slowly rolling to rest on a flat floor due to friction", "A child's swing rising higher when pushed at its natural frequency"], "answer": 2}, {"q": "The amplitude of a lightly damped oscillator falls from 10 cm to 5 cm in 4 s. Using A = A0 e^{-λt}, the decay constant λ is approximately:", "explanation": "0.5 = e^{-4λ} ⟹ ln(0.5) = -4λ ⟹ λ = ln2/4 ≈ 0.693/4 ≈ 0.173 s⁻¹.", "type": "mcq", "options": ["0.693 s⁻¹", "0.173 s⁻¹", "0.087 s⁻¹", "0.347 s⁻¹"], "answer": 1}, {"q": "In forced oscillations, once steady state is reached, the system vibrates at the frequency of the driving force rather than its own natural frequency.", "explanation": "After initial transients die out, the oscillator locks onto and vibrates at the frequency of the applied periodic driving force.", "type": "tf", "answer": true}, {"q": "A critically damped system oscillates back and forth several times before finally settling at its equilibrium position.", "explanation": "A critically damped system does not oscillate at all; it returns directly to equilibrium in the shortest possible time.", "type": "tf", "answer": false}, {"q": "Resonance occurs when the frequency of the driving force equals the natural frequency of the oscillating system.", "explanation": "This matching of frequencies allows maximum energy transfer from the driving force to the oscillator, producing resonance.", "type": "tf", "answer": true}, {"q": "An overdamped system returns to its equilibrium position faster than a critically damped system.", "explanation": "Critical damping gives the fastest non-oscillatory return to equilibrium; an overdamped system returns more slowly than this.", "type": "tf", "answer": false}, {"q": "Damping always increases the amplitude of an oscillating system over time.", "explanation": "Damping removes energy from the system due to resistive forces, so it decreases (not increases) the amplitude over time.", "type": "tf", "answer": false}, {"q": "In damped oscillations, mechanical energy is gradually converted into ______ due to resistive forces acting on the system.", "explanation": "Resistive/frictional forces convert the ordered mechanical energy of oscillation into heat (and sound), dissipating it from the system.", "type": "fill", "answer": "heat"}, {"q": "A system that returns to equilibrium in the shortest possible time without oscillating is said to be ______ damped.", "explanation": "This special boundary case between underdamping and overdamping is called critical damping.", "type": "fill", "answer": "critically"}, {"q": "The phenomenon in which a system driven at its natural frequency oscillates with a dramatically increased amplitude is called ______.", "explanation": "Resonance occurs when the driving frequency matches the natural frequency, maximising energy transfer and amplitude.", "type": "fill", "answer": "resonance"}, {"q": "In an ______ oscillation, the object oscillates back and forth several times with an amplitude that decreases exponentially before coming to rest.", "explanation": "This is the underdamped (lightly damped) case, distinct from critical and overdamping, which show no oscillation.", "type": "fill", "answer": "underdamped (lightly damped)"}, {"q": "The 1940 collapse of the Tacoma Narrows Bridge is a famous real-life example of destructive ______ caused by wind-induced forces.", "explanation": "Periodic wind forces matched a natural vibrational mode of the bridge, producing a resonant oscillation that grew until the structure failed.", "type": "fill", "answer": "resonance"}]}, {"unit": 3, "title": "Unit 3: Propagation of Mechanical Waves", "questions": [{"q": "A mechanical wave is best defined as a wave that:", "explanation": "Unlike electromagnetic waves, mechanical waves need a material medium — such as air, water, or a solid — to transmit their energy.", "type": "mcq", "options": ["Travels only through empty space", "Requires a material medium (solid, liquid or gas) through which to propagate", "Can travel through a vacuum without any medium", "Has no wavelength or frequency"], "answer": 1}, {"q": "In a transverse wave, the particles of the medium vibrate:", "explanation": "In transverse waves (e.g. waves on a stretched string), particle displacement is at right angles to the direction the wave travels.", "type": "mcq", "options": ["In a direction that has no relation to the wave's motion", "Parallel to the direction of wave propagation", "Perpendicular to the direction of wave propagation", "In circles only, never in straight lines"], "answer": 2}, {"q": "In a longitudinal wave, the particles of the medium vibrate:", "explanation": "Longitudinal waves, such as sound in air, have particle motion along the same line as the direction of energy transfer, producing compressions and rarefactions.", "type": "mcq", "options": ["Not at all; only the wave pattern itself moves", "In a plane containing the wave crest only", "Parallel to the direction of wave propagation, creating compressions and rarefactions", "Perpendicular to the direction of wave propagation"], "answer": 2}, {"q": "Which of the following is the best example of a longitudinal mechanical wave?", "explanation": "Sound waves involve air particles oscillating back and forth along the direction of propagation, making them longitudinal waves.", "type": "mcq", "options": ["A light wave travelling through glass", "A sound wave travelling through air", "A wave on the surface of water", "A wave travelling along a stretched rope"], "answer": 1}, {"q": "For a progressive wave given by y = A sin(ωt - kx), the quantity k is called the:", "explanation": "k is the wave number (or propagation constant), related to wavelength λ by k = 2π/λ.", "type": "mcq", "options": ["Phase constant only", "Angular frequency", "Amplitude", "Wave number, equal to 2π/λ"], "answer": 3}, {"q": "A progressive sound wave has frequency 256 Hz and wavelength 1.3 m. Its speed is approximately:", "explanation": "Using v = fλ: v = 256 × 1.3 ≈ 332.8 m/s, close to the typical speed of sound in air.", "type": "mcq", "options": ["1.3 m/s", "332.8 m/s", "197 m/s", "256 m/s"], "answer": 1}, {"q": "A wave has wavelength 0.5 m. Its wave number k is approximately:", "explanation": "k = 2π/λ = 2π/0.5 ≈ 12.57 rad/m.", "type": "mcq", "options": ["12.57 rad/m", "3.14 rad/m", "0.5 rad/m", "6.28 rad/m"], "answer": 0}, {"q": "A wave has a frequency of 100 Hz. Its angular frequency ω is approximately:", "explanation": "ω = 2πf = 2π × 100 ≈ 628.3 rad/s.", "type": "mcq", "options": ["200 rad/s", "100 rad/s", "628.3 rad/s", "314 rad/s"], "answer": 2}, {"q": "In the wave equation y = A sin(ωt - kx), the constant A represents the:", "explanation": "A is the amplitude — the maximum displacement of a particle from its equilibrium position as the wave passes.", "type": "mcq", "options": ["Wave speed", "Wavelength", "Wave number", "Amplitude of the wave"], "answer": 3}, {"q": "Two points on a progressive wave are separated by a distance Δx along the direction of travel. Their phase difference Δφ is given by:", "explanation": "Phase difference between two points a distance Δx apart is Δφ = kΔx, where k is the wave number.", "type": "mcq", "options": ["Δφ = A·Δx", "Δφ = Δx/k", "Δφ = kΔx", "Δφ = ωΔx"], "answer": 2}, {"q": "A distinguishing feature of a progressive (travelling) wave is that it:", "explanation": "A progressive wave carries energy away from its source through the medium, while the medium's particles only oscillate about fixed positions — no net matter is transported.", "type": "mcq", "options": ["Cannot be reflected", "Transfers matter but not energy along the medium", "Has fixed nodes that never move", "Transfers energy from one place to another without net transfer of matter"], "answer": 3}, {"q": "A stationary (standing) wave is formed when:", "explanation": "Standing waves arise from the superposition of two coherent waves of equal amplitude and frequency travelling in opposite directions, e.g. an incident wave and its reflection.", "type": "mcq", "options": ["A single wave travels through a medium without any reflection", "Two waves of very different frequencies are combined", "Two identical waves travelling in opposite directions superpose in the same medium", "A wave loses all of its energy to friction"], "answer": 2}, {"q": "Which of the following best represents the equation of a stationary wave formed on a string?", "explanation": "A stationary wave's displacement can be written as y = 2A sin(kx) cos(ωt): each point oscillates in time with an amplitude that depends on its fixed position x, and the pattern does not travel.", "type": "mcq", "options": ["y = A + kx, a linear function of position", "y = A sin(ωt - kx), representing a wave travelling in the +x direction", "y = A e^{-kx}, an exponentially decaying displacement", "y = 2A sin(kx) cos(ωt), with amplitude 2A sin(kx) varying with position but no wave travelling"], "answer": 3}, {"q": "In a stationary wave, points that remain permanently at rest (zero displacement at all times) are called:", "explanation": "Nodes are the fixed points of zero amplitude in a standing wave pattern.", "type": "mcq", "options": ["Troughs", "Antinodes", "Nodes", "Crests"], "answer": 2}, {"q": "In a stationary wave, points of maximum amplitude of vibration are called:", "explanation": "Antinodes are the points where the standing wave amplitude is greatest.", "type": "mcq", "options": ["Antinodes", "Rarefactions", "Nodes", "Wavefronts"], "answer": 0}, {"q": "The distance between two adjacent nodes in a stationary wave is:", "explanation": "Adjacent nodes in a standing wave pattern are separated by half a wavelength, λ/2.", "type": "mcq", "options": ["λ/2", "λ (one full wavelength)", "λ/4", "2λ"], "answer": 0}, {"q": "The distance between a node and the nearest adjacent antinode in a stationary wave is:", "explanation": "A node and its neighbouring antinode are always a quarter wavelength (λ/4) apart.", "type": "mcq", "options": ["λ/4", "λ", "3λ/4", "λ/2"], "answer": 0}, {"q": "A string of length L is fixed at both ends and vibrates in its fundamental (first harmonic) mode. The wavelength of this mode is:", "explanation": "The fundamental mode of a string fixed at both ends has a node at each end and one antinode in the middle, fitting half a wavelength into L, so λ = 2L.", "type": "mcq", "options": ["λ = 2L", "λ = L/2", "λ = 4L", "λ = L"], "answer": 0}, {"q": "For a string of length L and wave speed v fixed at both ends, the fundamental frequency is given by:", "explanation": "Since λ1 = 2L for the fundamental mode, f1 = v/λ1 = v/(2L).", "type": "mcq", "options": ["f1 = v/2L", "f1 = 2v/L", "f1 = vL/2", "f1 = v/L"], "answer": 0}, {"q": "A string of length 0.6 m has wave speed 300 m/s along it. Its fundamental frequency of vibration is:", "explanation": "f1 = v/(2L) = 300/(2 × 0.6) = 300/1.2 = 250 Hz.", "type": "mcq", "options": ["180 Hz", "250 Hz", "500 Hz", "125 Hz"], "answer": 1}, {"q": "For a stretched string fixed at both ends, the wavelength of the second harmonic (first overtone) is related to the string length L by:", "explanation": "The second harmonic has one extra node compared to the fundamental, fitting a full wavelength into the string, so λ2 = L.", "type": "mcq", "options": ["λ2 = L", "λ2 = 4L", "λ2 = 2L", "λ2 = L/2"], "answer": 0}, {"q": "Regarding energy transfer, a stationary wave differs from a progressive wave in that a stationary wave:", "explanation": "In a standing wave, energy is confined between nodes and antinodes, oscillating in place rather than propagating steadily along the medium as in a travelling wave.", "type": "mcq", "options": ["Transfers matter but no energy", "Stores energy locally, oscillating between kinetic and potential forms, with no net energy transfer along the medium", "Cannot store any energy at all", "Transfers energy steadily from one end of the medium to the other"], "answer": 1}, {"q": "Which of the following is a good real-life example of a stationary (standing) wave?", "explanation": "The fixed ends of a vibrating string reflect waves, and the incident and reflected waves superpose to form a stable standing wave pattern.", "type": "mcq", "options": ["A single pulse travelling once along a rope", "Ripples spreading outward from a stone dropped in a pond", "Sound travelling directly from a loudspeaker to a listener's ear", "A vibrating guitar or violin string fixed at both ends"], "answer": 3}, {"q": "Which of the following is a good real-life example of a progressive (travelling) wave?", "explanation": "Sound spreading from a source to a listener is a classic progressive wave: it carries energy through the air from one place to another.", "type": "mcq", "options": ["The fixed nodes on a vibrating rope tied at both ends", "The stationary pattern on a plucked guitar string", "A standing wave in an organ pipe closed at one end", "Sound travelling outward from a loudspeaker to a listener"], "answer": 3}, {"q": "For the wave equation y = A sin(ωt - kx), the negative sign before kx indicates that the wave travels:", "explanation": "The form y = A sin(ωt - kx) represents a wave moving in the positive x-direction; y = A sin(ωt + kx) would represent motion in the negative x-direction.", "type": "mcq", "options": ["In the negative x-direction", "It does not indicate any direction", "In a circular path", "In the positive x-direction"], "answer": 3}, {"q": "The wave speed (v), wavelength (λ) and period (T) of a progressive wave are related by:", "explanation": "Since the wave moves one wavelength in one period, its speed is v = λ/T (equivalently v = fλ).", "type": "mcq", "options": ["v = λ + T", "v = λT", "v = λ/T", "v = T/λ"], "answer": 2}, {"q": "Sound waves travelling through air are classified as:", "explanation": "Sound propagates through air via alternating compressions and rarefactions, with particle motion parallel to the direction of travel — a longitudinal wave.", "type": "mcq", "options": ["Standing waves only", "Longitudinal waves", "Electromagnetic waves", "Transverse waves"], "answer": 1}, {"q": "Regarding water surface waves, which statement is most accurate?", "explanation": "In real water waves, particles near the surface trace approximately circular or elliptical orbits, combining both transverse (vertical) and longitudinal (horizontal) components of motion.", "type": "mcq", "options": ["They are purely longitudinal, with particles moving strictly forward and backward", "Water particles typically move in roughly circular/elliptical paths, showing a combination of transverse and longitudinal motion", "Water particles do not move at all as the wave passes", "They are purely transverse, with particles moving strictly up and down"], "answer": 1}, {"q": "A progressive wave is described by y = 0.02 sin(4πt - 2πx) (SI units). The speed of this wave is:", "explanation": "Comparing with y = A sin(ωt - kx): ω = 4π rad/s and k = 2π rad/m, so v = ω/k = 4π/2π = 2 m/s.", "type": "mcq", "options": ["0.5 m/s", "2 m/s", "1 m/s", "4 m/s"], "answer": 1}, {"q": "A wave in air has frequency 50 Hz and travels at the speed of sound, 340 m/s. Its wavelength is:", "explanation": "λ = v/f = 340/50 = 6.8 m.", "type": "mcq", "options": ["6.8 m", "5.0 m", "3.4 m", "17,000 m"], "answer": 0}, {"q": "Mechanical waves cannot travel through a vacuum because they require a material medium.", "explanation": "Mechanical waves rely on the oscillation of particles in a medium, so unlike electromagnetic waves, they cannot propagate through a vacuum.", "type": "tf", "answer": true}, {"q": "In a transverse wave, particles of the medium move parallel to the direction of wave propagation.", "explanation": "That description applies to longitudinal waves; in a transverse wave particles move perpendicular to the direction of propagation.", "type": "tf", "answer": false}, {"q": "A stationary wave transfers energy steadily from one end of the medium to the other, just like a progressive wave.", "explanation": "A stationary wave stores energy locally between nodes and antinodes; there is no net energy transfer along the medium.", "type": "tf", "answer": false}, {"q": "The distance between two consecutive nodes in a stationary wave is equal to half a wavelength.", "explanation": "Consecutive nodes are always separated by λ/2 in a standing wave pattern.", "type": "tf", "answer": true}, {"q": "Sound waves travelling through air are longitudinal waves.", "explanation": "Air particles oscillate back and forth parallel to the direction sound travels, producing compressions and rarefactions typical of longitudinal waves.", "type": "tf", "answer": true}, {"q": "A wave that requires a material medium in order to travel is called a ______ wave.", "explanation": "Mechanical waves (unlike electromagnetic waves) need a medium such as a solid, liquid or gas to propagate.", "type": "fill", "answer": "mechanical"}, {"q": "In a ______ wave, the particles of the medium vibrate perpendicular to the direction the wave travels.", "explanation": "This perpendicular relationship between particle motion and wave direction defines a transverse wave.", "type": "fill", "answer": "transverse"}, {"q": "Points on a stationary wave pattern that remain permanently at rest are called ______.", "explanation": "Nodes are fixed points of zero displacement formed by destructive interference in a standing wave.", "type": "fill", "answer": "nodes"}, {"q": "The general equation of a progressive wave travelling in the positive x-direction is y = A sin(______).", "explanation": "The term (ωt - kx) represents the phase of a wave moving in the positive x-direction; the standard form is y = A sin(ωt - kx).", "type": "fill", "answer": "ωt - kx"}, {"q": "A stationary wave is produced by the superposition of two identical waves of the same frequency and amplitude travelling in ______ directions.", "explanation": "It is the meeting of an incident wave and its reflection, travelling in opposite directions, that produces a standing wave pattern.", "type": "fill", "answer": "opposite"}]}, {"unit": 4, "title": "Unit 4: Fluid Mechanics", "questions": [{"q": "The pressure P at a depth h below the surface of a liquid of density ρ (taking g as the acceleration due to gravity) is given by:", "explanation": "The pressure due to a liquid column is P = hρg, which increases linearly with depth h and with density ρ.", "type": "mcq", "options": ["P = hρg", "P = h + ρg", "P = h²ρg", "P = h/(ρg)"], "answer": 0}, {"q": "Using g = 10 m/s², the pressure at a depth of 10 m in water (density 1000 kg/m³) is:", "explanation": "P = hρg = 10 × 1000 × 10 = 100,000 Pa = 1 × 10⁵ Pa.", "type": "mcq", "options": ["1 × 10⁴ Pa", "1 × 10⁶ Pa", "1 × 10⁵ Pa", "1 × 10³ Pa"], "answer": 2}, {"q": "Pascal's principle states that:", "explanation": "Pascal's principle is the basis of hydraulic systems: pressure applied anywhere in an enclosed, incompressible fluid is transmitted undiminished throughout the fluid.", "type": "mcq", "options": ["Pressure applied to an enclosed fluid is transmitted equally to every part of the fluid and to the walls of its container", "Fluids cannot transmit pressure at all", "Pressure in a fluid decreases with increasing depth", "Pressure in a moving fluid is always constant"], "answer": 0}, {"q": "In a hydraulic lift, a force of 50 N is applied to a small piston of area 0.001 m², and the load is on a large piston of area 0.1 m². The force the large piston can support is:", "explanation": "Pressure is transmitted equally: F1/A1 = F2/A2 ⟹ F2 = F1 × (A2/A1) = 50 × (0.1/0.001) = 5,000 N.", "type": "mcq", "options": ["500 N", "50 N", "5,000 N", "50,000 N"], "answer": 2}, {"q": "The rise (or fall) of a liquid in a narrow tube due to surface tension effects is called:", "explanation": "Capillarity describes the rise or depression of a liquid surface inside a narrow (capillary) tube, caused by surface tension and adhesive/cohesive forces.", "type": "mcq", "options": ["Turbulence", "Buoyancy", "Capillarity", "Viscosity"], "answer": 2}, {"q": "The height of capillary rise h in a tube of radius r, for a liquid of surface tension T, density ρ, and contact angle θ, is given by:", "explanation": "The standard capillary rise formula is h = 2Tcosθ/(rρg).", "type": "mcq", "options": ["h = Tρg/(2rcosθ)", "h = rρg/(2Tcosθ)", "h = 2T/(rρgcosθ)", "h = 2Tcosθ/(rρg)"], "answer": 3}, {"q": "According to the capillary rise formula, if the radius of the capillary tube is decreased (all else constant), the height of liquid rise will:", "explanation": "Since h ∝ 1/r, a narrower tube produces a greater capillary rise.", "type": "mcq", "options": ["Decrease", "Become negative", "Increase", "Remain unchanged"], "answer": 2}, {"q": "Capillary depression (the liquid surface being pushed down in a narrow tube) occurs typically when:", "explanation": "When adhesive forces between liquid and tube are weaker than cohesive forces within the liquid (contact angle > 90°), the liquid is depressed rather than raised, as seen with mercury in glass.", "type": "mcq", "options": ["The liquid completely wets the tube material (contact angle less than 90°)", "The tube is extremely wide", "The liquid has zero surface tension", "The liquid does not wet the tube material (contact angle greater than 90°), as with mercury in a glass tube"], "answer": 3}, {"q": "The SI unit of surface tension is:", "explanation": "Surface tension is force per unit length acting along a line on the liquid surface, so its SI unit is newton per metre (N/m).", "type": "mcq", "options": ["N/m", "N·m", "Pa·s", "N/m²"], "answer": 0}, {"q": "The Reynolds number for flow of a fluid of density ρ and viscosity η, moving with speed v through a pipe of diameter d, is given by:", "explanation": "The Reynolds number is defined as Re = ρvd/η, a dimensionless number comparing inertial to viscous forces in the flow.", "type": "mcq", "options": ["Re = ηv d/ρ", "Re = ρvd/η", "Re = vd/(ρη)", "Re = ρη/(vd)"], "answer": 1}, {"q": "A low Reynolds number for fluid flow in a pipe generally indicates:", "explanation": "Low Reynolds numbers correspond to viscous forces dominating over inertial forces, favouring smooth, orderly laminar flow.", "type": "mcq", "options": ["Turbulent flow", "No flow at all", "Flow at the speed of sound", "Laminar (smooth, streamline) flow"], "answer": 3}, {"q": "A high Reynolds number for fluid flow generally indicates:", "explanation": "At high Reynolds numbers, inertial forces dominate, and small disturbances grow into chaotic eddies, producing turbulent flow.", "type": "mcq", "options": ["Flow that has completely stopped", "Laminar flow", "Turbulent, chaotic flow with eddies and mixing", "Zero viscosity of the fluid"], "answer": 2}, {"q": "The continuity equation A1v1 = A2v2 for an incompressible fluid expresses the principle of:", "explanation": "Since the fluid is incompressible and cannot accumulate anywhere in a pipe, the volume flow rate (Av) must be the same at every cross-section — this is conservation of mass.", "type": "mcq", "options": ["Conservation of pressure", "Conservation of mass (volume flow rate is constant)", "Conservation of energy", "Conservation of momentum"], "answer": 1}, {"q": "Water flows through a pipe that narrows from area 0.02 m² to 0.01 m². If the speed in the wider section is 3 m/s, the speed in the narrower section is:", "explanation": "By continuity, A1v1 = A2v2 ⟹ v2 = (A1v1)/A2 = (0.02 × 3)/0.01 = 6 m/s.", "type": "mcq", "options": ["1.5 m/s", "3 m/s", "6 m/s", "12 m/s"], "answer": 2}, {"q": "Bernoulli's equation, P + ½ρv² + ρgh = constant, along a streamline represents:", "explanation": "Bernoulli's equation is essentially the work-energy theorem applied to fluid flow, stating that pressure energy, kinetic energy and potential energy per unit volume sum to a constant along a streamline.", "type": "mcq", "options": ["The Reynolds number of the flow", "Conservation of mass only", "Conservation of electric charge in a moving fluid", "Conservation of mechanical energy per unit volume for an ideal, incompressible, non-viscous fluid"], "answer": 3}, {"q": "According to Bernoulli's principle, in a horizontal flow where the fluid speed increases, the pressure of the fluid:", "explanation": "For horizontal flow, P + ½ρv² = constant, so an increase in speed v must be accompanied by a decrease in pressure P.", "type": "mcq", "options": ["Stays exactly constant", "Becomes negative always", "Increases", "Decreases"], "answer": 3}, {"q": "The lift on an aircraft wing is commonly explained using Bernoulli's principle by noting that:", "explanation": "The wing's shape causes air to travel faster over the curved top, lowering the pressure there relative to beneath the wing, producing an upward lift force.", "type": "mcq", "options": ["Air moves faster over the curved upper surface than beneath, creating lower pressure above and a net upward force", "Air moves slower over the top of the wing, creating higher pressure there", "Air pressure is the same above and below the wing, so no lift is generated", "The wing simply pushes air downward with no pressure difference involved"], "answer": 0}, {"q": "A perfume atomizer (spray bottle) works by using a rapid stream of air blown across the top of a narrow tube, which:", "explanation": "The fast airstream over the tube's opening lowers the local pressure there, so atmospheric pressure on the liquid pushes it up the tube where it is atomised into a fine spray.", "type": "mcq", "options": ["Increases the pressure at the top of the tube, pushing the perfume back down", "Freezes the liquid perfume so it cannot flow", "Has no effect on pressure inside the tube", "Decreases the pressure at the top of the tube (Bernoulli's principle), drawing the liquid perfume up the tube to be sprayed"], "answer": 3}, {"q": "In a carburettor, a narrow constriction (venturi) in the air passage is used to:", "explanation": "The venturi constriction increases air speed and lowers pressure there, drawing fuel from the fuel jet into the fast-moving airstream — a direct application of Bernoulli's principle.", "type": "mcq", "options": ["Increase air pressure so fuel is pushed away from the air stream", "Speed up the air flow, lowering local pressure so that fuel is drawn in and mixed with the air", "Cool the incoming air to increase its density", "Stop the flow of air completely"], "answer": 1}, {"q": "A laboratory filter pump (aspirator) removes air from a flask using:", "explanation": "As water is forced through a narrowing nozzle, its speed increases and pressure drops (Bernoulli's principle), so air is drawn in and carried away with the water stream.", "type": "mcq", "options": ["Heating the flask to boil off the air", "A fast jet of water passing through a constriction, creating low pressure that sucks in air from the side tube", "A rotating fan blade placed inside the flask", "Increasing the pressure of water flowing past the flask"], "answer": 1}, {"q": "Sailing boats can make progress even when sailing partly against the wind mainly because:", "explanation": "A well-trimmed sail behaves like an aircraft wing: air moves faster over its curved side, lowering pressure there and generating a net force with a usable forward component, allowing tacking against the wind.", "type": "mcq", "options": ["The sail acts like an airfoil, and air flowing faster over its curved leeward side lowers pressure there, producing a forward-driving force component", "Wind always pushes the boat directly backward, so no forward motion is possible", "Water pressure alone propels the boat forward", "The sail has no aerodynamic effect at all"], "answer": 0}, {"q": "Terminal velocity of an object falling through a viscous fluid is reached when:", "explanation": "At terminal velocity, the downward weight is exactly balanced by the upward viscous drag and buoyant upthrust, giving zero net force and zero acceleration, so the velocity stays constant.", "type": "mcq", "options": ["The net force on the object becomes zero, so weight is balanced by drag and upthrust", "The object's acceleration is at its maximum", "The viscosity of the fluid becomes zero", "The object stops moving completely"], "answer": 0}, {"q": "By Stokes' law, the terminal velocity v_t of a small sphere of radius r, density ρ, falling through a fluid of density σ and viscosity η is given by:", "explanation": "Stokes' law gives the terminal velocity of a small sphere in a viscous fluid as v_t = 2r²g(ρ - σ)/(9η).", "type": "mcq", "options": ["v_t = 2r²g(ρ - σ)/(9η)", "v_t = 9η/(2r²g(ρ - σ))", "v_t = 2rg(ρ - σ)/(9η)", "v_t = r²g(ρ + σ)/(9η)"], "answer": 0}, {"q": "At the instant an object reaches terminal velocity while falling through a fluid, its acceleration is:", "explanation": "Terminal velocity is, by definition, the constant final velocity reached once the net force (and hence acceleration) on the falling object becomes zero.", "type": "mcq", "options": ["Negative and increasing in magnitude", "Zero", "Equal to g", "Maximum"], "answer": 1}, {"q": "The velocity–time graph of an object released from rest and falling through a viscous fluid typically shows:", "explanation": "The object accelerates from rest, but as speed increases, drag increases too, so acceleration decreases and velocity approaches (but never quite reaches, in theory) a constant terminal value.", "type": "mcq", "options": ["Velocity that is constant from the very start", "Velocity increasing rapidly at first, then levelling off asymptotically to a constant terminal velocity", "Velocity decreasing steadily to zero", "Velocity increasing linearly forever with no limit"], "answer": 1}, {"q": "The SI unit of dynamic viscosity (η) is:", "explanation": "Dynamic viscosity has SI units of pascal-seconds (Pa·s), equivalent to N·s/m².", "type": "mcq", "options": ["N/m", "m²/s only", "kg/m³", "Pa·s (equivalently N·s/m²)"], "answer": 3}, {"q": "If the viscosity of the fluid increases while all other factors (radius, densities, g) remain constant, the terminal velocity of a falling sphere will:", "explanation": "Since v_t = 2r²g(ρ-σ)/(9η), terminal velocity is inversely proportional to viscosity η, so increasing η decreases v_t.", "type": "mcq", "options": ["Increase", "Become infinite", "Decrease", "Stay exactly the same"], "answer": 2}, {"q": "If the radius of a falling sphere is doubled while everything else stays the same, its terminal velocity (by Stokes' law) becomes:", "explanation": "Since v_t ∝ r², doubling the radius increases the terminal velocity by a factor of 2² = 4.", "type": "mcq", "options": ["Half as large", "Four times as large", "The same", "Twice as large"], "answer": 1}, {"q": "Water flows horizontally through a pipe that narrows so its speed increases from 1 m/s to 4 m/s. If the pressure in the wide section is 200,000 Pa and the density of water is 1000 kg/m³, the pressure in the narrow section is approximately:", "explanation": "By Bernoulli's equation for horizontal flow: P1 + ½ρv1² = P2 + ½ρv2². P2 = 200,000 + ½(1000)(1² - 4²) = 200,000 + 500(1-16) = 200,000 - 7,500 = 192,500 Pa.", "type": "mcq", "options": ["192,500 Pa", "207,500 Pa", "200,000 Pa", "185,500 Pa"], "answer": 0}, {"q": "Which of the following does NOT directly affect the height of capillary rise in a tube, according to h = 2Tcosθ/(rρg)?", "explanation": "The capillary rise formula contains T, θ, r, ρ and g, but not the total length of the tube, so as long as the tube is long enough, its length does not affect the rise height.", "type": "mcq", "options": ["The density of the liquid", "The overall length of the tube (provided it is long enough)", "The radius of the tube", "The surface tension of the liquid"], "answer": 1}, {"q": "The pressure at a point within a liquid increases as the depth below the surface increases.", "explanation": "Since P = hρg, pressure grows linearly with depth h for a given liquid.", "type": "tf", "answer": true}, {"q": "Pascal's principle applies only to gases and cannot be applied to liquids in hydraulic systems.", "explanation": "Pascal's principle applies to enclosed fluids in general, and it is precisely the basis of hydraulic liquid systems such as hydraulic jacks and presses.", "type": "tf", "answer": false}, {"q": "A high Reynolds number for fluid flow through a pipe generally indicates turbulent flow.", "explanation": "High Reynolds numbers mean inertial forces dominate viscous forces, favouring the onset of chaotic, turbulent flow.", "type": "tf", "answer": true}, {"q": "According to Bernoulli's principle, an increase in a fluid's speed along a horizontal streamline is accompanied by an increase in its pressure.", "explanation": "Bernoulli's principle states the opposite: for horizontal flow, an increase in speed is accompanied by a decrease in pressure, since P + ½ρv² is constant.", "type": "tf", "answer": false}, {"q": "An object falling through a viscous fluid reaches terminal velocity when the net force acting on it becomes zero.", "explanation": "At terminal velocity, weight is exactly balanced by drag and upthrust, giving zero net force and constant velocity.", "type": "tf", "answer": true}, {"q": "The pressure exerted at a depth h in a liquid of density ρ is given by the formula P = ______.", "explanation": "This formula shows that liquid pressure depends on the depth, the liquid's density, and gravitational acceleration.", "type": "fill", "answer": "hρg"}, {"q": "______'s principle states that pressure applied to an enclosed fluid is transmitted equally to every part of the fluid.", "explanation": "This principle underlies hydraulic machines such as hydraulic lifts, jacks and brakes.", "type": "fill", "answer": "Pascal"}, {"q": "The rise or fall of a liquid surface inside a narrow tube due to surface tension is called ______.", "explanation": "Capillarity results from the balance between adhesive forces (liquid–tube) and cohesive forces (within the liquid) combined with surface tension.", "type": "fill", "answer": "capillarity"}, {"q": "The equation A1v1 = A2v2, which expresses conservation of mass for an incompressible fluid in a pipe, is called the ______ equation.", "explanation": "This equation states that the volume flow rate (Av) is constant along a pipe of varying cross-sectional area.", "type": "fill", "answer": "continuity"}, {"q": "The constant maximum velocity reached by an object falling through a viscous fluid, when the net force on it is zero, is called ______ velocity.", "explanation": "Terminal velocity occurs once weight is balanced exactly by the fluid's drag and upthrust forces.", "type": "fill", "answer": "terminal"}]}, {"unit": 5, "title": "Unit 5: Motion on Orbits", "questions": [{"q": "Newton's law of universal gravitation states that the gravitational force between two point masses is", "explanation": "F = Gm1m2/r², so F is proportional to m1m2 and inversely proportional to r².", "type": "mcq", "options": ["directly proportional to the product of the masses and inversely proportional to their separation", "inversely proportional to the product of the masses and directly proportional to the square of their separation", "directly proportional to the sum of the masses and inversely proportional to their separation", "directly proportional to the product of the masses and inversely proportional to the square of their separation"], "answer": 3}, {"q": "The universal gravitational constant G has an approximate value of ______ N·m²/kg².", "explanation": "G = 6.67 × 10⁻¹¹ N m² kg⁻² is the constant of proportionality in Newton's law of gravitation.", "type": "fill", "answer": "6.67 × 10⁻¹¹"}, {"q": "Two point masses of 1000 kg and 500 kg have their centres 2.0 m apart. What is the gravitational force between them?", "explanation": "F = Gm1m2/r² = (6.67×10⁻¹¹ × 1000 × 500)/2² = (3.335×10⁻⁵)/4 = 8.34×10⁻⁶ N.", "type": "mcq", "options": ["3.34 × 10⁻⁵ N", "8.34 × 10⁻⁴ N", "1.67 × 10⁻⁵ N", "8.34 × 10⁻⁶ N"], "answer": 3}, {"q": "The gravitational force between two masses is always attractive, never repulsive.", "explanation": "Unlike electric charges, mass has only one 'sign', so gravity is always an attractive force.", "type": "tf", "answer": true}, {"q": "If the distance between two masses is doubled while the masses stay constant, the gravitational force between them", "explanation": "F is proportional to 1/r², so doubling r reduces F by a factor of 2² = 4.", "type": "mcq", "options": ["doubles", "decreases to one half of its original value", "remains unchanged", "decreases to one quarter of its original value"], "answer": 3}, {"q": "Gravitational field strength at a point is defined as", "explanation": "Field strength g = F/m, the force per unit mass placed at the point, measured in N/kg.", "type": "mcq", "options": ["the gravitational potential energy per unit mass at that point", "the gravitational force experienced per unit mass placed at that point", "the work done in moving a unit mass to infinity", "the gravitational force between two unit masses at that point"], "answer": 1}, {"q": "Gravitational field strength is measured in units of ______.", "explanation": "Since g = F/m, its SI unit is newtons per kilogram, which is dimensionally equivalent to m/s².", "type": "fill", "answer": "N/kg (equivalent to m/s²)"}, {"q": "The gravitational field strength at a distance r from a point mass M is given by", "explanation": "Combining F = GMm/r² with g = F/m gives g = GM/r².", "type": "mcq", "options": ["g = GM/r²", "g = GM/r", "g = GM²/r", "g = GMr²"], "answer": 0}, {"q": "In a diagram of a gravitational field around an isolated spherical mass, the field lines", "explanation": "Gravitational field lines always point in the direction a small test mass would be pulled, i.e. towards the source mass.", "type": "mcq", "options": ["point radially outward away from the mass", "form closed loops around the mass", "run parallel to each other in one fixed direction everywhere", "point radially inward towards the centre of the mass"], "answer": 3}, {"q": "Which of the following is NOT a typical effect of the Earth's gravitational field?", "explanation": "Movement of charge between conductors is an electrical effect, not gravitational; weight, orbits and tides are all gravitational effects.", "type": "mcq", "options": ["It keeps the Moon and satellites in orbit", "It causes the tides through the Moon's and Sun's gravitational pull", "It causes electric charges to move between conductors", "It gives objects weight"], "answer": 2}, {"q": "How does the acceleration due to gravity, g, vary with height h above the Earth's surface (radius R, surface value g₀)?", "explanation": "Since g = GM/r², replacing r with (R+h) gives g(h) = GM/(R+h)² = g₀R²/(R+h)², a decrease with height.", "type": "mcq", "options": ["g = g₀(1 − h/R)", "g stays constant with height", "g = g₀R²/(R + h)²", "g = g₀(R + h)²/R²"], "answer": 2}, {"q": "A satellite orbits at a height above the Earth's surface equal to the Earth's radius R (so r = 2R). The gravitational acceleration there is", "explanation": "g = g₀R²/(2R)² = g₀R²/4R² = g₀/4.", "type": "mcq", "options": ["g₀", "g₀/4", "g₀/2", "g₀/√2"], "answer": 1}, {"q": "Assuming the Earth has uniform density, how does g vary with depth d below the surface (radius R)?", "explanation": "Below the surface, only the mass enclosed within radius (R−d) contributes; for uniform density this gives g = g₀(1 − d/R), a linear decrease.", "type": "mcq", "options": ["g increases linearly with depth", "g = g₀(R − d)²/R²", "g = g₀(1 − d/R)", "g = g₀R²/(R − d)²"], "answer": 2}, {"q": "At a depth equal to half the Earth's radius (assuming uniform density), the value of g is", "explanation": "g = g₀(1 − d/R) = g₀(1 − 0.5) = g₀/2.", "type": "mcq", "options": ["3g₀/4", "g₀", "g₀/4", "g₀/2"], "answer": 3}, {"q": "Assuming uniform Earth density, the acceleration due to gravity decreases linearly to zero as you approach the Earth's centre.", "explanation": "For a uniform sphere, g = g₀(1 − d/R), which is a straight-line decrease reaching zero at d = R (the centre).", "type": "tf", "answer": true}, {"q": "The acceleration due to gravity is at its maximum value exactly at the Earth's centre.", "explanation": "At the centre, the enclosed mass pulling in any one direction is effectively zero by symmetry, so g = 0 there; g is maximum at the surface.", "type": "tf", "answer": false}, {"q": "The gravitational acceleration at the Earth's surface has an average value of approximately ______ m/s².", "explanation": "The standard value used for g at the Earth's surface is 9.8 m/s² (sometimes taken as 9.81 m/s²).", "type": "fill", "answer": "9.8"}, {"q": "A mountaineer climbs to the top of a high mountain. Compared to sea level, their weight at the summit is", "explanation": "Increasing r decreases g = GM/r², so the gravitational force (weight) is slightly smaller at altitude, even though mass is unchanged.", "type": "mcq", "options": ["slightly more, because they are farther from the Earth's centre", "exactly the same, since mass does not change", "slightly less, because they are farther from the Earth's centre", "zero, since gravity does not act above sea level"], "answer": 2}, {"q": "Deep in a mine shaft below the Earth's surface, the value of g compared to its surface value is", "explanation": "Below the surface, less mass is enclosed within the radius to the p
