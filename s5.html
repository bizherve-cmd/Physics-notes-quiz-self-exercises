ocity addition rule, if a ball is thrown forward at speed u inside a train moving at speed v (relative to the ground), its speed relative to the ground is:", "explanation": "Galilean relativity simply adds velocities: the ground observer sees the ball moving at u + v, since velocities are assumed to combine additively.", "type": "mcq", "options": ["u/v", "u + v", "v − u", "u − v"], "answer": 1}, {"q": "The first postulate of Einstein's special theory of relativity states that:", "explanation": "Einstein's first postulate (principle of relativity) states that the laws of physics take the same form in every inertial reference frame.", "type": "mcq", "options": ["The laws of physics are the same in all inertial reference frames", "Mass increases without limit at low speeds", "Time is absolute for all observers", "The speed of light depends on the observer's motion"], "answer": 0}, {"q": "The second postulate of Einstein's special theory of relativity states that:", "explanation": "Einstein proposed that the speed of light in vacuum (c ≈ 3×10⁸ m/s) is constant and the same for every inertial observer, independent of the relative motion of the source or observer.", "type": "mcq", "options": ["The speed of light varies depending on the observer's velocity", "The speed of light in vacuum is the same for all observers, regardless of the motion of the source or observer", "Light travels faster in a moving frame", "Light needs a medium (ether) to propagate"], "answer": 1}, {"q": "Which experimental result motivated Einstein's postulate about the speed of light?", "explanation": "The Michelson–Morley experiment failed to detect any variation in the speed of light due to Earth's motion through a hypothesized ether, supporting the idea that c is constant for all observers.", "type": "mcq", "options": ["The photoelectric effect", "The Michelson–Morley experiment, which found no evidence of a luminiferous ether or variation in the speed of light", "Rutherford's gold foil experiment", "Young's double-slit experiment"], "answer": 1}, {"q": "One major implication of Einstein's postulates is that:", "explanation": "Because the speed of light is constant for all observers, events that appear simultaneous in one inertial frame may not appear simultaneous to an observer in a different inertial frame moving relative to the first.", "type": "mcq", "options": ["Simultaneity of events is relative — two events simultaneous in one frame may not be simultaneous in another", "Simultaneity of events is absolute for all observers", "Mass and energy are unrelated", "Time and space are completely independent of motion"], "answer": 0}, {"q": "The Lorentz factor γ is defined as:", "explanation": "The Lorentz factor is γ = 1/√(1 − v²/c²), which appears in the equations for time dilation, length contraction, and relativistic mass/energy.", "type": "mcq", "options": ["γ = v²/c²", "γ = 1 − v²/c²", "γ = 1/√(1 − v²/c²)", "γ = √(1 − v²/c²)"], "answer": 2}, {"q": "Calculate the Lorentz factor γ for an object moving at v = 0.6c.", "explanation": "γ = 1/√(1 − v²/c²) = 1/√(1 − 0.36) = 1/√0.64 = 1/0.8 = 1.25.", "type": "mcq", "options": ["1.00", "2.00", "1.67", "1.25"], "answer": 3}, {"q": "Time dilation is described by the equation:", "explanation": "Time dilation states that the time interval Δt measured by an observer for whom the clock is moving is Δt = γΔt₀ = Δt₀/√(1 − v²/c²), where Δt₀ is the proper time.", "type": "mcq", "options": ["Δt = Δt₀ √(1 − v²/c²)", "Δt = Δt₀ v/c", "Δt = Δt₀/√(1 − v²/c²)", "Δt = Δt₀(1 − v²/c²)"], "answer": 2}, {"q": "A clock on a spaceship measures a proper time interval of 2 s between two events. If the spaceship moves at v = 0.6c relative to Earth, what time interval does an Earth observer measure?", "explanation": "γ = 1.25 for v = 0.6c, so Δt = γΔt₀ = 1.25 × 2 s = 2.5 s.", "type": "mcq", "options": ["3.2 s", "2.5 s", "2.0 s", "1.6 s"], "answer": 1}, {"q": "As observed from a stationary (Earth) frame, a clock moving at high speed relative to that frame appears to:", "explanation": "Time dilation implies that a moving clock, as observed from a stationary frame, ticks more slowly (runs slower) than an identical stationary clock, since Δt = γΔt₀ > Δt₀.", "type": "mcq", "options": ["Run slower than an identical stationary clock", "Stop completely at any nonzero speed", "Run at exactly the same rate", "Run faster than an identical stationary clock"], "answer": 0}, {"q": "Proper time (Δt₀) is defined as the time interval between two events:", "explanation": "Proper time is the time interval measured by a clock that is present at both events, i.e. at rest relative to the events, and it is always the shortest time interval measured between two events.", "type": "mcq", "options": ["Measured by an observer for whom the two events occur at the same location (at rest relative to the events)", "That is always longer than the time measured in any other frame", "Measured by any observer, regardless of motion", "Measured only on Earth"], "answer": 0}, {"q": "Length contraction is described by the equation:", "explanation": "The length of a moving object, as measured by an observer relative to whom it is moving, is contracted: L = L₀√(1 − v²/c²) = L₀/γ, where L₀ is the proper length.", "type": "mcq", "options": ["L = L₀ γ", "L = L₀(1 + v²/c²)", "L = L₀/√(1 − v²/c²)", "L = L₀ √(1 − v²/c²)"], "answer": 3}, {"q": "A spaceship has a proper length of 100 m. What length would an observer on Earth measure if the ship travels at v = 0.8c?", "explanation": "γ = 1/√(1 − 0.64) = 1/√0.36 = 1/0.6 ≈ 1.667. L = L₀/γ = 100/1.667 = 60 m.", "type": "mcq", "options": ["60 m", "80 m", "40 m", "100 m"], "answer": 0}, {"q": "Length contraction occurs:", "explanation": "Length contraction affects only the dimension of an object that lies along the direction of relative motion; dimensions perpendicular to the motion are unaffected.", "type": "mcq", "options": ["Only perpendicular to the direction of motion", "Only along the direction of relative motion", "Only when the object is accelerating", "In all three spatial dimensions equally"], "answer": 1}, {"q": "The proper length of an object is:", "explanation": "Proper length L₀ is the length of an object as measured in its own rest frame; any observer moving relative to the object measures a shorter (contracted) length.", "type": "mcq", "options": ["The length measured in the reference frame in which the object is at rest", "The length measured by an observer moving relative to the object", "Always shorter than the length measured by a moving observer", "Undefined in special relativity"], "answer": 0}, {"q": "Einstein's mass-energy equivalence relation is expressed as:", "explanation": "Einstein showed that mass and energy are equivalent and related by E = mc², where c is the speed of light in vacuum.", "type": "mcq", "options": ["E = m²c", "E = mc", "E = mc²", "E = m/c²"], "answer": 2}, {"q": "Calculate the energy equivalent of a mass of 1 gram (1 × 10⁻³ kg) using E = mc² (c = 3 × 10⁸ m/s).", "explanation": "E = mc² = (1×10⁻³)(3×10⁸)² = (1×10⁻³)(9×10¹⁶) = 9 × 10¹³ J.", "type": "mcq", "options": ["3 × 10⁸ J", "9 × 10¹⁶ J", "9 × 10¹³ J", "9 × 10¹⁰ J"], "answer": 2}, {"q": "A nuclear reaction releases 1.8 × 10⁻¹⁰ J of energy due to a mass defect. What is the mass defect (c = 3 × 10⁸ m/s)?", "explanation": "From E = mc², m = E/c² = (1.8×10⁻¹⁰)/(9×10¹⁶) = 2 × 10⁻²⁷ kg.", "type": "mcq", "options": ["1.8 × 10⁻²⁶ kg", "6 × 10⁻¹⁹ kg", "5.4 × 10⁻³ kg", "2 × 10⁻²⁷ kg"], "answer": 3}, {"q": "One implication of E = mc² is that:", "explanation": "Mass-energy equivalence means mass and energy are interchangeable forms of the same physical quantity, as seen in nuclear fission, fusion, and particle-antiparticle annihilation.", "type": "mcq", "options": ["Only chemical reactions can release the energy equivalent of mass", "Mass can be converted into energy and energy into mass", "Mass and energy are completely unrelated quantities", "Energy can never be released from matter"], "answer": 1}, {"q": "According to special relativity, as the speed of an object with nonzero rest mass approaches the speed of light, the energy required to accelerate it further:", "explanation": "As v → c, the Lorentz factor γ → ∞, so the relativistic energy (and the energy needed to further accelerate the object) also approaches infinity, which is why massive objects cannot reach the speed of light.", "type": "mcq", "options": ["Approaches zero", "Approaches a finite constant value", "Decreases steadily", "Approaches infinity"], "answer": 3}, {"q": "The relativity of simultaneity means that:", "explanation": "Because of the finite, constant speed of light, whether two spatially separated events are simultaneous depends on the observer's frame of reference — this is the relativity of simultaneity.", "type": "mcq", "options": ["Simultaneity has no meaning in physics", "Two events that are simultaneous for one inertial observer may not be simultaneous for another observer in relative motion", "Only events at the same location can be simultaneous", "All observers always agree on which events are simultaneous"], "answer": 1}, {"q": "In the twin paradox, a twin who travels on a high-speed round trip and returns to Earth, compared to the twin who stayed on Earth, will be:", "explanation": "Due to time dilation, the traveling twin's clock (proper time along their path) accumulates less elapsed time, so upon return they are younger than the twin who remained on Earth.", "type": "mcq", "options": ["Older than the twin who stayed on Earth", "Exactly the same age", "Unable to be compared due to relativity", "Younger than the twin who stayed on Earth"], "answer": 3}, {"q": "GPS satellite clocks must be corrected for relativistic effects mainly because:", "explanation": "GPS satellites move at high orbital speeds (special relativistic time dilation) and experience weaker gravity (general relativistic effect), both of which cause their onboard clocks to run at a different rate than clocks on Earth, requiring correction.", "type": "mcq", "options": ["Radio waves travel faster in space than on Earth", "Satellites do not use electromagnetic signals", "Satellites move at high speed and are in a different gravitational potential, both of which affect their clock rates relative to clocks on Earth", "GPS relies only on Newtonian mechanics"], "answer": 2}, {"q": "As v increases from 0 toward c, the Lorentz factor γ:", "explanation": "Since γ = 1/√(1 − v²/c²), as v increases toward c, the denominator approaches zero, so γ increases without bound toward infinity.", "type": "mcq", "options": ["Remains constant at 1", "Decreases from 1 toward 0", "Increases from 1 toward infinity", "Oscillates periodically"], "answer": 2}, {"q": "A rod has a rest length of 50 m. Measured by an observer relative to whom it moves at v = 0.6c, its length is:", "explanation": "γ = 1.25 for v = 0.6c. L = L₀/γ = 50/1.25 = 40 m.", "type": "mcq", "options": ["30 m", "50 m", "62.5 m", "40 m"], "answer": 3}, {"q": "Which statement correctly compares Galilean and Einsteinian relativity?", "explanation": "Galilean relativity assumes time is universal and speeds simply add without limit, while Einstein's relativity shows time and length are relative to the observer and no material object can reach or exceed the speed of light.", "type": "mcq", "options": ["Both assume time is absolute", "Galilean relativity assumes absolute time and unlimited relative speeds; Einsteinian relativity treats time as relative and limits speeds to at most c", "Galilean relativity accounts for the constancy of the speed of light", "Einsteinian relativity applies only to slow-moving objects"], "answer": 1}, {"q": "According to the Galilean transformation, time is assumed to be the same for all observers, regardless of their relative motion.", "explanation": "Classical (Galilean) relativity treats time as absolute, so t' = t in all inertial frames — an assumption later shown to be incorrect by special relativity.", "type": "tf", "answer": true}, {"q": "According to Einstein's postulates, the speed of light in vacuum depends on the velocity of the source emitting it.", "explanation": "Einstein's second postulate states that the speed of light in vacuum is constant for all inertial observers, independent of the motion of the source or the observer.", "type": "tf", "answer": false}, {"q": "As observed from a stationary frame, a moving clock runs faster than an identical stationary clock.", "explanation": "Time dilation predicts the opposite: a moving clock, as seen from a stationary frame, runs slower (Δt = γΔt₀ > Δt₀ for the stationary observer's measurement of the moving clock's ticks).", "type": "tf", "answer": false}, {"q": "Length contraction occurs only in the direction perpendicular to the relative motion between observer and object.", "explanation": "Length contraction occurs only along the direction of relative motion; dimensions perpendicular to the motion remain unchanged.", "type": "tf", "answer": false}, {"q": "According to Einstein's mass-energy equivalence, mass and energy are interchangeable forms of the same physical quantity.", "explanation": "E = mc² shows that mass can be converted into energy and vice versa, as observed in nuclear reactions and particle physics.", "type": "tf", "answer": true}, {"q": "The equation E = ______ expresses the equivalence of mass and energy.", "explanation": "Einstein's mass-energy equivalence relation is E = mc², where c is the speed of light in vacuum.", "type": "fill", "answer": "mc²"}, {"q": "A reference frame that is at rest or moving at constant velocity is called an ______ frame.", "explanation": "An inertial frame is a non-accelerating frame of reference in which Newton's first law (and the postulates of special relativity) holds.", "type": "fill", "answer": "inertial"}, {"q": "The fact that two events simultaneous in one reference frame may not be simultaneous in another moving frame is called the relativity of ______.", "explanation": "This effect, called the relativity of simultaneity, arises because the speed of light is constant and signals take time to travel between observers in relative motion.", "type": "fill", "answer": "simultaneity"}, {"q": "The factor γ = 1/√(1 − v²/c²) used in time dilation and length contraction equations is called the ______ factor.", "explanation": "This quantity, the Lorentz factor, increases from 1 toward infinity as an object's speed approaches the speed of light.", "type": "fill", "answer": "Lorentz"}, {"q": "According to length contraction, an object's length is greatest (equal to its proper length) when measured in its own ______ frame.", "explanation": "The proper length L₀ is measured in the object's rest frame; any observer moving relative to the object measures a shorter, contracted length.", "type": "fill", "answer": "rest"}]}, {"unit": 11, "title": "Unit 11: Interference and Diffraction of Light", "questions": [{"q": "An electromagnetic wave is best described as:", "explanation": "Electromagnetic waves are transverse waves made up of oscillating electric and magnetic fields that are perpendicular to each other and to the direction the wave travels, and they can propagate through vacuum.", "type": "mcq", "options": ["A transverse wave consisting of oscillating electric and magnetic fields perpendicular to each other and to the direction of propagation", "A mechanical wave that transports matter", "A longitudinal wave requiring a material medium to travel", "A wave that only exists inside conductors"], "answer": 0}, {"q": "Electromagnetic waves can travel through:", "explanation": "Unlike mechanical waves, electromagnetic waves do not need a medium; they can propagate through vacuum as well as through transparent media such as air, water, and glass.", "type": "mcq", "options": ["Only solids", "Vacuum, as well as through various media", "Only gases", "Only liquids"], "answer": 1}, {"q": "The speed of electromagnetic waves in a vacuum is approximately:", "explanation": "All electromagnetic waves travel at the speed of light in vacuum, c ≈ 3 × 10⁸ m/s, regardless of their frequency or wavelength.", "type": "mcq", "options": ["3 × 10¹⁰ m/s", "3 × 10⁸ m/s", "3 × 10⁶ m/s", "3 × 10⁵ m/s"], "answer": 1}, {"q": "Arranged in order of increasing frequency, the electromagnetic spectrum is:", "explanation": "In order of increasing frequency (decreasing wavelength), the spectrum runs radio waves, microwaves, infrared, visible light, ultraviolet, X-rays, then gamma rays.", "type": "mcq", "options": ["Radio waves, microwaves, infrared, visible, ultraviolet, X-rays, gamma rays", "Visible, infrared, radio waves, microwaves, ultraviolet, X-rays, gamma rays", "Gamma rays, X-rays, ultraviolet, visible, infrared, microwave, radio waves", "Radio waves, gamma rays, X-rays, visible, infrared, microwaves, ultraviolet"], "answer": 0}, {"q": "Which region of the electromagnetic spectrum is commonly used for medical imaging of bones due to its high penetrating power?", "explanation": "X-rays have high energy and penetrating power, allowing them to pass through soft tissue but be absorbed by denser material like bone, making them useful for medical imaging.", "type": "mcq", "options": ["Microwaves", "X-rays", "Radio waves", "Infrared"], "answer": 1}, {"q": "Microwaves are commonly applied in:", "explanation": "Microwaves are widely used in communication systems (mobile phones, satellites, radar) and in microwave ovens, where they cause water molecules in food to vibrate and generate heat.", "type": "mcq", "options": ["Producing visible light in incandescent bulbs", "Sterilizing surgical instruments using ionizing radiation", "Radiotherapy for cancer treatment only", "Satellite and mobile communication, and microwave cooking"], "answer": 3}, {"q": "For two light sources to produce a sustained (observable) interference pattern, they must be:", "explanation": "Interference patterns remain stable only if the two sources are coherent, meaning they emit waves of the same frequency with a constant (unchanging) phase difference.", "type": "mcq", "options": ["Placed very far apart", "Coherent — having a constant phase difference and the same frequency", "Extremely bright", "Of different frequencies"], "answer": 1}, {"q": "Constructive interference occurs at points where the path difference between two coherent waves is:", "explanation": "Constructive interference (bright fringes) occurs when the path difference equals a whole number of wavelengths: Δ = nλ, where n = 0, ±1, ±2, ...", "type": "mcq", "options": ["Exactly a quarter wavelength", "An integral multiple of the wavelength (nλ)", "An odd multiple of half the wavelength", "Any random value"], "answer": 1}, {"q": "Destructive interference occurs at points where the path difference between two coherent waves is:", "explanation": "Destructive interference (dark fringes) occurs when the path difference is an odd multiple of half a wavelength: Δ = (n + 1/2)λ, causing the waves to arrive out of phase and cancel.", "type": "mcq", "options": ["An odd multiple of half the wavelength, i.e. (n + 1/2)λ", "Zero", "An integral multiple of the wavelength", "Equal to the slit separation"], "answer": 0}, {"q": "Why can't two independent light bulbs produce a stable interference pattern?", "explanation": "Independent sources emit light with randomly and rapidly varying phase relationships (incoherent light), so any interference pattern shifts too fast to be observed, averaging out to uniform illumination.", "type": "mcq", "options": ["The distance between bulbs is always too large", "Their light waves have random, rapidly changing phase differences (they are incoherent)", "Light bulbs emit no electromagnetic waves", "They emit light of exactly the same wavelength"], "answer": 1}, {"q": "In Young's double-slit experiment, the two coherent sources are typically obtained by:", "explanation": "Young's experiment achieves coherence by passing light from a single source through two narrow slits, so that the light emerging from both slits maintains a constant phase relationship.", "type": "mcq", "options": ["Illuminating two narrow, closely spaced slits with light from a single source", "Using a prism to split white light into colors", "Using two separate, unrelated lamps", "Reflecting light off a mirror twice"], "answer": 0}, {"q": "In Young's double-slit experiment, the fringe spacing (fringe width) β is given by:", "explanation": "The fringe spacing in Young's double-slit experiment is β = λD/d, where λ is the wavelength, D is the distance from slits to screen, and d is the slit separation.", "type": "mcq", "options": ["β = λD/d", "β = dD/λ", "β = λd/D", "β = D/(λd)"], "answer": 0}, {"q": "In a Young's double-slit setup, λ = 600 nm, D = 1 m, and d = 1 mm. Calculate the fringe width.", "explanation": "β = λD/d = (600×10⁻⁹ × 1)/(1×10⁻³) = 6 × 10⁻⁴ m = 0.6 mm.", "type": "mcq", "options": ["6 mm", "60 mm", "0.6 mm", "0.06 mm"], "answer": 2}, {"q": "If the slit separation d in Young's double-slit experiment is increased while λ and D stay constant, the fringe width:", "explanation": "Since β = λD/d, fringe width is inversely proportional to slit separation d, so increasing d decreases the fringe width.", "type": "mcq", "options": ["Becomes infinite", "Remains the same", "Increases", "Decreases"], "answer": 3}, {"q": "If the wavelength of light used in Young's double-slit experiment is increased (D and d fixed), the fringe width will:", "explanation": "Since β = λD/d, fringe width is directly proportional to wavelength, so a longer wavelength produces wider fringes.", "type": "mcq", "options": ["Decrease", "Become zero", "Increase", "Stay the same"], "answer": 2}, {"q": "Increasing the distance D between the double slit and the screen, with λ and d constant, causes the fringe width to:", "explanation": "Since β = λD/d, fringe width increases directly with the slit-to-screen distance D.", "type": "mcq", "options": ["Become negative", "Remain unchanged", "Decrease", "Increase"], "answer": 3}, {"q": "In Young's double-slit pattern, the central bright fringe occurs where:", "explanation": "The central fringe is bright because the path difference from both slits to that point on the screen is zero, giving perfect constructive interference (n = 0).", "type": "mcq", "options": ["There is no light from either slit", "The path difference equals one wavelength", "The path difference is zero", "The path difference equals half a wavelength"], "answer": 2}, {"q": "The condition for bright fringes in a double-slit experiment, in terms of slit separation d and angle θ from the central axis, is:", "explanation": "Bright fringes occur where the path difference d sinθ equals a whole number of wavelengths: d sinθ = nλ, for n = 0, ±1, ±2, ...", "type": "mcq", "options": ["d cosθ = nλ", "d sinθ = (n + 1/2)λ", "d sinθ = nλ", "d tanθ = nλ/2"], "answer": 2}, {"q": "In the intensity distribution formula for double-slit interference, I = 4I₀cos²(φ/2), where I₀ is the intensity from a single slit, the maximum resultant intensity is:", "explanation": "The maximum intensity occurs when cos²(φ/2) = 1 (at φ = 0, 2π, ...), giving I_max = 4I₀, four times the intensity of a single slit alone.", "type": "mcq", "options": ["2I₀", "I₀", "8I₀", "4I₀"], "answer": 3}, {"q": "According to the intensity distribution of the double-slit fringe pattern, the intensity is zero (dark fringe) when the phase difference φ equals:", "explanation": "I = 4I₀cos²(φ/2) is zero when cos(φ/2) = 0, which occurs at φ/2 = π/2, 3π/2, ..., i.e. φ = π, 3π, 5π, ... (odd multiples of π).", "type": "mcq", "options": ["2π", "0", "π (and odd multiples of π)", "4π"], "answer": 2}, {"q": "The relationship between phase difference φ and path difference Δ for two interfering waves of wavelength λ is:", "explanation": "Phase difference and path difference are related by φ = (2π/λ) × Δ, since a path difference of one full wavelength corresponds to a phase difference of 2π.", "type": "mcq", "options": ["φ = (λ/2π)Δ", "φ = (2π/λ)Δ", "φ = λΔ", "φ = Δ/λ"], "answer": 1}, {"q": "Two coherent waves have a path difference of λ/2. What is their phase difference?", "explanation": "φ = (2π/λ)Δ = (2π/λ)(λ/2) = π rad, which corresponds to destructive interference.", "type": "mcq", "options": ["0 rad", "π rad", "2π rad", "π/2 rad"], "answer": 1}, {"q": "Diffraction of light refers to:", "explanation": "Diffraction is the bending and spreading of waves as they pass around an obstacle or through a narrow aperture (slit), most noticeable when the obstacle/aperture size is comparable to the wavelength.", "type": "mcq", "options": ["The bending or spreading of light waves around obstacles or through small apertures", "The absorption of light by a black surface", "The reflection of light from a mirror", "The splitting of white light into its component colors by a prism"], "answer": 0}, {"q": "Diffraction effects become most noticeable when the size of the slit or obstacle is:", "explanation": "Diffraction effects are most pronounced when the slit width or obstacle size is comparable to the wavelength of the wave; if it is much larger, diffraction is negligible.", "type": "mcq", "options": ["Comparable to (of the same order as) the wavelength of light", "Much smaller than the wavelength of light", "Exactly equal to zero", "Much larger than the wavelength of light"], "answer": 0}, {"q": "In single-slit diffraction, the condition for the positions of the dark fringes (minima) for a slit of width a is:", "explanation": "For single-slit diffraction, minima (dark fringes) occur at angles θ satisfying a sinθ = nλ, where n = 1, 2, 3, ... (n ≠ 0).", "type": "mcq", "options": ["a sinθ = (n + 1/2)λ", "a sinθ = λ/2 only", "a cosθ = nλ", "a sinθ = nλ, n = 1, 2, 3, ..."], "answer": 3}, {"q": "Compared to the secondary maxima, the central maximum in a single-slit diffraction pattern is:", "explanation": "The central maximum in single-slit diffraction is about twice as wide as each secondary maximum and is significantly more intense (brightest part of the pattern).", "type": "mcq", "options": ["Absent altogether", "Narrower and dimmer", "The same width but dimmer", "Wider and brighter"], "answer": 3}, {"q": "If the width of a single slit is decreased (wavelength constant), the central diffraction maximum on the screen:", "explanation": "Since the angular position of the first minimum satisfies sinθ = λ/a, decreasing the slit width a increases θ, spreading the central maximum wider.", "type": "mcq", "options": ["Stays exactly the same width", "Disappears completely", "Becomes wider", "Becomes narrower"], "answer": 2}, {"q": "A single slit of width 0.2 mm is illuminated with light of wavelength 500 nm. Find the angle to the first diffraction minimum.", "explanation": "sinθ = λ/a = (500×10⁻⁹)/(0.2×10⁻³) = 2.5 × 10⁻³ rad. θ ≈ 0.143° (since sinθ ≈ θ in radians for small angles).", "type": "mcq", "options": ["14.3°", "0.0143°", "0.143°", "1.43°"], "answer": 2}, {"q": "The key distinction between interference and diffraction is that:", "explanation": "Interference is typically described as superposition of waves from two (or more) distinct coherent sources, whereas diffraction results from the superposition of secondary wavelets originating from different points across a single wavefront or aperture.", "type": "mcq", "options": ["Diffraction requires two separate light sources, while interference requires only one", "Interference only occurs with sound waves, while diffraction only occurs with light", "There is no real physical difference between the two phenomena", "Interference involves the superposition of waves from two or more coherent sources, while diffraction involves the spreading and superposition of secondary wavelets from a single wavefront/aperture"], "answer": 3}, {"q": "Young's double-slit experiment is historically significant because it:", "explanation": "By producing a clear interference pattern of bright and dark fringes, Young's experiment provided strong evidence that light behaves as a wave, contradicting the purely corpuscular (particle) theory of light of the time.", "type": "mcq", "options": ["Provided strong evidence for the wave nature of light by demonstrating interference", "Showed that light cannot diffract", "Proved that light travels only in straight lines", "Disproved the existence of the electromagnetic spectrum"], "answer": 0}, {"q": "Electromagnetic waves require a material medium in order to propagate.", "explanation": "Electromagnetic waves consist of oscillating electric and magnetic fields and can travel through a vacuum; they do not require a medium, unlike mechanical waves.", "type": "tf", "answer": false}, {"q": "For a stable interference pattern to be observed, the two light sources must be coherent, having the same frequency and a constant phase difference.", "explanation": "Coherence (same frequency, constant phase relationship) is essential; without it, the interference pattern shifts too rapidly to be observed and the light appears uniformly bright.", "type": "tf", "answer": true}, {"q": "In Young's double-slit experiment, the fringe width is independent of the wavelength of light used.", "explanation": "Fringe width β = λD/d is directly proportional to the wavelength λ, so changing the wavelength changes the fringe spacing.", "type": "tf", "answer": false}, {"q": "In single-slit diffraction, the central maximum is the brightest and widest part of the pattern.", "explanation": "The central maximum receives the greatest constructive contribution from the wavelets across the slit and spans roughly twice the angular width of each secondary maximum.", "type": "tf", "answer": true}, {"q": "Destructive interference occurs when the path difference between two coherent waves equals an odd multiple of half the wavelength.", "explanation": "At path differences of (n + 1/2)λ, the two waves arrive exactly out of phase and cancel, producing a dark fringe (destructive interference).", "type": "tf", "answer": true}, {"q": "Electromagnetic waves consist of oscillating ______ and magnetic fields that are perpendicular to each other and to the direction of wave travel.", "explanation": "An electromagnetic wave has mutually perpendicular oscillating electric and magnetic field components, both perpendicular to the direction of propagation.", "type": "fill", "answer": "electric"}, {"q": "The fringe spacing in Young's double-slit experiment is given by the formula β = ______.", "explanation": "Fringe width β equals λD/d, where λ is the wavelength, D the slit-to-screen distance, and d the slit separation.", "type": "fill", "answer": "λD/d"}, {"q": "Two sources that emit waves of the same frequency with a constant phase difference are called ______ sources.", "explanation": "Coherent sources are required to produce a stable, observable interference pattern.", "type": "fill", "answer": "coherent"}, {"q": "In single-slit diffraction, dark fringes (minima) occur when a sinθ = ______, where a is the slit width.", "explanation": "The minima in a single-slit diffraction pattern occur at angles satisfying a sinθ = nλ, for n = 1, 2, 3, ...", "type": "fill", "answer": "nλ"}, {"q": "The bending and spreading of light waves as they pass through a narrow slit or around an obstacle is called ______.", "explanation": "Diffraction is most noticeable when the slit width or obstacle size is comparable to the wavelength of the light.", "type": "fill", "answer": "diffraction"}]}];

  function loadProgress(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {};
  }
  function saveProgress(p){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
  }
  var progress = loadProgress(); // { unitIndex: {correct, attempted, done} }

  var homeView = document.getElementById("homeView");
  var quizView = document.getElementById("quizView");
  var summaryView = document.getElementById("summaryView");
  var unitGrid = document.getElementById("unitGrid");
  var overallScoreVal = document.getElementById("overallScoreVal");

  var state = { unitIdx: null, qIdx: 0, correct: 0, attempted: 0, answered: false };

  function normalize(s){
    return (s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  }
  function answerVariants(ans){
    // split things like "underdamped (lightly damped)" or "rad/s (radian per second)"
    var out = [];
    var cleaned = ans.replace(/[()]/g, "|");
    cleaned.split(/[|\/,;]| or /i).forEach(function(part){
      var n = normalize(part);
      if(n) out.push(n);
    });
    var whole = normalize(ans);
    if(whole) out.push(whole);
    return out;
  }
  function fuzzyMatch(userText, correctText){
    var u = normalize(userText);
    if(!u) return false;
    var variants = answerVariants(correctText);
    for(var i=0;i<variants.length;i++){
      var v = variants[i];
      if(!v) continue;
      if(u === v) return true;
      if(v.length > 3 && (u.indexOf(v) !== -1 || v.indexOf(u) !== -1)) return true;
    }
    return false;
  }

  function totalQuestions(){
    var t=0; DATA.forEach(function(u){ t += u.questions.length; }); return t;
  }
  function overallStats(){
    var correct=0, attempted=0;
    Object.keys(progress).forEach(function(k){
      correct += progress[k].correct||0;
      attempted += progress[k].attempted||0;
    });
    return {correct:correct, attempted:attempted};
  }
  function refreshOverall(){
    var s = overallStats();
    overallScoreVal.textContent = s.correct + "/" + totalQuestions();
  }

  function renderUnitList(){
    unitGrid.innerHTML = "";
    DATA.forEach(function(unit, idx){
      var p = progress[idx];
      var btn = document.createElement("button");
      btn.className = "unit-card";
      var done = p && p.done;
      btn.innerHTML =
        '<span class="num">U' + unit.unit + '</span>' +
        '<span class="info">' +
          '<span class="t">' + escapeHtml(unit.title.replace(/^Unit \d+:\s*/,"")) + '</span>' +
          '<span class="s">' + unit.questions.length + ' questions</span>' +
        '</span>' +
        '<span class="badge' + (done ? ' done' : '') + '">' +
          (p ? (p.correct + '/' + unit.questions.length) : 'Start') +
        '</span>';
      btn.addEventListener("click", function(){ startUnit(idx); });
      unitGrid.appendChild(btn);
    });
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // ---- shuffling: new question order and answer order on every attempt ----
  function shuffleArr(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function shuffleOptions(q){
    if(q.type !== "mcq") return q;
    var idx = q.options.map(function(_, i){ return i; });
    // options like "None of the above" stay in their place at the end
    var movable = idx.filter(function(i){ return !/of the above/i.test(q.options[i]); });
    var shuffled = shuffleArr(movable.slice());
    var order = idx.slice(), k = 0;
    for(var i=0;i<idx.length;i++){ if(movable.indexOf(i) !== -1){ order[i] = shuffled[k++]; } }
    var copy = {}; for(var p in q){ copy[p] = q[p]; }
    copy.options = order.map(function(i){ return q.options[i]; });
    copy.answer = order.indexOf(q.answer);
    return copy;
  }
  function buildSession(questions){
    // questions marked "link" refer to the one before, so they stay together as a group
    var groups = [];
    questions.forEach(function(q){
      if(q.link && groups.length) groups[groups.length-1].push(q);
      else groups.push([q]);
    });
    shuffleArr(groups);
    var out = [];
    groups.forEach(function(g){ g.forEach(function(q){ out.push(shuffleOptions(q)); }); });
    return out;
  }

  function startUnit(idx){
    state.unitIdx = idx;
    state.session = buildSession(DATA[idx].questions);
    state.qIdx = 0;
    state.correct = 0;
    state.attempted = 0;
    showView("quiz");
    renderQuestion();
  }

  function showView(name){
    homeView.hidden = name !== "home";
    quizView.hidden = name !== "quiz";
    summaryView.hidden = name !== "summary";
    if(name === "home"){ renderUnitList(); refreshOverall(); }
  }

  var quizUnitTitle = document.getElementById("quizUnitTitle");
  var quizProgressLabel = document.getElementById("quizProgressLabel");
  var unitScoreVal = document.getElementById("unitScoreVal");
  var progressFill = document.getElementById("progressFill");
  var qmeta = document.getElementById("qmeta");
  var qtext = document.getElementById("qtext");
  var optionsWrap = document.getElementById("optionsWrap");
  var fillWrap = document.getElementById("fillWrap");
  var fillInput = document.getElementById("fillInput");
  var fillSubmit = document.getElementById("fillSubmit");
  var feedback = document.getElementById("feedback");
  var nextBtn = document.getElementById("nextBtn");
  var skipBtn = document.getElementById("skipBtn");
  var backBtn = document.getElementById("backBtn");

  function currentUnit(){ return DATA[state.unitIdx]; }
  function currentQuestion(){ return state.session[state.qIdx]; }

  function renderQuestion(){
    var unit = currentUnit();
    var q = currentQuestion();
    state.answered = false;
    quizUnitTitle.textContent = unit.title;
    quizProgressLabel.textContent = "Question " + (state.qIdx+1) + " of " + unit.questions.length;
    unitScoreVal.textContent = state.correct + "/" + state.attempted;
    progressFill.style.width = (100 * state.qIdx / unit.questions.length) + "%";
    qmeta.textContent = q.type === "mcq" ? "Multiple choice" : (q.type === "tf" ? "True / False" : "Fill in the blank");
    qtext.textContent = q.q;
    feedback.className = "feedback";
    feedback.innerHTML = "";
    nextBtn.disabled = true;

    optionsWrap.innerHTML = "";
    fillWrap.hidden = true;

    if(q.type === "mcq"){
      optionsWrap.hidden = false;
      q.options.forEach(function(opt, i){
        var b = document.createElement("button");
        b.className = "opt";
        b.innerHTML = '<span class="k">' + "ABCD"[i] + '</span><span>' + escapeHtml(opt) + '</span>';
        b.addEventListener("click", function(){ answerMcq(i, b); });
        optionsWrap.appendChild(b);
      });
    } else if(q.type === "tf"){
      optionsWrap.hidden = false;
      [["True", true], ["False", false]].forEach(function(pair, i){
        var b = document.createElement("button");
        b.className = "opt";
        b.innerHTML = '<span class="k">' + (i===0?"T":"F") + '</span><span>' + pair[0] + '</span>';
        b.addEventListener("click", function(){ answerTf(pair[1], b); });
        optionsWrap.appendChild(b);
      });
    } else {
      optionsWrap.hidden = true;
      fillWrap.hidden = false;
      fillInput.value = "";
      fillInput.disabled = false;
      fillSubmit.disabled = false;
      setTimeout(function(){ fillInput.focus(); }, 0);
    }
  }

  function lockOptions(){
    Array.prototype.forEach.call(optionsWrap.querySelectorAll(".opt"), function(b){ b.disabled = true; });
  }

  function showFeedback(isCorrect, explanation, correctText){
    feedback.classList.add("show");
    feedback.classList.add(isCorrect ? "correct" : "incorrect");
    var head = isCorrect
      ? '<div class="verdict v-correct">Correct.</div>'
      : '<div class="verdict v-incorrect">Not quite' + (correctText ? (" &mdash; correct answer: " + escapeHtml(correctText)) : "") + '.</div>';
    feedback.innerHTML = head + (explanation ? '<div>' + escapeHtml(explanation) + '</div>' : "");
    nextBtn.disabled = false;
  }

  function recordAnswer(isCorrect){
    state.attempted++;
    if(isCorrect) state.correct++;
    unitScoreVal.textContent = state.correct + "/" + state.attempted;
  }

  function answerMcq(i, btnEl){
    if(state.answered) return;
    state.answered = true;
    var q = currentQuestion();
    var isCorrect = i === q.answer;
    lockOptions();
    Array.prototype.forEach.call(optionsWrap.children, function(b, idx){
      if(idx === q.answer) b.classList.add("correct");
      else if(idx === i) b.classList.add("incorrect");
    });
    recordAnswer(isCorrect);
    showFeedback(isCorrect, q.explanation, null);
  }

  function answerTf(val, btnEl){
    if(state.answered) return;
    state.answered = true;
    var q = currentQuestion();
    var isCorrect = val === q.answer;
    lockOptions();
    Array.prototype.forEach.call(optionsWrap.children, function(b, idx){
      var bVal = idx === 0;
      if(bVal === q.answer) b.classList.add("correct");
      else if(bVal === val) b.classList.add("incorrect");
    });
    recordAnswer(isCorrect);
    showFeedback(isCorrect, q.explanation, null);
  }

  function answerFill(){
    if(state.answered) return;
    var q = currentQuestion();
    var val = fillInput.value.trim();
    if(!val) return;
    state.answered = true;
    fillInput.disabled = true;
    fillSubmit.disabled = true;
    var isCorrect = fuzzyMatch(val, q.answer);
    recordAnswer(isCorrect);
    showFeedback(isCorrect, q.explanation, q.answer);
  }

  fillSubmit.addEventListener("click", answerFill);
  fillInput.addEventListener("keydown", function(e){ if(e.key === "Enter") answerFill(); });

  skipBtn.addEventListener("click", function(){
    if(!state.answered){
      var q = currentQuestion();
      state.attempted++;
      unitScoreVal.textContent = state.correct + "/" + state.attempted;
      lockOptions();
      fillInput.disabled = true; fillSubmit.disabled = true;
      showFeedback(false, q.explanation, q.type === "fill" ? q.answer : (q.type === "mcq" ? q.options[q.answer] : (q.answer ? "True" : "False")));
      state.answered = true;
    } else {
      advance();
    }
  });

  nextBtn.addEventListener("click", advance);

  function advance(){
    var unit = currentUnit();
    if(state.qIdx < unit.questions.length - 1){
      state.qIdx++;
      renderQuestion();
    } else {
      finishUnit();
    }
  }

  function finishUnit(){
    var unit = currentUnit();
    progress[state.unitIdx] = {
      correct: state.correct,
      attempted: state.attempted,
      done: true
    };
    saveProgress(progress);
    document.getElementById("summaryUnitTitle").textContent = unit.title;
    document.getElementById("summaryScore").textContent = state.correct + "/" + unit.questions.length;
    var pct = Math.round(100 * state.correct / unit.questions.length);
    var sub = "You scored " + pct + "%.";
    if(pct >= 80) sub = "Excellent work &mdash; " + pct + "%. This unit is solid.";
    else if(pct >= 50) sub = "Good progress &mdash; " + pct + "%. Review the missed questions in the practice book.";
    else sub = pct + "%. Worth another pass through this unit.";
    document.getElementById("summarySub").innerHTML = sub;
    showView("summary");
    refreshOverall();
  }

  document.getElementById("retryBtn").addEventListener("click", function(){ startUnit(state.unitIdx); });
  document.getElementById("toUnitsBtn").addEventListener("click", function(){ showView("home"); });
  backBtn.addEventListener("click", function(){ showView("home"); });

  showView("home");
})();
</script>

</body></html>
