"At resonance, XL and Xc cancel, leaving only resistance R, which is the minimum possible impedance for that circuit."}, {"type": "mcq", "q": "The resonant frequency of a series LCR circuit is given by:", "options": ["f0 = 1/(2π√(LC))", "f0 = 2π√(LC)", "f0 = 1/(LC)", "f0 = LC/2π"], "answer": 0, "explanation": "The resonant frequency is f0 = 1/(2π√(LC)), derived by setting XL = Xc."}, {"type": "mcq", "q": "Average power in a purely resistive AC circuit is given by:", "options": ["P = VrmsIrms", "P = V0I0", "P = VrmsI0", "P = 2VrmsIrms"], "answer": 0, "explanation": "Average power dissipated in a resistive AC circuit is P = VrmsIrms (= Irms²R = Vrms²/R)."}, {"type": "mcq", "q": "The average power delivered in a purely reactive (inductive or capacitive) AC circuit is:", "options": ["Maximum", "Zero", "Equal to resistive power", "Negative always"], "answer": 1, "explanation": "In a purely reactive circuit, current and voltage are 90° out of phase, so the average power delivered over a cycle is zero."}, {"type": "mcq", "q": "Power factor in an AC circuit is defined as:", "options": ["sinθ, where θ is the phase angle", "cosθ, where θ is the phase angle between V and I", "tanθ", "Always equal to 1"], "answer": 1, "explanation": "Power factor = cosθ, where θ is the phase difference between voltage and current; it indicates the effectiveness of power delivery."}, {"type": "mcq", "q": "A capacitor connected across an AC supply allows current to flow because:", "options": ["Charge physically crosses between the plates", "The capacitor continuously charges and discharges as the voltage alternates", "It behaves like a pure resistor", "It rectifies the AC"], "answer": 1, "explanation": "Although no charge crosses the gap between plates, the continuous charging and discharging as AC voltage alternates results in an effective AC current flow."}, {"type": "mcq", "q": "An AC voltage of peak value 340 V has an rms value of approximately:", "options": ["340 V", "240 V", "480 V", "170 V"], "answer": 1, "explanation": "Vrms = V0/√2 = 340/1.414 ≈ 240 V, a typical mains rms voltage."}, {"type": "mcq", "q": "Which quantity remains constant regardless of frequency in an AC circuit containing only a resistor?", "options": ["Reactance", "Resistance", "Impedance angle", "Phase difference"], "answer": 1, "explanation": "A pure resistor's resistance R does not depend on frequency, unlike reactance which changes with frequency in capacitors and inductors."}, {"type": "mcq", "q": "The phase angle between current and voltage in a series LCR circuit at resonance is:", "options": ["90°", "180°", "0°", "45°"], "answer": 2, "explanation": "At resonance, the circuit behaves purely resistively, so current and voltage are in phase (phase angle = 0°)."}, {"type": "mcq", "q": "A transformer is more efficient with AC than DC because:", "options": ["DC produces stronger magnetic fields", "AC creates a continuously changing flux needed for induction", "DC has no voltage", "AC has no frequency"], "answer": 1, "explanation": "Only a changing current (as in AC) produces a continuously changing magnetic flux, which is required for transformer operation via mutual induction."}, {"type": "mcq", "q": "At very low frequency, a capacitor in an AC circuit behaves almost like:", "options": ["A short circuit", "An open circuit (very high reactance)", "A pure resistor", "An inductor"], "answer": 1, "explanation": "Since Xc = 1/(2πfC), as frequency approaches zero, reactance becomes very large, so the capacitor behaves almost like an open circuit (as with DC)."}, {"type": "mcq", "q": "At very high frequency, an inductor in an AC circuit behaves almost like:", "options": ["A short circuit", "An open circuit (very high reactance)", "A pure resistor", "A capacitor"], "answer": 1, "explanation": "Since XL = 2πfL, as frequency increases, reactance becomes very large, so the inductor behaves almost like an open circuit at high frequency."}, {"type": "mcq", "q": "Household electricity meters usually measure energy consumption in:", "options": ["Watts", "Kilowatt-hours", "Volts", "Amperes"], "answer": 1, "explanation": "Electrical energy consumption for billing is typically measured in kilowatt-hours (kWh)."}, {"type": "mcq", "q": "A step-up transformer used to transmit electricity over long distances helps by:", "options": ["Increasing current, reducing power loss", "Increasing voltage, reducing current, and reducing resistive power loss (I²R)", "Only reducing voltage for safety", "Eliminating resistive losses completely"], "answer": 1, "explanation": "Stepping up voltage for transmission reduces the current needed for a given power, which reduces I²R losses in transmission lines."}, {"type": "mcq", "q": "Quality factor (Q) of a resonant LCR circuit indicates:", "options": ["The sharpness of resonance (how selective the circuit is)", "The total resistance only", "The DC power dissipated", "The transformer turns ratio"], "answer": 0, "explanation": "The Q factor describes how sharp and narrow the resonance peak is — higher Q means a more selective (narrower bandwidth) resonant circuit."}, {"type": "mcq", "q": "A rectifier is used to convert:", "options": ["DC to AC", "AC to DC", "Voltage to current", "Resistance to reactance"], "answer": 1, "explanation": "A rectifier circuit (using diodes) converts alternating current into direct current."}, {"type": "mcq", "q": "An oscilloscope displaying an AC signal typically shows:", "options": ["A straight horizontal line", "A sinusoidal waveform varying with time", "A single dot", "A random pattern with no periodicity"], "answer": 1, "explanation": "An oscilloscope displays the AC voltage as a sinusoidal waveform, showing how it varies periodically with time."}, {"type": "tf", "q": "The average value of a pure sine wave AC voltage over a complete cycle is zero.", "answer": true, "explanation": "Since the positive and negative halves of a sine wave are symmetric, their average over a full cycle is exactly zero."}, {"type": "tf", "q": "In a purely resistive AC circuit, no phase difference exists between voltage and current.", "answer": true, "explanation": "Resistors do not introduce any phase shift, so voltage and current remain in phase in a purely resistive AC circuit."}, {"type": "tf", "q": "At resonance, a series LCR circuit has maximum impedance.", "answer": false, "explanation": "At resonance, impedance is minimum (equal to R alone), not maximum, since the reactances cancel."}, {"type": "tf", "q": "Inductive reactance decreases with increasing frequency.", "answer": false, "explanation": "Inductive reactance XL = 2πfL increases with frequency, the opposite of capacitive reactance."}, {"type": "tf", "q": "Power factor of 1 indicates that voltage and current are perfectly in phase.", "answer": true, "explanation": "A power factor of cosθ = 1 means θ = 0°, so voltage and current are exactly in phase, giving maximum real power transfer."}, {"type": "fill", "q": "The rms value of a sinusoidal peak voltage V0 is Vrms = V0/______.", "answer": "√2", "explanation": "Vrms = V0/√2 for a sinusoidal AC waveform."}, {"type": "fill", "q": "The opposition offered by a capacitor to AC current is called capacitive ______.", "answer": "reactance", "explanation": "Capacitive reactance Xc = 1/(2πfC) is the opposition a capacitor offers to alternating current."}, {"type": "fill", "q": "The condition XL = Xc in a series LCR circuit defines the point of ______.", "answer": "resonance", "explanation": "Resonance occurs precisely when inductive and capacitive reactances are equal in magnitude."}, {"type": "fill", "q": "The total opposition to current flow in an AC circuit, combining resistance and reactance, is called ______.", "answer": "impedance", "explanation": "Impedance (Z) is the combined opposition to AC current from both resistance and reactance."}, {"type": "fill", "q": "cosθ, the ratio that indicates how effectively power is delivered in an AC circuit, is called the ______ factor.", "answer": "power", "explanation": "The power factor, cosθ, indicates the phase relationship between voltage and current and how effectively real power is delivered."}]}, {"unit": 7, "title": "Unit 7: Electronics - Semiconductors and Devices", "questions": [{"type": "mcq", "q": "Semiconductors have electrical conductivity that is:", "options": ["Always higher than metals", "Between that of conductors and insulators", "Zero at all temperatures", "The same as insulators always"], "answer": 1, "explanation": "Semiconductors have conductivity intermediate between good conductors (metals) and insulators, and this conductivity increases with temperature."}, {"type": "mcq", "q": "Doping a semiconductor means:", "options": ["Heating it to very high temperatures", "Adding small amounts of impurity atoms to change its electrical properties", "Cooling it to absolute zero", "Coating it with metal"], "answer": 1, "explanation": "Doping introduces controlled amounts of impurity atoms into a pure (intrinsic) semiconductor to modify its electrical conductivity."}, {"type": "mcq", "q": "An n-type semiconductor is formed by doping with atoms that:", "options": ["Have fewer valence electrons than the semiconductor", "Have more valence electrons than the semiconductor, providing free electrons", "Remove all free charge carriers", "Are always metals"], "answer": 1, "explanation": "Doping with pentavalent atoms (like phosphorus in silicon) adds extra free electrons, creating an n-type (negative charge carrier) semiconductor."}, {"type": "mcq", "q": "A p-type semiconductor is formed by doping with atoms that:", "options": ["Create excess free electrons", "Create a deficiency of electrons, forming 'holes'", "Have the same valency as the base material", "Prevent conduction entirely"], "answer": 1, "explanation": "Doping with trivalent atoms (like boron in silicon) creates electron deficiencies called 'holes', which act as positive charge carriers."}, {"type": "mcq", "q": "A p-n junction diode allows current to flow easily when:", "options": ["Reverse biased", "Forward biased", "Not connected to any supply", "Cooled below freezing"], "answer": 1, "explanation": "In forward bias, the p-n junction's depletion region narrows, allowing current to flow easily through the diode."}, {"type": "mcq", "q": "In reverse bias, a p-n junction diode:", "options": ["Conducts easily", "Blocks current flow (except a tiny leakage current)", "Behaves like a perfect conductor", "Has zero resistance"], "answer": 1, "explanation": "Reverse bias widens the depletion region, blocking the flow of majority carriers and allowing only a very small leakage current."}, {"type": "mcq", "q": "A half-wave rectifier uses:", "options": ["Two diodes to pass all of the AC cycle", "One diode to pass only one half of the AC cycle", "No diodes at all", "A capacitor only"], "answer": 1, "explanation": "A half-wave rectifier uses a single diode, which conducts during only one half-cycle of the AC input, blocking the other half."}, {"type": "mcq", "q": "A full-wave rectifier, compared to a half-wave rectifier, produces:", "options": ["A smoother, more continuous DC output using both halves of the AC cycle", "Exactly the same output", "A weaker signal", "Only negative voltage output"], "answer": 0, "explanation": "A full-wave rectifier uses both halves of the AC cycle (using two or four diodes), producing a smoother and more continuous DC output."}, {"type": "mcq", "q": "A transistor is a semiconductor device with:", "options": ["One p-n junction", "Two p-n junctions (three regions: emitter, base, collector)", "No junctions", "Four separate terminals"], "answer": 1, "explanation": "A bipolar junction transistor has three regions (emitter, base, collector) forming two p-n junctions."}, {"type": "mcq", "q": "An NPN transistor consists of:", "options": ["Two p-type regions sandwiching an n-type region", "Two n-type regions sandwiching a p-type region", "Only n-type material throughout", "Only p-type material throughout"], "answer": 1, "explanation": "An NPN transistor has a thin p-type base sandwiched between two n-type regions (emitter and collector)."}, {"type": "mcq", "q": "A transistor can be used as an electronic switch because:", "options": ["It always conducts regardless of base current", "A small base current can control a much larger collector current, turning it on or off", "It stores electric charge like a capacitor", "It only works with AC signals"], "answer": 1, "explanation": "By controlling a small base current, a transistor can switch a much larger current in the collector circuit on or off, acting as an electronic switch."}, {"type": "mcq", "q": "A transistor used as an amplifier works because:", "options": ["It converts DC to AC", "A small change in base current produces a much larger change in collector current", "It has no gain at all", "It only rectifies signals"], "answer": 1, "explanation": "In amplifier configuration, small variations in base current cause proportionally much larger variations in collector current, providing signal amplification."}, {"type": "mcq", "q": "The output of an AND logic gate is HIGH only when:", "options": ["At least one input is HIGH", "All inputs are HIGH", "All inputs are LOW", "Exactly one input is HIGH"], "answer": 1, "explanation": "An AND gate outputs HIGH (1) only when every one of its inputs is HIGH (1); otherwise the output is LOW (0)."}, {"type": "mcq", "q": "The output of an OR logic gate is HIGH when:", "options": ["All inputs are LOW", "At least one input is HIGH", "No inputs are present", "Exactly two inputs are LOW"], "answer": 1, "explanation": "An OR gate outputs HIGH if any one (or more) of its inputs is HIGH."}, {"type": "mcq", "q": "A NOT gate (inverter) has:", "options": ["Two inputs and one output", "One input and one output that is the opposite of the input", "No inputs", "Three outputs"], "answer": 1, "explanation": "A NOT gate has a single input and produces an output that is the logical inverse (opposite) of that input."}, {"type": "mcq", "q": "Silicon and germanium are commonly used semiconductors because they:", "options": ["Have four valence electrons, allowing controlled doping", "Are metals with free electrons", "Cannot conduct electricity at all", "Have no crystal structure"], "answer": 0, "explanation": "Silicon and germanium each have four valence electrons, forming a stable crystal lattice that can be precisely doped to create n-type or p-type materials."}, {"type": "mcq", "q": "The region at a p-n junction with no free charge carriers is called the:", "options": ["Conduction band", "Depletion region", "Valence band", "Doping zone"], "answer": 1, "explanation": "The depletion region is a narrow zone at the p-n junction depleted of free charge carriers, formed by recombination near the junction."}, {"type": "mcq", "q": "Increasing temperature generally ___ the conductivity of a pure (intrinsic) semiconductor.", "options": ["Decreases", "Increases", "Has no effect on", "Reverses"], "answer": 1, "explanation": "As temperature rises, more electron-hole pairs are thermally generated in a semiconductor, increasing its conductivity (opposite to the trend in metals)."}, {"type": "mcq", "q": "A light-emitting diode (LED) emits light when:", "options": ["Reverse biased", "Forward biased, as electrons and holes recombine releasing energy", "Not connected to any circuit", "Cooled to very low temperature"], "answer": 1, "explanation": "An LED emits light in forward bias, as electrons and holes recombine at the junction and release energy in the form of photons."}, {"type": "mcq", "q": "A photodiode is a semiconductor device that:", "options": ["Emits sound when illuminated", "Generates or modulates electric current in response to light", "Amplifies magnetic fields", "Works only in complete darkness"], "answer": 1, "explanation": "A photodiode's current changes in response to incident light, making it useful as a light sensor."}, {"type": "mcq", "q": "A solar cell converts:", "options": ["Electrical energy into light", "Light energy directly into electrical energy", "Heat into mechanical energy", "Sound into electrical energy"], "answer": 1, "explanation": "A solar (photovoltaic) cell is a semiconductor device that converts light energy directly into electrical energy."}, {"type": "mcq", "q": "The base region of a transistor is typically:", "options": ["Very thick and heavily doped", "Very thin and lightly doped compared to emitter and collector", "The same thickness as the collector", "Absent in modern transistors"], "answer": 1, "explanation": "The base region is deliberately made thin and lightly doped so that most carriers injected from the emitter pass through to the collector, enabling amplification."}, {"type": "mcq", "q": "Combining an AND gate and a NOT gate in series produces which gate?", "options": ["OR gate", "NAND gate", "XOR gate", "Buffer"], "answer": 1, "explanation": "An AND gate followed by a NOT (inverter) gate produces a NAND gate, whose output is the complement of the AND output."}, {"type": "mcq", "q": "A capacitor used as a filter after a rectifier serves to:", "options": ["Increase ripple in the output", "Smooth out the pulsating DC output, reducing ripple", "Convert DC back into AC", "Increase the AC frequency"], "answer": 1, "explanation": "A smoothing capacitor charges during peaks and discharges between them, reducing the ripple in a rectified DC output."}, {"type": "mcq", "q": "Zener diodes are specially designed to operate in:", "options": ["Forward bias only", "A controlled reverse breakdown region for voltage regulation", "No bias condition", "AC circuits exclusively as rectifiers"], "answer": 1, "explanation": "Zener diodes are designed to safely operate in reverse breakdown at a specific voltage, making them useful for voltage regulation."}, {"type": "mcq", "q": "The main advantage of transistors over older vacuum tubes includes:", "options": ["Larger size and higher power consumption", "Smaller size, lower power consumption, and greater reliability", "Requiring a heated filament to operate", "Working only at very high voltages"], "answer": 1, "explanation": "Transistors are much smaller, consume less power, generate less heat, and are more reliable and durable than vacuum tubes."}, {"type": "mcq", "q": "In a common-emitter transistor amplifier, the output signal is typically:", "options": ["In phase with the input signal", "180° out of phase (inverted) relative to the input", "Completely unrelated to the input", "Always zero"], "answer": 1, "explanation": "A common-emitter amplifier configuration produces an output signal that is inverted (180° phase shift) relative to the input signal."}, {"type": "mcq", "q": "A logic circuit that outputs HIGH only when its two inputs differ is called:", "options": ["AND gate", "OR gate", "XOR (exclusive OR) gate", "NOT gate"], "answer": 2, "explanation": "An XOR gate outputs HIGH only when its two inputs are different (one HIGH, one LOW); if both are the same, the output is LOW."}, {"type": "mcq", "q": "Which is a common application of transistors in digital electronics?", "options": ["As switches representing binary 0s and 1s in logic circuits", "As permanent magnets", "As capacitors for energy storage only", "As resistors with fixed value"], "answer": 0, "explanation": "Transistors act as fast electronic switches, forming the basic building blocks of digital logic circuits representing binary states."}, {"type": "mcq", "q": "A rectifier followed by a smoothing capacitor and voltage regulator forms a basic:", "options": ["Amplifier circuit", "DC power supply circuit", "Radio transmitter", "Logic gate array"], "answer": 1, "explanation": "This combination (rectifier + smoothing + regulation) forms a typical DC power supply, converting AC mains into stable DC output."}, {"type": "tf", "q": "A p-type semiconductor has majority charge carriers that are electrons.", "answer": false, "explanation": "In a p-type semiconductor, the majority charge carriers are holes (positive), not electrons."}, {"type": "tf", "q": "A diode conducts easily in forward bias and blocks current in reverse bias.", "answer": true, "explanation": "This is the defining behaviour of a p-n junction diode: low resistance when forward biased, high resistance when reverse biased."}, {"type": "tf", "q": "A transistor can amplify a signal because a small base current controls a much larger collector current.", "answer": true, "explanation": "This current-controlling behaviour is exactly how a transistor achieves amplification of small signals."}, {"type": "tf", "q": "An OR gate outputs HIGH only when all of its inputs are HIGH.", "answer": false, "explanation": "That description applies to an AND gate; an OR gate outputs HIGH if at least one input is HIGH."}, {"type": "tf", "q": "Increasing temperature always decreases the conductivity of a semiconductor.", "answer": false, "explanation": "Unlike metals, increasing temperature generally increases the conductivity of a semiconductor, as more charge carriers are thermally generated."}, {"type": "fill", "q": "A semiconductor doped to have excess free electrons is called ______-type.", "answer": "n", "explanation": "n-type semiconductors are doped with pentavalent impurities, providing extra free electrons as majority carriers."}, {"type": "fill", "q": "A semiconductor doped to have a deficiency of electrons (excess holes) is called ______-type.", "answer": "p", "explanation": "p-type semiconductors are doped with trivalent impurities, creating holes as majority carriers."}, {"type": "fill", "q": "The process of converting AC into DC using diodes is called ______.", "answer": "rectification", "explanation": "Rectification is the process of converting alternating current into direct current, typically using diodes."}, {"type": "fill", "q": "A transistor has three regions called the emitter, base, and ______.", "answer": "collector", "explanation": "The three regions of a bipolar junction transistor are the emitter, base, and collector."}, {"type": "fill", "q": "A logic gate that inverts its single input is called a ______ gate.", "answer": "NOT", "explanation": "The NOT gate (inverter) produces an output that is the logical opposite of its single input."}]}, {"unit": 8, "title": "Unit 8: Atomic Physics and the Photoelectric Effect", "questions": [{"type": "mcq", "q": "The photoelectric effect refers to:", "options": ["The emission of electrons from a metal surface when light of sufficient frequency shines on it", "The absorption of electrons by a metal", "The heating of a metal by an electric current", "The reflection of light from a mirror"], "answer": 0, "explanation": "The photoelectric effect is the emission of electrons from a metal surface when illuminated by light above a certain (threshold) frequency."}, {"type": "mcq", "q": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted electrons is:", "options": ["KEmax = hf + Φ", "KEmax = hf - Φ", "KEmax = Φ - hf", "KEmax = hfΦ"], "answer": 1, "explanation": "Einstein's photoelectric equation: KEmax = hf - Φ, where hf is the photon energy and Φ is the work function of the metal."}, {"type": "mcq", "q": "The work function of a metal is defined as:", "options": ["The total energy of an incoming photon", "The minimum energy needed to remove an electron from the metal surface", "The kinetic energy of emitted electrons", "The frequency of incident light"], "answer": 1, "explanation": "The work function Φ is the minimum energy required to liberate an electron from a metal's surface."}, {"type": "mcq", "q": "Below the threshold frequency, no photoelectrons are emitted because:", "options": ["The light intensity is always too low", "Each photon carries insufficient energy to overcome the work function", "The metal is too cold", "Electrons refuse to absorb single photons"], "answer": 1, "explanation": "If a single photon's energy (hf) is less than the work function, no electron can be emitted, regardless of light intensity, since photoelectric emission is a one-photon, one-electron process."}, {"type": "mcq", "q": "Increasing the intensity of light above the threshold frequency mainly increases:", "options": ["The kinetic energy of each emitted electron", "The number of photoelectrons emitted per second", "The threshold frequency itself", "The work function of the metal"], "answer": 1, "explanation": "Higher intensity means more photons arriving per second, which increases the number of electrons emitted (photocurrent), not their individual kinetic energy."}, {"type": "mcq", "q": "Increasing the frequency of incident light (above threshold) mainly increases:", "options": ["The number of electrons emitted", "The maximum kinetic energy of the emitted electrons", "The work function of the metal", "The size of the metal surface"], "answer": 1, "explanation": "Higher frequency means more energy per photon, which increases KEmax = hf - Φ for each emitted electron."}, {"type": "mcq", "q": "The photoelectric effect provided evidence for:", "options": ["The purely wave nature of light", "The particle (photon) nature of light", "The non-existence of electrons", "Newton's laws of motion"], "answer": 1, "explanation": "The photoelectric effect could not be explained by wave theory alone and provided strong evidence that light behaves as discrete packets of energy (photons)."}, {"type": "mcq", "q": "The energy of a photon is given by:", "options": ["E = hf", "E = h/f", "E = mc²", "E = hλ"], "answer": 0, "explanation": "The energy of a photon is E = hf, where h is Planck's constant and f is the frequency of the light."}, {"type": "mcq", "q": "The de Broglie wavelength of a moving particle is given by:", "options": ["λ = h/p", "λ = hp", "λ = p/h", "λ = h·m"], "answer": 0, "explanation": "De Broglie's hypothesis: λ = h/p, where p is the momentum of the particle, showing that matter can exhibit wave-like properties."}, {"type": "mcq", "q": "Wave-particle duality refers to the idea that:", "options": ["Light and matter can each exhibit both wave-like and particle-like behaviour", "Only light behaves as a wave", "Only matter behaves as a particle", "Waves and particles are completely unrelated concepts"], "answer": 0, "explanation": "Wave-particle duality is the concept that both light and matter display characteristics of waves and of particles, depending on the experiment."}, {"type": "mcq", "q": "In the Bohr model of the atom, electrons:", "options": ["Move randomly around the nucleus at any energy", "Occupy specific discrete energy levels (orbits) around the nucleus", "Are stationary within the nucleus", "Have continuous, unquantized energy"], "answer": 1, "explanation": "The Bohr model proposes that electrons orbit the nucleus only in specific allowed energy levels, with quantized energy values."}, {"type": "mcq", "q": "An electron in the Bohr model emits a photon when it:", "options": ["Moves to a higher energy level", "Falls from a higher to a lower energy level", "Remains in the same energy level", "Is captured by the nucleus"], "answer": 1, "explanation": "When an electron transitions from a higher to a lower energy level, it emits a photon carrying energy equal to the difference between the two levels."}, {"type": "mcq", "q": "The energy of the photon emitted during an electron transition equals:", "options": ["The sum of the two energy levels", "The difference between the initial and final energy levels", "Always exactly 13.6 eV", "The electron's rest mass energy"], "answer": 1, "explanation": "Photon energy = E_initial - E_final, the energy difference between the two atomic energy levels involved in the transition."}, {"type": "mcq", "q": "Line emission spectra of atoms are evidence for:", "options": ["Continuous energy levels in atoms", "Discrete, quantized energy levels in atoms", "The absence of electrons in atoms", "Only thermal radiation processes"], "answer": 1, "explanation": "The discrete lines in emission spectra correspond to specific photon energies from transitions between quantized (discrete) energy levels."}, {"type": "mcq", "q": "The ground state of an atom refers to:", "options": ["Its highest possible energy state", "Its lowest possible energy state", "A state with no electrons", "A state where the atom is ionized"], "answer": 1, "explanation": "The ground state is the lowest energy configuration an atom's electron(s) can occupy under normal conditions."}, {"type": "mcq", "q": "Ionization energy is the energy required to:", "options": ["Move an electron between two excited states", "Completely remove an electron from an atom (to infinity)", "Add an electron to an atom", "Split the nucleus of an atom"], "answer": 1, "explanation": "Ionization energy is the minimum energy needed to remove an electron entirely from an atom, taking it to an infinite distance (E = 0)."}, {"type": "mcq", "q": "A photon with energy exactly equal to the work function will:", "options": ["Give the emitted electron zero kinetic energy", "Give the emitted electron maximum possible kinetic energy", "Never be absorbed", "Always be reflected"], "answer": 0, "explanation": "At exactly the threshold frequency, all the photon's energy is used just to overcome the work function, leaving zero kinetic energy for the emitted electron."}, {"type": "mcq", "q": "Planck's constant h has approximate value:", "options": ["6.63 × 10⁻³⁴ J·s", "3.0 × 10⁸ J·s", "1.6 × 10⁻¹⁹ J·s", "9.1 × 10⁻³¹ J·s"], "answer": 0, "explanation": "Planck's constant is approximately 6.63 × 10⁻³⁴ joule-seconds."}, {"type": "mcq", "q": "The stopping potential in a photoelectric experiment is used to measure:", "options": ["The intensity of incident light", "The maximum kinetic energy of emitted photoelectrons", "The work function directly without calculation", "The wavelength of incident light directly"], "answer": 1, "explanation": "The stopping potential V0 is the voltage needed to just stop the most energetic photoelectrons, so eV0 = KEmax."}, {"type": "mcq", "q": "A photon of visible light typically has more energy than:", "options": ["An X-ray photon", "A radio wave photon", "A gamma ray photon", "An ultraviolet photon"], "answer": 1, "explanation": "Since E = hf, and radio waves have much lower frequency than visible light, radio wave photons carry much less energy than visible light photons."}, {"type": "mcq", "q": "The de Broglie wavelength of a fast-moving electron is generally:", "options": ["Very large, like radio waves", "Extremely small, comparable to atomic scales", "Exactly equal to visible light wavelengths", "Infinite"], "answer": 1, "explanation": "Because electrons have small momentum despite their speed, their de Broglie wavelength is extremely small, on the scale relevant to atomic and crystal structures."}, {"type": "mcq", "q": "Electron diffraction experiments (e.g., through crystals) demonstrate:", "options": ["That electrons behave purely as particles", "The wave nature of electrons", "That electrons have no mass", "That light cannot be diffracted"], "answer": 1, "explanation": "Electron diffraction patterns, similar to those of X-rays through crystals, provide direct evidence for the wave nature of electrons, confirming de Broglie's hypothesis."}, {"type": "mcq", "q": "The threshold frequency for the photoelectric effect depends on:", "options": ["The intensity of the incident light", "The work function (material) of the metal surface", "The duration of exposure to light", "The distance from the light source"], "answer": 1, "explanation": "Threshold frequency f0 = Φ/h is determined by the work function of the specific metal, a material-dependent property."}, {"type": "mcq", "q": "If light intensity is increased but frequency stays below the threshold, the number of photoelectrons emitted is:", "options": ["Increased proportionally", "Still zero, regardless of intensity", "Doubled exactly", "Dependent on temperature only"], "answer": 1, "explanation": "Since individual photons still lack sufficient energy (frequency below threshold), no photoelectrons are emitted no matter how intense the light is."}, {"type": "mcq", "q": "Which experiment historically could not be explained using classical wave theory of light?", "options": ["Double-slit interference", "The photoelectric effect", "Reflection of light", "Refraction of light"], "answer": 1, "explanation": "The photoelectric effect's key features (threshold frequency, instantaneous emission, and intensity-independent electron energy) could not be explained by classical wave theory, requiring Einstein's photon concept."}, {"type": "mcq", "q": "The energy levels in a hydrogen atom become closer together as:", "options": ["The electron moves to lower energy levels (closer to nucleus)", "The electron moves to higher energy levels (further from nucleus)", "The atom is heated", "The atom loses all electrons"], "answer": 1, "explanation": "In hydrogen, energy levels converge as n increases (moving away from the nucleus), becoming increasingly closely spaced near the ionization limit."}, {"type": "mcq", "q": "A photon interacting with an atom can be absorbed only if:", "options": ["Its energy exactly matches the difference between two allowed energy levels", "It has any energy value at all", "The atom is completely ionized already", "The photon has zero energy"], "answer": 0, "explanation": "Absorption requires the photon's energy to precisely match the energy gap between two quantized levels for the electron to transition upward."}, {"type": "mcq", "q": "Which best describes complementarity in quantum physics?", "options": ["Light and matter can never show both wave and particle properties", "Wave and particle descriptions are complementary, each capturing part of the full behaviour, but not observed simultaneously in the same experiment", "Only large objects show particle behaviour", "Only photons show wave properties"], "answer": 1, "explanation": "The principle of complementarity states that wave and particle aspects are both necessary to fully describe quantum entities, though a single experiment typically reveals only one aspect at a time."}, {"type": "mcq", "q": "An electron accelerated through a higher potential difference has a de Broglie wavelength that is:", "options": ["Larger", "Smaller", "Unchanged", "Infinite"], "answer": 1, "explanation": "A higher accelerating potential gives the electron more momentum, and since λ = h/p, higher momentum results in a smaller de Broglie wavelength."}, {"type": "mcq", "q": "The photoelectric effect is used practically in devices such as:", "options": ["Solar cells and light sensors", "Nuclear reactors", "Radio transmitters", "Transformers"], "answer": 0, "explanation": "The photoelectric effect underlies solar (photovoltaic) cells and various light-sensing devices."}, {"type": "tf", "q": "Increasing the intensity of light below the threshold frequency will eventually cause photoelectron emission.", "answer": false, "explanation": "No matter how intense, light below the threshold frequency cannot cause emission, since each individual photon still lacks sufficient energy."}, {"type": "tf", "q": "The maximum kinetic energy of photoelectrons depends on the frequency of incident light, not its intensity.", "answer": true, "explanation": "KEmax = hf - Φ depends only on frequency (and work function), while intensity affects only the number of photoelectrons emitted."}, {"type": "tf", "q": "The Bohr model explains that atomic electrons can have any continuous value of energy.", "answer": false, "explanation": "The Bohr model specifically proposes that electrons occupy discrete, quantized energy levels, not continuous energy values."}, {"type": "tf", "q": "De Broglie proposed that all matter has an associated wavelength related to its momentum.", "answer": true, "explanation": "De Broglie's hypothesis extends wave-particle duality to matter, proposing λ = h/p for any particle with momentum p."}, {"type": "tf", "q": "Emission line spectra are continuous, showing all possible wavelengths.", "answer": false, "explanation": "Emission line spectra consist of discrete, specific wavelengths (lines), corresponding to specific electron transitions, not a continuous range."}, {"type": "fill", "q": "The minimum energy needed to remove an electron from a metal surface is called the ______ function.", "answer": "work", "explanation": "The work function Φ is the minimum energy required to liberate an electron from a metal's surface."}, {"type": "fill", "q": "The energy of a photon is given by E = h______.", "answer": "f", "explanation": "Photon energy E = hf, where h is Planck's constant and f is frequency."}, {"type": "fill", "q": "The wavelength associated with a moving particle, given by λ = h/p, is called the ______ wavelength.", "answer": "de Broglie", "explanation": "This is the de Broglie wavelength, linking a particle's momentum to an associated wave nature."}, {"type": "fill", "q": "The lowest possible energy state of an atom is called its ______ state.", "answer": "ground", "explanation": "The ground state is the atom's lowest energy configuration."}, {"type": "fill", "q": "The model proposing that electrons occupy discrete energy levels around the nucleus is the ______ model of the atom.", "answer": "Bohr", "explanation": "The Bohr model introduced the idea of quantized, discrete electron energy levels in an atom."}]}, {"unit": 9, "title": "Unit 9: Nuclear Physics and Radioactivity", "questions": [{"type": "mcq", "q": "The nucleus of an atom is composed of:", "options": ["Protons and electrons", "Protons and neutrons", "Neutrons and electrons", "Only protons"], "answer": 1, "explanation": "The atomic nucleus contains protons (positively charged) and neutrons (neutral), collectively called nucleons."}, {"type": "mcq", "q": "Isotopes of an element have:", "options": ["The same number of protons but different numbers of neutrons", "The same number of neutrons but different numbers of protons", "Different atomic numbers", "No neutrons at all"], "answer": 0, "explanation": "Isotopes share the same atomic number (same number of protons) but differ in neutron number, giving different mass numbers."}, {"type": "mcq", "q": "Alpha decay involves the emission of:", "options": ["A high-energy electron", "A helium nucleus (2 protons and 2 neutrons)", "A photon only", "A neutrino only"], "answer": 1, "explanation": "Alpha particles are helium nuclei consisting of 2 protons and 2 neutrons, emitted during alpha decay."}, {"type": "mcq", "q": "Beta-minus decay involves the emission of:", "options": ["A helium nucleus", "An electron (and an antineutrino), as a neutron converts to a proton", "A proton only", "A gamma ray only"], "answer": 1, "explanation": "In beta-minus decay, a neutron in the nucleus converts into a proton, emitting an electron and an antineutrino."}, {"type": "mcq", "q": "Gamma decay involves the emission of:", "options": ["A helium nucleus", "An electron", "A high-energy photon", "A neutron"], "answer": 2, "explanation": "Gamma decay is the emission of high-energy electromagnetic radiation (photons) as a nucleus transitions from an excited to a lower energy state."}, {"type": "mcq", "q": "The half-life of a radioactive isotope is defined as:", "options": ["The time for all atoms to decay completely", "The time for half of the radioactive nuclei in a sample to decay", "The total lifespan of the isotope", "The time for the isotope to become stable permanently and instantly"], "answer": 1, "explanation": "Half-life is the time required for half of the radioactive nuclei present in a sample to undergo decay."}, {"type": "mcq", "q": "The radioactive decay law is expressed as:", "options": ["N = N0e^(-λt)", "N = N0e^(λt)", "N = N0λt", "N = N0/λt"], "answer": 0, "explanation": "The number of undecayed nuclei follows exponential decay: N = N0e^(-λt), where λ is the decay constant."}, {"type": "mcq", "q": "The decay constant λ is related to half-life T½ by:", "options": ["λ = ln2/T½", "λ = T½/ln2", "λ = 2/T½", "λ = T½ × ln2"], "answer": 0, "explanation": "The relationship between decay constant and half-life is λ = ln2/T½ (approximately 0.693/T½)."}, {"type": "mcq", "q": "Activity of a radioactive sample is defined as:", "options": ["The total number of nuclei present", "The rate of decay (number of decays per unit time)", "The half-life of the sample", "The mass of the sample"], "answer": 1, "explanation": "Activity A = λN, the rate at which radioactive decays occur in a sample, usually measured in becquerels (Bq)."}, {"type": "mcq", "q": "The SI unit of radioactive activity is the:", "options": ["Curie", "Becquerel", "Gray", "Sievert"], "answer": 1, "explanation": "The becquerel (Bq) is the SI unit of radioactivity, equal to one decay per second."}, {"type": "mcq", "q": "Which type of radiation has the greatest penetrating power?", "options": ["Alpha particles", "Beta particles", "Gamma rays", "All have equal penetrating power"], "answer": 2, "explanation": "Gamma rays are electromagnetic radiation with the highest penetrating power, able to pass through several centimetres of lead, unlike alpha or beta particles."}, {"type": "mcq", "q": "Alpha particles can typically be stopped by:", "options": ["A sheet of paper", "A few millimetres of aluminium", "Thick lead or concrete", "Nothing can stop them"], "answer": 0, "explanation": "Alpha particles have low penetrating power and can be stopped by just a sheet of paper or a few centimetres of air."}, {"type": "mcq", "q": "Mass defect in a nucleus refers to:", "options": ["The difference between the mass of the nucleus and the sum of masses of its separate nucleons", "The total mass of the nucleus", "The charge of the nucleus", "The number of neutrons only"], "answer": 0, "explanation": "Mass defect is the small difference between the total mass of separate nucleons and the actual (lower) mass of the bound nucleus, converted to binding energy."}, {"type": "mcq", "q": "According to Einstein's mass-energy relation, energy equivalent to mass m is given by:", "options": ["E = mc", "E = mc²", "E = m/c²", "E = m²c"], "answer": 1, "explanation": "Einstein's famous equation E = mc² relates mass and energy, where c is the speed of light."}, {"type": "mcq", "q": "Binding energy of a nucleus represents:", "options": ["The energy released when a nucleus is formed from its separate nucleons", "The kinetic energy of the nucleus", "The charge of the nucleus", "The half-life of the nucleus"], "answer": 0, "explanation": "Binding energy is the energy equivalent of the mass defect, representing the energy needed to separate a nucleus into its individual nucleons (or released when it forms)."}, {"type": "mcq", "q": "Nuclear fission is a process in which:", "options": ["A light nucleus splits into two lighter fragments", "A heavy nucleus splits into two lighter nuclei, releasing energy", "Two light nuclei combine into a heavier one", "A nucleus emits only gamma rays"], "answer": 1, "explanation": "Nuclear fission involves a heavy nucleus (like uranium-235) splitting into two lighter nuclei, releasing significant energy and often more neutrons."}, {"type": "mcq", "q": "Nuclear fusion is a process in which:", "options": ["Heavy nuclei split apart", "Light nuclei combine to form a heavier nucleus, releasing energy", "Electrons are captured by the nucleus", "Only gamma radiation occurs"], "answer": 1, "explanation": "Nuclear fusion involves light nuclei (like hydrogen isotopes) combining to form a heavier nucleus, releasing large amounts of energy — the process powering stars."}, {"type": "mcq", "q": "Nuclear fusion powers:", "options": ["Nuclear power stations on Earth exclusively", "The Sun and other stars", "Only artificial nuclear weapons", "Radioactive decay of heavy elements"], "answer": 1, "explanation": "Stars, including the Sun, are powered primarily by nuclear fusion, mainly converting hydrogen into helium."}, {"type": "mcq", "q": "A chain reaction in nuclear fission occurs when:", "options": ["Each fission event releases neutrons that trigger further fission events", "A single fission event happens once and stops", "No neutrons are released at all", "Only gamma rays are produced"], "answer": 0, "explanation": "In a chain reaction, neutrons released by one fission event go on to trigger further fission events in neighbouring nuclei, sustaining the reaction."}, {"type": "mcq", "q": "Nuclear power stations typically use fission of which element?", "options": ["Hydrogen", "Uranium (or plutonium)", "Helium", "Carbon"], "answer": 1, "explanation": "Nuclear power stations commonly use uranium-235 (or plutonium) as fuel for controlled fission reactions to generate heat and electricity."}, {"type": "mcq", "q": "A control rod in a nuclear reactor is used to:", "options": ["Absorb excess neutrons and control the rate of the chain reaction", "Increase the number of fission events uncontrollably", "Cool the reactor using water only", "Generate radioactive waste intentionally"], "answer": 0, "explanation": "Control rods, often made of materials like boron or cadmium, absorb neutrons to regulate and control the rate of the fission chain reaction."}, {"type": "mcq", "q": "Ionizing radiation can be harmful to living tissue mainly because it:", "options": ["Has no interaction with matter", "Can damage or alter molecules such as DNA within cells", "Only affects non-living matter", "Increases photosynthesis in cells"], "answer": 1, "explanation": "Ionizing radiation can damage biological molecules, including DNA, potentially causing cell damage or mutations, which is why radiation exposure must be carefully controlled."}, {"type": "mcq", "q": "Radioactive dating (e.g., carbon-14 dating) relies on:", "options": ["The constant, known half-life of a radioactive isotope in a sample", "The colour of the sample", "The temperature of the sample", "The total mass of the sample only"], "answer": 0, "explanation": "Radiometric dating uses the known, constant half-life of a radioactive isotope (like carbon-14) to estimate the age of a sample based on how much has decayed."}, {"type": "mcq", "q": "A sample with a half-life of 10 years will have what fraction remaining after 20 years?", "options": ["1/2", "1/4", "1/8", "1/16"], "answer": 1, "explanation": "After 20 years (2 half-lives), the remaining fraction is (1/2)² = 1/4."}, {"type": "mcq", "q": "The atomic number Z of a nucleus represents:", "options": ["The total number of nucleons", "The number of protons", "The number of neutrons", "The mass number"], "answer": 1, "explanation": "Atomic number Z is the number of protons in the nucleus, which determines the element's identity."}, {"type": "mcq", "q": "The mass number A of a nucleus represents:", "options": ["The number of protons only", "The number of neutrons only", "The total number of protons and neutrons", "The number of electrons"], "answer": 2, "explanation": "Mass number A = number of protons + number of neutrons (total nucleons) in the nucleus."}, {"type": "mcq", "q": "In beta-plus (positron) decay, a proton in the nucleus converts into:", "options": ["A neutron, emitting a positron and a neutrino", "An electron directly", "A photon only", "Another proton"], "answer": 0, "explanation": "In beta-plus decay, a proton converts into a neutron, emitting a positron (positive electron) and a neutrino."}, {"type": "mcq", "q": "Radioactive decay is a random process, meaning:", "options": ["Every nucleus decays at exactly the same predictable time", "It is impossible to predict exactly when any individual nucleus will decay, but statistical behaviour of large samples is predictable", "No mathematical model can describe it at all", "Only large samples decay, never individual atoms"], "answer": 1, "explanation": "While the exact decay time of any single nucleus is random and unpredictable, the statistical behaviour of a large collection of nuclei follows a predictable exponential decay law."}, {"type": "mcq", "q": "Which safety precaution is commonly used to protect against radioactive exposure?", "options": ["Increasing exposure time", "Minimizing exposure time, maximizing distance, and using shielding", "Standing as close as possible to the source", "Removing all protective clothing"], "answer": 1, "explanation": "The standard principles for radiation safety are minimizing time of exposure, maximizing distance from the source, and using appropriate shielding."}, {"type": "mcq", "q": "The energy released in nuclear fission/fusion reactions comes primarily from:", "options": ["Chemical bond breaking", "Conversion of a small amount of mass into energy (via E=mc²)", "Simple kinetic energy transfer only", "Gravitational potential energy"], "answer": 1, "explanation": "The enormous energy from nuclear reactions arises because a small amount of mass is converted directly into energy, as described by E = mc²."}, {"type": "tf", "q": "Isotopes of the same element have identical chemical properties but different atomic masses.", "answer": true, "explanation": "Since isotopes have the same number of protons (and electrons), their chemical properties are essentially identical, but differing neutron numbers give different atomic masses."}, {"type": "tf", "q": "Gamma rays are the least penetrating type of nuclear radiation.", "answer": false, "explanation": "Gamma rays are the most penetrating type of the three main types of nuclear radiation (alpha, beta, gamma)."}, {"type": "tf", "q": "Nuclear fusion releases energy by combining light nuclei into a heavier nucleus.", "answer": true, "explanation": "Fusion combines light nuclei (e.g., hydrogen isotopes) into a heavier nucleus, releasing energy in the process."}, {"type": "tf", "q": "The half-life of a radioactive isotope changes with temperature and pressure.", "answer": false, "explanation": "Half-life is a nuclear property that is essentially constant, unaffected by external conditions like temperature, pressure, or chemical state."}, {"type": "tf", "q": "A chain reaction in nuclear fission requires the release of neutrons that trigger subsequent fission events.", "answer": true, "explanation": "Sustained chain reactions rely on neutrons released from each fission event going on to cause further fission in neighbouring nuclei."}, {"type": "fill", "q": "The time taken for half of the radioactive nuclei in a sample to decay is called the ______.", "answer": "half-life", "explanation": "Half-life is the characteristic time for half of a radioactive sample's nuclei to decay."}, {"type": "fill", "q": "The SI unit of radioactive activity is the ______.", "answer": "becquerel", "explanation": "Activity, the rate of nuclear decay, is measured in becquerels (Bq), equal to one decay per second."}, {"type": "fill", "q": "The process in which a heavy nucleus splits into two lighter nuclei is called nuclear ______.", "answer": "fission", "explanation": "Nuclear fission is the splitting of a heavy nucleus into two (or more) lighter nuclei, releasing energy."}, {"type": "fill", "q": "The process in which light nuclei combine to form a heavier nucleus is called nuclear ______.", "answer": "fusion", "explanation": "Nuclear fusion is the combination of light nuclei into a heavier nucleus, the process that powers stars."}, {"type": "fill", "q": "The energy released when nucleons bind together to form a nucleus is called the ______ energy.", "answer": "binding", "explanation": "Binding energy is the energy released (equivalent to the mass defect) when separate nucleons combine into a bound nucleus."}]}, {"unit": 10, "title": "Unit 10: Introduction to Modern Physics - Special Relativity", "questions": [{"type": "mcq", "q": "Einstein's special theory of relativity is based on the postulate that the laws of physics are the same in:", "options": ["Only one specific reference frame", "All inertial (non-accelerating) reference frames", "Only accelerating reference frames", "No reference frame at all"], "answer": 1, "explanation": "The first postulate of special relativity states that the laws of physics take the same form in all inertial reference frames."}, {"type": "mcq", "q": "The second postulate of special relativity states that the speed of light in a vacuum is:", "options": ["Different for different observers depending on their motion", "The same for all observers, regardless of their relative motion", "Infinite for all observers", "Zero in a vacuum"], "answer": 1, "explanation": "Einstein's second postulate: the speed of light in a vacuum, c, is the same constant value for all observers, regardless of the motion of the source or observer."}, {"type": "mcq", "q": "Time dilation refers to the phenomenon in which:", "options": ["Time runs faster for a moving observer, as measured by a stationary observer", "A moving clock appears to run slower, as measured by a stationary observer", "Time is unaffected by relative motion", "Clocks always show the same time in every frame"], "answer": 1, "explanation": "Time dilation means that a clock moving relative to an observer appears to tick more slowly compared to the observer's own clock."}, {"type": "mcq", "q": "Length contraction refers to the phenomenon in which:", "options": ["A moving object appears longer in its direction of motion", "A moving object appears shorter along its direction of motion, as measured by a stationary observer", "Length is completely unaffected by relative motion", "Objects expand as they speed up"], "answer": 1, "explanation": "Length contraction predicts that an object moving relative to an observer appears shortened along the direction of motion, as measured by that observer."}, {"type": "mcq", "q": "Relativistic effects such as time dilation and length contraction become significant when an object's speed is:", "options": ["Very small compared to the speed of light", "A significant fraction of the speed of light", "Exactly zero", "Greater than the speed of light always"], "answer": 1, "explanation": "Relativistic effects only become noticeable when speeds approach a significant fraction of the speed of light (c); at everyday speeds they are negligible."}, {"type": "mcq", "q": "According to special relativity, no object with mass can:", "options": ["Move slower than light", "Reach or exceed the speed of light in a vacuum", "Have any kinetic energy", "Experience any force"], "answer": 1, "explanation": "Special relativity shows that as an object with mass approaches the speed of light, its relativistic mass/energy increases without bound, making it impossible to reach or exceed c."}, {"type": "mcq", "q": "The mass-energy equivalence relation E = mc² implies that:", "options": ["Mass and energy are completely unrelated", "Mass can be considered a highly concentrated form of energy", "Energy has no relation to the speed of light", "Only massless particles have energy"], "answer": 1, "explanation": "E = mc² shows that mass and energy are interchangeable — even a small amount of mass corresponds to an enormous amount of energy."}, {"type": "mcq", "q": "A muon moving at very high speed relative to Earth is observed to survive longer than its normal lifetime at rest, due to:", "options": ["Length contraction of the muon", "Time dilation of the muon's internal clock, as observed from Earth", "An increase in the speed of light", "A decrease in the muon's mass"], "answer": 1, "explanation": "This classic experimental confirmation of relativity is explained by time dilation: from Earth's frame, the muon's internal decay 'clock' runs slower, extending its apparent lifetime."}, {"type": "mcq", "q": "Relativistic momentum of a particle is given by:", "options": ["p = mv, exactly as in classical mechanics at all speeds", "p = γmv, where γ is the Lorentz factor that increases with speed", "p = mc always", "p = 0 for all moving particles"], "answer": 1, "explanation": "Relativistic momentum is p = γm ive motion."}, {"type": "mcq", "q": "At everyday (non-relativistic) speeds, the equations of special relativity essentially reduce to:", "options": ["Quantum mechanics equations", "Classical Newtonian mechanics", "General relativity equations only", "No physics applies at all"], "answer": 1, "explanation": "At speeds much less than c, relativistic corrections become negligible (γ ≈ 1), and the equations of special relativity reduce to familiar classical Newtonian mechanics."}, {"type": "mcq", "q": "The rest energy of a particle with mass m is given by:", "options": ["E0 = mc²", "E0 = mc", "E0 = m/c²", "E0 = 0"], "answer": 0, "explanation": "The rest energy (energy associated with mass alone, when the particle is at rest) is E0 = mc²."}, {"type": "mcq", "q": "Particle accelerators such as those used in physics research must account for relativistic effects because:", "options": ["Particles are accelerated to speeds close to the speed of light", "Particles never move at all in accelerators", "Relativity does not apply to small particles", "Only classical mechanics is needed at any speed"], "answer": 0, "explanation": "In particle accelerators, particles reach speeds very close to c, so relativistic effects (increasing mass/momentum, time dilation) must be accounted for in their design and analysis."}, {"type": "mcq", "q": "GPS satellite systems must correct for relativistic effects because:", "options": ["Satellite clocks experience both time dilation (from speed) and gravitational time differences compared to clocks on Earth", "GPS does not use any clocks", "Relativity has no measurable effect at satellite speeds and altitudes", "Satellites travel faster than light"], "answer": 0, "explanation": "GPS satellites move at high speed and are in weaker gravity than clocks on Earth's surface, so both special and general relativistic effects on their clocks must be corrected for accurate positioning."}, {"type": "mcq", "q": "Which of these is a key experimental confirmation of special relativity?", "options": ["The increased survival distance of fast-moving muons reaching Earth's surface", "The colour of the sky", "The formation of rainbows", "The refraction of light in water"], "answer": 0, "explanation": "The observed number of muons reaching Earth's surface (more than expected from their short rest-frame lifetime) is strong experimental evidence for time dilation."}, {"type": "mcq", "q": "As a particle's speed approaches c, the energy required to accelerate it further:", "options": ["Decreases to zero", "Increases without bound, approaching infinity", "Remains constant", "Becomes negative"], "answer": 1, "explanation": "Since relativistic kinetic energy diverges as v approaches c, an ever-increasing (theoretically infinite) amount of energy would be required to reach the speed of light."}, {"type": "mcq", "q": "The invariant quantity in special relativity, the same in all inertial frames, is:", "options": ["The length of any object", "The time interval between events", "The speed of light in a vacuum", "The mass of any moving object"], "answer": 2, "explanation": "Unlike length, time interval, or (relativistic) mass, which can differ between observers in relative motion, the speed of light in a vacuum is invariant — the same in every inertial frame."}, {"type": "mcq", "q": "Which statement about relativistic mass/energy is correct?", "options": ["A moving object's total energy includes both its rest energy and its kinetic energy", "A moving object has less energy than when at rest", "Rest energy and kinetic energy are unrelated concepts in relativity", "Only massless particles carry energy"], "answer": 0, "explanation": "In relativity, the total energy of a moving object is the sum of its rest energy (mc²) and its relativistic kinetic energy."}, {"type": "mcq", "q": "Photons, which are massless, always travel at:", "options": ["Speeds less than c, depending on their energy", "Exactly the speed of light, c, in a vacuum", "Zero speed", "Speeds greater than c"], "answer": 1, "explanation": "Since photons have zero rest mass, they always travel at exactly the speed of light c in a vacuum, regardless of their energy or frequency."}, {"type": "mcq", "q": "A key difference between special and general relativity is that general relativity additionally deals with:", "options": ["Only objects moving at constant velocity", "Gravity and accelerated (non-inertial) reference frames", "Only electromagnetic phenomena", "Chemical reactions"], "answer": 1, "explanation": "General relativity extends special relativity to include gravity and non-inertial (accelerating) reference frames, describing gravity as the curvature of spacetime."}, {"type": "mcq", "q": "If two observers move at high relative speed, each will observe the other's clock to be running:", "options": ["Faster than their own", "Slower than their own (time dilation is symmetric between them)", "At exactly the same rate", "Backwards in time"], "answer": 1, "explanation": "Time dilation is symmetric: each inertial observer, from their own frame, sees the other's clock as running slow relative to their own."}, {"type": "mcq", "q": "Modern applications relying on special relativity's predictions include:", "options": ["Particle physics research and satellite navigation systems", "Only fictional science stories", "Simple pendulum clocks", "Basic Newtonian orbital mechanics only"], "answer": 0, "explanation": "Special relativity is essential in real, modern technologies such as particle accelerators/detectors and satellite-based navigation (GPS) systems."}, {"type": "mcq", "q": "The concept that space and time are interwoven into a single four-dimensional entity is called:", "options": ["Newtonian absolute space", "Spacetime", "The luminiferous ether", "Quantum entanglement"], "answer": 1, "explanation": "Special relativity introduced the concept of spacetime, unifying the three dimensions of space with time into a single four-dimensional framework."}, {"type": "mcq", "q": "Before Einstein, many physicists believed light required a medium called the:", "options": ["Photon field", "Luminiferous ether", "Quantum vacuum", "Gravitational field"], "answer": 1, "explanation": "Before special relativity, physicists hypothesized a medium called the 'luminiferous ether' through which light waves were thought to propagate; experiments (like Michelson-Morley) failed to detect it, motivating Einstein's theory."}, {"type": "mcq", "q": "The Michelson-Morley experiment's null result (no detectable ether) helped motivate:", "options": ["Newton's laws of motion", "Einstein's special theory of relativity", "The discovery of the electron", "Quantum mechanics entirely"], "answer": 1, "explanation": "The failure to detect Earth's motion through a hypothetical ether was a key motivating experimental result behind the development of special relativity."}, {"type": "mcq", "q": "Which of the following best describes 'proper time'?", "options": ["Time measured by any moving clock in any frame", "The time interval measured by a clock that is present at both events (i.e., in its own rest frame)", "A universally agreed, absolute time for all observers", "Only the time shown on Earth-based clocks"], "answer": 1, "explanation": "Proper time is the time interval measured by a clock that is at rest relative to the events being timed — i.e., the clock's own, unaffected time."}, {"type": "mcq", "q": "Special relativity is called 'special' because it deals specifically with:", "options": ["Only very fast-moving objects", "Only inertial (non-accelerating) reference frames, unlike the more general theory that includes gravity", "Only quantum particles", "Only chemical bonding"], "answer": 1, "explanation": "It is termed 'special' relativity because it is a special (restricted) case dealing only with inertial (constant-velocity) frames, while general relativity extends the theory to gravity and acceleration."}, {"type": "tf", "q": "The speed of light in a vacuum is the same for all observers, regardless of their relative motion.", "answer": true, "explanation": "This is the second postulate of special relativity, confirmed by numerous experiments."}, {"type": "tf", "q": "Time dilation predicts that a moving clock runs faster than a stationary one, as observed by a stationary observer.", "answer": false, "explanation": "Time dilation predicts that a moving clock runs slower, not faster, as observed by a stationary observer."}, {"type": "tf", "q": "According to special relativity, an object with mass can be accelerated to exactly the speed of light with enough energy.", "answer": false, "explanation": "Special relativity shows that infinite energy would be required to accelerate a massive object to exactly the speed of light, making it physically impossible."}, {"type": "tf", "q": "Simultaneity of events is absolute and agreed upon by all observers in special relativity.", "answer": false, "explanation": "Special relativity shows that simultaneity is relative — observers in different inertial frames may disagree on whether two events are simultaneous."}, {"type": "tf", "q": "GPS systems must apply relativistic corrections to maintain accurate positioning.", "answer": true, "explanation": "Due to both their high speed and different gravitational conditions, GPS satellite clocks require relativistic corrections (both special and general) for accurate operation."}, {"type": "fill", "q": "The theory that describes physics in inertial reference frames, including time dilation and length contraction, is called special ______.", "answer": "relativity", "explanation": "Special relativity, developed by Einstein, describes the physics of inertial (non-accelerating) reference frames at any relative speed."}, {"type": "fill", "q": "The phenomenon where a moving clock appears to run slower is called time ______.", "answer": "dilation", "explanation": "Time dilation describes how a moving clock, from a stationary observer's perspective, appears to tick more slowly."}, {"type": "fill", "q": "The phenomenon where a moving object appears shortened along its direction of motion is called length ______.", "answer": "contraction", "explanation": "Length contraction describes the apparent shortening of a moving object's length along its direction of travel, as observed from a relatively stationary frame."}, {"type": "fill", "q": "Einstein's famous equation relating mass and energy is E = m______.", "answer": "c²", "explanation": "Einstein's mass-energy equivalence: E = mc², where c is the speed of light."}, {"type": "fill", "q": "The factor γ = 1/√(1-v²/c²), which appears in relativistic equations, is called the ______ factor.", "answer": "Lorentz", "explanation": "This is the Lorentz factor, which quantifies the magnitude of relativistic effects like time dilation and length contraction as a function of speed v."}]}];

  function loadProgress(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {};
  }
  function saveProgress(p){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
  }
  var progress = loadProgress(); // { unitIndex: {correct, attempted, done} }

  var homeView = document.getElementById("homeView");
  var quizView = document.getElementById("quizView");
  var summaryView = document.getElementById("summaryView");
  var unitGrid = document.getElementById("unitGrid");
  var overallScoreVal = document.getElementById("overallScoreVal");

  var state = { unitIdx: null, qIdx: 0, correct: 0, attempted: 0, answered: false };

  function normalize(s){
    return (s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  }
  function answerVariants(ans){
    // split things like "underdamped (lightly damped)" or "rad/s (radian per second)"
    var out = [];
    var cleaned = ans.replace(/[()]/g, "|");
    cleaned.split(/[|\/,;]| or /i).forEach(function(part){
      var n = normalize(part);
      if(n) out.push(n);
    });
    var whole = normalize(ans);
    if(whole) out.push(whole);
    return out;
  }
  function fuzzyMatch(userText, correctText){
    var u = normalize(userText);
    if(!u) return false;
    var variants = answerVariants(correctText);
    for(var i=0;i<variants.length;i++){
      var v = variants[i];
      if(!v) continue;
      if(u === v) return true;
      if(v.length > 3 && (u.indexOf(v) !== -1 || v.indexOf(u) !== -1)) return true;
    }
    return false;
  }

  function totalQuestions(){
    var t=0; DATA.forEach(function(u){ t += u.questions.length; }); return t;
  }
  function overallStats(){
    var correct=0, attempted=0;
    Object.keys(progress).forEach(function(k){
      correct += progress[k].correct||0;
      attempted += progress[k].attempted||0;
    });
    return {correct:correct, attempted:attempted};
  }
  function refreshOverall(){
    var s = overallStats();
    overallScoreVal.textContent = s.correct + "/" + totalQuestions();
  }

  function renderUnitList(){
    unitGrid.innerHTML = "";
    DATA.forEach(function(unit, idx){
      var p = progress[idx];
      var btn = document.createElement("button");
      btn.className = "unit-card";
      var done = p && p.done;
      btn.innerHTML =
        '<span class="num">U' + unit.unit + '</span>' +
        '<span class="info">' +
          '<span class="t">' + escapeHtml(unit.title.replace(/^Unit \d+:\s*/,"")) + '</span>' +
          '<span class="s">' + unit.questions.length + ' questions</span>' +
        '</span>' +
        '<span class="badge' + (done ? ' done' : '') + '">' +
          (p ? (p.correct + '/' + unit.questions.length) : 'Start') +
        '</span>';
      btn.addEventListener("click", function(){ startUnit(idx); });
      unitGrid.appendChild(btn);
    });
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function startUnit(idx){
    state.unitIdx = idx;
    state.qIdx = 0;
    state.correct = 0;
    state.attempted = 0;
    showView("quiz");
    renderQuestion();
  }

  function showView(name){
    homeView.hidden = name !== "home";
    quizView.hidden = name !== "quiz";
    summaryView.hidden = name !== "summary";
    if(name === "home"){ renderUnitList(); refreshOverall(); }
  }

  var quizUnitTitle = document.getElementById("quizUnitTitle");
  var quizProgressLabel = document.getElementById("quizProgressLabel");
  var unitScoreVal = document.getElementById("unitScoreVal");
  var progressFill = document.getElementById("progressFill");
  var qmeta = document.getElementById("qmeta");
  var qtext = document.getElementById("qtext");
  var optionsWrap = document.getElementById("optionsWrap");
  var fillWrap = document.getElementById("fillWrap");
  var fillInput = document.getElementById("fillInput");
  var fillSubmit = document.getElementById("fillSubmit");
  var feedback = document.getElementById("feedback");
  var nextBtn = document.getElementById("nextBtn");
  var skipBtn = document.getElementById("skipBtn");
  var backBtn = document.getElementById("backBtn");

  function currentUnit(){ return DATA[state.unitIdx]; }
  function currentQuestion(){ return currentUnit().questions[state.qIdx]; }

  function renderQuestion(){
    var unit = currentUnit();
    var q = currentQuestion();
    state.answered = false;
    quizUnitTitle.textContent = unit.title;
    quizProgressLabel.textContent = "Question " + (state.qIdx+1) + " of " + unit.questions.length;
    unitScoreVal.textContent = state.correct + "/" + state.attempted;
    progressFill.style.width = (100 * state.qIdx / unit.questions.length) + "%";
    qmeta.textContent = q.type === "mcq" ? "Multiple choice" : (q.type === "tf" ? "True / False" : "Fill in the blank");
    qtext.textContent = q.q;
    feedback.className = "feedback";
    feedback.innerHTML = "";
    nextBtn.disabled = true;

    optionsWrap.innerHTML = "";
    fillWrap.hidden = true;

    if(q.type === "mcq"){
      optionsWrap.hidden = false;
      q.options.forEach(function(opt, i){
        var b = document.createElement("button");
        b.className = "opt";
        b.innerHTML = '<span class="k">' + "ABCD"[i] + '</span><span>' + escapeHtml(opt) + '</span>';
        b.addEventListener("click", function(){ answerMcq(i, b); });
        optionsWrap.appendChild(b);
      });
    } else if(q.type === "tf"){
      optionsWrap.hidden = false;
      [["True", true], ["False", false]].forEach(function(pair, i){
        var b = document.createElement("button");
        b.className = "opt";
        b.innerHTML = '<span class="k">' + (i===0?"T":"F") + '</span><span>' + pair[0] + '</span>';
        b.addEventListener("click", function(){ answerTf(pair[1], b); });
        optionsWrap.appendChild(b);
      });
    } else {
      optionsWrap.hidden = true;
      fillWrap.hidden = false;
      fillInput.value = "";
      fillInput.disabled = false;
      fillSubmit.disabled = false;
      setTimeout(function(){ fillInput.focus(); }, 0);
    }
  }

  function lockOptions(){
    Array.prototype.forEach.call(optionsWrap.querySelectorAll(".opt"), function(b){ b.disabled = true; });
  }

  function showFeedback(isCorrect, explanation, correctText){
    feedback.classList.add("show");
    feedback.classList.add(isCorrect ? "correct" : "incorrect");
    var head = isCorrect
      ? '<div class="verdict v-correct">Correct.</div>'
      : '<div class="verdict v-incorrect">Not quite' + (correctText ? (" &mdash; correct answer: " + escapeHtml(correctText)) : "") + '.</div>';
    feedback.innerHTML = head + (explanation ? '<div>' + escapeHtml(explanation) + '</div>' : "");
    nextBtn.disabled = false;
  }

  function recordAnswer(isCorrect){
    state.attempted++;
    if(isCorrect) state.correct++;
    unitScoreVal.textContent = state.correct + "/" + state.attempted;
  }

  function answerMcq(i, btnEl){
    if(state.answered) return;
    state.answered = true;
    var q = currentQuestion();
    var isCorrect = i === q.answer;
    lockOptions();
    Array.prototype.forEach.call(optionsWrap.children, function(b, idx){
      if(idx === q.answer) b.classList.add("correct");
      else if(idx === i) b.classList.add("incorrect");
    });
    recordAnswer(isCorrect);
    showFeedback(isCorrect, q.explanation, null);
  }

  function answerTf(val, btnEl){
    if(state.answered) return;
    state.answered = true;
    var q = currentQuestion();
    var isCorrect = val === q.answer;
    lockOptions();
    Array.prototype.forEach.call(optionsWrap.children, function(b, idx){
      var bVal = idx === 0;
      if(bVal === q.answer) b.classList.add("correct");
      else if(bVal === val) b.classList.add("incorrect");
    });
    recordAnswer(isCorrect);
    showFeedback(isCorrect, q.explanation, null);
  }

  function answerFill(){
    if(state.answered) return;
    var q = currentQuestion();
    var val = fillInput.value.trim();
    if(!val) return;
    state.answered = true;
    fillInput.disabled = true;
    fillSubmit.disabled = true;
    var isCorrect = fuzzyMatch(val, q.answer);
    recordAnswer(isCorrect);
    showFeedback(isCorrect, q.explanation, q.answer);
  }

  fillSubmit.addEventListener("click", answerFill);
  fillInput.addEventListener("keydown", function(e){ if(e.key === "Enter") answerFill(); });

  skipBtn.addEventListener("click", function(){
    if(!state.answered){
      var q = currentQuestion();
      state.attempted++;
      unitScoreVal.textContent = state.correct + "/" + state.attempted;
      lockOptions();
      fillInput.disabled = true; fillSubmit.disabled = true;
      showFeedback(false, q.explanation, q.type === "fill" ? q.answer : (q.type === "mcq" ? q.options[q.answer] : (q.answer ? "True" : "False")));
      state.answered = true;
    } else {
      advance();
    }
  });

  nextBtn.addEventListener("click", advance);

  function advance(){
    var unit = currentUnit();
    if(state.qIdx < unit.questions.length - 1){
      state.qIdx++;
      renderQuestion();
    } else {
      finishUnit();
    }
  }

  function finishUnit(){
    var unit = currentUnit();
    progress[state.unitIdx] = {
      correct: state.correct,
      attempted: state.attempted,
      done: true
    };
    saveProgress(progress);
    document.getElementById("summaryUnitTitle").textContent = unit.title;
    document.getElementById("summaryScore").textContent = state.correct + "/" + unit.questions.length;
    var pct = Math.round(100 * state.correct / unit.questions.length);
    var sub = "You scored " + pct + "%.";
    if(pct >= 80) sub = "Excellent work &mdash; " + pct + "%. This unit is solid.";
    else if(pct >= 50) sub = "Good progress &mdash; " + pct + "%. Review the missed questions in the practice book.";
    else sub = pct + "%. Worth another pass through this unit.";
    document.getElementById("summarySub").innerHTML = sub;
    showView("summary");
    refreshOverall();
  }

  document.getElementById("retryBtn").addEventListener("click", function(){ startUnit(state.unitIdx); });
  document.getElementById("toUnitsBtn").addEventListener("click", function(){ showView("home"); });
  backBtn.addEventListener("click", function(){ showView("home"); });

  showView("home");
})();
</script>
