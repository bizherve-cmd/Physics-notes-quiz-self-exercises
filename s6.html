<title>S6 Physics Quiz</title>
<style>
  :root{
    --bg:#f4f6f9;
    --surface:#ffffff;
    --surface-2:#eceff4;
    --text:#161b26;
    --text-dim:#5b6475;
    --border:#dde2ea;
    --accent:#0f7a73;
    --accent-ink:#ffffff;
    --accent-soft:#e3f3f1;
    --correct:#1c8a4b;
    --correct-soft:#e5f6ec;
    --incorrect:#c23b3b;
    --incorrect-soft:#fbe9e9;
    --shadow: 0 1px 2px rgba(20,24,34,.06), 0 8px 24px -12px rgba(20,24,34,.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e131b;
      --surface:#161d29;
      --surface-2:#1d2532;
      --text:#e9edf4;
      --text-dim:#95a0b3;
      --border:#2a3342;
      --accent:#3fd7c8;
      --accent-ink:#08211d;
      --accent-soft:#12312d;
      --correct:#4fce8a;
      --correct-soft:#123526;
      --incorrect:#ff8383;
      --incorrect-soft:#3a1c1e;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e131b;
    --surface:#161d29;
    --surface-2:#1d2532;
    --text:#e9edf4;
    --text-dim:#95a0b3;
    --border:#2a3342;
    --accent:#3fd7c8;
    --accent-ink:#08211d;
    --accent-soft:#12312d;
    --correct:#4fce8a;
    --correct-soft:#123526;
    --incorrect:#ff8383;
    --incorrect-soft:#3a1c1e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-inline:16px;
    padding-block:24px;
  }
  h1,h2,h3{font-family:"Sora", ui-sans-serif, system-ui, sans-serif; text-wrap:balance; margin:0;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}

  .wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:20px;}

  .app-header{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .app-header .eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:4px;}
  .app-header h1{font-size:22px; font-weight:700;}
  .byline{font-size:13px; color:var(--text-dim); margin-top:6px;}

  .score-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:6px 12px; font-size:13px; color:var(--text-dim); box-shadow:var(--shadow);
    white-space:nowrap;
  }
  .score-pill strong{color:var(--text); font-family:"IBM Plex Mono", monospace;}

  /* ---- unit list ---- */
  .unit-grid{display:flex; flex-direction:column; gap:10px;}
  .unit-card{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; box-shadow:var(--shadow); cursor:pointer; text-align:left;
    font:inherit; color:inherit; width:100%;
  }
  .unit-card:hover{border-color:var(--accent);}
  .unit-card .num{
    font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--accent);
    background:var(--accent-soft); border-radius:8px; padding:4px 8px; flex:none;
  }
  .unit-card .info{flex:1; min-width:0;}
  .unit-card .info .t{font-weight:600; font-size:15px;}
  .unit-card .info .s{font-size:12.5px; color:var(--text-dim); margin-top:2px;}
  .unit-card .badge{
    font-size:12px; font-family:"IBM Plex Mono",monospace; flex:none;
    padding:4px 9px; border-radius:999px; border:1px solid var(--border); color:var(--text-dim);
  }
  .unit-card .badge.done{color:var(--correct); border-color:var(--correct); background:var(--correct-soft);}

  /* ---- quiz view ---- */
  .quiz-header{display:flex; align-items:center; gap:10px;}
  .back-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:10px; padding:8px 10px; cursor:pointer; font-size:14px; line-height:1;
    flex:none;
  }
  .quiz-header .title{flex:1; min-width:0;}
  .quiz-header .title .t{font-weight:700; font-size:15px;}
  .quiz-header .title .s{font-size:12.5px; color:var(--text-dim);}

  .progress-track{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); border-radius:999px; transition:width .25s ease;}

  .qcard{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:16px;
  }
  .qmeta{font-size:12.5px; color:var(--text-dim); font-family:"IBM Plex Mono",monospace;}
  .qtext{font-size:17px; font-weight:600; line-height:1.45;}

  .options{display:flex; flex-direction:column; gap:9px;}
  .opt{
    display:flex; align-items:flex-start; gap:10px; text-align:left;
    background:var(--surface-2); border:1.5px solid var(--border); border-radius:12px;
    padding:11px 13px; cursor:pointer; font:inherit; color:inherit; font-size:14.5px; line-height:1.4;
    transition:border-color .12s ease, background .12s ease;
  }
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:disabled{cursor:default;}
  .opt .k{
    font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:13px; flex:none;
    width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
  }
  .opt.correct{background:var(--correct-soft); border-color:var(--correct);}
  .opt.correct .k{background:var(--correct); color:#fff; border-color:var(--correct);}
  .opt.incorrect{background:var(--incorrect-soft); border-color:var(--incorrect);}
  .opt.incorrect .k{background:var(--incorrect); color:#fff; border-color:var(--incorrect);}

  .fill-row{display:flex; gap:8px; flex-wrap:wrap;}
  .fill-row input{
    flex:1; min-width:160px; font:inherit; font-size:14.5px; padding:11px 13px;
    border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text);
  }
  .fill-row input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .btn{
    font:inherit; font-weight:600; font-size:14px; border-radius:12px; border:1px solid transparent;
    padding:11px 16px; cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:disabled{opacity:.5; cursor:default;}
  .btn-ghost{background:var(--surface); border-color:var(--border); color:var(--text);}

  .feedback{
    border-radius:12px; padding:13px 14px; font-size:14px; line-height:1.5; display:none;
    border:1px solid var(--border);
  }
  .feedback.show{display:block;}
  .feedback.correct{background:var(--correct-soft); border-color:var(--correct); color:var(--text);}
  .feedback.incorrect{background:var(--incorrect-soft); border-color:var(--incorrect); color:var(--text);}
  .feedback .verdict{font-weight:700; margin-bottom:4px;}
  .feedback .verdict.v-correct{color:var(--correct);}
  .feedback .verdict.v-incorrect{color:var(--incorrect);}

  .actions{display:flex; justify-content:flex-end; gap:8px;}

  .summary{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:26px 20px; text-align:center; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .summary .big{font-family:"IBM Plex Mono",monospace; font-size:40px; font-weight:700;}
  .summary .sub{color:var(--text-dim); font-size:14px;}
  .summary .actions2{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; justify-content:center;}

  [hidden]{display:none !important;}
  footer{text-align:center; font-size:12px; color:var(--text-dim); padding-top:8px;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<div class="wrap">

  <div class="app-header">
    <div>
      <div class="eyebrow">Senior 6 Physics &middot; Self-Study Practice</div>
      <h1 id="pageTitle">Senior 6 Physics Quiz</h1>
      <div class="byline">Compiled by BIZIYAREMYE Donat, GS BYUMBA INYANGE &middot; 10 units &middot; 400 questions</div>
    </div>
    <div class="score-pill" id="overallScore">
      <span>Overall</span><strong id="overallScoreVal">0/0</strong>
    </div>
  </div>

  <div id="homeView">
    <div class="unit-grid" id="unitGrid"></div>
  </div>

  <div id="quizView" hidden>
    <div class="quiz-header">
      <button class="back-btn" id="backBtn" aria-label="Back to units">&larr;</button>
      <div class="title">
        <div class="t" id="quizUnitTitle">Unit</div>
        <div class="s" id="quizProgressLabel">Question 1 of 40</div>
      </div>
      <div class="score-pill"><span>Score</span><strong id="unitScoreVal">0/0</strong></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

    <div class="qcard">
      <div class="qmeta" id="qmeta">MCQ</div>
      <div class="qtext" id="qtext"></div>
      <div class="options" id="optionsWrap"></div>
      <div class="fill-row" id="fillWrap" hidden>
        <input id="fillInput" type="text" placeholder="Type your answer&hellip;" autocomplete="off">
        <button class="btn btn-primary" id="fillSubmit">Check</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="btn btn-ghost" id="skipBtn">Skip</button>
        <button class="btn btn-primary" id="nextBtn" disabled>Next</button>
      </div>
    </div>
  </div>

  <div id="summaryView" hidden>
    <div class="summary">
      <div class="eyebrow">Unit complete</div>
      <h2 id="summaryUnitTitle">Unit</h2>
      <div class="big" id="summaryScore">0/40</div>
      <div class="sub" id="summarySub">Nice work.</div>
      <div class="actions2">
        <button class="btn btn-ghost" id="retryBtn">Retry unit</button>
        <button class="btn btn-primary" id="toUnitsBtn">Choose another unit</button>
      </div>
    </div>
  </div>

  <footer>Self-study practice book &middot; tap an answer for instant feedback</footer>
</div>

<script>
(function(){
  "use strict";
  var LEVEL_KEY = "s6";
  var STORAGE_KEY = "physics-quiz-progress-" + LEVEL_KEY;
  var DATA = [{"unit": 1, "title": "Unit 1: Electric Fields and Potential", "questions": [{"type": "mcq", "q": "Coulomb's law states that the force between two point charges is proportional to:", "options": ["The sum of the charges and inversely proportional to distance", "The product of the charges and inversely proportional to the square of the distance", "The product of the charges and directly proportional to the distance", "The difference of the charges only"], "answer": 1, "explanation": "Coulomb's law: F = kQ1Q2/r², so force is proportional to the product of the charges and inversely proportional to the square of their separation."}, {"type": "mcq", "q": "The SI unit of electric field strength is:", "options": ["Coulomb", "Volt", "Newton per coulomb (N/C)", "Farad"], "answer": 2, "explanation": "Electric field strength is force per unit charge, E = F/q, so its unit is newton per coulomb (equivalently volt per metre)."}, {"type": "mcq", "q": "Electric field lines around an isolated positive point charge point:", "options": ["Towards the charge", "Radially outward from the charge", "In circles around the charge", "Parallel to each other"], "answer": 1, "explanation": "Field lines always point away from positive charges and towards negative charges; for an isolated positive charge they radiate outward radially."}, {"type": "mcq", "q": "The electric potential at a point due to a point charge Q at distance r is given by:", "options": ["V = kQ/r", "V = kQ/r²", "V = kQr", "V = kQ²/r"], "answer": 0, "explanation": "Electric potential due to a point charge is V = kQ/r, which falls off as 1/r (unlike the field, which falls off as 1/r²)."}, {"type": "mcq", "q": "Two points on the same equipotential surface have:", "options": ["Different potentials", "The same potential", "Different electric fields only", "No electric field between them"], "answer": 1, "explanation": "By definition, every point on an equipotential surface has the same electric potential."}, {"type": "mcq", "q": "The work done moving a charge along an equipotential surface is:", "options": ["Maximum", "Zero", "Equal to qV", "Infinite"], "answer": 1, "explanation": "Since potential does not change along an equipotential surface, no work is done moving a charge along it (W = qΔV = 0)."}, {"type": "mcq", "q": "The relationship between electric field E and potential V is:", "options": ["E = V/d in a uniform field", "E = Vd", "E = V²/d", "E = d/V"], "answer": 0, "explanation": "In a uniform field between parallel plates, E = V/d, where d is the separation of the plates."}, {"type": "mcq", "q": "Electric field lines never cross because:", "options": ["They repel each other", "The field at a point can only have one direction", "They are always straight", "Of magnetic effects"], "answer": 1, "explanation": "The electric field at any point has a single, unique direction, so field lines representing it cannot cross."}, {"type": "mcq", "q": "The electric field inside a charged, isolated conductor in electrostatic equilibrium is:", "options": ["Maximum at the centre", "Zero", "Equal to the surface field", "Infinite"], "answer": 1, "explanation": "In electrostatic equilibrium, free charges rearrange so that the net electric field inside a conductor is zero."}, {"type": "mcq", "q": "Electric potential energy of two point charges is given by:", "options": ["U = kQ1Q2/r", "U = kQ1Q2/r²", "U = kQ1Q2r", "U = k(Q1+Q2)/r"], "answer": 0, "explanation": "The potential energy of a pair of point charges is U = kQ1Q2/r, analogous to the potential (but for a pair of charges)."}, {"type": "mcq", "q": "If a positive test charge is released in an electric field, it will:", "options": ["Stay at rest always", "Move in the direction of the field", "Move opposite to the field", "Move perpendicular to the field"], "answer": 1, "explanation": "A positive charge experiences a force in the same direction as the electric field, so it accelerates along the field direction."}, {"type": "mcq", "q": "The electric field due to an infinite charged plane is:", "options": ["Zero everywhere", "Uniform and independent of distance from the plane", "Inversely proportional to distance", "Inversely proportional to the square of distance"], "answer": 1, "explanation": "An infinite uniformly charged plane produces a field of constant magnitude, independent of the distance from the plane."}, {"type": "mcq", "q": "Electric flux through a surface is defined as:", "options": ["The charge enclosed only", "The product of the electric field and the perpendicular area it passes through", "The potential difference across the surface", "The current through the surface"], "answer": 1, "explanation": "Electric flux Φ = E·A·cosθ, the component of the electric field passing perpendicularly through an area."}, {"type": "mcq", "q": "Gauss's law relates electric flux through a closed surface to:", "options": ["The potential at the surface", "The net charge enclosed by the surface", "The distance to the nearest charge", "The area of the surface only"], "answer": 1, "explanation": "Gauss's law states Φ = Qenclosed/ε₀, relating the total flux through a closed surface to the net charge it encloses."}, {"type": "mcq", "q": "The unit of electric potential is the:", "options": ["Coulomb", "Newton", "Volt", "Watt"], "answer": 2, "explanation": "Electric potential is measured in volts, where 1 volt = 1 joule per coulomb."}, {"type": "mcq", "q": "Two charges of +2 µC and -2 µC placed close together form:", "options": ["A monopole", "An electric dipole", "A capacitor plate", "A conductor"], "answer": 1, "explanation": "A pair of equal and opposite charges separated by a small distance forms an electric dipole."}, {"type": "mcq", "q": "The potential due to a dipole at a point on its equatorial line is:", "options": ["Maximum", "Zero", "Equal to that of a single charge", "Negative infinity"], "answer": 1, "explanation": "On the equatorial (perpendicular bisector) line of a dipole, the potentials from the two charges cancel exactly, giving zero net potential."}, {"type": "mcq", "q": "A charge of 4 C experiences a force of 20 N in an electric field. The field strength is:", "options": ["5 N/C", "80 N/C", "0.2 N/C", "24 N/C"], "answer": 0, "explanation": "E = F/q = 20/4 = 5 N/C."}, {"type": "mcq", "q": "Moving a charge of 2 C through a potential difference of 6 V requires work of:", "options": ["3 J", "12 J", "8 J", "0.33 J"], "answer": 1, "explanation": "W = qV = 2 × 6 = 12 J."}, {"type": "mcq", "q": "The direction of the electric field at a point is defined as the direction of force on:", "options": ["Any charge placed there", "A small positive test charge placed there", "A negative test charge placed there", "The nearest source charge"], "answer": 1, "explanation": "By convention, the electric field direction is the direction of the force experienced by a small positive test charge."}, {"type": "mcq", "q": "As distance from a point charge doubles, the electric field strength becomes:", "options": ["Half", "One quarter", "Double", "Four times"], "answer": 1, "explanation": "Since E ∝ 1/r², doubling r reduces E to (1/2)² = 1/4 of its original value."}, {"type": "mcq", "q": "The potential energy of a charge in an electric field is analogous to which quantity in mechanics?", "options": ["Kinetic energy", "Gravitational potential energy", "Momentum", "Power"], "answer": 1, "explanation": "Both increase with position against a restoring/attractive force and both can be converted into kinetic energy — electric PE is the electrical analogue of gravitational PE."}, {"type": "mcq", "q": "An electron placed in a uniform electric field pointing right will experience a force:", "options": ["To the right", "To the left", "Upward", "No force"], "answer": 1, "explanation": "Since the electron is negatively charged, the force on it is opposite to the field direction, i.e., to the left."}, {"type": "mcq", "q": "Which quantity is a scalar?", "options": ["Electric field", "Electric force", "Electric potential", "Electric flux density"], "answer": 2, "explanation": "Electric potential is a scalar quantity (it has magnitude but no direction), unlike field and force which are vectors."}, {"type": "mcq", "q": "The capacitor plates are charged to create a field of 500 V/m over a gap of 2 mm. The potential difference is:", "options": ["1 V", "0.25 V", "250 V", "1000 V"], "answer": 0, "explanation": "V = E × d = 500 × 0.002 = 1 V."}, {"type": "mcq", "q": "A region where the electric potential is constant everywhere is called:", "options": ["A field line", "An equipotential region", "A charge centre", "A polarised region"], "answer": 1, "explanation": "A region of constant potential throughout is called an equipotential region/surface."}, {"type": "mcq", "q": "The number of electric field lines drawn per unit area represents:", "options": ["The potential", "The strength of the electric field", "The total charge", "The capacitance"], "answer": 1, "explanation": "Field line density (lines per unit area) is used to represent the relative strength of the electric field — denser lines mean a stronger field."}, {"type": "mcq", "q": "Electric potential due to a negative charge at a nearby point is:", "options": ["Always positive", "Always negative", "Always zero", "Undefined"], "answer": 1, "explanation": "Since V = kQ/r and Q is negative, the potential is negative at all finite distances from a negative point charge."}, {"type": "mcq", "q": "Which of the following best describes electrostatic shielding?", "options": ["Charges accumulate at the centre of a conductor", "A conductor with a cavity shields the cavity from external fields", "Field lines pass straight through a conductor", "Electric field is always strongest at the centre of a conductor"], "answer": 1, "explanation": "A hollow conductor shields its interior from external electric fields, since induced surface charges cancel the field inside — this is electrostatic shielding (Faraday cage effect)."}, {"type": "mcq", "q": "The energy stored per unit volume in an electric field is proportional to:", "options": ["E", "E²", "1/E", "E³"], "answer": 1, "explanation": "Energy density in an electric field is given by u = ½ε₀E², proportional to the square of the field strength."}, {"type": "tf", "q": "Electric field lines can intersect at a single point if two fields overlap.", "answer": false, "explanation": "Field lines never cross, since the field at any given point has only one net direction — overlapping fields combine into a single resultant, not two crossing lines."}, {"type": "tf", "q": "Potential decreases in the direction of the electric field.", "answer": true, "explanation": "The electric field points in the direction of decreasing potential; formally E = -dV/dr."}, {"type": "tf", "q": "The potential at infinity due to a point charge is taken as zero.", "answer": true, "explanation": "By convention, electric potential is defined to be zero at an infinite distance from the source charge."}, {"type": "tf", "q": "A conductor in electrostatic equilibrium has all excess charge distributed throughout its volume.", "answer": false, "explanation": "In electrostatic equilibrium, excess charge on a conductor resides entirely on its outer surface, not throughout its volume."}, {"type": "tf", "q": "Work done in moving a charge between two points depends on the path taken in an electrostatic field.", "answer": false, "explanation": "The electrostatic force is conservative, so the work done depends only on the initial and final potentials, not on the path taken."}, {"type": "fill", "q": "The force between two point charges varies inversely with the ______ of the distance between them.", "answer": "square", "explanation": "Coulomb's law states F ∝ 1/r², so the force varies inversely with the square of the separation."}, {"type": "fill", "q": "The SI unit of electric charge is the ______.", "answer": "coulomb", "explanation": "Electric charge is measured in coulombs (C) in the SI system."}, {"type": "fill", "q": "A surface on which the potential is the same at every point is called an ______ surface.", "answer": "equipotential", "explanation": "Such a surface, where V is constant everywhere, is called an equipotential surface."}, {"type": "fill", "q": "The quantity that measures force per unit charge at a point is called the electric ______.", "answer": "field", "explanation": "Electric field strength E = F/q is the force experienced per unit positive test charge."}, {"type": "fill", "q": "Electric potential is defined as ______ done per unit charge in bringing it from infinity to a point.", "answer": "work", "explanation": "V = W/q, the work done per unit charge to bring a small positive charge from infinity to that point."}]}, {"unit": 2, "title": "Unit 2: Capacitors and Capacitance", "questions": [{"type": "mcq", "q": "Capacitance is defined as the ratio of:", "options": ["Voltage to charge", "Charge to voltage", "Charge to current", "Voltage to current"], "answer": 1, "explanation": "Capacitance C = Q/V, the charge stored per unit potential difference across the capacitor."}, {"type": "mcq", "q": "The SI unit of capacitance is the:", "options": ["Ohm", "Henry", "Farad", "Weber"], "answer": 2, "explanation": "Capacitance is measured in farads (F), where 1 F = 1 coulomb per volt."}, {"type": "mcq", "q": "The capacitance of a parallel-plate capacitor is given by:", "options": ["C = ε₀A/d", "C = ε₀d/A", "C = Ad/ε₀", "C = ε₀Ad"], "answer": 0, "explanation": "For a parallel-plate capacitor, C = ε₀A/d, where A is plate area and d is plate separation."}, {"type": "mcq", "q": "Inserting a dielectric between capacitor plates (keeping charge constant):", "options": ["Decreases capacitance", "Increases capacitance", "Has no effect on capacitance", "Reduces charge stored"], "answer": 1, "explanation": "A dielectric increases the capacitance by a factor equal to its relative permittivity (dielectric constant)."}, {"type": "mcq", "q": "When capacitors are connected in series, the total capacitance is:", "options": ["Greater than any individual capacitance", "Less than the smallest individual capacitance", "Equal to the sum of capacitances", "Equal to the average capacitance"], "answer": 1, "explanation": "For capacitors in series, 1/C_total = 1/C1 + 1/C2 + ..., making the total less than the smallest individual capacitance."}, {"type": "mcq", "q": "When capacitors are connected in parallel, the total capacitance is:", "options": ["The sum of the individual capacitances", "Less than the smallest capacitance", "The reciprocal sum of capacitances", "Always equal for all combinations"], "answer": 0, "explanation": "In parallel, capacitances simply add: C_total = C1 + C2 + C3 + ..."}, {"type": "mcq", "q": "The energy stored in a charged capacitor is given by:", "options": ["U = QV", "U = ½QV", "U = Q/V", "U = 2QV"], "answer": 1, "explanation": "The energy stored in a capacitor is U = ½QV = ½CV² = Q²/2C."}, {"type": "mcq", "q": "A capacitor of 4 µF is charged to 10 V. The charge stored is:", "options": ["40 µC", "2.5 µC", "0.4 µC", "400 µC"], "answer": 0, "explanation": "Q = CV = 4 × 10 = 40 µC."}, {"type": "mcq", "q": "The time constant of an RC charging circuit is given by:", "options": ["τ = R/C", "τ = RC", "τ = C/R", "τ = 1/RC"], "answer": 1, "explanation": "The time constant of an RC circuit is τ = RC, the time for charge/voltage to reach about 63% of its final value."}, {"type": "mcq", "q": "During charging of a capacitor through a resistor, the current:", "options": ["Increases exponentially", "Decreases exponentially from an initial maximum", "Remains constant", "Oscillates"], "answer": 1, "explanation": "Charging current starts at a maximum (V/R) and decays exponentially towards zero as the capacitor charges."}, {"type": "mcq", "q": "After one time constant, the charge on a charging capacitor reaches approximately:", "options": ["37% of maximum", "50% of maximum", "63% of maximum", "100% of maximum"], "answer": 2, "explanation": "After one time constant τ, the capacitor charges to about 63% (1 - 1/e) of its final (maximum) charge."}, {"type": "mcq", "q": "A capacitor blocks:", "options": ["Alternating current only", "Direct current in steady state", "Both AC and DC equally", "Neither AC nor DC"], "answer": 1, "explanation": "In steady state, no current flows through a fully charged capacitor, so it blocks direct current, while still allowing AC to pass (via charging/discharging)."}, {"type": "mcq", "q": "The main function of a dielectric in a capacitor is to:", "options": ["Conduct current between plates", "Increase capacitance and prevent plates from touching", "Decrease the plate area", "Increase plate separation"], "answer": 1, "explanation": "A dielectric increases capacitance (by increasing permittivity) and physically separates the plates, preventing direct contact/short circuit."}, {"type": "mcq", "q": "Two 2 µF capacitors connected in series give a total capacitance of:", "options": ["4 µF", "1 µF", "2 µF", "0.5 µF"], "answer": 1, "explanation": "1/C = 1/2 + 1/2 = 1, so C = 1 µF for two equal capacitors in series."}, {"type": "mcq", "q": "Two 2 µF capacitors connected in parallel give a total capacitance of:", "options": ["1 µF", "2 µF", "4 µF", "0.5 µF"], "answer": 2, "explanation": "In parallel, capacitances add directly: 2 + 2 = 4 µF."}, {"type": "mcq", "q": "The energy stored in a capacitor is analogous to which stored energy in mechanics?", "options": ["Kinetic energy of a moving mass", "Elastic potential energy of a stretched spring", "Gravitational potential energy", "Rotational kinetic energy"], "answer": 1, "explanation": "Both a capacitor (U = ½CV²) and a spring (U = ½kx²) store energy proportional to the square of a displacement-like variable, making them closely analogous."}, {"type": "mcq", "q": "A capacitor with plates of larger area, all else equal, has:", "options": ["Smaller capacitance", "Larger capacitance", "Same capacitance", "No stored charge"], "answer": 1, "explanation": "Since C ∝ A, increasing plate area increases capacitance."}, {"type": "mcq", "q": "Increasing the plate separation of a parallel-plate capacitor, all else equal:", "options": ["Increases capacitance", "Decreases capacitance", "Has no effect on capacitance", "Doubles the charge stored"], "answer": 1, "explanation": "Since C ∝ 1/d, increasing separation d decreases capacitance."}, {"type": "mcq", "q": "Capacitors are used in camera flash circuits mainly because they can:", "options": ["Store energy and release it very quickly", "Convert AC to DC permanently", "Amplify current", "Store data permanently"], "answer": 0, "explanation": "Capacitors can be charged slowly and then discharged very rapidly, releasing a burst of energy needed for a camera flash."}, {"type": "mcq", "q": "A fully discharged capacitor in an RC circuit initially behaves like:", "options": ["An open circuit", "A short circuit (very low resistance)", "A resistor of fixed value", "An inductor"], "answer": 1, "explanation": "At the instant a fully discharged capacitor starts charging, it offers negligible opposition, behaving like a short circuit (maximum initial current)."}, {"type": "mcq", "q": "The dielectric constant (relative permittivity) of a vacuum is:", "options": ["0", "1", "Infinite", "Depends on the material"], "answer": 1, "explanation": "By definition, the relative permittivity (dielectric constant) of a vacuum is exactly 1."}, {"type": "mcq", "q": "If the voltage across a capacitor is doubled, the energy stored:", "options": ["Doubles", "Halves", "Quadruples", "Stays the same"], "answer": 2, "explanation": "Since U = ½CV², doubling V increases U by a factor of 2² = 4."}, {"type": "mcq", "q": "A 100 µF capacitor charged to 20 V stores energy of:", "options": ["0.02 J", "2 J", "0.2 J", "20 J"], "answer": 0, "explanation": "U = ½CV² = ½ × 100×10⁻⁶ × 20² = ½ × 100×10⁻⁶ × 400 = 0.02 J."}, {"type": "mcq", "q": "Which factor does NOT affect the capacitance of a parallel-plate capacitor?", "options": ["Plate area", "Plate separation", "Applied voltage", "Dielectric between plates"], "answer": 2, "explanation": "Capacitance is a property of the capacitor's geometry and dielectric, independent of the voltage applied (C = Q/V stays constant as both Q and V change proportionally)."}, {"type": "mcq", "q": "Electrolytic capacitors are typically used when:", "options": ["A very small, fixed capacitance is needed with no polarity", "A large capacitance value is needed, often with polarity", "Only AC signals are present", "No dielectric is required"], "answer": 1, "explanation": "Electrolytic capacitors provide relatively large capacitance values in a small size but are polarised, requiring correct connection direction."}, {"type": "mcq", "q": "The formula for combining two capacitors C1 and C2 in series is:", "options": ["C = C1 + C2", "C = C1C2/(C1+C2)", "C = C1 - C2", "C = (C1+C2)/2"], "answer": 1, "explanation": "For two capacitors in series, C = C1C2/(C1 + C2), the product-over-sum formula."}, {"type": "mcq", "q": "A capacitor discharging through a resistor shows voltage that:", "options": ["Increases linearly", "Decreases exponentially towards zero", "Remains constant", "Oscillates sinusoidally"], "answer": 1, "explanation": "During discharge, the capacitor voltage decays exponentially towards zero, following V = V₀e^(-t/RC)."}, {"type": "mcq", "q": "Which combination of capacitors gives the largest total capacitance from equal capacitors?", "options": ["Series", "Parallel", "Both give the same result", "Neither, they always cancel"], "answer": 1, "explanation": "Parallel connection always gives the largest total capacitance compared to series, for the same set of capacitors."}, {"type": "mcq", "q": "A capacitor's ability to store charge for a given voltage depends primarily on its:", "options": ["Colour", "Physical construction and dielectric material", "The battery used to charge it", "The wire connecting it"], "answer": 1, "explanation": "Capacitance depends on the physical design (plate area, separation) and the dielectric material used, not on external circuit elements."}, {"type": "mcq", "q": "In a fully charged capacitor connected to a DC source, the current flowing is:", "options": ["Maximum", "Zero", "Equal to V/R always", "Infinite"], "answer": 1, "explanation": "Once fully charged, no more charge flows onto the capacitor, so the steady-state current in that branch is zero."}, {"type": "tf", "q": "Capacitance depends on the applied voltage across the capacitor.", "answer": false, "explanation": "Capacitance is a fixed property of the capacitor's geometry and dielectric; it does not depend on the applied voltage, since Q and V change proportionally, keeping C = Q/V constant."}, {"type": "tf", "q": "The total capacitance of capacitors in parallel is always greater than any single capacitor in the combination.", "answer": true, "explanation": "Adding capacitances in parallel always increases the total, since C_total = C1 + C2 + ... is at least as large as the largest individual value."}, {"type": "tf", "q": "A capacitor allows steady direct current to flow through it indefinitely once fully charged.", "answer": false, "explanation": "Once fully charged, a capacitor blocks further steady DC current; current only flows during charging or discharging transients."}, {"type": "tf", "q": "The time constant RC represents the time taken for a capacitor to charge to exactly 100% of its final voltage.", "answer": false, "explanation": "The time constant RC is the time to reach about 63% of the final voltage, not 100%; full charging theoretically takes infinite time."}, {"type": "tf", "q": "Placing a dielectric between capacitor plates always decreases the capacitance.", "answer": false, "explanation": "A dielectric increases capacitance by a factor equal to its relative permittivity, which is always greater than 1 for real dielectrics."}, {"type": "fill", "q": "The unit of capacitance is the ______.", "answer": "farad", "explanation": "Capacitance is measured in farads (F) in the SI system."}, {"type": "fill", "q": "The formula for the charge stored in a capacitor is Q = ______.", "answer": "CV", "explanation": "The defining relationship for a capacitor is Q = CV, charge equals capacitance times voltage."}, {"type": "fill", "q": "In an RC circuit, the time constant is calculated as τ = ______.", "answer": "RC", "explanation": "The time constant of an RC circuit is the product of resistance and capacitance, τ = RC."}, {"type": "fill", "q": "A material placed between capacitor plates to increase capacitance is called a ______.", "answer": "dielectric", "explanation": "A dielectric is an insulating material inserted between plates to increase capacitance and withstand higher voltage."}, {"type": "fill", "q": "The energy stored in a capacitor can be expressed as U = ½ ______ V².", "answer": "C", "explanation": "Energy stored is U = ½CV², where C is capacitance and V is the potential difference."}]}, {"unit": 3, "title": "Unit 3: Current Electricity and DC Circuits", "questions": [{"type": "mcq", "q": "Ohm's law states that, at constant temperature, current through a conductor is:", "options": ["Inversely proportional to voltage", "Directly proportional to voltage", "Independent of voltage", "Proportional to the square of voltage"], "answer": 1, "explanation": "Ohm's law: V = IR, so at constant temperature and resistance, current is directly proportional to the applied voltage."}, {"type": "mcq", "q": "The SI unit of resistance is the:", "options": ["Ampere", "Volt", "Ohm", "Watt"], "answer": 2, "explanation": "Electrical resistance is measured in ohms (Ω)."}, {"type": "mcq", "q": "Resistivity of a material depends on:", "options": ["The length of the wire only", "The cross-sectional area only", "The nature of the material and temperature", "The current flowing through it"], "answer": 2, "explanation": "Resistivity is an intrinsic property of the material that depends on its nature and temperature, unlike resistance which also depends on geometry."}, {"type": "mcq", "q": "For resistors in series, the total resistance is:", "options": ["Less than the smallest resistor", "The sum of the individual resistances", "The reciprocal sum of the resistances", "Always equal to the largest resistor only"], "answer": 1, "explanation": "In series, resistances simply add: R_total = R1 + R2 + R3 + ..."}, {"type": "mcq", "q": "For resistors in parallel, the total resistance is:", "options": ["Greater than any individual resistor", "Less than the smallest individual resistor", "Equal to the sum of resistors", "Equal to the average of resistors"], "answer": 1, "explanation": "In parallel, 1/R_total = 1/R1 + 1/R2 + ..., making the total always less than the smallest individual resistance."}, {"type": "mcq", "q": "Kirchhoff's current law is based on the conservation of:", "options": ["Energy", "Charge", "Momentum", "Voltage"], "answer": 1, "explanation": "Kirchhoff's current law states that the total current entering a junction equals the total current leaving it, which follows from conservation of electric charge."}, {"type": "mcq", "q": "Kirchhoff's voltage law is based on the conservation of:", "options": ["Charge", "Energy", "Mass", "Current"], "answer": 1, "explanation": "Kirchhoff's voltage law states that the sum of EMFs equals the sum of potential drops around a closed loop, which follows from conservation of energy."}, {"type": "mcq", "q": "The EMF of a cell is defined as:", "options": ["The voltage across its terminals when delivering current", "The energy given to each unit charge by the source", "The current it can deliver", "The resistance of the cell"], "answer": 1, "explanation": "EMF is the total energy supplied per unit charge by the source, including energy lost to internal resistance, distinguishing it from terminal voltage."}, {"type": "mcq", "q": "The terminal voltage of a cell with internal resistance r, delivering current I, is given by:", "options": ["V = EMF + Ir", "V = EMF - Ir", "V = EMF × Ir", "V = EMF/Ir"], "answer": 1, "explanation": "Terminal voltage V = EMF - Ir, since some of the EMF is used to drive current through the cell's own internal resistance."}, {"type": "mcq", "q": "A potential divider is used to:", "options": ["Increase the total resistance", "Obtain a fraction of a source voltage", "Store electric charge", "Measure current directly"], "answer": 1, "explanation": "A potential divider (voltage divider) uses two or more resistors to tap off a desired fraction of the supply voltage."}, {"type": "mcq", "q": "A Wheatstone bridge is balanced when:", "options": ["All resistors are equal", "The galvanometer reads maximum current", "No current flows through the galvanometer", "The battery is disconnected"], "answer": 2, "explanation": "A Wheatstone bridge is balanced when the ratio of resistances on each side is equal, resulting in zero current through the galvanometer."}, {"type": "mcq", "q": "Electrical power dissipated in a resistor is given by:", "options": ["P = IR", "P = I²R", "P = I/R", "P = R/I"], "answer": 1, "explanation": "Power dissipated in a resistor is P = I²R (also equal to V²/R or VI)."}, {"type": "mcq", "q": "A wire carries a current of 3 A when connected across a 12 V supply. Its resistance is:", "options": ["4 Ω", "36 Ω", "0.25 Ω", "9 Ω"], "answer": 0, "explanation": "R = V/I = 12/3 = 4 Ω."}, {"type": "mcq", "q": "Two 6 Ω resistors connected in series give a total resistance of:", "options": ["3 Ω", "12 Ω", "36 Ω", "6 Ω"], "answer": 1, "explanation": "In series, resistances add: 6 + 6 = 12 Ω."}, {"type": "mcq", "q": "Two 6 Ω resistors connected in parallel give a total resistance of:", "options": ["12 Ω", "6 Ω", "3 Ω", "1.5 Ω"], "answer": 2, "explanation": "For equal resistors in parallel, R_total = R/n = 6/2 = 3 Ω."}, {"type": "mcq", "q": "Doubling the length of a uniform wire, keeping area constant, ___ its resistance.", "options": ["Halves", "Doubles", "Quadruples", "Leaves unchanged"], "answer": 1, "explanation": "Since R = ρL/A, resistance is directly proportional to length, so doubling length doubles resistance."}, {"type": "mcq", "q": "Doubling the cross-sectional area of a wire, keeping length constant, ___ its resistance.", "options": ["Doubles", "Halves", "Quadruples", "Leaves unchanged"], "answer": 1, "explanation": "Since R = ρL/A, resistance is inversely proportional to area, so doubling area halves resistance."}, {"type": "mcq", "q": "An ammeter is always connected in ___ with the circuit component to measure current.", "options": ["Parallel", "Series", "Either series or parallel", "Neither"], "answer": 1, "explanation": "An ammeter is connected in series so that the full current to be measured passes through it."}, {"type": "mcq", "q": "A voltmeter is always connected in ___ with the circuit component to measure voltage.", "options": ["Series", "Parallel", "Either series or parallel", "Neither"], "answer": 1, "explanation": "A voltmeter is connected in parallel across a component to measure the potential difference across it without significantly altering the circuit."}, {"type": "mcq", "q": "An ideal ammeter has ___ resistance and an ideal voltmeter has ___ resistance.", "options": ["Infinite; zero", "Zero; infinite", "Zero; zero", "Infinite; infinite"], "answer": 1, "explanation": "An ideal ammeter should have zero resistance (no voltage drop) and an ideal voltmeter should have infinite resistance (draws no current)."}, {"type": "mcq", "q": "When resistors of different values are connected in parallel, the current through each:", "options": ["Is the same for all", "Is inversely proportional to its resistance", "Is directly proportional to its resistance", "Is zero in all but one"], "answer": 1, "explanation": "For resistors in parallel (same voltage across each), current is inversely proportional to resistance, following I = V/R."}, {"type": "mcq", "q": "The power delivered by a source with EMF 12 V and current 2 A is:", "options": ["6 W", "24 W", "10 W", "14 W"], "answer": 1, "explanation": "P = EMF × I = 12 × 2 = 24 W."}, {"type": "mcq", "q": "A cell with EMF 6 V and internal resistance 1 Ω delivers a current of 2 A. Its terminal voltage is:", "options": ["6 V", "4 V", "8 V", "2 V"], "answer": 1, "explanation": "Terminal voltage = EMF - Ir = 6 - (2×1) = 4 V."}, {"type": "mcq", "q": "At a circuit junction, the sum of currents entering equals:", "options": ["Twice the sum of currents leaving", "The sum of currents leaving", "Zero always", "The voltage at that point"], "answer": 1, "explanation": "This is Kirchhoff's current law: total current in equals total current out at any junction."}, {"type": "mcq", "q": "The resistance of a metallic conductor generally ___ as temperature increases.", "options": ["Decreases", "Increases", "Stays constant", "Becomes zero"], "answer": 1, "explanation": "For most metals, increased temperature causes more lattice vibrations, increasing resistance."}, {"type": "mcq", "q": "A short circuit is characterized by:", "options": ["Very high resistance", "Very low (near zero) resistance path", "Infinite resistance", "No current flow"], "answer": 1, "explanation": "A short circuit provides a path of very low resistance, which can cause dangerously high current flow."}, {"type": "mcq", "q": "The internal resistance of a cell causes:", "options": ["An increase in terminal voltage with current", "A drop in terminal voltage as current drawn increases", "No effect on terminal voltage", "The EMF to increase"], "answer": 1, "explanation": "As more current is drawn, more voltage is lost across the internal resistance (Ir), so the terminal voltage available to the external circuit decreases."}, {"type": "mcq", "q": "Which combination of two unequal resistors gives the lowest total resistance?", "options": ["Series", "Parallel", "Both are equal", "Depends on current only"], "answer": 1, "explanation": "Parallel combination always gives a total resistance less than the smallest individual resistor, lower than any series combination."}, {"type": "mcq", "q": "A galvanometer is a sensitive instrument used to detect:", "options": ["Large currents only", "Small currents or the absence of current", "Voltage across large resistors only", "Power dissipation"], "answer": 1, "explanation": "A galvanometer detects small currents and is often used to indicate zero current, e.g., in a balanced Wheatstone bridge."}, {"type": "mcq", "q": "The formula for effective EMF of two identical cells connected in series (aiding) is:", "options": ["EMF of one cell", "Twice the EMF of one cell", "Half the EMF of one cell", "Zero"], "answer": 1, "explanation": "When identical cells are connected in series aiding each other, their EMFs add, giving twice the EMF of a single cell."}, {"type": "tf", "q": "In a series circuit, the current is the same through every component.", "answer": true, "explanation": "Since there is only one path for current in a series circuit, the same current flows through every component."}, {"type": "tf", "q": "In a parallel circuit, the voltage across each branch is the same.", "answer": true, "explanation": "All branches in a simple parallel circuit share the same two connection points, so the voltage across each branch is equal."}, {"type": "tf", "q": "Kirchhoff's laws apply only to simple circuits with a single loop.", "answer": false, "explanation": "Kirchhoff's laws apply generally to any circuit, however complex, with multiple loops and junctions."}, {"type": "tf", "q": "Increasing the internal resistance of a cell increases the terminal voltage for a given current.", "answer": false, "explanation": "A higher internal resistance causes a greater voltage drop (Ir) inside the cell, decreasing the terminal voltage for the same current."}, {"type": "tf", "q": "A Wheatstone bridge can be used to accurately measure an unknown resistance.", "answer": true, "explanation": "By balancing the bridge (zero galvanometer current), the unknown resistance can be calculated from the ratio of the other three known resistances."}, {"type": "fill", "q": "Ohm's law can be written as V = ______.", "answer": "IR", "explanation": "Ohm's law states V = IR, relating voltage, current, and resistance."}, {"type": "fill", "q": "The unit of electric current is the ______.", "answer": "ampere", "explanation": "Electric current is measured in amperes (A)."}, {"type": "fill", "q": "A device used to measure potential difference is called a ______.", "answer": "voltmeter", "explanation": "A voltmeter measures potential difference and is connected in parallel across a component."}, {"type": "fill", "q": "The law stating that current entering a junction equals current leaving is Kirchhoff's ______ law.", "answer": "current", "explanation": "This is Kirchhoff's current law (also called the junction rule)."}, {"type": "fill", "q": "Electrical power can be calculated using P = VI or P = I²______.", "answer": "R", "explanation": "Power dissipated in a resistor can be written as P = I²R, equivalent to P = VI using Ohm's law."}]}, {"unit": 4, "title": "Unit 4: Magnetic Fields and Forces", "questions": [{"type": "mcq", "q": "The SI unit of magnetic flux density is the:", "options": ["Weber", "Tesla", "Henry", "Ampere-turn"], "answer": 1, "explanation": "Magnetic flux density (magnetic field strength) is measured in tesla (T)."}, {"type": "mcq", "q": "The force on a current-carrying conductor in a magnetic field is given by:", "options": ["F = BIL", "F = BI/L", "F = B/IL", "F = BIL²"], "answer": 0, "explanation": "The force on a straight current-carrying conductor in a uniform field is F = BIL sinθ, maximum (F = BIL) when the conductor is perpendicular to the field."}, {"type": "mcq", "q": "The force on a charge q moving with velocity v in a magnetic field B is:", "options": ["F = qvB", "F = qv/B", "F = qB/v", "F = q/vB"], "answer": 0, "explanation": "The magnetic force on a moving charge is F = qvB sinθ, maximum when velocity is perpendicular to the field."}, {"type": "mcq", "q": "The direction of force on a current-carrying conductor in a magnetic field is found using:", "options": ["Lenz's law", "Fleming's left-hand rule", "Fleming's right-hand rule", "Kirchhoff's law"], "answer": 1, "explanation": "Fleming's left-hand rule gives the direction of the force (motor effect) on a current-carrying conductor in a magnetic field."}, {"type": "mcq", "q": "A magnetic field around a long straight current-carrying wire has the shape of:", "options": ["Straight lines parallel to the wire", "Concentric circles around the wire", "Radial lines from the wire", "A uniform field everywhere"], "answer": 1, "explanation": "The magnetic field around a long straight wire consists of concentric circles centred on the wire, as given by the right-hand grip rule."}, {"type": "mcq", "q": "The magnetic field inside a long solenoid is:", "options": ["Zero", "Uniform and along its axis", "Strongest at the ends only", "Circular around the coil"], "answer": 1, "explanation": "Inside a long solenoid, the magnetic field is essentially uniform and directed along the axis of the solenoid."}, {"type": "mcq", "q": "Increasing the current in a solenoid ___ the magnetic field strength inside it.", "options": ["Decreases", "Increases", "Has no effect on", "Reverses"], "answer": 1, "explanation": "Magnetic field strength inside a solenoid is proportional to the current, so increasing current increases the field."}, {"type": "mcq", "q": "The force between two parallel wires carrying current in the same direction is:", "options": ["Repulsive", "Attractive", "Zero", "Perpendicular to both wires"], "answer": 1, "explanation": "Parallel wires carrying current in the same direction attract each other due to their magnetic fields."}, {"type": "mcq", "q": "The force between two parallel wires carrying current in opposite directions is:", "options": ["Attractive", "Repulsive", "Zero", "Random"], "answer": 1, "explanation": "Parallel wires carrying current in opposite directions repel each other."}, {"type": "mcq", "q": "A current loop placed in a uniform magnetic field experiences:", "options": ["A net force only", "A torque that tends to rotate it", "No effect at all", "Only a change in resistance"], "answer": 1, "explanation": "A current loop in a uniform magnetic field experiences a torque that tends to align its magnetic moment with the field, forming the basis of electric motors."}, {"type": "mcq", "q": "The magnetic moment of a current loop is given by:", "options": ["m = IA", "m = I/A", "m = A/I", "m = I²A"], "answer": 0, "explanation": "The magnetic moment of a current loop is m = IA, the product of current and loop area."}, {"type": "mcq", "q": "A wire carrying 5 A is placed perpendicular to a field of 0.2 T. If the wire is 2 m long, the force on it is:", "options": ["0.5 N", "2 N", "1 N", "10 N"], "answer": 1, "explanation": "F = BIL = 0.2 × 5 × 2 = 2 N."}, {"type": "mcq", "q": "Which of these devices relies directly on the motor effect (force on current in a magnetic field)?", "options": ["Transformer", "Electric motor", "Capacitor", "Diode"], "answer": 1, "explanation": "An electric motor uses the force exerted on current-carrying coils in a magnetic field (the motor effect) to produce rotational motion."}, {"type": "mcq", "q": "The magnetic field due to a circular current loop at its centre is:", "options": ["Zero", "Maximum at the centre, perpendicular to the loop plane", "Parallel to the plane of the loop", "The same as a straight wire"], "answer": 1, "explanation": "At the centre of a circular current loop, the magnetic field is maximum and directed perpendicular to the plane of the loop."}, {"type": "mcq", "q": "Increasing the number of turns in a solenoid, keeping current constant, ___ the magnetic field.", "options": ["Decreases", "Increases", "Has no effect on", "Halves"], "answer": 1, "explanation": "Magnetic field strength inside a solenoid is proportional to the number of turns per unit length, so more turns increase the field."}, {"type": "mcq", "q": "A charged particle moving parallel to a magnetic field experiences:", "options": ["Maximum force", "Zero force", "A force perpendicular to the field", "A force along the field"], "answer": 1, "explanation": "The magnetic force is F = qvB sinθ; when velocity is parallel to the field (θ = 0), sinθ = 0, so the force is zero."}, {"type": "mcq", "q": "A charged particle moving perpendicular to a uniform magnetic field follows a:", "options": ["Straight line", "Circular path", "Parabolic path", "Elliptical path"], "answer": 1, "explanation": "A charged particle moving perpendicular to a uniform magnetic field experiences a constant-magnitude force perpendicular to its velocity, causing circular motion."}, {"type": "mcq", "q": "The tesla can be expressed in base SI units as:", "options": ["kg/(A·s²)", "kg/(A·s³)", "kg·A/s²", "kg·s/A²"], "answer": 0, "explanation": "The tesla is equivalent to kg·s⁻²·A⁻¹, often written as kg/(A·s²)."}, {"type": "mcq", "q": "A moving-coil galvanometer works on the principle of:", "options": ["Electromagnetic induction", "The motor effect (torque on a current loop in a magnetic field)", "The photoelectric effect", "Capacitive charging"], "answer": 1, "explanation": "A moving-coil galvanometer uses the torque produced on a current-carrying coil in a magnetic field to deflect a pointer, proportional to the current."}, {"type": "mcq", "q": "Ferromagnetic materials are characterized by:", "options": ["Weak repulsion from magnetic fields", "Strong attraction and ability to be magnetized", "No interaction with magnetic fields", "Only temporary magnetism at high temperature"], "answer": 1, "explanation": "Ferromagnetic materials (like iron) are strongly attracted to magnetic fields and can retain magnetization."}, {"type": "mcq", "q": "The right-hand grip rule is used to find the direction of:", "options": ["Force on a moving charge", "Magnetic field around a current-carrying wire", "Induced EMF", "Electric field of a charge"], "answer": 1, "explanation": "The right-hand grip (or right-hand rule) gives the direction of the magnetic field circling a current-carrying conductor."}, {"type": "mcq", "q": "A magnetic field can be produced by:", "options": ["Static charges only", "Moving charges (currents) or permanent magnets", "Only permanent magnets", "Only alternating currents"], "answer": 1, "explanation": "Magnetic fields are produced by moving charges (electric currents) as well as by permanent magnets due to aligned atomic magnetic moments."}, {"type": "mcq", "q": "If a wire is placed parallel to a magnetic field, the force on it due to the field is:", "options": ["Maximum", "Zero", "Half maximum", "Dependent only on current"], "answer": 1, "explanation": "Since F = BIL sinθ, when the wire is parallel to the field (θ = 0), the force is zero."}, {"type": "mcq", "q": "A solenoid behaves magnetically similar to a:", "options": ["Point charge", "Bar magnet", "Capacitor", "Resistor"], "answer": 1, "explanation": "A current-carrying solenoid produces a magnetic field pattern very similar to that of a bar magnet, with distinct north and south poles."}, {"type": "mcq", "q": "The unit weber is used to measure:", "options": ["Magnetic flux density", "Magnetic flux", "Magnetic force", "Current"], "answer": 1, "explanation": "Magnetic flux is measured in webers (Wb), while flux density (field strength) is measured in tesla."}, {"type": "mcq", "q": "Doubling both the current and magnetic field strength on a current-carrying wire changes the force by a factor of:", "options": ["2", "4", "0.5", "1"], "answer": 1, "explanation": "Since F = BIL, doubling both B and I multiplies the force by 2 × 2 = 4."}, {"type": "mcq", "q": "A cyclotron uses a magnetic field to:", "options": ["Accelerate charged particles in a straight line", "Force charged particles into a circular/spiral path for acceleration", "Store electric charge", "Generate electromagnetic waves"], "answer": 1, "explanation": "A cyclotron uses a magnetic field to bend charged particles into a circular/spiral path while an electric field accelerates them repeatedly."}, {"type": "mcq", "q": "Diamagnetic materials are:", "options": ["Strongly attracted to magnetic fields", "Weakly repelled by magnetic fields", "Permanently magnetized", "Unaffected in any way by fields"], "answer": 1, "explanation": "Diamagnetic materials are weakly repelled by external magnetic fields, unlike ferromagnetic materials which are strongly attracted."}, {"type": "mcq", "q": "The magnetic force does no work on a moving charge because it is always:", "options": ["Parallel to velocity", "Perpendicular to velocity", "Opposite to velocity", "Equal to zero"], "answer": 1, "explanation": "The magnetic force F = qv×B is always perpendicular to the velocity, so it changes direction but never speeds up or slows down the charge, doing no work."}, {"type": "mcq", "q": "A compass needle placed near a current-carrying wire will:", "options": ["Remain unaffected", "Align with the magnetic field produced by the wire", "Point directly at the wire", "Spin continuously"], "answer": 1, "explanation": "A compass needle aligns itself with the local magnetic field, so near a current-carrying wire it deflects to align with the field the current produces (as shown in Oersted's experiment)."}, {"type": "tf", "q": "The magnetic field inside a long solenoid is zero.", "answer": false, "explanation": "Inside a long solenoid, the field is strong and essentially uniform, not zero; the field outside is comparatively weak."}, {"type": "tf", "q": "Like magnetic poles repel each other, and unlike poles attract.", "answer": true, "explanation": "Just as with electric charges, like magnetic poles repel and unlike poles attract each other."}, {"type": "tf", "q": "The magnetic force on a charge is always parallel to its velocity.", "answer": false, "explanation": "The magnetic force on a moving charge is always perpendicular to its velocity, given by F = qv × B."}, {"type": "tf", "q": "Fleming's left-hand rule is used for finding the force direction (motor effect), while the right-hand rule relates to induced EMF (generator effect).", "answer": true, "explanation": "Convention: left-hand rule for the motor effect (force on current), right-hand rule for the generator effect (induced EMF)."}, {"type": "tf", "q": "Two parallel wires carrying current in the same direction repel each other.", "answer": false, "explanation": "Wires carrying current in the same direction attract each other; opposite directions cause repulsion."}, {"type": "fill", "q": "The SI unit of magnetic flux density is the ______.", "answer": "tesla", "explanation": "Magnetic flux density (field strength) is measured in tesla (T)."}, {"type": "fill", "q": "The rule used to find the direction of force on a current-carrying conductor is Fleming's ______-hand rule.", "answer": "left", "explanation": "Fleming's left-hand rule gives the direction of force on a current-carrying conductor in a magnetic field."}, {"type": "fill", "q": "A coil of wire wound in a tight helix, used to produce a strong uniform magnetic field, is called a ______.", "answer": "solenoid", "explanation": "A solenoid is a coil of wire that produces a strong, uniform magnetic field inside it when current flows."}, {"type": "fill", "q": "The magnetic moment of a current loop is given by m = I × ______.", "answer": "A", "explanation": "Magnetic moment m = IA, current multiplied by the loop's area."}, {"type": "fill", "q": "A charged particle moving perpendicular to a uniform magnetic field follows a ______ path.", "answer": "circular", "explanation": "The constant perpendicular magnetic force causes the particle to move in a circle."}]}, {"unit": 5, "title": "Unit 5: Electromagnetic Induction", "questions": [{"type": "mcq", "q": "Faraday's law of electromagnetic induction relates induced EMF to:", "options": ["The magnitude of the magnetic field only", "The rate of change of magnetic flux", "The resistance of the coil", "The current flowing through the coil"], "answer": 1, "explanation": "Faraday's law states that the induced EMF equals the negative rate of change of magnetic flux linkage: EMF = -dΦ/dt."}, {"type": "mcq", "q": "Lenz's law states that the direction of induced current is such that it:", "options": ["Aids the change producing it", "Opposes the change producing it", "Has no defined direction", "Is always clockwise"], "answer": 1, "explanation": "Lenz's law: the induced current flows in a direction that opposes the change in flux that caused it, consistent with conservation of energy."}, {"type": "mcq", "q": "Motional EMF is induced when:", "options": ["A stationary conductor is placed in a static field", "A conductor moves through a magnetic field, cutting field lines", "Current flows through a resistor", "A capacitor is charged"], "answer": 1, "explanation": "A conductor moving through a magnetic field, cutting through field lines, induces a motional EMF given by EMF = BLv (for motion perpendicular to B and the conductor)."}, {"type": "mcq", "q": "The formula for motional EMF of a rod of length L moving with velocity v perpendicular to field B is:", "options": ["EMF = BLv", "EMF = BL/v", "EMF = B/Lv", "EMF = BvL²"], "answer": 0, "explanation": "Motional EMF for a straight conductor moving perpendicular to both its length and a uniform field is EMF = BLv."}, {"type": "mcq", "q": "Self-inductance of a coil is defined by the relation:", "options": ["EMF = -L(dI/dt)", "EMF = L·I", "EMF = -LI²", "EMF = I/L"], "answer": 0, "explanation": "Self-induced EMF is given by EMF = -L(dI/dt), where L is the self-inductance of the coil."}, {"type": "mcq", "q": "The SI unit of inductance is the:", "options": ["Farad", "Ohm", "Henry", "Tesla"], "answer": 2, "explanation": "Inductance is measured in henries (H)."}, {"type": "mcq", "q": "Mutual inductance describes:", "options": ["Induction within a single coil due to its own changing current", "Induction in one coil due to changing current in a nearby coil", "The resistance between two coils", "The capacitance between two coils"], "answer": 1, "explanation": "Mutual inductance is the EMF induced in one coil due to a changing current in a neighbouring coil, the basis of transformer operation."}, {"type": "mcq", "q": "A transformer works on the principle of:", "options": ["Self-inductance only", "Mutual induction between coils sharing a magnetic core", "The motor effect", "Electrostatic induction"], "answer": 1, "explanation": "A transformer transfers energy between coils via mutual induction, using a shared magnetic core to link the changing flux."}, {"type": "mcq", "q": "For an ideal transformer, the turns ratio relates voltages as:", "options": ["V1/V2 = N2/N1", "V1/V2 = N1/N2", "V1V2 = N1N2", "V1+V2 = N1+N2"], "answer": 1, "explanation": "For an ideal transformer, V1/V2 = N1/N2, where V1, V2 are primary/secondary voltages and N1, N2 are the corresponding turns."}, {"type": "mcq", "q": "A step-up transformer:", "options": ["Increases voltage and decreases current", "Decreases voltage and increases current", "Keeps both voltage and current the same", "Only works with DC"], "answer": 0, "explanation": "A step-up transformer has more secondary turns than primary, increasing voltage while decreasing current (conserving power, ideally)."}, {"type": "mcq", "q": "Eddy currents are induced circulating currents that:", "options": ["Always increase efficiency of machines", "Are induced in bulk conductors due to changing magnetic flux, causing energy loss", "Only occur in insulators", "Are unrelated to electromagnetic induction"], "answer": 1, "explanation": "Eddy currents are loops of induced current in bulk conducting material due to changing flux, generally causing unwanted heating and energy loss."}, {"type": "mcq", "q": "Laminating the iron core of a transformer helps to:", "options": ["Increase eddy current losses", "Reduce eddy current losses", "Increase resistance of the winding", "Change the turns ratio"], "answer": 1, "explanation": "Laminating the core into thin insulated sheets increases resistance to eddy current loops, reducing associated energy losses."}, {"type": "mcq", "q": "An AC generator converts:", "options": ["Electrical energy to mechanical energy", "Mechanical energy to electrical energy", "Chemical energy to electrical energy directly", "Heat energy to light energy"], "answer": 1, "explanation": "A generator (alternator/dynamo) converts mechanical energy (rotation) into electrical energy via electromagnetic induction."}, {"type": "mcq", "q": "The induced EMF in a rotating coil generator is maximum when the coil plane is:", "options": ["Parallel to the magnetic field", "Perpendicular to the magnetic field", "At 45° to the magnetic field", "Stationary"], "answer": 0, "explanation": "EMF is maximum when the rate of change of flux is greatest, which occurs when the coil plane is parallel to the field (flux through the coil is momentarily zero but changing fastest)."}, {"type": "mcq", "q": "Increasing the speed of rotation of a generator coil ___ the induced EMF.", "options": ["Decreases", "Increases", "Has no effect on", "Halves"], "answer": 1, "explanation": "Since EMF depends on the rate of change of flux, increasing rotational speed increases the induced EMF."}, {"type": "mcq", "q": "A coil of N turns experiences a changing flux of dΦ/dt. The induced EMF is:", "options": ["EMF = dΦ/dt", "EMF = N(dΦ/dt)", "EMF = dΦ/(Ndt)", "EMF = N/(dΦ/dt)"], "answer": 1, "explanation": "For a coil of N turns, the total induced EMF is N times the rate of change of flux through a single turn: EMF = N(dΦ/dt)."}, {"type": "mcq", "q": "Lenz's law is a consequence of the conservation of:", "options": ["Charge", "Energy", "Mass", "Momentum only"], "answer": 1, "explanation": "Lenz's law ensures that induced currents oppose the change causing them, consistent with the conservation of energy (otherwise energy could be created from nothing)."}, {"type": "mcq", "q": "A magnet moving towards a coil induces a current that creates a magnetic field which:", "options": ["Attracts the magnet further in", "Opposes the magnet's motion (repels it)", "Has no interaction with the magnet", "Instantly stops all motion"], "answer": 1, "explanation": "By Lenz's law, the induced current opposes the change (the approaching magnet), creating a field that repels the magnet, resisting its motion."}, {"type": "mcq", "q": "Transformers only work with:", "options": ["Direct current (DC)", "Alternating current (AC)", "Both AC and DC equally well", "Neither AC nor DC"], "answer": 1, "explanation": "Transformers require a changing magnetic flux, so they only function with alternating current, not steady DC."}, {"type": "mcq", "q": "The efficiency of a real transformer is reduced mainly due to:", "options": ["Perfect coupling of magnetic flux", "Resistive losses in windings and eddy current/hysteresis losses in the core", "Excessive turns ratio", "Using AC instead of DC"], "answer": 1, "explanation": "Real transformers lose some energy to resistance in the windings (copper losses) and eddy currents/hysteresis in the core (iron losses)."}, {"type": "mcq", "q": "A rod of length 0.5 m moves at 4 m/s perpendicular to a 0.2 T field. The induced EMF is:", "options": ["0.4 V", "0.04 V", "4 V", "0.8 V"], "answer": 0, "explanation": "EMF = BLv = 0.2 × 0.5 × 4 = 0.4 V."}, {"type": "mcq", "q": "If the number of turns in the secondary coil of a transformer is greater than the primary, the transformer:", "options": ["Steps up voltage", "Steps down voltage", "Keeps voltage the same", "Cannot function"], "answer": 0, "explanation": "More secondary turns than primary turns results in a higher output voltage than input — a step-up transformer."}, {"type": "mcq", "q": "The induced current opposing an increasing flux through a coil will flow in a direction to:", "options": ["Increase the flux further", "Create a magnetic field opposing the increase", "Have zero magnetic effect", "Reverse the applied field's source"], "answer": 1, "explanation": "According to Lenz's law, the induced current creates a magnetic field that opposes the increasing flux, i.e. acts to reduce the rate of increase."}, {"type": "mcq", "q": "A generator's EMF output can be increased by:", "options": ["Reducing the number of coil turns", "Increasing the speed of rotation or the number of turns", "Using a weaker magnet", "Disconnecting the coil"], "answer": 1, "explanation": "EMF can be increased by rotating the coil faster, using more turns, or using a stronger magnetic field — all increase the rate of flux change."}, {"type": "mcq", "q": "A step-down transformer is commonly used in household appliance adaptors to:", "options": ["Increase the mains voltage for the device", "Reduce the mains voltage to a safer, lower level for the device", "Convert AC directly into chemical energy", "Store electrical energy"], "answer": 1, "explanation": "Step-down transformers reduce high mains voltage to the lower voltage required by many household electronic devices."}, {"type": "mcq", "q": "Mutual inductance between two coils depends on:", "options": ["Only the current in the primary coil", "The geometry, turns, and relative position/coupling of the two coils", "The colour of the wire", "The voltage source frequency only"], "answer": 1, "explanation": "Mutual inductance depends on the physical arrangement, number of turns, and how well the magnetic flux links the two coils."}, {"type": "mcq", "q": "A changing electric field can also induce a magnetic field, according to:", "options": ["Faraday's law alone", "Maxwell's extension of Ampere's law", "Ohm's law", "Coulomb's law"], "answer": 1, "explanation": "Maxwell showed that a changing electric field also produces a magnetic field, extending Ampere's law and unifying electromagnetism."}, {"type": "mcq", "q": "Induction cookers work by using:", "options": ["Direct resistive heating from mains current", "Eddy currents induced in the cooking pan by a changing magnetic field", "Static electric charge", "Chemical combustion"], "answer": 1, "explanation": "Induction cookers use a coil producing a changing magnetic field, which induces eddy currents in a ferromagnetic pan, heating it directly."}, {"type": "mcq", "q": "The unit of magnetic flux, the weber, is equivalent to:", "options": ["Volt-second", "Ampere-second", "Ohm-second", "Watt-second"], "answer": 0, "explanation": "One weber equals one volt-second (Wb = V·s), consistent with EMF = -dΦ/dt."}, {"type": "mcq", "q": "A bicycle dynamo generates electricity by:", "options": ["Chemical reaction", "Electromagnetic induction from a rotating magnet near a coil", "Static friction alone", "Solar energy conversion"], "answer": 1, "explanation": "A bicycle dynamo uses the wheel's rotation to spin a magnet near a coil, inducing an EMF via electromagnetic induction."}, {"type": "tf", "q": "Lenz's law is essentially a statement of the conservation of energy.", "answer": true, "explanation": "Since induced effects always oppose the change that causes them, energy must be supplied to maintain that change, consistent with conservation of energy."}, {"type": "tf", "q": "A stationary coil in a stationary magnetic field will have an induced EMF.", "answer": false, "explanation": "Since there is no change in flux (nothing moving, nothing changing), no EMF is induced in a stationary coil in a static field."}, {"type": "tf", "q": "Transformers can step up or step down both AC and DC voltages equally well.", "answer": false, "explanation": "Transformers rely on changing flux and work only with AC; they do not function to transform steady DC voltages."}, {"type": "tf", "q": "Eddy currents are generally undesirable in transformer cores because they cause energy loss as heat.", "answer": true, "explanation": "Eddy currents circulating in the core dissipate energy as heat, reducing transformer efficiency, so they are minimized using laminated cores."}, {"type": "tf", "q": "The induced EMF in a coil depends only on the number of turns, not on the rate of change of flux.", "answer": false, "explanation": "Induced EMF depends on both the number of turns and the rate of change of flux: EMF = N(dΦ/dt)."}, {"type": "fill", "q": "The law stating that induced EMF equals the rate of change of flux is ______'s law.", "answer": "Faraday", "explanation": "Faraday's law of electromagnetic induction: EMF = -N(dΦ/dt)."}, {"type": "fill", "q": "The law that gives the direction of induced current, opposing the change producing it, is ______'s law.", "answer": "Lenz", "explanation": "Lenz's law gives the direction of induced current, always opposing the change in flux."}, {"type": "fill", "q": "The property of a coil that opposes changes in its own current is called ______-inductance.", "answer": "self", "explanation": "Self-inductance is the property by which a changing current in a coil induces an opposing EMF in itself."}, {"type": "fill", "q": "A device that transfers electrical energy between two coils via a shared changing magnetic flux is called a ______.", "answer": "transformer", "explanation": "A transformer uses mutual induction between primary and secondary coils to transfer and transform AC voltage/current."}, {"type": "fill", "q": "Unwanted circulating currents induced in bulk conductors due to changing flux are called ______ currents.", "answer": "eddy", "explanation": "Eddy currents are induced loops of current in conducting material, often causing unwanted heating."}]}, {"unit": 6, "title": "Unit 6: Alternating Current", "questions": [{"type": "mcq", "q": "An alternating current is one that:", "options": ["Flows in one direction only", "Periodically reverses direction and varies in magnitude", "Remains constant in magnitude and direction", "Only flows through capacitors"], "answer": 1, "explanation": "Alternating current periodically changes direction and magnitude, typically following a sinusoidal pattern."}, {"type": "mcq", "q": "The root-mean-square (rms) value of an AC voltage relates to peak voltage V0 by:", "options": ["Vrms = V0", "Vrms = V0/√2", "Vrms = V0√2", "Vrms = 2V0"], "answer": 1, "explanation": "For a sinusoidal AC signal, Vrms = V0/√2 ≈ 0.707 V0."}, {"type": "mcq", "q": "The rms value of AC is significant because it represents:", "options": ["The maximum instantaneous value", "The average value over a full cycle (which is zero for sine waves)", "A DC value that would produce the same average power/heating effect", "The frequency of the AC signal"], "answer": 2, "explanation": "The rms value represents the equivalent DC value that would produce the same average power dissipation in a resistor."}, {"type": "mcq", "q": "The frequency of standard mains AC supply is commonly:", "options": ["1 Hz", "50 or 60 Hz", "500 Hz", "5000 Hz"], "answer": 1, "explanation": "Mains AC frequency is typically 50 Hz (many countries including Rwanda) or 60 Hz (e.g., USA)."}, {"type": "mcq", "q": "In a purely resistive AC circuit, current and voltage are:", "options": ["90° out of phase", "In phase with each other", "180° out of phase", "Undefined"], "answer": 1, "explanation": "In a purely resistive circuit, current and voltage reach their maximum and zero values simultaneously — they are in phase."}, {"type": "mcq", "q": "In a purely capacitive AC circuit, the current:", "options": ["Lags the voltage by 90°", "Leads the voltage by 90°", "Is in phase with voltage", "Is always zero"], "answer": 1, "explanation": "In a purely capacitive circuit, current leads voltage by 90° (a common memory aid is 'ICE': in a Capacitor, I leads E)."}, {"type": "mcq", "q": "In a purely inductive AC circuit, the current:", "options": ["Leads the voltage by 90°", "Lags the voltage by 90°", "Is in phase with voltage", "Is always maximum"], "answer": 1, "explanation": "In a purely inductive circuit, current lags voltage by 90° ('ELI': in an inductor L, E leads I)."}, {"type": "mcq", "q": "Capacitive reactance is given by:", "options": ["Xc = 1/(2πfC)", "Xc = 2πfC", "Xc = 2πf/C", "Xc = C/(2πf)"], "answer": 0, "explanation": "Capacitive reactance Xc = 1/(2πfC), which decreases as frequency increases."}, {"type": "mcq", "q": "Inductive reactance is given by:", "options": ["XL = 1/(2πfL)", "XL = 2πfL", "XL = 2πf/L", "XL = L/(2πf)"], "answer": 1, "explanation": "Inductive reactance XL = 2πfL, which increases as frequency increases."}, {"type": "mcq", "q": "As frequency increases, capacitive reactance:", "options": ["Increases", "Decreases", "Remains constant", "Becomes infinite"], "answer": 1, "explanation": "Since Xc = 1/(2πfC), reactance decreases as frequency increases — capacitors pass higher frequencies more easily."}, {"type": "mcq", "q": "As frequency increases, inductive reactance:", "options": ["Decreases", "Increases", "Remains constant", "Becomes zero"], "answer": 1, "explanation": "Since XL = 2πfL, reactance increases with frequency — inductors oppose higher frequencies more strongly."}, {"type": "mcq", "q": "Impedance in an AC circuit is the:", "options": ["Same as resistance for all circuits", "Total opposition to current flow, combining resistance and reactance", "Only relevant in DC circuits", "Purely due to capacitors"], "answer": 1, "explanation": "Impedance Z is the total opposition to AC current flow, combining both resistance and reactance (Z = √(R² + X²) for series RLC)."}, {"type": "mcq", "q": "Resonance in a series LCR circuit occurs when:", "options": ["XL = 0 and Xc = 0", "XL = Xc", "R = 0", "Frequency is zero"], "answer": 1, "explanation": "Resonance occurs when inductive and capacitive reactances are equal (XL = Xc), making impedance purely resistive and minimum."}, {"type": "mcq", "q": "At resonance in a series LCR circuit, the impedance is:", "options": ["Maximum", "Minimum (equal to resistance R)", "Zero", "Infinite"], "answer": 1, "explanation":
