<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIZIYAREMYE Donat — Physics Self-Study</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #2f6fed;
    --border: #e5e5e2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14151a;
      --card: #1d1e24;
      --text: #f0f0f0;
      --muted: #9a9aa0;
      --accent: #6d9bff;
      --border: #2c2d34;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14151a;
    --card: #1d1e24;
    --text: #f0f0f0;
    --muted: #9a9aa0;
    --accent: #6d9bff;
    --border: #2c2d34;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .wrap { max-width: 560px; width: 100%; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 32px; }
  .card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 14px;
    text-decoration: none;
    color: var(--text);
    transition: border-color .15s ease;
  }
  .card:hover { border-color: var(--accent); }
  .card h2 { margin: 0 0 4px; font-size: 1.1rem; }
  .card span { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Physics Self-Study Quizzes</h1>
    <p class="sub">By BIZIYAREMYE Donat — click a level to start practicing.</p>

    <a class="card" href="s3.html">
      <h2>Senior 3 Physics</h2>
      <span>10 units · 400 questions</span>
    </a>
    <a class="card" href="s4.html">
      <h2>Senior 4 Physics</h2>
      <span>10 units · 400 questions</span>
    </a>
    <a class="card" href="s5.html">
      <h2>Senior 5 Physics</h2>
      <span>11 units · 440 questions</span>
    </a>
  </div>
</body>
</html>
