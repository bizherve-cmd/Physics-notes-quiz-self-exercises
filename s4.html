<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>S4 Physics Quiz</title>
<style>
  :root{
    --bg:#f4f6f9;
    --surface:#ffffff;
    --surface-2:#eceff4;
    --text:#161b26;
    --text-dim:#5b6475;
    --border:#dde2ea;
    --accent:#0f7a73;
    --accent-ink:#ffffff;
    --accent-soft:#e3f3f1;
    --correct:#1c8a4b;
    --correct-soft:#e5f6ec;
    --incorrect:#c23b3b;
    --incorrect-soft:#fbe9e9;
    --shadow: 0 1px 2px rgba(20,24,34,.06), 0 8px 24px -12px rgba(20,24,34,.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e131b;
      --surface:#161d29;
      --surface-2:#1d2532;
      --text:#e9edf4;
      --text-dim:#95a0b3;
      --border:#2a3342;
      --accent:#3fd7c8;
      --accent-ink:#08211d;
      --accent-soft:#12312d;
      --correct:#4fce8a;
      --correct-soft:#123526;
      --incorrect:#ff8383;
      --incorrect-soft:#3a1c1e;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e131b;
    --surface:#161d29;
    --surface-2:#1d2532;
    --text:#e9edf4;
    --text-dim:#95a0b3;
    --border:#2a3342;
    --accent:#3fd7c8;
    --accent-ink:#08211d;
    --accent-soft:#12312d;
    --correct:#4fce8a;
    --correct-soft:#123526;
    --incorrect:#ff8383;
    --incorrect-soft:#3a1c1e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-inline:16px;
    padding-block:24px;
  }
  h1,h2,h3{font-family:"Sora", ui-sans-serif, system-ui, sans-serif; text-wrap:balance; margin:0;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}

  .wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:20px;}

  .app-header{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .app-header .eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:4px;}
  .app-header h1{font-size:22px; font-weight:700;}
  .byline{font-size:13px; color:var(--text-dim); margin-top:6px;}

  .score-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:6px 12px; font-size:13px; color:var(--text-dim); box-shadow:var(--shadow);
    white-space:nowrap;
  }
  .score-pill strong{color:var(--text); font-family:"IBM Plex Mono", monospace;}

  /* ---- unit list ---- */
  .unit-grid{display:flex; flex-direction:column; gap:10px;}
  .unit-card{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; box-shadow:var(--shadow); cursor:pointer; text-align:left;
    font:inherit; color:inherit; width:100%;
  }
  .unit-card:hover{border-color:var(--accent);}
  .unit-card .num{
    font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--accent);
    background:var(--accent-soft); border-radius:8px; padding:4px 8px; flex:none;
  }
  .unit-card .info{flex:1; min-width:0;}
  .unit-card .info .t{font-weight:600; font-size:15px;}
  .unit-card .info .s{font-size:12.5px; color:var(--text-dim); margin-top:2px;}
  .unit-card .badge{
    font-size:12px; font-family:"IBM Plex Mono",monospace; flex:none;
    padding:4px 9px; border-radius:999px; border:1px solid var(--border); color:var(--text-dim);
  }
  .unit-card .badge.done{color:var(--correct); border-color:var(--correct); background:var(--correct-soft);}

  /* ---- quiz view ---- */
  .quiz-header{display:flex; align-items:center; gap:10px;}
  .back-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:10px; padding:8px 10px; cursor:pointer; font-size:14px; line-height:1;
    flex:none;
  }
  .quiz-header .title{flex:1; min-width:0;}
  .quiz-header .title .t{font-weight:700; font-size:15px;}
  .quiz-header .title .s{font-size:12.5px; color:var(--text-dim);}

  .progress-track{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); border-radius:999px; transition:width .25s ease;}

  .qcard{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:16px;
  }
  .qmeta{font-size:12.5px; color:var(--text-dim); font-family:"IBM Plex Mono",monospace;}
  .qtext{font-size:17px; font-weight:600; line-height:1.45;}

  .options{display:flex; flex-direction:column; gap:9px;}
  .opt{
    display:flex; align-items:flex-start; gap:10px; text-align:left;
    background:var(--surface-2); border:1.5px solid var(--border); border-radius:12px;
    padding:11px 13px; cursor:pointer; font:inherit; color:inherit; font-size:14.5px; line-height:1.4;
    transition:border-color .12s ease, background .12s ease;
  }
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:disabled{cursor:default;}
  .opt .k{
    font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:13px; flex:none;
    width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
  }
  .opt.correct{background:var(--correct-soft); border-color:var(--correct);}
  .opt.correct .k{background:var(--correct); color:#fff; border-color:var(--correct);}
  .opt.incorrect{background:var(--incorrect-soft); border-color:var(--incorrect);}
  .opt.incorrect .k{background:var(--incorrect); color:#fff; border-color:var(--incorrect);}

  .fill-row{display:flex; gap:8px; flex-wrap:wrap;}
  .fill-row input{
    flex:1; min-width:160px; font:inherit; font-size:14.5px; padding:11px 13px;
    border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text);
  }
  .fill-row input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .btn{
    font:inherit; font-weight:600; font-size:14px; border-radius:12px; border:1px solid transparent;
    padding:11px 16px; cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:disabled{opacity:.5; cursor:default;}
  .btn-ghost{background:var(--surface); border-color:var(--border); color:var(--text);}

  .feedback{
    border-radius:12px; padding:13px 14px; font-size:14px; line-height:1.5; display:none;
    border:1px solid var(--border);
  }
  .feedback.show{display:block;}
  .feedback.correct{background:var(--correct-soft); border-color:var(--correct); color:var(--text);}
  .feedback.incorrect{background:var(--incorrect-soft); border-color:var(--incorrect); color:var(--text);}
  .feedback .verdict{font-weight:700; margin-bottom:4px;}
  .feedback .verdict.v-correct{color:var(--correct);}
  .feedback .verdict.v-incorrect{color:var(--incorrect);}

  .actions{display:flex; justify-content:flex-end; gap:8px;}

  .summary{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:26px 20px; text-align:center; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .summary .big{font-family:"IBM Plex Mono",monospace; font-size:40px; font-weight:700;}
  .summary .sub{color:var(--text-dim); font-size:14px;}
  .summary .actions2{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; justify-content:center;}

  [hidden]{display:none !important;}
  footer{text-align:center; font-size:12px; color:var(--text-dim); padding-top:8px;}
</style>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<div class="wrap">

  <div class="app-header">
    <div>
      <div class="eyebrow">Senior 4 Physics &middot; Self-Study Practice</div>
      <h1 id="pageTitle">Senior 4 Physics Quiz</h1>
      <div class="byline">Compiled by BIZIYAREMYE Donat, GS BYUMBA INYANGE &middot; 10 units &middot; 400 questions</div>
    </div>
    <div class="score-pill" id="overallScore">
      <span>Overall</span><strong id="overallScoreVal">0/0</strong>
    </div>
  </div>

  <div id="homeView">
    <div class="unit-grid" id="unitGrid"></div>
  </div>

  <div id="quizView" hidden>
    <div class="quiz-header">
      <button class="back-btn" id="backBtn" aria-label="Back to units">&larr;</button>
      <div class="title">
        <div class="t" id="quizUnitTitle">Unit</div>
        <div class="s" id="quizProgressLabel">Question 1 of 40</div>
      </div>
      <div class="score-pill"><span>Score</span><strong id="unitScoreVal">0/0</strong></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

    <div class="qcard">
      <div class="qmeta" id="qmeta">MCQ</div>
      <div class="qtext" id="qtext"></div>
      <div class="options" id="optionsWrap"></div>
      <div class="fill-row" id="fillWrap" hidden>
        <input id="fillInput" type="text" placeholder="Type your answer&hellip;" autocomplete="off">
        <button class="btn btn-primary" id="fillSubmit">Check</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="btn btn-ghost" id="skipBtn">Skip</button>
        <button class="btn btn-primary" id="nextBtn" disabled>Next</button>
      </div>
    </div>
  </div>

  <div id="summaryView" hidden>
    <div class="summary">
      <div class="eyebrow">Unit complete</div>
      <h2 id="summaryUnitTitle">Unit</h2>
      <div class="big" id="summaryScore">0/40</div>
      <div class="sub" id="summarySub">Nice work.</div>
      <div class="actions2">
        <button class="btn btn-ghost" id="retryBtn">Retry unit</button>
        <button class="btn btn-primary" id="toUnitsBtn">Choose another unit</button>
      </div>
    </div>
  </div>

  <footer>Self-study practice book &middot; tap an answer for instant feedback</footer>
</div>

<script>
(function(){
  "use strict";
  var LEVEL_KEY = "s4";
  var STORAGE_KEY = "physics-quiz-progress-" + LEVEL_KEY;
  var DATA = [{"unit": 1, "title": "Unit 1: Reflection and Refraction of Light", "questions": [{"q": "According to the first law of reflection, the angle of incidence is equal to the:", "explanation": "The law of reflection states that the angle of incidence equals the angle of reflection, both measured from the normal at the point of incidence.", "type": "mcq", "options": ["critical angle", "angle of deviation", "angle of reflection", "angle of refraction"], "answer": 2}, {"q": "A concave mirror has a focal length of 15 cm. An object is placed 20 cm in front of it. Using 1/f = 1/u + 1/v, calculate the image distance.", "explanation": "1/v = 1/f − 1/u = 1/15 − 1/20 = 1/60, so v = 60 cm. The image is real and formed 60 cm from the mirror.", "type": "mcq", "options": ["50 cm", "30 cm", "60 cm", "40 cm"], "answer": 2}, {"q": "For the mirror in the previous scenario (u = 20 cm, v = 60 cm), what is the linear magnification produced?", "explanation": "Magnification m = v/u = 60/20 = 3. The image is three times the size of the object (real and inverted).", "type": "mcq", "options": ["2.0", "1.0", "3.0", "0.5"], "answer": 2, "link": 1}, {"q": "A convex mirror of focal length 20 cm is placed 30 cm from an object. Taking the convex mirror's focal length as negative in the real-is-positive convention, find the image distance.", "explanation": "1/v = 1/f − 1/u = −1/20 − 1/30 = −5/60 = −1/12, so v = −12 cm. The negative sign shows the image is virtual, formed behind the mirror.", "type": "mcq", "options": ["v = 15 cm (real)", "v = 12 cm (real)", "v = −60 cm (virtual)", "v = −12 cm (virtual)"], "answer": 3}, {"q": "In the New Cartesian sign convention, a negative magnification for a mirror indicates that the image is:", "explanation": "With m = −v/u, a negative value of m corresponds to a real, inverted image; a positive m corresponds to a virtual, erect image.", "type": "mcq", "options": ["real and inverted", "virtual and erect", "always at infinity", "virtual and diminished only"], "answer": 0}, {"q": "When an object is placed between the pole and the principal focus of a concave mirror, the image formed is:", "explanation": "This is the principle used in a shaving/make-up mirror: the image is virtual, erect, and magnified when the object lies between F and the pole.", "type": "mcq", "options": ["real, erect, same size", "real, inverted, diminished", "virtual, inverted, diminished", "virtual, erect, magnified"], "answer": 3}, {"q": "A spherical mirror has a radius of curvature of 40 cm. What is its focal length?", "explanation": "f = R/2 = 40/2 = 20 cm, since the principal focus lies midway between the pole and the centre of curvature.", "type": "mcq", "options": ["10 cm", "40 cm", "80 cm", "20 cm"], "answer": 3}, {"q": "The focal length of a spherical mirror is the distance between the pole of the mirror and its:", "explanation": "The focal length f is measured from the pole to the principal focus, the point where paraxial rays parallel to the principal axis converge (or appear to diverge from).", "type": "mcq", "options": ["aperture edge", "centre of curvature", "pole of the object", "principal focus"], "answer": 3}, {"q": "In the New Cartesian sign convention, distances measured against the direction of the incident light are taken as negative.", "explanation": "By convention, distances in the direction of incident light (left to right) are positive, and those measured against it are negative.", "type": "tf", "answer": true}, {"q": "For a concave mirror, when the object is placed at the centre of curvature, the image formed is real, inverted, and ______ in size compared to the object.", "explanation": "At C, u = v = R, giving magnification m = v/u = 1, so the image is the same size as the object.", "type": "fill", "answer": "the same (equal)"}, {"q": "The second law of refraction (Snell's law) states that the ratio sin i / sin r is:", "explanation": "Snell's law: n = sin i / sin r, where n is a constant (the refractive index) for a given pair of media and a given wavelength of light.", "type": "mcq", "options": ["constant for a given pair of media and colour of light", "equal to the angle of the prism", "equal to the critical angle", "always equal to 1"], "answer": 0}, {"q": "A ray of light strikes a glass block (n = 1.5) at an angle of incidence of 60°. What is the angle of refraction?", "explanation": "sin r = sin 60°/1.5 = 0.866/1.5 = 0.577, so r = sin⁻¹(0.577) ≈ 35.3°.", "type": "mcq", "options": ["35.3°", "50.0°", "41.8°", "60.0°"], "answer": 0}, {"q": "When light travels from air into a glass block, it bends towards the normal because, in glass, light:", "explanation": "Glass is optically denser than air, so light slows down on entering it, causing the ray to bend towards the normal.", "type": "mcq", "options": ["loses energy as heat only", "changes colour", "travels faster than in air", "travels slower than in air"], "answer": 3}, {"q": "When light emerges from a parallel-sided (rectangular) glass block, the emergent ray is ______ to the incident ray, though laterally displaced.", "explanation": "The two refractions at the parallel surfaces cancel each other's angular deviation, leaving the emergent ray parallel to the incident ray, only shifted sideways.", "type": "fill", "answer": "parallel"}, {"q": "When light passes through a rectangular glass block, the emergent ray is parallel to the incident ray but laterally displaced.", "explanation": "This is a standard result of refraction through a slab with parallel faces: the net angular deviation is zero, but a lateral (sideways) shift occurs.", "type": "tf", "answer": true}, {"q": "The refractive index of glass is 1.5 and the speed of light in vacuum is 3 × 10⁸ m/s. What is the speed of light in the glass?", "explanation": "n = c/v, so v = c/n = (3 × 10⁸)/1.5 = 2.0 × 10⁸ m/s.", "type": "mcq", "options": ["4.5 × 10⁸ m/s", "1.5 × 10⁸ m/s", "3.0 × 10⁸ m/s", "2.0 × 10⁸ m/s"], "answer": 3}, {"q": "The bending of light as it passes obliquely from one transparent medium into another of different optical density is called ______.", "explanation": "Refraction is the change in direction of a light ray as it crosses a boundary between media of different refractive indices.", "type": "fill", "answer": "refraction"}, {"q": "Which of the following does NOT affect the refractive index of a given pair of media?", "explanation": "By Snell's law, n = sin i/sin r is constant for a given pair of media and wavelength regardless of the angle of incidence chosen; changing i simply changes r proportionally, keeping n fixed.", "type": "mcq", "options": ["the wavelength (colour) of light", "the angle of incidence used", "the nature of the two media", "the temperature of the medium (to a small extent)"], "answer": 1}, {"q": "A swimming pool has a real depth of 3.0 m. If the refractive index of water is 1.33, what is its apparent depth when viewed from directly above?", "explanation": "Apparent depth = real depth/n = 3.0/1.33 ≈ 2.3 m.", "type": "mcq", "options": ["3.0 m", "1.5 m", "2.3 m", "4.0 m"], "answer": 2}, {"q": "A coin lies at the bottom of a glass slab of real thickness 6 cm (n = 1.5). By how much does the coin appear to be raised when viewed from directly above?", "explanation": "Apparent depth = 6/1.5 = 4 cm, so the apparent shift = 6 − 4 = 2 cm.", "type": "mcq", "options": ["3 cm", "4 cm", "2 cm", "1 cm"], "answer": 2}, {"q": "A swimming pool always looks shallower than it really is when viewed from directly above because:", "explanation": "Rays from the bottom refract away from the normal as they leave water into air, so they appear to diverge from a point closer to the surface than the true bottom, making the apparent depth less than the real depth.", "type": "mcq", "options": ["light slows down entering water, bending rays away from the normal on leaving into air, so real depth appears less", "the eye lens automatically shortens the perceived distance", "light speeds up entering water, bending rays away from the normal at the surface", "water absorbs light and reduces visible depth"], "answer": 0}, {"q": "Apparent depth is always greater than real depth when viewing an object in water from air.", "explanation": "The opposite is true: because water is optically denser than air, apparent depth is always less than real depth (apparent depth = real depth/n, and n > 1).", "type": "tf", "answer": false}, {"q": "The ratio of real depth to apparent depth of an object viewed normally through a transparent medium is equal to the ______ of that medium.", "explanation": "n = real depth/apparent depth for near-normal viewing.", "type": "fill", "answer": "refractive index"}, {"q": "A fish appears to be at a depth of 1.2 m when viewed from directly above a pond (n(water) = 4/3). What is the fish's actual (real) depth?", "explanation": "Real depth = n × apparent depth = (4/3) × 1.2 = 1.6 m.", "type": "mcq", "options": ["1.6 m", "1.2 m", "0.9 m", "2.0 m"], "answer": 0}, {"q": "The refractive index of a certain glass is 1.5. What is its critical angle for light travelling from glass to air?", "explanation": "sin C = 1/n = 1/1.5 = 0.667, so C = sin⁻¹(0.667) ≈ 41.8°.", "type": "mcq", "options": ["48.6°", "41.8°", "60.0°", "30.0°"], "answer": 1}, {"q": "Total internal reflection occurs only when:", "explanation": "Both conditions must be satisfied: the light must be travelling towards a less optically dense medium, and the angle of incidence in the denser medium must be greater than the critical angle.", "type": "mcq", "options": ["the angle of incidence equals 90°", "light travels from a denser to a less dense medium AND the angle of incidence exceeds the critical angle", "light travels from a less dense to a denser medium, at any angle", "the two media have equal refractive indices"], "answer": 1}, {"q": "Total internal reflection is the principle mainly responsible for the operation of:", "explanation": "In optical fibres, light undergoes repeated total internal reflection at the core–cladding boundary, allowing it to travel long distances with minimal loss.", "type": "mcq", "options": ["convex lenses in cameras", "diverging lenses for myopia correction", "concave mirrors in torches", "optical fibres used in telecommunications"], "answer": 3}, {"q": "Total internal reflection can occur when light travels from a less dense medium to a denser medium.", "explanation": "Total internal reflection can only occur when light travels from a denser medium towards a less dense medium, not the reverse.", "type": "tf", "answer": false}, {"q": "The angle of incidence in the denser medium for which the angle of refraction is exactly 90° is called the ______.", "explanation": "This is the definition of the critical angle, C, beyond which total internal reflection occurs.", "type": "fill", "answer": "critical angle"}, {"q": "As the refractive index of a medium increases, its critical angle (for light leaving that medium into air):", "explanation": "Since sin C = 1/n, C decreases as n increases (they are inversely related).", "type": "mcq", "options": ["stays the same", "decreases", "becomes exactly 90°", "increases"], "answer": 1}, {"q": "Diamond has a refractive index of about 2.42. What is its approximate critical angle?", "explanation": "sin C = 1/2.42 = 0.413, so C = sin⁻¹(0.413) ≈ 24.4°. This very small critical angle causes extensive internal reflection, giving diamond its sparkle.", "type": "mcq", "options": ["24.4°", "18.0°", "45.0°", "35.0°"], "answer": 0}, {"q": "In an optical fibre, the refractive index of the core must be greater than that of the cladding so that:", "explanation": "Total internal reflection requires light to move from a denser (core) to a less dense (cladding) medium and strike the boundary beyond the critical angle, keeping the light confined within the core.", "type": "mcq", "options": ["light travels faster through the cladding", "the fibre becomes more flexible", "total internal reflection can occur at the core–cladding boundary", "light disperses into different colours"], "answer": 2}, {"q": "A converging lens has a focal length of 10 cm. An object is placed 30 cm from the lens. Using 1/f = 1/v − 1/u (New Cartesian sign convention), find the image distance.", "explanation": "Using the Cartesian form 1/v − 1/u = 1/f with the real object at u = −30 cm: 1/v = 1/f + 1/u = 1/10 − 1/30 = 2/30 = 1/15, so v = 15 cm (a real image on the far side of the lens).", "type": "mcq", "options": ["7.5 cm", "15 cm", "20 cm", "12 cm"], "answer": 1}, {"q": "For the converging lens above (u = 30 cm, f = 10 cm, v = 15 cm), what type of image is formed?", "explanation": "Since the object lies beyond 2f (30 cm > 20 cm), the image forms between f and 2f (v = 15 cm), and is real, inverted, and diminished (m = v/u = 0.5).", "type": "mcq", "options": ["Virtual, inverted, magnified", "Real, erect, same size", "Real, inverted, diminished", "Virtual, erect, magnified"], "answer": 2, "link": 1}, {"q": "A converging lens has a focal length of 10 cm. What is its power?", "explanation": "Power P = 1/f, with f in metres: P = 1/0.10 = +10 D (positive because it is a converging lens).", "type": "mcq", "options": ["+10 D", "+100 D", "+0.1 D", "+1 D"], "answer": 0}, {"q": "A diverging lens has a focal length of 25 cm. What is its power?", "explanation": "P = 1/f = 1/(−0.25 m) = −4 D. The power of a diverging lens is negative.", "type": "mcq", "options": ["+4 D", "−4 D", "−0.25 D", "−40 D"], "answer": 1}, {"q": "Two thin lenses of powers +5 D and −2 D are placed in contact. What is the focal length of the combination?", "explanation": "Combined power P = P₁ + P₂ = 5 + (−2) = +3 D, so f = 1/P = 1/3 m ≈ 33.3 cm.", "type": "mcq", "options": ["33.3 cm", "3 cm", "50 cm", "20 cm"], "answer": 0}, {"q": "The power of a converging (convex) lens is positive, while that of a diverging (concave) lens is negative.", "explanation": "By convention, P = 1/f, and since a converging lens has a positive focal length while a diverging lens has a negative one, their powers carry opposite signs.", "type": "tf", "answer": true}, {"q": "The power of a lens is defined as the reciprocal of its focal length measured in ______, and is expressed in dioptres (D).", "explanation": "P (in dioptres) = 1/f, where f must be expressed in metres.", "type": "fill", "answer": "metres"}, {"q": "When an object is placed between the focal point and the optical centre of a converging (convex) lens, the image formed is:", "explanation": "This is the principle of a simple magnifying glass: with the object inside the focal length, the lens produces a virtual, erect, magnified image on the same side as the object.", "type": "mcq", "options": ["real, erect, and same size", "virtual, erect, and magnified", "virtual, inverted, and diminished", "real, inverted, and diminished"], "answer": 1}]}, {"unit": 2, "title": "Unit 2: Optical Instruments", "questions": [{"q": "The image formed on the film/sensor of a camera photographing a distant object is:", "explanation": "A camera's converging lens forms a real, inverted image, usually diminished, on the light-sensitive film or sensor.", "type": "mcq", "options": ["real, inverted, diminished", "virtual, inverted, diminished", "virtual, erect, magnified", "real, erect, same size"], "answer": 0}, {"q": "In a camera, focusing on objects at different distances is achieved by:", "explanation": "Unlike the eye, a camera lens has a fixed shape; focusing is achieved by moving the lens to adjust the lens-to-film (image) distance.", "type": "mcq", "options": ["changing the shape (focal length) of the lens", "rotating the film continuously", "changing the size of the film", "moving the lens relative to the film to change the image distance"], "answer": 3}, {"q": "The diaphragm (aperture) of a camera mainly controls:", "explanation": "The aperture (adjustable opening) controls how much light passes through the lens onto the film/sensor.", "type": "mcq", "options": ["the amount of light entering the camera", "the colour of the image", "the exposure time", "the focal length of the lens"], "answer": 0}, {"q": "The shutter of a camera controls:", "explanation": "The shutter opens for a set time (exposure time), determining how long light is allowed to strike the film/sensor.", "type": "mcq", "options": ["the magnification of the image", "the type of lens used", "the amount of light entering per unit time by controlling exposure duration", "the colour balance of the photograph"], "answer": 2}, {"q": "Unlike the eye, a camera focuses images of objects at different distances by changing the lens-to-film distance rather than the focal length of the lens.", "explanation": "The camera lens has a fixed focal length; the lens itself is moved to change the image distance and keep the image sharply focused on the film.", "type": "tf", "answer": true}, {"q": "The light-sensitive surface on which a real image is formed in a camera is called the ______.", "explanation": "In older cameras this is photographic film; in digital cameras, it is an electronic sensor (e.g., CCD/CMOS).", "type": "fill", "answer": "film (or sensor)"}, {"q": "Which part of the human eye controls the amount of light entering the eye, acting like a camera's diaphragm?", "explanation": "The iris adjusts the size of the pupil to regulate the amount of light entering the eye.", "type": "mcq", "options": ["iris", "retina", "cornea", "ciliary muscle"], "answer": 0}, {"q": "Most of the refraction of light entering the eye occurs at the:", "explanation": "The curved cornea, together with the aqueous humour, provides most of the eye's total refractive power; the crystalline lens provides the fine adjustment for focusing.", "type": "mcq", "options": ["crystalline lens", "iris", "retina", "cornea"], "answer": 3}, {"q": "During accommodation for viewing a near object, the ciliary muscles:", "explanation": "To focus on near objects, the ciliary muscles contract, allowing the elastic lens to become more curved (thicker), increasing its refractive power.", "type": "mcq", "options": ["relax, making the lens thinner and less powerful", "have no effect on the lens shape", "contract, making the lens thicker (more convex) and more powerful", "contract, flattening the lens completely"], "answer": 2}, {"q": "The retina of the eye functions mainly to:", "explanation": "The retina is the light-sensitive layer at the back of the eye where a real image forms; photoreceptor cells convert this light into electrical nerve impulses sent to the brain.", "type": "mcq", "options": ["form a real image and convert light into nerve impulses", "provide most of the eye's refraction", "control the amount of light entering the eye", "focus light using accommodation"], "answer": 0}, {"q": "The visual angle is best defined as the:", "explanation": "The visual angle is the angle that an object (or its size) subtends at the eye; it determines the apparent size of the object as perceived.", "type": "mcq", "options": ["angle subtended by an object at the eye (or its lens)", "angle of total internal reflection in the eye", "angle between the eye's axis and the horizontal", "angle through which the eye can rotate"], "answer": 0}, {"q": "For a normal human eye, the least distance of distinct vision (near point) is approximately:", "explanation": "The standard near point (least distance of distinct vision) for a normal eye is taken as 25 cm.", "type": "mcq", "options": ["50 cm", "infinity", "10 cm", "25 cm"], "answer": 3}, {"q": "Accommodation is the ability of the eye lens to change its focal length (curvature) so that images of objects at different distances are focused sharply on the retina.", "explanation": "The ciliary muscles change the curvature (and hence focal length) of the crystalline lens, enabling clear focus over a range of object distances.", "type": "tf", "answer": true}, {"q": "The far point of a normal eye is at ______, while its near point is about 25 cm.", "explanation": "A normal eye can focus on very distant objects (far point at infinity) as well as objects as close as 25 cm (near point).", "type": "fill", "answer": "infinity"}, {"q": "In myopia (short-sightedness), the image of a distant object forms:", "explanation": "In myopia, the eyeball is too long or the lens/cornea too strongly curved, so parallel rays from distant objects converge in front of the retina.", "type": "mcq", "options": ["behind the retina", "in front of the retina", "outside the eye entirely", "exactly on the retina"], "answer": 1}, {"q": "Myopia (short-sightedness) is corrected using a:", "explanation": "A diverging lens spreads out the incoming rays slightly before they reach the eye's own lens, moving the focus point back onto the retina.", "type": "mcq", "options": ["bifocal lens only", "cylindrical lens", "diverging (concave) lens", "converging (convex) lens"], "answer": 2}, {"q": "Hypermetropia (long-sightedness) is corrected using a:", "explanation": "A converging lens adds extra convergence to the light before it enters the eye, bringing the focus forward onto the retina instead of behind it.", "type": "mcq", "options": ["converging (convex) lens", "plane mirror", "diverging (concave) lens", "cylindrical lens"], "answer": 0}, {"q": "A myopic person has a far point of 2.0 m. What power of corrective lens is needed to enable them to see very distant objects clearly?", "explanation": "The lens must form a virtual image of a distant object (u = ∞) at the far point (v = −2.0 m). Then 1/f = 1/v = 1/(−2.0), so f = −2.0 m and P = 1/f = −0.5 D.", "type": "mcq", "options": ["−0.5 D", "−2.0 D", "+2.0 D", "+0.5 D"], "answer": 0}, {"q": "A hypermetropic person has a near point of 100 cm instead of the normal 25 cm. What power of lens is required to allow them to read a book at 25 cm?", "explanation": "1/f = 1/v − 1/u = 1/(−1.0) − 1/(−0.25) = −1 + 4 = 3, so f = 1/3 m and P = +3 D (a converging lens).", "type": "mcq", "options": ["−3 D", "+4 D", "+3 D", "+2 D"], "answer": 2}, {"q": "Astigmatism is mainly caused by:", "explanation": "Astigmatism results from the cornea (or lens) having different curvatures along different planes, so light in different planes focuses at different points.", "type": "mcq", "options": ["the eyeball being too short", "unequal curvature of the cornea (or lens) in different planes", "clouding of the crystalline lens", "the eyeball being too long"], "answer": 1}, {"q": "Astigmatism is corrected using a:", "explanation": "A cylindrical lens has different focal powers in different planes, compensating for the unequal curvature that causes astigmatism.", "type": "mcq", "options": ["spherical converging lens", "spherical diverging lens", "bifocal spherical lens", "cylindrical lens"], "answer": 3}, {"q": "Myopia (short-sightedness) is corrected using a converging (convex) lens.", "explanation": "Myopia is corrected with a diverging (concave) lens, which reduces the eye's excessive converging power so images focus on the retina rather than in front of it.", "type": "tf", "answer": false}, {"q": "A person suffering from hypermetropia has a near point that is ______ than the normal 25 cm.", "explanation": "In hypermetropia, the near point recedes farther from the eye than the normal 25 cm, making close objects appear blurred.", "type": "fill", "answer": "farther (greater)"}, {"q": "Myopia can be caused by:", "explanation": "Myopia arises when the eyeball is elongated and/or the cornea/lens system is too strongly converging, both of which cause the image to form in front of the retina.", "type": "mcq", "options": ["an eyeball that is too short only", "an eyeball that is too long", "a lens/cornea system with too much converging power", "either of the above"], "answer": 3}, {"q": "A simple microscope (magnifying glass) consists of a single converging lens with the object placed:", "explanation": "Placing the object within the focal length of a converging lens produces a virtual, erect, magnified image, which is the principle of a simple microscope.", "type": "mcq", "options": ["beyond 2f from the lens", "within its focal length", "exactly at its focal point only", "beyond the centre of curvature"], "answer": 1}, {"q": "A simple microscope has a focal length of 5 cm. What is its magnifying power when the image is formed at the near point (D = 25 cm)?", "explanation": "M = 1 + D/f = 1 + 25/5 = 6.", "type": "mcq", "options": ["10", "6", "4", "5"], "answer": 1}, {"q": "For the same simple microscope (f = 5 cm), what is its magnifying power when the final image is formed at infinity (relaxed eye)?", "explanation": "M = D/f = 25/5 = 5, for normal adjustment with the image at infinity.", "type": "mcq", "options": ["6", "4", "25", "5"], "answer": 3, "link": 1}, {"q": "A compound microscope consists of:", "explanation": "A compound microscope uses two converging lenses: an objective with a very short focal length placed close to the object, and an eyepiece used like a simple magnifier to further magnify the objective's image.", "type": "mcq", "options": ["a concave mirror and a converging lens", "a single diverging lens", "an objective lens of short focal length and an eyepiece lens, both converging", "two diverging lenses of equal focal length"], "answer": 2}, {"q": "In a compound microscope, the objective lens produces a linear magnification of 10, and the eyepiece produces an angular magnification of 5. What is the overall magnifying power of the microscope?", "explanation": "Overall magnifying power M = Mo × Me = 10 × 5 = 50.", "type": "mcq", "options": ["25", "15", "2", "50"], "answer": 3}, {"q": "In a compound microscope, the image formed by the objective lens (which then acts as the object for the eyepiece) is:", "explanation": "The objective lens forms a real, inverted, magnified image of the specimen; this image acts as the object for the eyepiece, which further magnifies it.", "type": "mcq", "options": ["virtual, erect, diminished", "real, inverted, magnified", "virtual, inverted, magnified", "real, erect, same size"], "answer": 1}, {"q": "In a simple microscope, the image formed is virtual, erect, and magnified.", "explanation": "Since the object is placed within the focal length of the single converging lens, a virtual, erect, magnified image is produced.", "type": "tf", "answer": true}, {"q": "The magnifying power of a simple microscope with the final image formed at infinity (normal adjustment) is given by M = ______.", "explanation": "Where D is the least distance of distinct vision (25 cm) and f is the focal length of the lens.", "type": "fill", "answer": "D/f"}, {"q": "In an astronomical (refracting) telescope, the objective lens has a focal length that is:", "explanation": "The objective lens of an astronomical telescope has a long focal length compared to the eyepiece, which has a short focal length, to achieve high magnifying power (M = fo/fe).", "type": "mcq", "options": ["shorter than that of the eyepiece", "always negative", "equal to that of the eyepiece", "longer than that of the eyepiece"], "answer": 3}, {"q": "An astronomical telescope has an objective of focal length 100 cm and an eyepiece of focal length 5 cm. What is its magnifying power in normal adjustment?", "explanation": "M = fo/fe = 100/5 = 20.", "type": "mcq", "options": ["5", "20", "50", "105"], "answer": 1}, {"q": "For an astronomical telescope in normal adjustment (final image at infinity), the separation between the objective and eyepiece lenses is equal to:", "explanation": "In normal adjustment, the objective forms its image at its own focal point, which coincides with the focal point of the eyepiece, so the tube length equals fo + fe.", "type": "mcq", "options": ["fo × fe", "fo − fe", "fo + fe", "fo/fe"], "answer": 2}, {"q": "In normal adjustment, the final image produced by an astronomical telescope is:", "explanation": "In normal adjustment, the astronomical telescope produces a virtual, inverted image located at infinity, allowing viewing with a relaxed eye.", "type": "mcq", "options": ["virtual, inverted, at infinity", "virtual, erect, at infinity", "real, erect, at the near point", "real, inverted, at the focal point of the objective"], "answer": 0}, {"q": "A telescope has an objective of focal length 120 cm and a magnifying power of 24 in normal adjustment. What is the focal length of its eyepiece?", "explanation": "fe = fo/M = 120/24 = 5 cm.", "type": "mcq", "options": ["6 cm", "10 cm", "5 cm", "4 cm"], "answer": 2}, {"q": "A large-aperture objective lens is used in astronomical telescopes mainly to:", "explanation": "A larger objective aperture collects more light from faint distant objects and improves the telescope's resolving power, producing a brighter, more detailed image.", "type": "mcq", "options": ["make the telescope shorter", "gather more light and improve the resolution/brightness of the image", "reduce the magnifying power", "eliminate the need for an eyepiece"], "answer": 1}, {"q": "To increase the magnifying power of an astronomical telescope in normal adjustment, one can use an eyepiece of shorter focal length.", "explanation": "Since M = fo/fe, decreasing fe (for a fixed fo) increases the magnifying power M.", "type": "tf", "answer": true}, {"q": "In an astronomical telescope, the lens nearer to the distant object being observed is called the ______.", "explanation": "The objective lens collects light from the distant object and forms a real image, which the eyepiece then magnifies.", "type": "fill", "answer": "objective (lens)"}]}, {"unit": 3, "title": "Unit 3: Moments and Equilibrium of Bodies", "questions": [{"q": "A force is best described as an agent that can:", "explanation": "A force can change a body's velocity (speed or direction) or deform it; it may act through contact or at a distance (e.g., gravity, magnetism).", "type": "mcq", "options": ["only exist between two touching bodies", "only act on stationary bodies", "only change the shape of a body", "change or tend to change the state of rest or of uniform motion of a body, or change its shape"], "answer": 3}, {"q": "The SI unit of force is the:", "explanation": "The newton (N) is the SI unit of force, defined as the force that gives a 1 kg mass an acceleration of 1 m/s².", "type": "mcq", "options": ["watt", "newton", "joule", "pascal"], "answer": 1}, {"q": "Which of the following is a vector quantity?", "explanation": "Force has both magnitude and direction, making it a vector quantity, unlike mass, temperature, and energy, which are scalars.", "type": "mcq", "options": ["mass", "energy", "force", "temperature"], "answer": 2}, {"q": "Two forces of 3 N and 4 N act on a body at right angles to each other. What is the magnitude of their resultant?", "explanation": "By Pythagoras' theorem, R = √(3² + 4²) = √25 = 5 N.", "type": "mcq", "options": ["5 N", "1 N", "12 N", "7 N"], "answer": 0}, {"q": "Two perpendicular forces of 6 N and 8 N act on a body. What angle does the resultant make with the 6 N force?", "explanation": "tan θ = 8/6 = 1.333, so θ = tan⁻¹(1.333) ≈ 53.1° from the 6 N force.", "type": "mcq", "options": ["36.9°", "45.0°", "53.1°", "60.0°"], "answer": 2}, {"q": "The scalar (dot) product of two vectors A and B is given by A·B = |A||B|cos θ. If A and B are perpendicular, then A·B equals:", "explanation": "When θ = 90°, cos θ = 0, so the scalar product of two perpendicular vectors is zero.", "type": "mcq", "options": ["|A| + |B|", "|A||B|", "zero", "|A||B|/2"], "answer": 2}, {"q": "The direction of the vector (cross) product of two vectors, A × B, is found using the:", "explanation": "The vector product A × B has magnitude |A||B|sin θ and points in the direction given by the right-hand rule, perpendicular to the plane of A and B.", "type": "mcq", "options": ["triangle rule of vector addition", "parallelogram rule only", "left-hand rule for motors", "right-hand rule, perpendicular to the plane containing A and B"], "answer": 3}, {"q": "The scalar product of two perpendicular vectors is zero.", "explanation": "A·B = |A||B|cos 90° = 0, since cos 90° = 0.", "type": "tf", "answer": true}, {"q": "A physical quantity that has both magnitude and direction is called a ______ quantity.", "explanation": "Examples include force, velocity, displacement, and momentum, all of which require a direction to be fully specified.", "type": "fill", "answer": "vector"}, {"q": "The moment (torque) of a force about a point is defined as the product of the force and the:", "explanation": "Moment of a force = Force × perpendicular distance from the pivot/point to the line of action of the force.", "type": "mcq", "options": ["mass of the object on which it acts", "time for which the force acts", "total distance travelled by the force", "perpendicular distance from the point to the line of action of the force"], "answer": 3}, {"q": "A force of 20 N is applied at a perpendicular distance of 0.5 m from a pivot. What is the moment of the force about the pivot?", "explanation": "Moment = F × d = 20 × 0.5 = 10 N·m.", "type": "mcq", "options": ["10 N·m", "4 N·m", "20.5 N·m", "40 N·m"], "answer": 0}, {"q": "The SI unit of the moment of a force is the:", "explanation": "Since moment = force × distance, its unit is newton-metre (N·m), numerically the same as the joule but representing a different physical quantity (torque, not energy).", "type": "mcq", "options": ["newton-metre (N·m)", "newton (N)", "newton per metre", "joule per second"], "answer": 0}, {"q": "By common convention in moments problems, a moment that tends to turn a body in the anticlockwise direction is usually taken as:", "explanation": "By convention (though the choice is arbitrary as long as it is applied consistently), anticlockwise moments are usually taken as positive and clockwise moments as negative.", "type": "mcq", "options": ["negative", "always larger than a clockwise moment", "zero", "positive"], "answer": 3}, {"q": "The moment of a force about a point depends on the perpendicular distance from the point to the line of action of the force.", "explanation": "Moment = force × perpendicular distance, so the same force produces a larger or smaller moment depending on how far its line of action is from the pivot.", "type": "tf", "answer": true}, {"q": "The principle of moments states that, for a body in rotational equilibrium about a point:", "explanation": "The principle of moments (for rotational/moment equilibrium): total clockwise moment about any point equals total anticlockwise moment about the same point.", "type": "mcq", "options": ["the net force must equal the net moment", "the sum of clockwise moments equals the sum of anticlockwise moments about that point", "all forces must act at the same point", "the sum of all forces must be zero"], "answer": 1}, {"q": "A uniform beam pivoted at a point has a 10 N force acting clockwise at a perpendicular distance of 0.3 m from the pivot. What anticlockwise force at a perpendicular distance of 0.2 m is needed to balance the beam?", "explanation": "By the principle of moments: F × 0.2 = 10 × 0.3, so F = 3/0.2 = 15 N.", "type": "mcq", "options": ["30 N", "6.7 N", "20 N", "15 N"], "answer": 3}, {"q": "A couple consists of:", "explanation": "A couple is formed by two forces of equal magnitude, acting in opposite directions along parallel (non-collinear) lines of action, producing a pure turning effect with zero net force.", "type": "mcq", "options": ["two equal forces acting along the same line", "a single force acting at the centre of gravity", "any two forces acting on a body", "two equal, opposite, and parallel forces whose lines of action do not coincide"], "answer": 3}, {"q": "A couple is formed by two forces of 5 N each, separated by a perpendicular distance of 0.4 m. What is the torque (moment) of this couple?", "explanation": "Torque of a couple = one force × perpendicular distance between the forces = 5 × 0.4 = 2 N·m.", "type": "mcq", "options": ["20 N·m", "1.25 N·m", "9 N·m", "2 N·m"], "answer": 3}, {"q": "Unlike a single force, a couple acting on a rigid body produces:", "explanation": "The two forces of a couple are equal and opposite, so they cancel to give zero net force, but because they act along different lines, they produce a net turning effect (torque) that is the same about any point.", "type": "mcq", "options": ["neither a net force nor a net torque", "a net force but zero net torque", "zero net force but a net turning effect (torque)", "both a large net force and a large torque"], "answer": 2}, {"q": "A couple has zero net force but produces a net turning effect (torque) on the body it acts upon.", "explanation": "This is the defining property of a couple: resultant force = 0, resultant moment ≠ 0.", "type": "tf", "answer": true}, {"q": "Two equal, opposite, and parallel forces whose lines of action do not coincide form a ______.", "explanation": "Such a pair of forces produces pure rotation (a torque) with no net translational force.", "type": "fill", "answer": "couple"}, {"q": "The first condition for the equilibrium of a rigid body requires that:", "explanation": "The first (translational) condition for equilibrium is ΣF = 0, meaning the vector sum of all external forces acting on the body is zero.", "type": "mcq", "options": ["the body must be at rest permanently", "the vector sum of all forces acting on the body is zero", "only two forces act on the body", "the sum of all moments about any point is zero"], "answer": 1}, {"q": "The second condition for the equilibrium of a rigid body requires that:", "explanation": "The second (rotational) condition for equilibrium is Στ = 0: the sum of all moments/torques about any chosen point must be zero.", "type": "mcq", "options": ["the sum of moments (torques) about any point is zero", "the net force is zero", "the centre of gravity lies outside the body", "the body has no weight"], "answer": 0}, {"q": "A free body diagram is used to:", "explanation": "A free body diagram isolates the object of interest and shows all external forces (weight, normal reactions, tension, friction, applied forces, etc.) acting on it, used to analyse equilibrium or motion.", "type": "mcq", "options": ["represent all the external forces acting on an isolated body, with their directions and points of application", "show only the internal forces within a structure", "eliminate the need to apply Newton's laws", "calculate the mass of the body only"], "answer": 0}, {"q": "A uniform beam of weight 100 N and length 4 m rests horizontally on two supports at its ends. What is the reaction force at each support?", "explanation": "By symmetry, the weight acting at the centre is shared equally: since ΣF = 0, R_left + R_right = 100 N, and by symmetry each = 50 N.", "type": "mcq", "options": ["200 N", "25 N", "50 N", "100 N"], "answer": 2}, {"q": "A non-uniform beam of length 5 m carries a weight of 100 N at a point 2 m from its left end, and rests on supports at both ends. Using the principle of moments about the left end, find the reaction at the right support.", "explanation": "Taking moments about the left support: R_right × 5 = 100 × 2, so R_right = 200/5 = 40 N (and R_left = 100 − 40 = 60 N by ΣF = 0).", "type": "mcq", "options": ["20 N", "40 N", "80 N", "60 N"], "answer": 1}, {"q": "For a rigid body to be in complete static equilibrium, both the translational equilibrium condition (ΣF = 0) and the rotational equilibrium condition (Στ = 0) must be satisfied simultaneously.", "explanation": "A body could have zero net force but still rotate (if there is a net torque, e.g. a couple), or have zero net torque but still accelerate (if there is a net force); both conditions are needed for full equilibrium.", "type": "tf", "answer": true}, {"q": "The condition ΣF = 0 (the vector sum of all forces on a body is zero) represents ______ equilibrium.", "explanation": "This ensures the body has no net linear acceleration; it is one of the two conditions needed for complete equilibrium.", "type": "fill", "answer": "translational"}, {"q": "A body is in stable equilibrium if, when slightly displaced and released, it:", "explanation": "In stable equilibrium, a small displacement raises the centre of gravity, creating a restoring moment that returns the body to its original position when released.", "type": "mcq", "options": ["starts rotating continuously", "returns to its original position", "moves further away from its original position", "remains in its new position"], "answer": 1}, {"q": "A cone balanced on its apex is an example of which type of equilibrium?", "explanation": "A small displacement lowers the centre of gravity and moves it outside the base of support, so the cone topples further away rather than returning — this is unstable equilibrium.", "type": "mcq", "options": ["dynamic equilibrium", "unstable equilibrium", "neutral equilibrium", "stable equilibrium"], "answer": 1}, {"q": "A ball resting on a flat horizontal surface, when displaced slightly, stays in its new position without returning or moving further. This illustrates:", "explanation": "In neutral equilibrium, the height of the centre of gravity does not change on displacement, so there is no restoring or further-toppling moment, and the body simply remains in its new position.", "type": "mcq", "options": ["stable equilibrium", "unstable equilibrium", "neutral equilibrium", "no equilibrium at all"], "answer": 2}, {"q": "The centre of gravity of a body is defined as the point:", "explanation": "The centre of gravity is the single point through which the resultant weight of the body can be considered to act, for the purposes of analysing equilibrium and moments.", "type": "mcq", "options": ["that lies exactly at the geometric centre for every body", "where the body must be supported to remain in static motion", "at which the entire weight of the body may be considered to act", "where the net force on the body is maximum"], "answer": 2}, {"q": "For a uniform straight rod, the centre of gravity lies at:", "explanation": "Because the rod is uniform, its mass is distributed symmetrically, so its centre of gravity coincides with its geometric midpoint.", "type": "mcq", "options": ["one-third of its length from either end", "the midpoint of the rod", "one end of the rod", "a point outside the rod"], "answer": 1}, {"q": "The point at which the total weight of a body appears to act is called the ______.", "explanation": "This concept simplifies the analysis of forces and moments by allowing the entire weight to be treated as a single force acting at this point.", "type": "fill", "answer": "centre of gravity"}, {"q": "Stress is defined as:", "explanation": "Stress = Force/Area, measured in pascals (Pa) or N/m², and represents the internal restoring force per unit area within a deformed material.", "type": "mcq", "options": ["the force applied per unit cross-sectional area", "the product of force and distance", "the energy stored per unit volume", "the ratio of extension to original length"], "answer": 0}, {"q": "Strain is defined as:", "explanation": "Strain = extension/original length; being a ratio of two lengths, it is dimensionless and has no units.", "type": "mcq", "options": ["the ratio of change in length (extension) to original length, and has no units", "the product of Young's modulus and stress", "the rate of change of stress with time", "the force per unit area within a material"], "answer": 0}, {"q": "A wire of length 2.0 m and cross-sectional area 1.0 × 10⁻⁶ m² stretches by 0.5 mm under a load of 50 N. What is the Young's modulus of the wire material?", "explanation": "Stress = F/A = 50/1×10⁻⁶ = 5×10⁷ Pa. Strain = extension/length = 0.5×10⁻³/2.0 = 2.5×10⁻⁴. Y = stress/strain = 5×10⁷/2.5×10⁻⁴ = 2×10¹¹ Pa.", "type": "mcq", "options": ["2 × 10¹¹ Pa", "2 × 10¹⁰ Pa", "5 × 10⁷ Pa", "1 × 10⁸ Pa"], "answer": 0}, {"q": "The essential difference between tensile stress and compressive stress is that:", "explanation": "Tensile stress arises from forces pulling a material apart (elongating it), while compressive stress arises from forces pushing it together (shortening it).", "type": "mcq", "options": ["there is no physical difference; only the name differs", "tensile stress tends to stretch/elongate a material, while compressive stress tends to squeeze/shorten it", "compressive stress always exceeds tensile stress in magnitude", "tensile stress only acts on gases, while compressive stress acts on solids"], "answer": 1}, {"q": "Beyond the elastic limit, a material does not return to its original shape and size after the deforming force is removed.", "explanation": "Stretching (or compressing) a material beyond its elastic limit causes permanent (plastic) deformation, so it does not fully recover its original dimensions once the force is removed.", "type": "tf", "answer": true}, {"q": "Young's modulus is defined as the ratio of (tensile or compressive) ______ to strain, within the elastic limit of the material.", "explanation": "Y = stress/strain, and it remains constant for a given material as long as the deformation stays within the elastic limit (Hooke's law region).", "type": "fill", "answer": "stress"}]}, {"unit": 4, "title": "Unit 4: Conservation of Linear Momentum and Collision", "questions": [{"q": "According to the definition of mechanical work, W = Fd cosθ, what does θ represent?", "explanation": "θ is the angle between the applied force vector and the displacement vector; work is the component of force along the displacement multiplied by the displacement.", "type": "mcq", "options": ["The angle between the force and the vertical", "The angle between velocity and acceleration", "The angle of the surface incline", "The angle between the force and the displacement"], "answer": 3}, {"q": "A force of 20 N pulls a box a distance of 5 m in the direction of the force. How much work is done?", "explanation": "W = Fd cosθ = 20 × 5 × cos0° = 100 J.", "type": "mcq", "options": ["100 J", "500 J", "4 J", "25 J"], "answer": 0}, {"q": "A 10 N force acts on an object, moving it 4 m at an angle of 60° to the force. What is the work done?", "explanation": "W = Fd cosθ = 10 × 4 × cos60° = 40 × 0.5 = 20 J.", "type": "mcq", "options": ["5 J", "40 J", "20 J", "34.6 J"], "answer": 2}, {"q": "The SI unit of work, the joule, is equivalent to which combination of base units?", "explanation": "Work is force times distance, so 1 joule = 1 newton-metre (N·m).", "type": "mcq", "options": ["N/s", "kg·m²/s³", "N·m", "kg·m/s"], "answer": 2}, {"q": "What is the gravitational potential energy of a 2 kg object raised 5 m above the ground (g = 10 m/s²)?", "explanation": "GPE = mgh = 2 × 10 × 5 = 100 J.", "type": "mcq", "options": ["50 J", "20 J", "10 J", "100 J"], "answer": 3}, {"q": "A spring with spring constant 200 N/m is compressed by 0.1 m. What elastic potential energy is stored in it?", "explanation": "Elastic PE = ½kx² = ½ × 200 × (0.1)² = ½ × 200 × 0.01 = 1 J.", "type": "mcq", "options": ["20 J", "2 J", "1 J", "0.5 J"], "answer": 2}, {"q": "A machine does 500 J of work in 10 seconds. What is its power output?", "explanation": "P = W/t = 500/10 = 50 W.", "type": "mcq", "options": ["50 W", "500 W", "5 W", "5000 W"], "answer": 0}, {"q": "The watt, the SI unit of power, is equivalent to which of the following?", "explanation": "Power is the rate of doing work, so 1 watt = 1 joule per second (J/s).", "type": "mcq", "options": ["N·m", "J·s", "J/s", "kg·m/s²"], "answer": 2}, {"q": "A force acts exactly perpendicular to an object's displacement. How much work does this force do on the object?", "explanation": "When θ = 90°, cosθ = 0, so W = Fd cosθ = 0; a perpendicular force does no work.", "type": "mcq", "options": ["Negative work", "Maximum possible work", "Zero work", "Half the maximum work"], "answer": 2}, {"q": "The principle of conservation of mechanical energy states that in the absence of non-conservative forces such as friction, the total of which two quantities remains constant?", "explanation": "With no friction or air resistance, KE + PE remains constant as energy simply converts between the two forms.", "type": "mcq", "options": ["Kinetic energy and potential energy", "Momentum and impulse", "Power and work", "Force and acceleration"], "answer": 0}, {"q": "A ball is dropped from rest from a height of 20 m (g = 10 m/s², ignore air resistance). What is its speed just before hitting the ground?", "explanation": "Using conservation of energy, mgh = ½mv², so v = √(2gh) = √(2×10×20) = √400 = 20 m/s.", "type": "mcq", "options": ["10 m/s", "20 m/s", "14.1 m/s", "40 m/s"], "answer": 1}, {"q": "In a swinging pendulum with no air resistance, at the lowest point of the swing the energy of the bob is:", "explanation": "At the lowest point, all the gravitational potential energy lost has been converted into kinetic energy.", "type": "mcq", "options": ["Zero total energy", "Entirely kinetic energy", "Half kinetic, half potential", "Entirely potential energy"], "answer": 1}, {"q": "Linear momentum of a body is defined by which formula?", "explanation": "Linear momentum p is the product of mass and velocity, p = mv.", "type": "mcq", "options": ["p = ½mv²", "p = Fd", "p = F/t", "p = mv"], "answer": 3}, {"q": "A 0.5 kg ball moves with a velocity of 20 m/s. What is its momentum?", "explanation": "p = mv = 0.5 × 20 = 10 kg·m/s.", "type": "mcq", "options": ["100 kg·m/s", "10 kg·m/s", "40 kg·m/s", "0.025 kg·m/s"], "answer": 1}, {"q": "Impulse delivered to a body is related to momentum change by which equation?", "explanation": "Impulse equals the product of force and the time interval over which it acts, and equals the resulting change in momentum: J = FΔt = Δp.", "type": "mcq", "options": ["J = FΔt = Δp", "J = mv²", "J = p/t", "J = Fd"], "answer": 0}, {"q": "A force of 50 N acts on an object for 0.2 s. What impulse is delivered?", "explanation": "J = FΔt = 50 × 0.2 = 10 N·s.", "type": "mcq", "options": ["10 N·s", "100 N·s", "0.4 N·s", "250 N·s"], "answer": 0}, {"q": "An impulse of 10 kg·m/s is applied to a 2 kg object initially at rest. What final velocity does it acquire?", "explanation": "J = Δp = mΔv, so Δv = J/m = 10/2 = 5 m/s.", "type": "mcq", "options": ["0.2 m/s", "2 m/s", "20 m/s", "5 m/s"], "answer": 3}, {"q": "The law of conservation of linear momentum applies strictly to which type of system?", "explanation": "Total momentum of a system is conserved only when the net external force acting on it is zero (an isolated system).", "type": "mcq", "options": ["Only systems where kinetic energy is lost", "Any system, regardless of external forces", "An isolated system with no net external force", "Only systems undergoing elastic collisions"], "answer": 2}, {"q": "What defines an elastic collision between two bodies?", "explanation": "In a perfectly elastic collision, both total momentum and total kinetic energy of the system are conserved.", "type": "mcq", "options": ["Both momentum and kinetic energy are lost", "Kinetic energy is lost but momentum is conserved", "Both momentum and kinetic energy are conserved", "Momentum is lost but kinetic energy is conserved"], "answer": 2}, {"q": "In an inelastic collision between two bodies, which statement is correct?", "explanation": "In inelastic collisions momentum is always conserved for an isolated system, but some kinetic energy is converted to heat, sound, or deformation.", "type": "mcq", "options": ["Neither momentum nor kinetic energy is conserved", "Momentum is conserved but kinetic energy is not", "Kinetic energy is conserved but momentum is not", "Both are always exactly conserved"], "answer": 1}, {"q": "What is the defining feature of a perfectly inelastic collision?", "explanation": "In a perfectly inelastic collision the colliding objects stick together and move as one body with a common final velocity.", "type": "mcq", "options": ["The objects bounce apart with equal speeds", "No momentum is transferred between objects", "Kinetic energy increases after collision", "The objects stick together and move with a common velocity"], "answer": 3}, {"q": "A 2 kg trolley moving at 3 m/s collides and sticks to a stationary 1 kg trolley. What is their common velocity after collision?", "explanation": "By conservation of momentum: m1v1 + m2v2 = (m1+m2)v → (2×3 + 1×0) = 3v → v = 6/3 = 2 m/s.", "type": "mcq", "options": ["2 m/s", "3 m/s", "1.5 m/s", "1 m/s"], "answer": 0}, {"q": "Two identical trolleys undergo a head-on elastic collision, with trolley A moving and trolley B initially at rest. What happens to their velocities after collision?", "explanation": "For an elastic collision between equal masses where one is initially at rest, the moving object stops and transfers all its velocity to the object it strikes.", "type": "mcq", "options": ["Both move at A's original velocity in the same direction", "Trolley A stops and trolley B moves off with A's initial velocity", "Both move together at half the initial speed", "Trolley A reverses direction and B stays at rest"], "answer": 1}, {"q": "In a glancing (two-dimensional) collision, how must momentum conservation be applied?", "explanation": "In 2D collisions, momentum is conserved independently along each perpendicular axis, so the x-components and y-components are each conserved separately.", "type": "mcq", "options": ["As a single combined vector equation only", "Separately along two perpendicular axes (e.g., x and y)", "It cannot be applied in two dimensions", "Only along the direction of the incoming object"], "answer": 1}, {"q": "Rocket propulsion is best explained using which physical principle?", "explanation": "A rocket expels exhaust gases backward; by conservation of momentum, the rocket itself gains forward momentum equal and opposite to that of the ejected gas.", "type": "mcq", "options": ["Newton's law of gravitation", "Conservation of linear momentum", "Conservation of energy only", "Conservation of angular momentum"], "answer": 1}, {"q": "Why does a rocket accelerate forward as it burns fuel and ejects exhaust gas backward?", "explanation": "The rocket exerts a backward force on the exhaust gas, and by Newton's third law the gas exerts an equal, opposite (forward) force on the rocket.", "type": "mcq", "options": ["By Newton's third law, the reaction force on the rocket from ejecting gas pushes it forward", "Gravity pulls the rocket upward", "The exhaust gas pushes against the surrounding air", "The rocket's mass increases as fuel burns"], "answer": 0}, {"q": "Which quantity is NOT conserved in a perfectly inelastic collision between two isolated objects?", "explanation": "Kinetic energy is lost (converted to heat, sound, deformation) in inelastic collisions, while momentum, mass, and total energy remain conserved.", "type": "mcq", "options": ["Total (all forms of) energy", "Total momentum", "Total mass", "Kinetic energy"], "answer": 3}, {"q": "The work-energy theorem states that the net work done on an object equals:", "explanation": "The work-energy theorem: net work done on a body equals its change in kinetic energy, W_net = ΔKE.", "type": "mcq", "options": ["Its total mechanical energy", "Its change in potential energy", "Its change in momentum", "Its change in kinetic energy"], "answer": 3}, {"q": "What is the kinetic energy of a 4 kg object moving at 5 m/s?", "explanation": "KE = ½mv² = ½ × 4 × 5² = ½ × 4 × 25 = 50 J.", "type": "mcq", "options": ["50 J", "20 J", "10 J", "100 J"], "answer": 0}, {"q": "A 1000 kg car travelling at 20 m/s brakes uniformly and stops over a distance of 50 m. What is the average braking force?", "explanation": "KE lost = ½×1000×20² = 200,000 J = Fd, so F = 200000/50 = 4000 N.", "type": "mcq", "options": ["2000 N", "4000 N", "400 N", "40000 N"], "answer": 1}, {"q": "In a perfectly elastic collision, total kinetic energy of the system is conserved.", "explanation": "By definition, elastic collisions conserve both total momentum and total kinetic energy.", "type": "tf", "answer": true}, {"q": "Impulse and momentum are measured in the same units.", "explanation": "Impulse equals a change in momentum, so both are measured in kg·m/s (equivalently N·s).", "type": "tf", "answer": true}, {"q": "Momentum is a scalar quantity with no direction.", "explanation": "Momentum p = mv is a vector quantity; it has both magnitude and direction, following the direction of velocity.", "type": "tf", "answer": false}, {"q": "In a perfectly inelastic collision, the colliding bodies move with a common velocity immediately after impact.", "explanation": "This is the defining characteristic of a perfectly inelastic collision — the bodies stick together and move as one.", "type": "tf", "answer": true}, {"q": "Total mechanical energy of a system remains constant even when friction acts within the system.", "explanation": "Friction is a non-conservative force that converts mechanical energy into heat, so mechanical energy is not conserved when friction acts.", "type": "tf", "answer": false}, {"q": "The SI unit of power is the ______.", "explanation": "Power is measured in watts (W), where 1 W = 1 J/s.", "type": "fill", "answer": "watt"}, {"q": "The law of conservation of momentum states that in the absence of a net external force, the total momentum of a system remains ______.", "explanation": "With zero net external force, total momentum before and after any interaction stays the same (constant).", "type": "fill", "answer": "constant"}, {"q": "Rocket propulsion works based on the principle of conservation of ______.", "explanation": "The rocket and its ejected exhaust gases form an isolated system whose total momentum is conserved.", "type": "fill", "answer": "momentum"}, {"q": "The elastic potential energy stored in a stretched or compressed spring of spring constant k and extension x is given by the formula ______.", "explanation": "Elastic potential energy in a spring is E = ½kx², derived from the work done in stretching or compressing it.", "type": "fill", "answer": "½kx² (E = ½kx²)"}, {"q": "A collision in which the total kinetic energy of the system is conserved is called a(n) ______ collision.", "explanation": "By definition, an elastic collision conserves both momentum and kinetic energy.", "type": "fill", "answer": "elastic"}]}, {"unit": 5, "title": "Unit 5: Direct Current Circuits", "questions": [{"q": "Electric current is defined by which relationship?", "explanation": "Electric current is the rate of flow of charge: I = Q/t, measured in amperes.", "type": "mcq", "options": ["I = Qt", "I = Q/t", "I = t/Q", "I = Q²/t"], "answer": 1}, {"q": "A charge of 10 C flows through a conductor in 5 s. What is the current?", "explanation": "I = Q/t = 10/5 = 2 A.", "type": "mcq", "options": ["0.5 A", "15 A", "2 A", "50 A"], "answer": 2}, {"q": "Electromotive force (e.m.f.) of a source is best defined as:", "explanation": "e.m.f. is the total energy supplied to each coulomb of charge by the source, including energy used to overcome internal resistance.", "type": "mcq", "options": ["The resistance internal to the source", "The current supplied by the source", "The voltage drop across the external resistor only", "The energy converted to electrical energy per unit charge driven around the whole circuit"], "answer": 3}, {"q": "The terminal voltage V of a cell with e.m.f. ε, internal resistance r, delivering current I, is given by:", "explanation": "Some of the e.m.f. is used to drive current through the internal resistance, so terminal voltage V = ε − Ir.", "type": "mcq", "options": ["V = ε/Ir", "V = ε − Ir", "V = εIr", "V = ε + Ir"], "answer": 1}, {"q": "A battery has e.m.f. 12 V and internal resistance 0.5 Ω. When it delivers a current of 2 A, what is its terminal voltage?", "explanation": "V = ε − Ir = 12 − (2×0.5) = 12 − 1 = 11 V.", "type": "mcq", "options": ["10 V", "13 V", "12 V", "11 V"], "answer": 3}, {"q": "Why does the terminal voltage of a battery drop as it supplies more current?", "explanation": "Part of the e.m.f. is used up overcoming the internal resistance (voltage drop = Ir), leaving less voltage available at the terminals.", "type": "mcq", "options": ["Because energy is lost driving current through the battery's own internal resistance", "Because current flows backward through the battery", "Because the e.m.f. of the battery decreases with current", "Because the external resistance increases automatically"], "answer": 0}, {"q": "What is the formula for the total (equivalent) resistance of resistors R1, R2, and R3 connected in series?", "explanation": "For resistors in series, the equivalent resistance is simply the sum of the individual resistances.", "type": "mcq", "options": ["R = R1 + R2 + R3", "1/R = 1/R1 + 1/R2 + 1/R3", "R = (R1+R2+R3)/3", "R = R1R2R3"], "answer": 0}, {"q": "Three resistors of 2 Ω, 3 Ω, and 5 Ω are connected in series. What is the total resistance?", "explanation": "In series: R = 2 + 3 + 5 = 10 Ω.", "type": "mcq", "options": ["10 Ω", "0.97 Ω", "3.3 Ω", "30 Ω"], "answer": 0}, {"q": "What is the formula for the equivalent resistance of two resistors R1 and R2 connected in parallel?", "explanation": "For resistors in parallel, the reciprocal of the equivalent resistance equals the sum of the reciprocals of each resistance.", "type": "mcq", "options": ["1/R = 1/R1 + 1/R2", "R = R1R2(R1+R2)", "R = (R1+R2)/2", "R = R1 + R2"], "answer": 0}, {"q": "Two resistors of 4 Ω each are connected in parallel. What is their equivalent resistance?", "explanation": "1/R = 1/4 + 1/4 = 2/4 = 1/2, so R = 2 Ω.", "type": "mcq", "options": ["1 Ω", "8 Ω", "4 Ω", "2 Ω"], "answer": 3}, {"q": "Resistors of 6 Ω and 3 Ω are connected in parallel. What is the equivalent resistance?", "explanation": "1/R = 1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2, so R = 2 Ω.", "type": "mcq", "options": ["1.5 Ω", "4.5 Ω", "9 Ω", "2 Ω"], "answer": 3}, {"q": "In a series circuit containing several resistors connected to a battery, which quantity is the same through every resistor?", "explanation": "In a series circuit, there is only one path for charge, so the same current flows through every component.", "type": "mcq", "options": ["Current", "Power", "Voltage", "Resistance"], "answer": 0}, {"q": "In a parallel circuit, which quantity is the same across every branch?", "explanation": "Each branch of a parallel circuit is connected directly across the same two nodes, so the potential difference across each branch is equal.", "type": "mcq", "options": ["Power", "Resistance", "Voltage (potential difference)", "Current"], "answer": 2}, {"q": "When identical cells are connected in series (same polarity), what happens to the total e.m.f. of the combination?", "explanation": "Cells connected in series with matching polarity add their e.m.f.s: total e.m.f. = ε1 + ε2 + ε3 + ...", "type": "mcq", "options": ["It stays the same as one cell", "It is the sum of the individual e.m.f.s", "It becomes zero", "It is the average of the individual e.m.f.s"], "answer": 1}, {"q": "Three identical 1.5 V cells are connected in series. What is the total e.m.f. of the combination?", "explanation": "Total e.m.f. = 1.5 + 1.5 + 1.5 = 4.5 V.", "type": "mcq", "options": ["0.5 V", "1.5 V", "4.5 V", "3.0 V"], "answer": 2}, {"q": "What is the main advantage of connecting several identical cells in parallel rather than using a single cell?", "explanation": "Parallel identical cells keep the same overall e.m.f. as one cell but reduce the combined internal resistance, allowing a larger current to be supplied.", "type": "mcq", "options": ["It reverses the direction of current flow", "It decreases the total charge stored", "It decreases the total internal resistance and increases the current the combination can supply", "It increases the total e.m.f. of the combination"], "answer": 2}, {"q": "Kirchhoff's current law (junction rule) states that at any junction in a circuit:", "explanation": "Kirchhoff's current law is a statement of conservation of charge: total current into a junction equals total current out of it.", "type": "mcq", "options": ["All currents entering a junction are equal in magnitude", "The sum of currents entering equals the sum of currents leaving", "Current is inversely proportional to resistance", "Voltage around any loop sums to zero"], "answer": 1}, {"q": "Kirchhoff's voltage law (loop rule) states that around any closed loop in a circuit:", "explanation": "Kirchhoff's voltage law reflects conservation of energy: the sum of e.m.f.s around a loop equals the sum of potential drops around that same loop.", "type": "mcq", "options": ["The sum of currents is zero", "The algebraic sum of e.m.f.s equals the algebraic sum of IR (voltage) drops", "The total resistance is zero", "The total power dissipated is zero"], "answer": 1}, {"q": "A circuit has two cells connected in opposition: e.m.f. 10 V and e.m.f. 6 V, each with internal resistance 1 Ω, in series with an external resistor of 2 Ω. What current flows in the circuit?", "explanation": "Net e.m.f. = 10 − 6 = 4 V; total resistance = 1 + 1 + 2 = 4 Ω; I = V/R = 4/4 = 1 A.", "type": "mcq", "options": ["1 A", "4 A", "2 A", "0.5 A"], "answer": 0}, {"q": "A single-loop circuit has a cell of e.m.f. 9 V, internal resistance 1 Ω, connected to an external resistor of 2 Ω. What current flows in the circuit?", "explanation": "Total resistance = r + R = 1 + 2 = 3 Ω; I = ε/R_total = 9/3 = 3 A.", "type": "mcq", "options": ["3 A", "1 A", "4.5 A", "9 A"], "answer": 0}, {"q": "Using the circuit in the previous question (ε = 9 V, r = 1 Ω, R = 2 Ω, I = 3 A), what is the terminal voltage of the cell?", "explanation": "V = ε − Ir = 9 − (3×1) = 6 V, which also equals IR = 3×2 = 6 V across the external resistor.", "type": "mcq", "options": ["9 V", "6 V", "3 V", "12 V"], "answer": 1, "link": 1}, {"q": "A current of 2 A flows through a resistor of 5 Ω. What power is dissipated in the resistor?", "explanation": "P = I²R = 2² × 5 = 4 × 5 = 20 W.", "type": "mcq", "options": ["10 W", "2.5 W", "20 W", "100 W"], "answer": 2}, {"q": "A source of e.m.f. 12 V supplies a current of 2 A to a circuit. What total power is delivered by the source?", "explanation": "Power delivered by the source, P = εI = 12 × 2 = 24 W.", "type": "mcq", "options": ["48 W", "14 W", "6 W", "24 W"], "answer": 3}, {"q": "Maximum power is transferred from a source to an external load when:", "explanation": "The maximum power transfer theorem states that maximum power is delivered to the load when the load resistance equals the source's internal resistance.", "type": "mcq", "options": ["The load resistance is much greater than the internal resistance", "The load resistance is zero", "The load resistance is much less than the internal resistance", "The load resistance equals the internal resistance"], "answer": 3}, {"q": "If the external (load) resistance of a circuit is reduced to zero (a short circuit), what determines the maximum current that flows?", "explanation": "With R = 0, the only opposition to current is the internal resistance, so the short-circuit current is I = ε/r, the maximum current the source can supply.", "type": "mcq", "options": ["The load resistance alone", "No current can flow", "The e.m.f. divided by the internal resistance only (I = ε/r)", "The load resistance divided by the e.m.f."], "answer": 2}, {"q": "An ammeter used to measure current in a circuit is designed to have:", "explanation": "An ammeter is connected in series in the current path and must have very low resistance so it does not significantly alter the current being measured.", "type": "mcq", "options": ["Very low resistance, and is connected in series", "Very high resistance, and is connected in parallel", "Zero resistance and infinite current capacity", "Very high resistance, and is connected in series"], "answer": 0}, {"q": "A voltmeter used to measure potential difference across a component is designed to have:", "explanation": "A voltmeter is connected in parallel across a component and must have very high resistance so it draws negligible current from the circuit.", "type": "mcq", "options": ["Zero resistance, connected in parallel", "Very hi
