gh resistance, connected in parallel", "Very low resistance, connected in series", "Very high resistance, connected in series"], "answer": 1}, {"q": "When applying Kirchhoff's voltage law while tracing a loop in the same direction as the assumed current through a resistor, the potential change across that resistor is treated as a:", "explanation": "By the standard sign convention, moving through a resistor in the direction of current flow gives a potential drop, taken as −IR in the loop equation.", "type": "mcq", "options": ["Zero change", "Drop (−IR)", "Rise (+IR)", "Doubled drop (−2IR)"], "answer": 1}, {"q": "Three resistors of 2 Ω, 3 Ω, and 6 Ω are connected in parallel. What is their equivalent resistance?", "explanation": "1/R = 1/2 + 1/3 + 1/6 = 3/6 + 2/6 + 1/6 = 6/6 = 1, so R = 1 Ω.", "type": "mcq", "options": ["11 Ω", "0.5 Ω", "3.67 Ω", "1 Ω"], "answer": 3}, {"q": "A 2 Ω resistor is connected in series with a parallel combination of two 4 Ω resistors. What is the total resistance of the network?", "explanation": "The two 4 Ω resistors in parallel give 2 Ω; adding the series 2 Ω resistor gives a total of 2 + 2 = 4 Ω.", "type": "mcq", "options": ["10 Ω", "6 Ω", "4 Ω", "2 Ω"], "answer": 2}, {"q": "The terminal voltage of a discharging battery is always greater than its e.m.f.", "explanation": "Terminal voltage V = ε − Ir is always less than the e.m.f. when current flows, due to the internal resistance drop.", "type": "tf", "answer": false}, {"q": "Kirchhoff's current law is a direct consequence of the law of conservation of electric charge.", "explanation": "Since charge cannot accumulate at a junction, the current flowing in must equal the current flowing out, which is a statement of charge conservation.", "type": "tf", "answer": true}, {"q": "The equivalent resistance of resistors connected in series is always greater than the largest individual resistance in the combination.", "explanation": "Since series resistance is the sum of all resistances, it must exceed any single one of them.", "type": "tf", "answer": true}, {"q": "Connecting several identical cells in parallel increases the total e.m.f. of the combination beyond that of a single cell.", "explanation": "Identical cells in parallel give the same e.m.f. as a single cell; what increases is the maximum current the combination can safely supply.", "type": "tf", "answer": false}, {"q": "Kirchhoff's voltage law is based on the principle of conservation of energy.", "explanation": "Since electric potential is related to energy per unit charge, the loop rule reflects the fact that energy supplied by e.m.f. sources equals energy dissipated around a closed loop.", "type": "tf", "answer": true}, {"q": "The SI unit of electromotive force is the ______.", "explanation": "Electromotive force, like potential difference, is measured in volts (V).", "type": "fill", "answer": "volt"}, {"q": "Kirchhoff's ______ law (junction rule) states that the algebraic sum of currents meeting at a junction is zero.", "explanation": "This is Kirchhoff's current law (also called the first law or junction rule).", "type": "fill", "answer": "current"}, {"q": "The resistance that opposes current flow inside a battery or cell itself is called its ______ resistance.", "explanation": "Internal resistance is the resistance within the source itself, causing a voltage drop when current flows.", "type": "fill", "answer": "internal"}, {"q": "For resistors connected in ______, the same current flows through each resistor, but the voltage divides between them.", "explanation": "In a series connection there is only one current path, so current is common while voltage divides across each resistor.", "type": "fill", "answer": "series"}, {"q": "The terminal voltage V of a cell of e.m.f. ε and internal resistance r delivering current I is given by V = ε − ______.", "explanation": "The voltage dropped across the internal resistance, Ir, is subtracted from the e.m.f. to give the terminal voltage.", "type": "fill", "answer": "Ir"}]}, {"unit": 6, "title": "Unit 6: Sources of Energy in the World", "questions": [{"q": "Which of the following is classified as a renewable energy source?", "explanation": "Solar energy is continuously replenished by the sun and does not get depleted, making it renewable, unlike fossil fuels.", "type": "mcq", "options": ["Coal", "Petroleum", "Natural gas", "Solar energy"], "answer": 3}, {"q": "Which of the following is classified as a non-renewable energy source?", "explanation": "Coal is a fossil fuel formed over millions of years and is consumed much faster than it can naturally form, making it non-renewable.", "type": "mcq", "options": ["Coal", "Hydropower", "Wind", "Biomass"], "answer": 0}, {"q": "What is currently the largest source of electricity generation in Rwanda?", "explanation": "Rwanda's electricity generation relies primarily on hydropower plants harnessing the country's rivers, supplemented by methane gas, solar, and thermal sources.", "type": "mcq", "options": ["Wind power", "Nuclear power", "Hydropower", "Coal power"], "answer": 2}, {"q": "Which unique energy resource is extracted from Lake Kivu and used for electricity generation in Rwanda?", "explanation": "Lake Kivu contains large dissolved reserves of methane gas, which Rwanda extracts and uses to generate electricity.", "type": "mcq", "options": ["Geothermal steam", "Methane gas", "Crude oil", "Coal deposits"], "answer": 1}, {"q": "Which is a major advantage of solar energy as a power source?", "explanation": "Solar panels generate electricity without burning fuel, so they produce no direct greenhouse gas emissions during operation.", "type": "mcq", "options": ["It requires no initial investment", "It can be transported easily like fuel", "It is available at a constant rate at all times of day", "It produces no greenhouse gas emissions during operation"], "answer": 3}, {"q": "Which is a major disadvantage of solar energy?", "explanation": "Solar power generation depends on sunlight, so output varies with weather, time of day, and season, making it intermittent.", "type": "mcq", "options": ["It causes significant air pollution", "It cannot generate any electricity", "Its output is intermittent, depending on sunlight availability", "It depletes rapidly after a few uses"], "answer": 2}, {"q": "Which is a key advantage of hydropower as an energy source?", "explanation": "Hydropower plants use flowing water and require no fuel purchases after construction, providing a reliable and relatively low-cost source of continuous power.", "type": "mcq", "options": ["Once built, it has low ongoing fuel costs and can supply continuous power", "It only works in desert regions", "It has no construction or environmental cost", "It requires no water source"], "answer": 0}, {"q": "Which is a key disadvantage of hydropower?", "explanation": "Building large dams can flood land, displace people, and alter river ecosystems, which are significant environmental and social costs.", "type": "mcq", "options": ["It produces large amounts of carbon dioxide during operation", "It cannot generate electricity at all", "Dam construction can displace communities and disrupt river ecosystems", "It is more expensive to operate than a nuclear plant per kWh"], "answer": 2}, {"q": "What is an advantage of wind energy?", "explanation": "Wind turbines convert wind's kinetic energy into electricity without burning fuel, giving low emissions and low running costs after installation.", "type": "mcq", "options": ["It produces large amounts of ash waste", "It is a clean, renewable source with low operating costs once installed", "It requires fossil fuel to operate turbines", "It works reliably regardless of wind conditions"], "answer": 1}, {"q": "What is a disadvantage of wind energy?", "explanation": "Wind turbines only generate power when wind speeds are sufficient, so output is variable and unreliable at low or excessive wind speeds.", "type": "mcq", "options": ["It produces significant greenhouse gases during operation", "It requires no land area", "Power output is intermittent and depends on wind speed and location", "It cannot be used to generate electricity"], "answer": 2}, {"q": "Geothermal energy is best described as energy derived from:", "explanation": "Geothermal energy harnesses heat generated within the Earth, often accessed through hot springs, steam, or drilled wells.", "type": "mcq", "options": ["The decay of organic waste", "Heat stored beneath the Earth's surface", "The burning of underground coal deposits", "Sunlight absorbed by rocks"], "answer": 1}, {"q": "Biomass energy is obtained from which of the following?", "explanation": "Biomass energy comes from organic materials like wood, agricultural residues, and animal waste, which can be burned or converted into fuel.", "type": "mcq", "options": ["Organic matter such as wood, crop residue, and animal waste", "Fossil deposits of crude oil", "Nuclear fuel rods", "Wind currents"], "answer": 0}, {"q": "Fossil fuels such as coal, oil, and natural gas are classified as non-renewable because:", "explanation": "Fossil fuels take millions of years to form from ancient organic material, so at current consumption rates they cannot be replenished within a human timescale.", "type": "mcq", "options": ["They are made instantly through chemical synthesis", "They can be regenerated within a few days", "They are used up faster than they can naturally reform over millions of years", "They never run out"], "answer": 2}, {"q": "Nuclear energy is generated in a power plant primarily through which process?", "explanation": "Nuclear power plants split (fission) heavy nuclei, typically uranium-235, releasing large amounts of heat used to generate electricity.", "type": "mcq", "options": ["Nuclear fission of heavy atoms such as uranium", "Combustion of uranium in open air", "Fermentation of organic material", "Solar-driven photovoltaic conversion"], "answer": 0}, {"q": "Which is an advantage of nuclear energy?", "explanation": "Nuclear fission releases enormous amounts of energy per unit mass of fuel compared to fossil fuels, making it highly energy-dense.", "type": "mcq", "options": ["It produces zero waste of any kind", "It relies on sunlight to function", "It produces a very large amount of energy from a small quantity of fuel", "It is completely risk-free to operate"], "answer": 2}, {"q": "Which is a significant disadvantage of nuclear energy?", "explanation": "Nuclear power generates radioactive waste requiring careful, long-term storage, and accidents (though rare) can have severe consequences.", "type": "mcq", "options": ["It produces radioactive waste that remains hazardous for long periods and carries accident risk", "It depends entirely on wind conditions", "It emits large amounts of carbon dioxide during operation", "It cannot generate electricity reliably"], "answer": 0}, {"q": "Burning coal in a power station mainly contributes to environmental damage by releasing:", "explanation": "Coal combustion releases carbon dioxide (a greenhouse gas) along with sulfur dioxide and particulates that cause air pollution and acid rain.", "type": "mcq", "options": ["Carbon dioxide and pollutants such as sulfur dioxide and particulates", "Only harmless nitrogen gas", "Pure oxygen and water vapor only", "Radioactive waste"], "answer": 0}, {"q": "In a hydroelectric power plant, what is the correct sequence of energy conversion?", "explanation": "Water stored at height has gravitational potential energy, which converts to kinetic energy as it falls and turns turbines, which generators then convert to electrical energy.", "type": "mcq", "options": ["Gravitational potential energy of water → kinetic energy → electrical energy", "Solar energy → chemical energy → electrical energy", "Chemical energy → electrical energy → kinetic energy", "Nuclear energy → thermal energy → electrical energy"], "answer": 0}, {"q": "In a solar photovoltaic panel, what type of energy conversion takes place?", "explanation": "Photovoltaic cells convert light (solar radiation) directly into electrical energy through the photovoltaic effect.", "type": "mcq", "options": ["Heat energy into mechanical energy", "Light energy directly into electrical energy", "Nuclear energy into light energy", "Chemical energy into thermal energy"], "answer": 1}, {"q": "In a typical fossil-fuel thermal power plant, what is the correct order of energy conversion?", "explanation": "Burning fuel releases chemical energy as heat, which boils water to produce steam that turns a turbine (mechanical energy), which a generator converts to electrical energy.", "type": "mcq", "options": ["Nuclear energy → electrical energy directly", "Chemical energy (fuel) → heat energy → mechanical energy (turbine) → electrical energy", "Mechanical energy → chemical energy → light energy", "Electrical energy → chemical energy → heat energy"], "answer": 1}, {"q": "Why is electricity transmitted over long distances at very high voltages?", "explanation": "For a fixed power, increasing voltage reduces the current needed; since power loss in the lines is I²R, a lower current greatly reduces energy wasted as heat.", "type": "mcq", "options": ["To make the transmission lines heavier and stronger", "To reduce the current for a given power, which minimizes resistive (I²R) power losses in the lines", "High voltage has no effect on transmission efficiency", "To increase the current and thus deliver more power"], "answer": 1}, {"q": "The network of cables, transformers, and substations used to carry electricity from power stations to consumers is called the:", "explanation": "The national grid is the interconnected transmission and distribution network that delivers electrical energy from generating stations to homes and industries.", "type": "mcq", "options": ["National electricity grid", "Solar array", "Battery bank", "Circuit breaker"], "answer": 0}, {"q": "In terms of reliability, which type of energy source generally provides the most continuous, on-demand power output?", "explanation": "Hydropower with a steady water supply and fossil fuel plants can generate continuously on demand, whereas solar and wind depend on variable weather conditions.", "type": "mcq", "options": ["Wave power in a completely still sea", "Wind power in calm conditions", "Solar power on a cloudy day", "Hydropower with a steady water supply, or fossil fuel plants"], "answer": 3}, {"q": "Widespread use of firewood and charcoal as household energy sources in developing regions is most closely linked to which environmental problem?", "explanation": "Heavy reliance on firewood and charcoal for cooking and heating drives tree-cutting faster than regrowth, leading to deforestation.", "type": "mcq", "options": ["Ocean acidification", "Deforestation and loss of forest cover", "Ozone layer depletion", "Nuclear contamination"], "answer": 1}, {"q": "A country that must import petroleum products because it lacks domestic oil reserves faces which economic consequence?", "explanation": "Importing fuel means spending foreign currency and being vulnerable to volatile international oil prices, which raises energy costs and affects the trade balance.", "type": "mcq", "options": ["Reduced dependency on foreign trade", "Increased cost of energy and greater exposure to global fuel price fluctuations", "No effect on its balance of trade", "Automatic access to cheaper electricity"], "answer": 1}, {"q": "Which of the following is an effective energy conservation practice for a household?", "explanation": "Using efficient appliances such as LED bulbs and switching off devices when not needed reduces unnecessary energy consumption.", "type": "mcq", "options": ["Leaving lights and appliances on when not in use", "Running all appliances simultaneously at peak hours", "Increasing the use of incandescent bulbs", "Using energy-efficient LED bulbs and switching off unused appliances"], "answer": 3}, {"q": "Sustainable energy development is best defined as:", "explanation": "Sustainable development balances current energy needs with the responsibility to preserve resources and environmental quality for future generations.", "type": "mcq", "options": ["Relying exclusively on nuclear power", "Using as much fossil fuel as possible today regardless of future supply", "Meeting present energy needs without compromising the ability of future generations to meet their own needs", "Stopping all energy consumption immediately"], "answer": 2}, {"q": "As part of its future energy strategy, Rwanda has been expanding which type of energy solution to improve rural electricity access?", "explanation": "Rwanda has promoted off-grid and mini-grid solar solutions, alongside grid extension, to increase electricity access in rural and remote areas.", "type": "mcq", "options": ["Deep-sea oil drilling platforms", "Large-scale nuclear power stations", "Coal-fired power stations", "Off-grid and mini-grid solar systems"], "answer": 3}, {"q": "Which characteristic makes an energy source described as 'reliable'?", "explanation": "A reliable energy source can consistently supply power when needed, without being overly dependent on unpredictable conditions.", "type": "mcq", "options": ["It is completely free of any construction cost", "It depends entirely on unpredictable weather", "It only works during the daytime", "It can supply power consistently and on demand regardless of external conditions"], "answer": 3}, {"q": "Compared with fossil fuel power plants, why are renewable sources like solar and wind generally considered more environmentally friendly during operation?", "explanation": "Solar and wind systems convert natural energy flows into electricity without combustion, so they emit little to no direct greenhouse gases during operation.", "type": "mcq", "options": ["They produce more air pollution than fossil fuels", "They release large amounts of carbon dioxide when generating electricity", "They require burning coal to start up", "They generate electricity without burning fuel, so they produce little to no direct greenhouse gas emissions"], "answer": 3}, {"q": "Solar energy is classified as a non-renewable source of energy.", "explanation": "Solar energy is renewable because sunlight is continuously supplied by the sun and is not depleted by use.", "type": "tf", "answer": false}, {"q": "Methane gas extracted from Lake Kivu is used to generate electricity in Rwanda.", "explanation": "Rwanda has developed methane extraction and power generation projects on Lake Kivu, converting the dissolved gas into electricity.", "type": "tf", "answer": true}, {"q": "Burning fossil fuels contributes to climate change through the release of greenhouse gases such as carbon dioxide.", "explanation": "Fossil fuel combustion releases carbon dioxide, a major greenhouse gas responsible for global warming and climate change.", "type": "tf", "answer": true}, {"q": "Hydropower currently supplies the largest share of Rwanda's electricity generation.", "explanation": "Rwanda's power generation mix has historically been dominated by hydropower plants on its rivers, alongside growing methane gas, solar, and thermal contributions.", "type": "tf", "answer": true}, {"q": "Nuclear power plants generate electricity without producing any waste products.", "explanation": "Nuclear power plants produce radioactive waste that must be carefully managed and stored for long periods.", "type": "tf", "answer": false}, {"q": "Energy sources that can be naturally replenished within a short period of time are called ______ energy sources.", "explanation": "Renewable energy sources, such as solar, wind, and hydropower, are naturally replenished and do not get permanently depleted.", "type": "fill", "answer": "renewable"}, {"q": "______ energy is harnessed from heat stored beneath the Earth's surface.", "explanation": "Geothermal energy comes from the natural heat within the Earth, accessed via hot springs, steam vents, or drilled wells.", "type": "fill", "answer": "Geothermal"}, {"q": "In Rwanda, gas dissolved in Lake ______ is extracted and used as a resource for electricity generation.", "explanation": "Lake Kivu holds significant dissolved methane gas reserves that Rwanda taps for power generation.", "type": "fill", "answer": "Kivu"}, {"q": "Reducing wasteful use of energy resources and using them wisely so they last longer is called energy ______.", "explanation": "Energy conservation refers to reducing unnecessary energy use to preserve resources and reduce costs and environmental impact.", "type": "fill", "answer": "conservation"}, {"q": "Electrical energy is transmitted over long distances at high ______ in order to minimize power losses in the transmission lines.", "explanation": "Transmitting at high voltage reduces the current needed for a given power, which minimizes I²R losses in the cables.", "type": "fill", "answer": "voltage"}]}, {"unit": 7, "title": "Unit 7: Projectile and Uniform Circular Motion", "questions": [{"q": "What is projectile motion?", "explanation": "Projectile motion is the two-dimensional motion of an object launched into the air and acted on only by gravity (air resistance ignored), producing a curved (parabolic) path.", "type": "mcq", "options": ["Motion of an object rotating about a fixed axis", "Motion of an object moving at constant velocity in a straight line", "Motion of an object under the influence of gravity alone after being launched, following a curved path", "Motion of an object moving with constant acceleration in a straight vertical line"], "answer": 2}, {"q": "After a projectile is launched (ignoring air resistance), which force continues to act on it?", "explanation": "Once launched, the only force acting on an ideal projectile is the weight (gravity) pulling it downward.", "type": "mcq", "options": ["Gravity and the launching force", "Only air resistance", "No force acts on it", "Only gravity"], "answer": 3}, {"q": "In horizontal projectile motion, the horizontal component of velocity:", "explanation": "There is no horizontal force (air resistance ignored), so horizontal velocity stays constant throughout the flight.", "type": "mcq", "options": ["Decreases uniformly with time", "Becomes zero at the highest point", "Remains constant throughout the flight", "Increases uniformly with time"], "answer": 2}, {"q": "In horizontal projectile motion, the vertical component of velocity:", "explanation": "Gravity acts vertically downward, causing the vertical velocity to increase uniformly according to v_y = gt.", "type": "mcq", "options": ["Is always zero", "Increases uniformly with time due to gravity", "Remains constant", "Decreases uniformly with time"], "answer": 1}, {"q": "A ball is projected horizontally from a cliff of height 20 m (g = 10 m/s²). How long does it take to hit the ground?", "explanation": "Using h = ½gt² → 20 = ½(10)t² → t² = 4 → t = 2 s.", "type": "mcq", "options": ["1 s", "2 s", "4 s", "3 s"], "answer": 1}, {"q": "A stone is thrown horizontally with speed 15 m/s from a height of 20 m (g = 10 m/s²). What horizontal distance does it travel before landing?", "explanation": "Time of flight t = √(2h/g) = √(4) = 2 s. Horizontal range x = v·t = 15 × 2 = 30 m.", "type": "mcq", "options": ["20 m", "15 m", "30 m", "45 m"], "answer": 2}, {"q": "An object is projected horizontally from a height of 45 m (g = 10 m/s²). Find the time of flight.", "explanation": "t = √(2h/g) = √(2×45/10) = √9 = 3 s.", "type": "mcq", "options": ["4 s", "3 s", "2 s", "5 s"], "answer": 1}, {"q": "For a projectile launched horizontally from height h, the time of flight is given by:", "explanation": "Since the vertical motion starts from rest and falls height h under gravity, h = ½gt², giving t = √(2h/g).", "type": "mcq", "options": ["t = v sinθ/g", "t = 2v/g", "t = v²/g", "t = √(2h/g)"], "answer": 3}, {"q": "The path traced by a projectile launched at an angle to the horizontal is:", "explanation": "Combining uniform horizontal motion with uniformly accelerated vertical motion produces a parabolic trajectory.", "type": "mcq", "options": ["A straight line", "A circle", "A parabola", "An ellipse"], "answer": 2}, {"q": "The time of flight of a projectile launched at angle θ with initial speed v is given by:", "explanation": "The projectile returns to launch height when the vertical displacement is zero, giving T = 2v sinθ/g.", "type": "mcq", "options": ["T = 2v cosθ/g", "T = 2v sinθ/g", "T = v sinθ/g", "T = v cosθ/g"], "answer": 1}, {"q": "A projectile is launched at 20 m/s at 30° to the horizontal (g = 10 m/s²). Find its time of flight.", "explanation": "T = 2v sinθ/g = 2(20)(0.5)/10 = 2 s.", "type": "mcq", "options": ["3 s", "1 s", "4 s", "2 s"], "answer": 3}, {"q": "The maximum height reached by a projectile launched at angle θ with speed v is given by:", "explanation": "At maximum height the vertical velocity is zero; using v_y² = (v sinθ)² − 2gH = 0 gives H = v²sin²θ/2g.", "type": "mcq", "options": ["H = v²sin²θ/2g", "H = v sinθ/g", "H = v²cos²θ/2g", "H = v²sin2θ/g"], "answer": 0}, {"q": "A projectile is launched at 20 m/s at 30° to the horizontal (g = 10 m/s²). Find its maximum height.", "explanation": "H = v²sin²θ/2g = (20²)(0.5²)/(2×10) = (400×0.25)/20 = 5 m.", "type": "mcq", "options": ["10 m", "2.5 m", "20 m", "5 m"], "answer": 3}, {"q": "The horizontal range of a projectile launched at angle θ with speed v is given by:", "explanation": "Range is horizontal distance covered during the time of flight, R = v cosθ × T = v²sin2θ/g.", "type": "mcq", "options": ["R = 2v²sinθ/g", "R = v²sinθ/g", "R = v²sin2θ/g", "R = v²cos2θ/g"], "answer": 2}, {"q": "A projectile is launched at 20 m/s at 30° to the horizontal (g = 10 m/s²). Find its horizontal range (sin60° ≈ 0.87).", "explanation": "R = v²sin2θ/g = (400 × sin60°)/10 = (400 × 0.87)/10 ≈ 34.6 m.", "type": "mcq", "options": ["40.0 m", "34.6 m", "24.6 m", "17.3 m"], "answer": 1}, {"q": "For a given launch speed, the angle of projection that gives the maximum horizontal range (on level ground) is:", "explanation": "Range R = v²sin2θ/g is maximum when sin2θ = 1, i.e. 2θ = 90°, so θ = 45°.", "type": "mcq", "options": ["45°", "60°", "30°", "90°"], "answer": 0}, {"q": "A ball launched at 30° and another launched at 60° with the same initial speed will have:", "explanation": "Angles that are complementary (30° and 60°) give sin2θ the same value, so the ranges are equal, though heights and times of flight differ.", "type": "mcq", "options": ["The same velocity at landing direction", "The same maximum height", "The same time of flight", "The same horizontal range"], "answer": 3}, {"q": "At the highest point of a projectile's trajectory (launched at an angle), the vertical component of velocity is:", "explanation": "At maximum height the projectile momentarily stops rising, so its vertical velocity component is zero.", "type": "mcq", "options": ["Negative", "Maximum", "Equal to the horizontal component", "Zero"], "answer": 3}, {"q": "At the highest point of its trajectory, the speed of a projectile launched at an angle (other than 90°) is:", "explanation": "Only the vertical velocity becomes zero at the top; the horizontal component v cosθ remains, so the speed at the top equals v cosθ.", "type": "mcq", "options": ["Equal to the horizontal component of the initial velocity, v cosθ", "Equal to the vertical component of the initial velocity", "Equal to the initial launch speed", "Zero"], "answer": 0}, {"q": "Ignoring air resistance, which quantity remains constant throughout the entire flight of a projectile launched at an angle?", "explanation": "With no horizontal force, the horizontal velocity component stays constant; vertical velocity, speed and kinetic energy all change.", "type": "mcq", "options": ["Speed", "Horizontal velocity", "Vertical velocity", "Kinetic energy"], "answer": 1}, {"q": "A footballer kicks a ball so that it follows a curved path through the air before landing. This is an example of:", "explanation": "The ball undergoes projectile motion, launched at an angle and acted on only by gravity.", "type": "mcq", "options": ["Projectile motion", "Rectilinear motion", "Uniform circular motion", "Simple harmonic motion"], "answer": 0}, {"q": "In military applications, understanding projectile motion equations helps in:", "explanation": "Range and time-of-flight equations of projectile motion allow calculation of the angle and speed needed for a shell to hit a target at a known distance.", "type": "mcq", "options": ["Measuring the temperature of a rocket engine", "Calculating electrical resistance of weapon circuits", "Determining the chemical composition of gunpowder", "Calculating the range and trajectory needed to hit a target with artillery shells"], "answer": 3}, {"q": "A decorative water fountain jet leaves a nozzle at an angle and lands some distance away. This is best explained using:", "explanation": "The water jet follows a curved path under gravity, exactly like any projectile launched at an angle.", "type": "mcq", "options": ["Projectile motion equations", "Simple harmonic motion equations", "Ohm's law", "The first law of thermodynamics"], "answer": 0}, {"q": "In designing an irrigation sprinkler, engineers adjust the nozzle angle mainly to:", "explanation": "Since range depends on launch angle (maximum at 45°) and speed, engineers choose the angle to control how far the water is thrown.", "type": "mcq", "options": ["Maximize or control the horizontal range the water covers", "Increase the temperature of the water", "Change the color of the water", "Change the density of the water"], "answer": 0}, {"q": "A conical pendulum consists of a bob attached to a string that:", "explanation": "In a conical pendulum, the bob moves in a horizontal circle at constant speed while the string traces the surface of a cone.", "type": "mcq", "options": ["Moves in a horizontal circle while the string sweeps out a cone", "Swings back and forth in a vertical plane", "Moves up and down along the string", "Remains stationary at all times"], "answer": 0}, {"q": "For a conical pendulum of string length L making angle θ with the vertical, the vertical equilibrium condition is:", "explanation": "The vertical component of tension balances the weight of the bob: T cosθ = mg.", "type": "mcq", "options": ["T sinθ = mg", "T tanθ = mg", "T cosθ = mg", "T = mg"], "answer": 2}, {"q": "In a conical pendulum, the horizontal component of the string's tension provides:", "explanation": "T sinθ is the unbalanced horizontal component of tension, which supplies the centripetal force mv²/r directed toward the center of the circle.", "type": "mcq", "options": ["The weight of the bob", "The centripetal force keeping the bob in circular motion", "No net force", "The normal reaction force"], "answer": 1}, {"q": "The banking angle θ of a curved road of radius r for a vehicle moving at speed v (ignoring friction) is given by:", "explanation": "Resolving forces on a banked, frictionless curve gives tanθ = v²/(rg), the ideal banking angle for speed v on radius r.", "type": "mcq", "options": ["tanθ = rg/v²", "tanθ = v/rg", "tanθ = v²/rg", "tanθ = vr/g"], "answer": 2}, {"q": "A car travels at 20 m/s around a banked curve of radius 100 m (g = 10 m/s²). What is the ideal banking angle?", "explanation": "tanθ = v²/rg = 400/(100×10) = 0.4, so θ = tan⁻¹(0.4) ≈ 21.8°.", "type": "mcq", "options": ["About 33.7°", "About 21.8°", "About 45°", "About 11.3°"], "answer": 1}, {"q": "The main purpose of banking a road at a curve is to:", "explanation": "Banking tilts the road so part of the normal reaction points toward the center of the curve, supplying centripetal force and reducing dependence on friction, especially at higher speeds.", "type": "mcq", "options": ["Allow a component of the normal force to help provide the centripetal force, reducing reliance on friction", "Make the road surface smoother", "Increase the friction needed for the turn", "Reduce the speed limit on the road"], "answer": 0}, {"q": "The horizontal component of a projectile's velocity remains constant throughout its flight, ignoring air resistance.", "explanation": "With no horizontal forces acting, the horizontal velocity component does not change during the flight.", "type": "tf", "answer": true}, {"q": "The time of flight of a projectile launched horizontally from a height depends on its initial horizontal speed.", "explanation": "Time of flight for horizontal projection depends only on the height and g, t = √(2h/g); horizontal speed only affects the range, not the time.", "type": "tf", "answer": false}, {"q": "A conical pendulum's bob moves with constant speed along a horizontal circular path.", "explanation": "In steady conical pendulum motion, the bob moves in a horizontal circle at constant angular and linear speed.", "type": "tf", "answer": true}, {"q": "The ideal banking angle of a road depends on the mass of the vehicle using it.", "explanation": "In tanθ = v²/(rg), mass cancels out, so the ideal banking angle does not depend on the vehicle's mass.", "type": "tf", "answer": false}, {"q": "At the top of its trajectory, a projectile launched at an angle (other than 90°) has zero total velocity.", "explanation": "Only the vertical velocity component is zero at the top; the horizontal component v cosθ is still non-zero, so the total velocity is not zero.", "type": "tf", "answer": false}, {"q": "The curved path traced by a projectile is called a ______.", "explanation": "Combining constant horizontal velocity with uniformly accelerated vertical motion produces a parabolic path.", "type": "fill", "answer": "parabola"}, {"q": "For a projectile launched horizontally from height h, the time of flight is given by t = ______.", "explanation": "This comes from the vertical free-fall equation h = ½gt² solved for t.", "type": "fill", "answer": "√(2h/g)"}, {"q": "The formula for the ideal banking angle of a road is tanθ = ______.", "explanation": "This is derived by resolving the normal reaction and weight to supply the centripetal force on a frictionless banked curve.", "type": "fill", "answer": "v²/rg"}, {"q": "In uniform circular motion, the net force directed toward the center of the circle is called the ______ force.", "explanation": "The centripetal force continuously changes the direction of velocity, keeping the object moving in a circle.", "type": "fill", "answer": "centripetal"}, {"q": "For a projectile launched on level ground, the maximum horizontal range (for a given speed) is achieved at a launch angle of ______ degrees.", "explanation": "Range R = v²sin2θ/g is maximum when sin2θ = 1, i.e. θ = 45°.", "type": "fill", "answer": "45"}]}, {"unit": 8, "title": "Unit 8: Electric Force and Electric Field", "questions": [{"q": "Coulomb's law states that the electrostatic force between two point charges is:", "explanation": "Coulomb's law: F = kq1q2/r², so force increases with charge magnitude and decreases with the square of separation.", "type": "mcq", "options": ["Directly proportional to the product of the charges and inversely proportional to the square of the distance between them", "Independent of the distance between the charges", "Inversely proportional to the product of the charges", "Directly proportional to the distance between them"], "answer": 0}, {"q": "The mathematical form of Coulomb's law is:", "explanation": "Coulomb's law is F = kq1q2/r², where k is Coulomb's constant.", "type": "mcq", "options": ["F = kq1q2/r²", "F = kq1q2/r", "F = k(q1+q2)/r²", "F = kq1q2r²"], "answer": 0}, {"q": "Two point charges of 2 μC and 3 μC are separated by 0.1 m (k = 9×10⁹ N·m²/C²). Find the force between them.", "explanation": "F = kq1q2/r² = (9×10⁹)(2×10⁻⁶)(3×10⁻⁶)/(0.1)² = 9×10⁹×6×10⁻¹²/0.01 = 5.4 N.", "type": "mcq", "options": ["54 N", "0.54 N", "540 N", "5.4 N"], "answer": 3}, {"q": "Two equal charges of 4 μC each are placed 0.2 m apart (k = 9×10⁹ N·m²/C²). Find the force between them.", "explanation": "F = kq1q2/r² = (9×10⁹)(4×10⁻⁶)(4×10⁻⁶)/(0.2)² = 9×10⁹×1.6×10⁻¹¹/0.04 = 3.6 N.", "type": "mcq", "options": ["14.4 N", "7.2 N", "1.8 N", "3.6 N"], "answer": 3}, {"q": "The SI unit of electric charge is the:", "explanation": "Electric charge is measured in coulombs (C).", "type": "mcq", "options": ["Ampere", "Farad", "Coulomb", "Volt"], "answer": 2}, {"q": "The magnitude of the charge on a single electron (elementary charge) is approximately:", "explanation": "The elementary charge e ≈ 1.6 × 10⁻¹⁹ C.", "type": "mcq", "options": ["3.0 × 10⁸ C", "1.6 × 10⁻¹⁹ C", "6.6 × 10⁻³⁴ C", "9.1 × 10⁻³¹ C"], "answer": 1}, {"q": "Two point charges will repel each other if they:", "explanation": "Like charges (both positive or both negative) repel; unlike charges attract.", "type": "mcq", "options": ["Are both neutral", "Have the same sign", "Have opposite signs", "Are placed very far apart"], "answer": 1}, {"q": "The value of Coulomb's constant, k, in SI units is approximately:", "explanation": "Coulomb's constant k = 1/(4πε₀) ≈ 9 × 10⁹ N·m²/C².", "type": "mcq", "options": ["6.67 × 10⁻¹¹ N·m²/kg²", "3 × 10⁸ N·m²/C²", "9 × 10⁹ N·m²/C²", "1.6 × 10⁻¹⁹ N·m²/C²"], "answer": 2}, {"q": "If the distance between two point charges is doubled while the charges stay the same, the electrostatic force between them becomes:", "explanation": "Since F ∝ 1/r², doubling r reduces F by a factor of 2² = 4, so the new force is one quarter of the original.", "type": "mcq", "options": ["Twice as large", "Half as large", "Four times as large", "One quarter as large"], "answer": 3}, {"q": "Electric field intensity at a point is defined as:", "explanation": "Electric field intensity E = F/q, the force experienced per unit positive test charge.", "type": "mcq", "options": ["The force per unit positive test charge placed at that point", "The potential energy per unit volume", "The work done in moving a charge a unit distance", "The total charge enclosed at that point"], "answer": 0}, {"q": "The electric field intensity due to a point charge Q at distance r is given by:", "explanation": "E = kQ/r², derived from E = F/q using Coulomb's law.", "type": "mcq", "options": ["E = kQ/r²", "E = kQ/r", "E = kQr²", "E = kQ²/r"], "answer": 0}, {"q": "A point charge of 5 μC produces an electric field at a distance of 0.2 m (k = 9×10⁹ N·m²/C²). Find the field strength.", "explanation": "E = kQ/r² = (9×10⁹)(5×10⁻⁶)/(0.2)² = 4.5×10⁴/0.04 = 1.125×10⁶ N/C.", "type": "mcq", "options": ["1.125 × 10⁷ N/C", "1.125 × 10⁵ N/C", "1.125 × 10⁴ N/C", "1.125 × 10⁶ N/C"], "answer": 3}, {"q": "The SI unit of electric field intensity can be expressed as:", "explanation": "Electric field intensity has units of newtons per coulomb, equivalent to volts per metre.", "type": "mcq", "options": ["N·C", "J/C", "C/N", "N/C (or V/m)"], "answer": 3}, {"q": "Electric field lines around an isolated positive point charge:", "explanation": "Field lines originate on positive charges and point radially outward, showing the direction of force on a positive test charge.", "type": "mcq", "options": ["Point radially inward toward the charge", "Form closed loops around the charge", "Are parallel straight lines", "Point radially outward from the charge"], "answer": 3}, {"q": "Electric field lines around an isolated negative point charge:", "explanation": "Field lines terminate on negative charges, so they point radially inward toward the negative charge.", "type": "mcq", "options": ["Point radially inward toward the charge", "Are always horizontal", "Point radially outward from the charge", "Do not exist"], "answer": 0}, {"q": "The principle of superposition for electric fields states that the resultant field due to several charges is:", "explanation": "By superposition, each charge produces its own field independently, and the net field is the vector sum of all individual fields.", "type": "mcq", "options": ["Always zero", "The algebraic sum of the magnitudes only", "The vector sum of the individual fields due to each charge", "Equal to the field of the largest charge only"], "answer": 2}, {"q": "Two equal positive point charges are placed a fixed distance apart. The electric field at the midpoint between them is:", "explanation": "At the midpoint, each charge produces a field of equal magnitude but pointing away from itself (in opposite directions), so by superposition they cancel to zero.", "type": "mcq", "options": ["Maximum, because both fields add up", "Equal to the field of one charge alone", "Undefined", "Zero, because the two fields are equal in magnitude but opposite in direction"], "answer": 3}, {"q": "Electric potential at a point is defined as:", "explanation": "Electric potential V = W/q, the work done per unit charge to bring a small positive test charge from infinity to that point.", "type": "mcq", "options": ["The energy stored in a capacitor", "The work done per unit positive charge in bringing it from infinity to that point", "The rate of flow of charge", "The force per unit charge at that point"], "answer": 1}, {"q": "The electric potential at a distance r from a point charge Q is given by:", "explanation": "V = kQ/r, obtained by integrating the electric field from infinity to distance r.", "type": "mcq", "options": ["V = kQr", "V = kQ/r²", "V = kQ/r", "V = kQ²/r"], "answer": 2}, {"q": "A point charge of 2 μC is at a distance of 0.5 m from a point P (k = 9×10⁹ N·m²/C²). Find the electric potential at P.", "explanation": "V = kQ/r = (9×10⁹)(2×10⁻⁶)/0.5 = 18,000/0.5 = 36,000 V.", "type": "mcq", "options": ["36,000 V", "360,000 V", "3,600 V", "18,000 V"], "answer": 0}, {"q": "Potential difference between two points in an electric field is defined as:", "explanation": "Potential difference is the work done per unit positive charge moved between two points, V = W/q.", "type": "mcq", "options": ["The work done per unit charge in moving a charge between the two points", "The total charge between the two points", "The distance between the two points", "The electric field strength between the two points"], "answer": 0}, {"q": "The electric potential energy of two point charges q1 and q2 separated by distance r is given by:", "explanation": "Electrostatic potential energy U = kq1q2/r, the work needed to assemble the two charges from infinite separation.", "type": "mcq", "options": ["U = kq1q2r", "U = kq1q2/r²", "U = kq1q2/r", "U = k(q1+q2)/r"], "answer": 2}, {"q": "Charges of +1 μC and −2 μC are separated by 0.1 m (k = 9×10⁹ N·m²/C²). Find their electric potential energy.", "explanation": "U = kq1q2/r = (9×10⁹)(1×10⁻⁶)(−2×10⁻⁶)/0.1 = −0.018/0.1 = −0.18 J.", "type": "mcq", "options": ["+1.8 J", "−0.18 J", "−1.8 J", "+0.18 J"], "answer": 1}, {"q": "A capacitor is a device that mainly functions to:", "explanation": "A capacitor consists of two conductive plates separated by a dielectric and stores charge (and energy) when a potential difference is applied.", "type": "mcq", "options": ["Convert electrical energy directly into heat only", "Amplify electric current", "Store electric charge and energy in an electric field", "Generate electric charge from nothing"], "answer": 2}, {"q": "Capacitance of a capacitor is defined by the relation:", "explanation": "Capacitance C = Q/V, the charge stored per unit potential difference across the capacitor.", "type": "mcq", "options": ["C = V/Q", "C = Q/V", "C = Q + V", "C = QV"], "answer": 1}, {"q": "A capacitor stores a charge of 6 μC when the potential difference across it is 3 V. Find its capacitance.", "explanation": "C = Q/V = 6 μC / 3 V = 2 μF.", "type": "mcq", "options": ["2 μF", "3 μF", "0.5 μF", "18 μF"], "answer": 0}, {"q": "The energy stored in a charged capacitor of capacitance C at voltage V is given by:", "explanation": "Energy stored in a capacitor: U = ½CV² (equivalently ½QV or Q²/2C).", "type": "mcq", "options": ["U = CV", "U = ½CV²", "U = CV²", "U = C²V"], "answer": 1}, {"q": "A 4 μF capacitor is charged to a potential difference of 10 V. How much energy is stored in it?", "explanation": "U = ½CV² = ½(4×10⁻⁶)(10)² = ½(4×10⁻⁶)(100) = 2×10⁻⁴ J.", "type": "mcq", "options": ["4 × 10⁻⁵ J", "4 × 10⁻⁴ J", "2 × 10⁻⁴ J", "2 × 10⁻³ J"], "answer": 2}, {"q": "In an RC circuit, the time constant τ = RC represents:", "explanation": "The time constant τ = RC characterizes the rate of exponential charging or discharging; after one time constant, about 63% of the change has occurred.", "type": "mcq", "options": ["The maximum voltage the capacitor can reach", "The time for the charge/voltage on the capacitor to change by a factor of about 63% toward its final value", "The resistance of the capacitor plates", "The total energy stored in the capacitor"], "answer": 1}, {"q": "Which of the following is a practical application of capacitors?", "explanation": "Capacitors are widely used to store and quickly release energy (e.g., camera flashes) and to smooth out voltage fluctuations in power supply circuits.", "type": "mcq", "options": ["Converting AC current into magnetic fields only", "Storing energy for camera flashes and smoothing voltage in power supplies", "Measuring temperature directly", "Generating gravitational force"], "answer": 1}, {"q": "The electric field inside a conductor in electrostatic equilibrium is zero.", "explanation": "Free charges in a conductor rearrange themselves until the internal electric field cancels out, giving zero net field inside at equilibrium.", "type": "tf", "answer": true}, {"q": "Like electric charges attract each other.", "explanation": "Like charges repel each other; only unlike (opposite) charges attract.", "type": "tf", "answer": false}, {"q": "The electric potential energy of two charges with the same sign is positive.", "explanation": "Since U = kq1q2/r and q1q2 > 0 when both charges have the same sign, the potential energy is positive.", "type": "tf", "answer": true}, {"q": "The capacitance of a capacitor depends on the amount of charge currently stored on it.", "explanation": "Capacitance depends on the geometry of the plates (area, separation) and the dielectric between them, not on the charge or voltage applied.", "type": "tf", "answer": false}, {"q": "Inserting a dielectric material between the plates of a capacitor increases its capacitance.", "explanation": "A dielectric reduces the effective electric field between the plates for a given charge, allowing more charge to be stored per volt, thus increasing capacitance.", "type": "tf", "answer": true}, {"q": "The SI unit of capacitance is the ______.", "explanation": "Capacitance is measured in farads (F), named after Michael Faraday.", "type": "fill", "answer": "farad"}, {"q": "The energy stored in a charged capacitor is given by the formula U = ______.", "explanation": "This is derived from the work done to charge the capacitor gradually against the rising voltage.", "type": "fill", "answer": "½CV²"}, {"q": "Coulomb's law constant k has an approximate value of ______ N·m²/C².", "explanation": "This constant equals 1/(4πε₀), where ε₀ is the permittivity of free space.", "type": "fill", "answer": "9 × 10⁹"}, {"q": "The process by which a charged capacitor loses its stored charge through a resistor is called ______.", "explanation": "During discharging, the charge and voltage on the capacitor decay exponentially with time constant τ = RC.", "type": "fill", "answer": "discharging"}, {"q": "According to the principle of ______, the resultant electric field due to several point charges is the vector sum of the fields due to each individual charge.", "explanation": "This principle allows the net field of a charge distribution to be found by adding the individual field vectors.", "type": "fill", "answer": "superposition"}]}, {"unit": 9, "title": "Unit 9: Laws of Thermodynamics", "questions": [{"q": "Internal energy of a thermodynamic system is best described as:", "explanation": "Internal energy U is the sum of the microscopic kinetic energy (molecular motion) and potential energy (intermolecular forces) of all particles in the system.", "type": "mcq", "options": ["The sum of the kinetic and potential energies of all the molecules of the system", "The total heat supplied to the system", "The total work done by the system", "The temperature of the system alone"], "answer": 0}, {"q": "Thermal energy (heat) transferred between two systems occurs due to:", "explanation": "Heat flows spontaneously from a region of higher temperature to one of lower temperature until thermal equilibrium is reached.", "type": "mcq", "options": ["A difference in temperature between them", "A difference in volume between them", "A difference in pressure between them", "A difference in mass between them"], "answer": 0}, {"q": "The work done by a gas expanding at constant pressure P through a volume change ΔV is:", "explanation": "At constant pressure, work done by the gas is W = PΔV, from the definition W = ∫P dV.", "type": "mcq", "options": ["W = ΔV/P", "W = PΔV", "W = P/ΔV", "W = P + ΔV"], "answer": 1}, {"q": "A gas expands at a constant pressure of 2 × 10⁵ Pa, and its volume increases by 0.01 m³. Find the work done by the gas.", "explanation": "W = PΔV = (2×10⁵)(0.01) = 2,000 J.", "type": "mcq", "options": ["20,000 J", "2,000 J", "2 J", "200 J"], "answer": 1}, {"q": "A gas at constant pressure of 1 × 10⁵ Pa expands from 0.02 m³ to 0.05 m³. Find the work done by the gas.", "explanation": "ΔV = 0.05 − 0.02 = 0.03 m³. W = PΔV = (1×10⁵)(0.03) = 3,000 J.", "type": "mcq", "options": ["5,000 J", "300 J", "500 J", "3,000 J"], "answer": 3}, {"q": "The first law of thermodynamics is expressed mathematically as:", "explanation": "The first law states that the increase in internal energy equals heat added to the system minus the work done by the system, ΔU = Q − W.", "type": "mcq", "options": ["ΔU = Q − W", "ΔU = W − Q", "ΔU = QW", "ΔU = Q + W"], "answer": 0}, {"q": "A system absorbs 500 J of heat and does 200 J of work on its surroundings. Find the change in internal energy.", "explanation": "ΔU = Q − W = 500 − 200 = 300 J.", "type": "mcq", "options": ["−700 J", "700 J", "−300 J", "300 J"], "answer": 3}, {"q": "A gas releases 300 J of heat to its surroundings while 100 J of work is done on it. Find the change in internal energy of the gas.", "explanation": "Heat released means Q = −300 J; work done on the gas means W = −100 J (work done by gas is negative). ΔU = Q − W = −300 − (−100) = −200 J.", "type": "mcq", "options": ["−200 J", "−400 J", "200 J", "400 J"], "answer": 0}, {"q": "In the first law of thermodynamics (ΔU = Q − W), the work W is taken as positive when:", "explanation": "By the standard convention used here, W is positive when the system (gas) expands and does work on its surroundings.", "type": "mcq", "options": ["Heat is removed from the gas", "No volume change occurs", "The gas expands and does work on the surroundings", "The gas is compressed by the surroundings"], "answer": 2}, {"q": "In the first law of thermodynamics, heat Q is taken as positive when:", "explanation": "Q is positive when heat flows into the system from the surroundings.", "type": "mcq", "options": ["The system does work", "The volume remains constant", "Heat is added to the system", "Heat is removed from the system"], "answer": 2}, {"q": "For an ideal gas, the relationship between the molar specific heat capacities at constant pressure (Cp) and constant volume (Cv) is:", "explanation": "Mayer's relation for an ideal gas states Cp − Cv = R, where R is the universal gas constant.", "type": "mcq", "options": ["Cp + Cv = R", "Cp − Cv = R", "Cp × Cv = R", "Cp = Cv"], "answer": 1}, {"q": "Cp is greater than Cv for an ideal gas because:", "explanation": "At constant pressure, part of the heat supplied goes into expansion work (PΔV) in addition to raising internal energy, so more heat per degree is needed compared to constant volume, where all the heat raises only the internal energy.", "type": "mcq", "options": ["Cv includes energy for chemical reactions", "At constant pressure, the gas must also do work as it expands when heated, requiring extra energy", "At constant volume, the gas does more work", "There is no real difference between Cp and Cv"], "answer": 1}, {"q": "An isothermal process is one in which:", "explanation": "In an isothermal process, the system's temperature stays constant throughout, requiring heat exchange with a reservoir as the gas expands or is compressed.", "type": "mcq", "options": ["The temperature of the system remains constant", "No heat is exchanged", "The volume of the system remains constant", "The pressure of the system remains constant"], "answer": 0}, {"q": "For an ideal gas undergoing an isothermal process, the relationship between Q and W is:", "explanation": "Since internal energy of an ideal gas depends only on temperature, ΔU = 0 in an isothermal process, so from the first law Q = W.", "type": "mcq", "options": ["Q = 0", "ΔU = Q", "W = 0", "Q = W"], "answer": 3}, {"q": "An isochoric (isovolumetric) process is one in which:", "explanation": "In an isochoric process the gas is held at constant volume, so no work is done by or on the gas (W = 0).", "type": "mcq", "options": ["The pressure remains constant", "The volume remains constant", "The temperature remains constant", "No heat is exchanged"], "answer": 1}, {"q": "A gas undergoes an isochoric process and absorbs 400 J of heat. Find the change in its internal energy.", "explanation": "At constant volume, W = 0, so ΔU = Q − W = 400 − 0 = 400 J.", "type": "mcq", "options": ["200 J", "0 J", "800 J", "400 J"], "answer": 3}, {"q": "An isobaric process is one in which:", "explanation": "In an isobaric process, the gas pressure stays constant while volume and temperature may change.", "type": "mcq", "options": ["The temperature remains constant", "The volume remains constant", "The pressure remains constant", "No work is done"], "answer": 2}, {"q": "A gas expands isobarically at 1.5 × 10⁵ Pa, with its volume increasing by 0.02 m³, while absorbing 3,500 J of heat. Find the change in internal energy.", "explanation": "W = PΔV = (1.5×10⁵)(0.02) = 3,000 J. ΔU = Q − W = 3,500 − 3,000 = 500 J.", "type": "mcq", "options": ["6,500 J", "3,500 J", "3,000 J", "500 J"], "answer": 3}, {"q": "An adiabatic process is one in which:", "explanation": "An adiabatic process occurs in a thermally insulated system, so Q = 0.", "type": "mcq", "options": ["No heat is exchanged with the surroundings (Q = 0)", "Pressure remains constant", "No work is done (W = 0)", "Temperature remains constant"], "answer": 0}, {"q": "For an ideal gas undergoing an adiabatic process, the change in internal energy is related to work by:", "explanation": "Since Q = 0 in an adiabatic process, the first law gives ΔU = Q − W = −W.", "type": "mcq", "options": ["ΔU = Q", "ΔU = W", "ΔU = −W", "ΔU = 0"], "answer": 2}, {"q": "For an ideal gas undergoing a reversible adiabatic process, pressure and volume are related by:", "explanation": "The adiabatic condition for an ideal gas is PVᵞ = constant, where γ = Cp/Cv is the ratio of specific heats.", "type": "mcq", "options": ["PV² = constant", "PVᵞ = constant (γ = Cp/Cv)", "P/V = constant", "PV = constant"], "answer": 1}, {"q": "Which thermodynamic process involves absolutely no heat transfer between the system and its surroundings?", "explanation": "By definition, an adiabatic process has Q = 0, meaning no heat enters or leaves the system.", "type": "mcq", "options": ["Isochoric", "Isothermal", "Isobaric", "Adiabatic"], "answer": 3}, {"q": "For an ideal gas, which process results in no change in internal energy?", "explanation": "Since internal energy of an ideal gas depends only on temperature, and temperature is constant in an isothermal process, ΔU = 0.", "type": "mcq", "options": ["Adiabatic", "Isochoric", "Isothermal", "Isobaric"], "answer": 2}, {"q": "A heat engine is a device that:", "explanation": "A heat engine operates in cycles, absorbing heat from a hot reservoir, converting part of it into useful mechanical work, and rejecting the rest to a cold reservoir.", "type": "mcq", "options": ["Converts chemical energy into light only", "Converts heat energy into mechanical work in a cyclic process", "Converts mechanical work directly into electrical energy", "Stores thermal energy indefinitely without loss"], "answer": 1}, {"q": "The Otto cycle is the idealized thermodynamic cycle that models the operation of:", "explanation": "The Otto cycle describes the ideal operation of spark-ignition petrol engines, where fuel-air mixture is ignited by a spark.", "type": "mcq", "options": ["Petrol (spark-ignition) engines", "Steam turbines", "Diesel (compression-ignition) engines", "Refrigerators only"], "answer": 0}, {"q": "The Diesel cycle is the idealized thermodynamic cycle that models the operation of:", "explanation": "The Diesel cycle models compression-ignition engines, where fuel is injected into highly compressed hot air and ignites without a spark.", "type": "mcq", "options": ["Solar panels", "Diesel (compression-ignition) engines", "Petrol (spark-ignition) engines", "Electric motors"], "answer": 1}, {"q": "The idealized Otto cycle consists of:", "explanation": "The Otto cycle consists of two adiabatic processes (compression and expansion) and two constant-volume processes (heat addition and rejection).", "type": "mcq", "options": ["Two isobaric and two isochoric processes", "Two isothermal and two isobaric processes", "Two adiabatic and two isochoric (constant-volume) processes", "Four isothermal processes"], "answer": 2}, {"q": "The main difference between the Diesel cycle and the Otto cycle is that in the Diesel cycle, heat is added:", "explanation": "In the Diesel cycle, combustion (heat addition) occurs at constant pressure, unlike the constant-volume heat addition in the Otto cycle.", "type": "mcq", "options": ["At constant pressure, rather than constant volume", "At constant volume, as in the Otto cycle", "Only during the compression stroke", "At constant temperature"], "answer": 0}, {"q": "The efficiency of a heat engine is generally defined as:", "explanation": "Efficiency is the fraction of the absorbed heat converted into useful work: η = W/Qh = (Qh − Qc)/Qh = 1 − Qc/Qh.", "type": "mcq", "options": ["η = Qc/Qh", "η = Qh/Qc", "η = W/Qh = 1 − Qc/Qh", "η = Qh − Qc"], "answer": 2}, {"q": "A heat engine absorbs 1000 J of heat from a hot reservoir and rejects 600 J to a cold reservoir. Find its efficiency.", "explanation": "η = 1 − Qc/Qh = 1 − 600/1000 = 1 − 0.6 = 0.4 = 40%.", "type": "mcq", "options": ["20%", "80%", "60%", "40%"], "answer": 3}, {"q": "In an isothermal process, the internal energy of an ideal gas remains constant.", "explanation": "Since internal energy of an ideal gas depends only on temperature, and temperature does not change in an isothermal process, ΔU = 0.", "type": "tf", "answer": true}, {"q": "In an adiabatic process, heat is exchanged freely between the system and its surroundings.", "explanation": "An adiabatic process is defined by Q = 0; the system is thermally insulated from its surroundings.", "type": "tf", "answer": false}, {"q": "No heat engine operating between two reservoirs can have an efficiency of 100%.", "explanation": "Some heat must always be rejected to the cold reservoir in a cyclic heat engine, so the efficiency is always less than 100%.", "type": "tf", "answer": true}, {"q": "For an ideal gas, the molar specific heat capacity at constant pressure (Cp) is greater than that at constant volume (Cv).", "explanation": "At constant pressure, additional heat is needed to also perform expansion work, so Cp > Cv, consistent with Cp − Cv = R.", "type": "tf", "answer": true}, {"q": "In an isochoric process, the gas does work on its surroundings as it is heated.", "explanation": "Since volume does not change in an isochoric process, W = PΔV = 0; no work is done by or on the gas.", "type": "tf", "answer": false}, {"q": "The first law of thermodynamics states that the change in internal energy is given by ΔU = ______.", "explanation": "This expresses conservation of energy: heat added to a system either increases its internal energy or is used to do work.", "type": "fill", "answer": "Q − W"}, {"q": "A thermodynamic process that occurs at constant volume is called an ______ process.", "explanation": "Because volume does not change, no work is done during this process (W = 0).", "type": "fill", "answer": "isochoric (isovolumetric)"}, {"q": "A thermodynamic process in which no heat enters or leaves the system is called an ______ process.", "explanation": "This occurs in a thermally insulated system, so Q = 0 and ΔU = −W.", "type": "fill", "answer": "adiabatic"}, {"q": "The idealized thermodynamic cycle that models the operation of diesel (compression-ignition) engines is called the ______ cycle.", "explanation": "In this cycle, heat is added at constant pressure, unlike the constant-volume heat addition of the Otto cycle.", "type": "fill", "answer": "Diesel"}, {"q": "For an ideal gas, the relationship between the specific heat capacities is Cp − Cv = ______.", "explanation": "This relation, known as Mayer's relation, accounts for the extra work done during constant-pressure heating.", "type": "fill", "answer": "R (the universal/molar gas constant)"}]}, {"unit": 10, "title": "Unit 10: General Structure of the Solar System", "questions": [{"q": "An astronomical unit (AU) is defined as:", "explanation": "1 AU is the mean distance from the Earth to the Sun, approximately 1.496 × 10¹¹ m, and is used as a convenient unit for distances within the solar system.", "type": "mcq", "options": ["The diameter of the Sun", "The distance light travels in one year", "The average distance between the Earth and the Sun (about 1.5 × 10¹¹ m)", "The distance between the Earth and the Moon"], "answer": 2}, {"q": "A light year is a unit used to measure:", "explanation": "A light year is a distance unit, defined as the distance light travels in a vacuum in one year, about 9.46 × 10¹² km.", "type": "mcq", "options": ["The brightness of a star", "Distance, equal to how far light travels in one year (~9.46 × 10¹² km)", "The speed of light itself", "Time taken for light to travel around the Earth"], "answer": 1}, {"q": "Which unit is most appropriate for expressing distances to stars outside the solar system?", "explanation": "Interstellar distances are enormous, so astronomers use light years (or parsecs) rather than kilometers for convenience.", "type": "mcq", "options": ["Centimeter", "Light year", "Kilometer", "Millimeter"], "answer": 1}, {"q": "According to the widely accepted theory of the origin of the solar system, it formed from:", "explanation": "The nebular hypothesis proposes that the solar system formed from the gravitational collapse of a giant rotating cloud of gas and dust called the solar nebula.", "type": "mcq", "options": ["A collision between two fully formed stars", "The gravitational collapse of a rotating cloud of gas and dust (solar nebula)", "A sudden creation with no prior matter", "The explosion of a nearby planet"], "answer": 1}, {"q": "According to the nebular hypothesis, the Sun formed from:", "explanation": "As the solar nebula collapsed under gravity, most of the mass concentrated at the center, becoming hot and dense enough to form the Sun.", "type": "mcq", "options": ["Material left over after all the planets had formed", "The dense, hot central region of the collapsing solar nebula", "A cloud of ice and comets only", "The outer edge of the solar nebula"], "answer": 1}, {"q": "According to the nebular hypothesis, the planets formed by:", "explanation": "In the flattened, rotating protoplanetary disk around the young Sun, dust and gas particles gradually collided and stuck together (accretion) to form planetesimals and eventually planets.", "type": "mcq", "options": ["Accretion of dust and gas particles in the rotating disk surrounding the young Sun", "Being captured from interstellar space fully formed", "Splitting off directly from the Sun's surface in one event", "Condensation of pure light energy"], "answer": 0}, {"q": "A solar eclipse occurs when:", "explanation": "During a solar eclipse, the Moon comes between the Sun and Earth, casting its shadow on parts of Earth's surface.", "type": "mcq", "options": ["The Moon passes directly between the Sun and the Earth, blocking sunlight from reaching part of the Earth", "The Moon moves behind the Earth's shadow", "The Earth passes directly between the Sun and the Moon", "The Sun passes between the Earth and the Moon"], "answer": 0}, {"q": "A lunar eclipse occurs when:", "explanation": "During a lunar eclipse, the Earth lies between the Sun and the Moon, and the Moon passes through the Earth's shadow.", "type": "mcq", "options": ["The Earth passes between the Sun and the Moon, casting its shadow on the Moon", "The Moon passes between the Sun and the Earth", "The Moon moves outside its orbit", "The Sun passes between the Earth and the Moon"], "answer": 0}, {"q": "A solar eclipse can only occur during which phase of the Moon?", "explanation": "A solar eclipse requires the Moon to be between the Earth and Sun, which happens only at new moon, when the Moon's illuminated side faces away from Earth.", "type": "mcq", "options": ["New moon", "Full moon", "First quarter", "Last quarter"], "answer": 0}, {"q": "A lunar eclipse can only occur during which phase of the Moon?", "explanation": "A lunar eclipse requires the Earth to be between the Sun and Moon, which happens only at full moon.", "type": "mcq", "options": ["Last quarter", "New moon", "First quarter", "Full moon"], "answer": 3}, {"q": "Eclipses do not occur at every new moon and every full moon mainly because:", "explanation": "Because the Moon's orbital plane is tilted about 5° to the ecliptic, the Sun, Earth and Moon are usually not perfectly aligned, so eclipses occur only a few times a year.", "type": "mcq", "options": ["The Sun's position changes every month", "The Earth's rotation prevents eclipses most months", "The Moon is too far from the Earth", "The Moon's orbit is tilted by about 5° relative to Earth's orbital plane (the ecliptic)"], "answer": 3}, {"q": "The main types of solar eclipse are:", "explanation": "Solar eclipses are classified as total (Sun fully blocked), partial (Sun partly blocked), or annular (a ring of Sun visible around the Moon).", "type": "mcq", "options": ["Total, waxing, and waning", "Total, partial, and annular", "Near and far", "Full, half, and quarter"], "answer": 1}, {"q": "The main types of lunar eclipse are:", "explanation": "Lunar eclipses are classified as total (Moon fully in Earth's umbra), partial (Moon partly in the umbra), and penumbral (Moon only in the lighter penumbral shadow).", "type": "mcq", "options": ["Waxing and waning only", "Near and far", "Annular, crescent, and gibbous", "Total, partial, and penumbral"], "answer": 3}, {"q": "The phase of the Moon that occurs a few days after new moon, when a thin sliver of the Moon is illuminated and increasing, is called:", "explanation": "As the illuminated portion grows (waxes) from new moon toward first quarter, this thin, growing sliver is the waxing crescent.", "type": "mcq", "options": ["Full moon", "Waning gibbous", "Waxing crescent", "Waning crescent"], "answer": 2}, {"q": "The phase of the Moon between the first quarter and full moon, when more than half is illuminated and increasing, is called:", "explanation": "As illumination increases (waxes) past half (first quarter) toward full moon, more than half is lit; this phase is the waxing gibbous.", "type": "mcq", "options": ["Waxing crescent", "Waning gibbous", "Last quarter", "Waxing gibbous"], "answer": 3}, {"q": "The phases of the Moon are caused by:", "explanation": "The Moon always has one half lit by the Sun; as it orbits Earth, the visible fraction of that lit half from Earth's perspective changes, producing phases.", "type": "mcq", "options": ["The changing relative positions of the Sun, Earth, and Moon, which change how much of the Moon's sunlit side is visible from Earth", "Changes in the Moon's actual shape", "The Earth blocking the Moon most nights", "The Moon's surface changing color"], "answer": 0}, {"q": "The inner (terrestrial) planets of the solar system are:", "explanation": "The four planets closest to the Sun—Mercury, Venus, Earth, and Mars—are called terrestrial (inner) planets because they are small and rocky.", "type": "mcq", "options": ["Earth, Mars, Jupiter, and Saturn", "Mercury, Venus, Earth, and Mars", "Jupiter, Saturn, Uranus, and Neptune", "Venus, Earth, Jupiter, and Neptune"], "answer": 1}, {"q": "The outer (Jovian/gas giant) planets of the solar system are:", "explanation": "Jupiter, Saturn, Uranus, and Neptune lie beyond the asteroid belt and are large gas/ice giants, called outer or Jovian planets.", "type": "mcq", "options": ["Earth, Mars, Uranus, and Neptune", "Mercury, Venus, Earth, and Mars", "Mars, Jupiter, Saturn, and Uranus", "Jupiter, Saturn, Uranus, and Neptune"], "answer": 3}, {"q": "Compared to the outer planets, the inner (terrestrial) planets are generally:", "explanation": "Terrestrial planets are relatively small, made of rock and metal, and have high average densities compared to the gas giants.", "type": "mcq", "options": ["Surrounded by prominent ring systems", "Composed mainly of ice and gas", "Smaller, rocky, and of higher density", "Larger, gaseous, and of low density"], "answer": 2}, {"q": "Compared to the inner planets, the outer (Jovian) planets are generally:", "explanation": "The outer planets are much larger than the terrestrial planets, composed mainly of hydrogen, helium and ices, and have lower average densities.", "type": "mcq", "options": ["Made entirely of solid rock", "Closer to the Sun", "Larger, mostly made of gas/ice, and of lower average density", "Smaller and rockier"], "answer": 2}, {"q": "The asteroid belt, containing most of the solar system's asteroids, is located:", "explanation": "The main asteroid belt lies in the region between the orbits of Mars and Jupiter.", "type": "mcq", "options": ["Between the orbits of Mercury and Venus", "Between the orbits of Mars and Jupiter", "Between the Earth and the Moon", "Beyond the orbit of Neptune"], "answer": 1}, {"q": "Comets are best described as:", "explanation": "Comets are often described as \"dirty snowballs\"—small icy bodies containing dust and frozen gases that develop glowing comas and tails when near the Sun.", "type": "mcq", "options": ["Man-made objects orbiting the Earth", "Large rocky planets found beyond Neptune", "Small bodies made mainly of ice, dust, and frozen gases (\"dirty snowballs\")", "Clouds of hot plasma near the Sun"], "answer": 2}, {"q": "As a comet approaches the Sun, its tail always points:", "explanation": "Solar wind and radiation pressure push the vaporized gas and dust away from the comet's nucleus, so the tail always points away from the Sun regardless of the comet's direction of travel.", "type": "mcq", "options": ["Away from the Sun, due to solar wind and radiation pressure", "Toward the nearest planet", "In the direction of the comet's motion only", "Toward the Sun"], "answer": 0}, {"q": "A meteoroid that survives its passage through Earth's atmosphere and lands on the surface is called a:", "explanation": "A meteoroid burning in the atmosphere produces a visible streak called a meteor; if a fragment reaches the ground, it is called a meteorite.", "type": "mcq", "options": ["Meteorite", "Comet", "Meteor", "Asteroid"], "answer": 0}, {"q": "The bright streak of light seen in the sky when a small space rock burns up in Earth's atmosphere is called a:", "explanation": "The visible flash of light caused by a meteoroid burning up due to friction with the atmosphere is called a meteor, commonly known as a shooting star.", "type": "mcq", "options": ["Asteroid", "Meteorite", "Meteor (shooting star)", "Comet"], "answer": 2}, {"q": "A constellation is best defined as:", "explanation": "A constellation is a recognizable grouping of stars, as observed in the sky from Earth, historically named after animals, objects, or mythological characters.", "type": "mcq", "options": ["A group of planets orbiting together", "A single very bright star", "A recognizable pattern or group of stars as seen from Earth, often named after mythological figures or objects", "A cluster of comets"], "answer": 2}, {"q": "Which of the following is a well-known constellation visible in the night sky?", "explanation": "Orion (\"the Hunter\") is one of the most recognizable and widely known constellations, easily identified by its distinctive belt of three stars.", "type": "mcq", "options": ["Mercury", "Milky Way disk", "Andromeda galaxy cluster only", "Orion"], "answer": 3}, {"q": "In the celestial coordinate system, the coordinate that corresponds to longitude on Earth is called:", "explanation": "Right ascension is measured eastward along the celestial equator and serves the same purpose as longitude does on Earth's surface.", "type": "mcq", "options": ["Right ascension", "Azimuth", "Altitude", "Declination"], "answer": 0}, {"q": "In the celestial coordinate system, the coordinate that corresponds to latitude on Earth is called:", "explanation": "Declination is measured as the angular distance north or south of the celestial equator, analogous to latitude on Earth.", "type": "mcq", "options": ["Zenith angle", "Declination", "Ecliptic longitude", "Right ascension"], "answer": 1}, {"q": "Which planet is closest to the Sun?", "explanation": "Mercury is the innermost planet of the solar system, orbiting closest to the Sun.", "type": "mcq", "options": ["Earth", "Mars", "Venus", "Mercury"], "answer": 3}, {"q": "The Sun is a star located approximately at the center of our solar system.", "explanation": "The Sun contains most of the solar system's mass and all the planets orbit around it, so it lies at the center of the solar system.", "type": "tf", "answer": true}, {"q": "A solar eclipse occurs when the Earth passes directly between the Sun and the Moon.", "explanation": "That description is a lunar eclipse; a solar eclipse occurs when the Moon passes between the Sun and the Earth.", "type": "tf", "answer": false}, {"q": "The outer planets (Jupiter, Saturn, Uranus, Neptune) are also called terrestrial planets.", "explanation": "The outer planets are called Jovian or gas giant planets; terrestrial planets refers to the small, rocky inner planets.", "type": "tf", "answer": false}, {"q": "The main asteroid belt is located between the orbits of Mars and Jupiter.", "explanation": "Most asteroids in the solar system orbit the Sun within this belt between Mars and Jupiter.", "type": "tf", "answer": true}, {"q": "Jupiter is the largest planet in the solar system.", "explanation": "Jupiter has by far the greatest mass and volume of any planet in the solar system.", "type": "tf", "answer": true}, {"q": "The distance that light travels through a vacuum in one year is called a ______.", "explanation": "This unit (~9.46 × 10¹² km) is used to express the vast distances between stars and galaxies.", "type": "fill", "answer": "light year"}, {"q": "A meteoroid that survives its passage through Earth's atmosphere and reaches the ground is called a ______.", "explanation": "Most meteoroids burn up completely as meteors; only a fraction survive to become meteorites.", "type": "fill", "answer": "meteorite"}, {"q": "A recognizable pattern of stars as seen from Earth, often given a traditional name, is called a ______.", "explanation": "Constellations have been used historically for navigation and storytelling, such as Orion and Ursa Major.", "type": "fill", "answer": "constellation"}, {"q": "The widely accepted scientific theory that the solar system formed from a collapsing cloud of gas and dust is called the ______ hypothesis.", "explanation": "This theory explains the formation of the Sun and planets from the same rotating cloud of material.", "type": "fill", "answer": "nebular (solar nebula)"}, {"q": "On the celestial coordinate system, the coordinate analogous to latitude on Earth is called ______.", "explanation": "Declination measures how far north or south a celestial object is from the celestial equator.", "type": "fill", "answer": "declination"}]}];

  function loadProgress(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {};
  }
  function saveProgress(p){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
  }
  var progress = loadProgress(); // { unitIndex: {correct, attempted, done} }

  var homeView = document.getElementById("homeView");
  var quizView = document.getElementById("quizView");
  var summaryView = document.getElementById("summaryView");
  var unitGrid = document.getElementById("unitGrid");
  var overallScoreVal = document.getElementById("overallScoreVal");

  var state = { unitIdx: null, qIdx: 0, correct: 0, attempted: 0, answered: false };

  function normalize(s){
    return (s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  }
  function answerVariants(ans){
    // split things like "underdamped (lightly damped)" or "rad/s (radian per second)"
    var out = [];
    var cleaned = ans.replace(/[()]/g, "|");
    cleaned.split(/[|\/,;]| or /i).forEach(function(part){
      var n = normalize(part);
      if(n) out.push(n);
    });
    var whole = normalize(ans);
    if(whole) out.push(whole);
    return out;
  }
  function fuzzyMatch(userText, correctText){
    var u = normalize(userText);
    if(!u) return false;
    var variants = answerVariants(correctText);
    for(var i=0;i<variants.length;i++){
      var v = variants[i];
      if(!v) continue;
      if(u === v) return true;
      if(v.length > 3 && (u.indexOf(v) !== -1 || v.indexOf(u) !== -1)) return true;
    }
    return false;
  }

  function totalQuestions(){
    var t=0; DATA.forEach(function(u){ t += u.questions.length; }); return t;
  }
  function overallStats(){
    var correct=0, attempted=0;
    Object.keys(progress).forEach(function(k){
      correct += progress[k].correct||0;
      attempted += progress[k].attempted||0;
    });
    return {correct:correct, attempted:attempted};
  }
  function refreshOverall(){
    var s = overallStats();
    overallScoreVal.textContent = s.correct + "/" + totalQuestions();
  }

  function renderUnitList(){
    unitGrid.innerHTML = "";
    DATA.forEach(function(unit, idx){
      var p = progress[idx];
      var btn = document.createElement("button");
      btn.className = "unit-card";
      var done = p && p.done;
      btn.innerHTML =
        '<span class="num">U' + unit.unit + '</span>' +
        '<span class="info">' +
          '<span class="t">' + escapeHtml(unit.title.replace(/^Unit \d+:\s*/,"")) + '</span>' +
          '<span class="s">' + unit.questions.length + ' questions</span>' +
        '</span>' +
        '<span class="badge' + (done ? ' done' : '') + '">' +
          (p ? (p.correct + '/' + unit.questions.length) : 'Start') +
        '</span>';
      btn.addEventListener("click", function(){ startUnit(idx); });
      unitGrid.appendChild(btn);
    });
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // ---- shuffling: new question order and answer order on every attempt ----
  function shuffleArr(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function shuffleOptions(q){
    if(q.type !== "mcq") return q;
    var idx = q.options.map(function(_, i){ return i; });
    // options like "None of the above" stay in their place at the end
    var movable = idx.filter(function(i){ return !/of the above/i.test(q.options[i]); });
    var shuffled = shuffleArr(movable.slice());
    var order = idx.slice(), k = 0;
