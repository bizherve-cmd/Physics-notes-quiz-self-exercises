<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>S3 Physics Quiz</title>
<style>
  :root{
    --bg:#f4f6f9;
    --surface:#ffffff;
    --surface-2:#eceff4;
    --text:#161b26;
    --text-dim:#5b6475;
    --border:#dde2ea;
    --accent:#0f7a73;
    --accent-ink:#ffffff;
    --accent-soft:#e3f3f1;
    --correct:#1c8a4b;
    --correct-soft:#e5f6ec;
    --incorrect:#c23b3b;
    --incorrect-soft:#fbe9e9;
    --shadow: 0 1px 2px rgba(20,24,34,.06), 0 8px 24px -12px rgba(20,24,34,.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e131b;
      --surface:#161d29;
      --surface-2:#1d2532;
      --text:#e9edf4;
      --text-dim:#95a0b3;
      --border:#2a3342;
      --accent:#3fd7c8;
      --accent-ink:#08211d;
      --accent-soft:#12312d;
      --correct:#4fce8a;
      --correct-soft:#123526;
      --incorrect:#ff8383;
      --incorrect-soft:#3a1c1e;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e131b;
    --surface:#161d29;
    --surface-2:#1d2532;
    --text:#e9edf4;
    --text-dim:#95a0b3;
    --border:#2a3342;
    --accent:#3fd7c8;
    --accent-ink:#08211d;
    --accent-soft:#12312d;
    --correct:#4fce8a;
    --correct-soft:#123526;
    --incorrect:#ff8383;
    --incorrect-soft:#3a1c1e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-inline:16px;
    padding-block:24px;
  }
  h1,h2,h3{font-family:"Sora", ui-sans-serif, system-ui, sans-serif; text-wrap:balance; margin:0;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}

  .wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:20px;}

  .app-header{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .app-header .eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:4px;}
  .app-header h1{font-size:22px; font-weight:700;}
  .byline{font-size:13px; color:var(--text-dim); margin-top:6px;}

  .score-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:6px 12px; font-size:13px; color:var(--text-dim); box-shadow:var(--shadow);
    white-space:nowrap;
  }
  .score-pill strong{color:var(--text); font-family:"IBM Plex Mono", monospace;}

  /* ---- unit list ---- */
  .unit-grid{display:flex; flex-direction:column; gap:10px;}
  .unit-card{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; box-shadow:var(--shadow); cursor:pointer; text-align:left;
    font:inherit; color:inherit; width:100%;
  }
  .unit-card:hover{border-color:var(--accent);}
  .unit-card .num{
    font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--accent);
    background:var(--accent-soft); border-radius:8px; padding:4px 8px; flex:none;
  }
  .unit-card .info{flex:1; min-width:0;}
  .unit-card .info .t{font-weight:600; font-size:15px;}
  .unit-card .info .s{font-size:12.5px; color:var(--text-dim); margin-top:2px;}
  .unit-card .badge{
    font-size:12px; font-family:"IBM Plex Mono",monospace; flex:none;
    padding:4px 9px; border-radius:999px; border:1px solid var(--border); color:var(--text-dim);
  }
  .unit-card .badge.done{color:var(--correct); border-color:var(--correct); background:var(--correct-soft);}

  /* ---- quiz view ---- */
  .quiz-header{display:flex; align-items:center; gap:10px;}
  .back-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:10px; padding:8px 10px; cursor:pointer; font-size:14px; line-height:1;
    flex:none;
  }
  .quiz-header .title{flex:1; min-width:0;}
  .quiz-header .title .t{font-weight:700; font-size:15px;}
  .quiz-header .title .s{font-size:12.5px; color:var(--text-dim);}

  .progress-track{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); border-radius:999px; transition:width .25s ease;}

  .qcard{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:16px;
  }
  .qmeta{font-size:12.5px; color:var(--text-dim); font-family:"IBM Plex Mono",monospace;}
  .qtext{font-size:17px; font-weight:600; line-height:1.45;}

  .options{display:flex; flex-direction:column; gap:9px;}
  .opt{
    display:flex; align-items:flex-start; gap:10px; text-align:left;
    background:var(--surface-2); border:1.5px solid var(--border); border-radius:12px;
    padding:11px 13px; cursor:pointer; font:inherit; color:inherit; font-size:14.5px; line-height:1.4;
    transition:border-color .12s ease, background .12s ease;
  }
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:disabled{cursor:default;}
  .opt .k{
    font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:13px; flex:none;
    width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
  }
  .opt.correct{background:var(--correct-soft); border-color:var(--correct);}
  .opt.correct .k{background:var(--correct); color:#fff; border-color:var(--correct);}
  .opt.incorrect{background:var(--incorrect-soft); border-color:var(--incorrect);}
  .opt.incorrect .k{background:var(--incorrect); color:#fff; border-color:var(--incorrect);}

  .fill-row{display:flex; gap:8px; flex-wrap:wrap;}
  .fill-row input{
    flex:1; min-width:160px; font:inherit; font-size:14.5px; padding:11px 13px;
    border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text);
  }
  .fill-row input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .btn{
    font:inherit; font-weight:600; font-size:14px; border-radius:12px; border:1px solid transparent;
    padding:11px 16px; cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:disabled{opacity:.5; cursor:default;}
  .btn-ghost{background:var(--surface); border-color:var(--border); color:var(--text);}

  .feedback{
    border-radius:12px; padding:13px 14px; font-size:14px; line-height:1.5; display:none;
    border:1px solid var(--border);
  }
  .feedback.show{display:block;}
  .feedback.correct{background:var(--correct-soft); border-color:var(--correct); color:var(--text);}
  .feedback.incorrect{background:var(--incorrect-soft); border-color:var(--incorrect); color:var(--text);}
  .feedback .verdict{font-weight:700; margin-bottom:4px;}
  .feedback .verdict.v-correct{color:var(--correct);}
  .feedback .verdict.v-incorrect{color:var(--incorrect);}

  .actions{display:flex; justify-content:flex-end; gap:8px;}

  .summary{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:26px 20px; text-align:center; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .summary .big{font-family:"IBM Plex Mono",monospace; font-size:40px; font-weight:700;}
  .summary .sub{color:var(--text-dim); font-size:14px;}
  .summary .actions2{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; justify-content:center;}

  [hidden]{display:none !important;}
  footer{text-align:center; font-size:12px; color:var(--text-dim); padding-top:8px;}
</style>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<div class="wrap">

  <div class="app-header">
    <div>
      <div class="eyebrow">Senior 3 Physics &middot; Self-Study Practice</div>
      <h1 id="pageTitle">Senior 3 Physics Quiz</h1>
      <div class="byline">Compiled by BIZIYAREMYE Donat, GS BYUMBA INYANGE &middot; 10 units &middot; 400 questions</div>
    </div>
    <div class="score-pill" id="overallScore">
      <span>Overall</span><strong id="overallScoreVal">0/0</strong>
    </div>
  </div>

  <div id="homeView">
    <div class="unit-grid" id="unitGrid"></div>
  </div>

  <div id="quizView" hidden>
    <div class="quiz-header">
      <button class="back-btn" id="backBtn" aria-label="Back to units">&larr;</button>
      <div class="title">
        <div class="t" id="quizUnitTitle">Unit</div>
        <div class="s" id="quizProgressLabel">Question 1 of 40</div>
      </div>
      <div class="score-pill"><span>Score</span><strong id="unitScoreVal">0/0</strong></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

    <div class="qcard">
      <div class="qmeta" id="qmeta">MCQ</div>
      <div class="qtext" id="qtext"></div>
      <div class="options" id="optionsWrap"></div>
      <div class="fill-row" id="fillWrap" hidden>
        <input id="fillInput" type="text" placeholder="Type your answer&hellip;" autocomplete="off">
        <button class="btn btn-primary" id="fillSubmit">Check</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="btn btn-ghost" id="skipBtn">Skip</button>
        <button class="btn btn-primary" id="nextBtn" disabled>Next</button>
      </div>
    </div>
  </div>

  <div id="summaryView" hidden>
    <div class="summary">
      <div class="eyebrow">Unit complete</div>
      <h2 id="summaryUnitTitle">Unit</h2>
      <div class="big" id="summaryScore">0/40</div>
      <div class="sub" id="summarySub">Nice work.</div>
      <div class="actions2">
        <button class="btn btn-ghost" id="retryBtn">Retry unit</button>
        <button class="btn btn-primary" id="toUnitsBtn">Choose another unit</button>
      </div>
    </div>
  </div>

  <footer>Self-study practice book &middot; tap an answer for instant feedback</footer>
</div>

<script>
(function(){
  "use strict";
  var LEVEL_KEY = "s3";
  var STORAGE_KEY = "physics-quiz-progress-" + LEVEL_KEY;
  var DATA = [{"unit": 1, "title": "Unit 1: Uniform Circular Motion", "questions": [{"q": "What is the shape of the path (trajectory) followed by an object in circular motion?", "explanation": "By definition, circular motion means the object's trajectory is a circle of fixed radius.", "type": "mcq", "options": ["A circle", "A parabola", "An ellipse", "A straight line"], "answer": 0}, {"q": "Angular displacement is measured in which unit?", "explanation": "Angular displacement (θ) is the angle swept and is measured in radians (rad).", "type": "mcq", "options": ["Seconds", "Metres", "Newtons", "Radians"], "answer": 3}, {"q": "How many radians correspond to one full revolution (360°)?", "explanation": "One complete revolution corresponds to 360°, which equals 2π radians.", "type": "mcq", "options": ["π/2 rad", "π rad", "2π rad", "4π rad"], "answer": 2}, {"q": "Convert 180° to radians.", "explanation": "180° = π radians, since 360° = 2π rad, so 180° = 2π/2 = π rad.", "type": "mcq", "options": ["π rad", "2π rad", "π/2 rad", "3π/2 rad"], "answer": 0}, {"q": "Which formula correctly defines angular velocity ω?", "explanation": "Angular velocity is the rate of change of angular displacement with time, ω = Δθ/Δt.", "type": "mcq", "options": ["ω = Δt/Δθ", "ω = Δθ/Δt", "ω = F/r", "ω = m·v"], "answer": 1}, {"q": "What is the SI unit of angular velocity?", "explanation": "Angular velocity has units of radians per second (rad/s).", "type": "mcq", "options": ["m/s", "Hz", "rad/s", "N"], "answer": 2}, {"q": "The period (T) of circular motion is best described as:", "explanation": "Period T is the time required for one complete revolution around the circle.", "type": "mcq", "options": ["The angle swept per second", "The distance travelled in one second", "The number of revolutions per second", "The time taken to complete one full revolution"], "answer": 3}, {"q": "Frequency (f) of circular motion is defined as:", "explanation": "Frequency is the number of complete revolutions per second, measured in hertz (Hz).", "type": "mcq", "options": ["The time for one revolution", "The speed of the object", "The radius of the circular path", "The number of revolutions completed per second"], "answer": 3}, {"q": "Which equation correctly relates period T and frequency f?", "explanation": "Period and frequency are reciprocals of each other: T = 1/f.", "type": "mcq", "options": ["T = 2f", "T = f²", "T = 1/f", "T = f"], "answer": 2}, {"q": "An object moves in a circle of radius 0.5 m with angular velocity 4 rad/s. Find its linear speed v.", "explanation": "Using v = ωr = 4 × 0.5 = 2 m/s.", "type": "mcq", "options": ["4 m/s", "2 m/s", "0.5 m/s", "8 m/s"], "answer": 1}, {"q": "An object completes one revolution of a circle of radius 2 m in 4 s. What is its linear speed?", "explanation": "Circumference = 2πr = 2π(2) = 12.57 m; v = distance/time = 12.57/4 ≈ 3.14 m/s.", "type": "mcq", "options": ["3.14 m/s", "12.56 m/s", "1.57 m/s", "6.28 m/s"], "answer": 0}, {"q": "In circular motion, the centripetal force always acts:", "explanation": "Centripetal force is directed radially inward, toward the centre of the circular path.", "type": "mcq", "options": ["In the direction of motion", "Toward the centre of the circle", "Tangent to the circle", "Away from the centre of the circle"], "answer": 1}, {"q": "Which formula correctly gives the centripetal force?", "explanation": "The centripetal force is Fc = mv²/r (equivalently Fc = mω²r).", "type": "mcq", "options": ["Fc = mr/v²", "Fc = m/rv²", "Fc = mv/r", "Fc = mv²/r"], "answer": 3}, {"q": "A 2 kg object moves in a circle of radius 1.5 m at 3 m/s. Calculate the centripetal force.", "explanation": "Fc = mv²/r = 2 × 3²/1.5 = 2 × 9/1.5 = 12 N.", "type": "mcq", "options": ["9 N", "18 N", "6 N", "12 N"], "answer": 3}, {"q": "A 0.5 kg mass moves with angular velocity 2 rad/s in a circle of radius 2 m. Find the centripetal force using Fc = mω²r.", "explanation": "Fc = mω²r = 0.5 × 2² × 2 = 0.5 × 4 × 2 = 4 N.", "type": "mcq", "options": ["4 N", "8 N", "1 N", "2 N"], "answer": 0}, {"q": "Centrifugal force is best described as:", "explanation": "Centrifugal force is not a real force; it is an apparent outward force experienced by an observer in a rotating (non-inertial) frame of reference.", "type": "mcq", "options": ["A force that increases the speed of a rotating object", "A real force pulling objects toward the centre", "The same as gravitational force", "An apparent (fictitious) force felt in a rotating reference frame, directed outward"], "answer": 3}, {"q": "What provides the centripetal force needed for a car to move around a curved road?", "explanation": "Frictional force between the tyres and the road surface supplies the centripetal force for cornering.", "type": "mcq", "options": ["Friction between the tyres and the road", "The engine's power", "Gravity alone", "Air resistance"], "answer": 0}, {"q": "What provides the centripetal force that keeps a satellite in orbit around the Earth?", "explanation": "The Earth's gravitational pull on the satellite acts as the centripetal force keeping it in orbit.", "type": "mcq", "options": ["Thrust from the satellite's engine", "Gravitational force between Earth and satellite", "Friction with the atmosphere", "Magnetic force"], "answer": 1}, {"q": "If the centripetal force on an object moving in a circle suddenly disappears, the object will:", "explanation": "By Newton's first law, without a centripetal force the object continues in a straight line tangent to its circular path at that instant.", "type": "mcq", "options": ["Move directly toward the centre", "Continue moving in the same circle", "Move in a straight line tangent to the circle", "Stop immediately"], "answer": 2}, {"q": "Why are roads banked (tilted) on sharp curves?", "explanation": "Banking provides a component of the normal force toward the centre, reducing dependence on friction for the centripetal force.", "type": "mcq", "options": ["To increase air resistance", "To slow vehicles down", "To reduce the reliance on friction and allow vehicles to turn safely at higher speeds", "To make the road look attractive"], "answer": 2}, {"q": "If the radius of a circular path increases while speed stays constant, the centripetal force:", "explanation": "Since Fc = mv²/r, for constant m and v, Fc is inversely proportional to r, so a larger r means a smaller Fc.", "type": "mcq", "options": ["Becomes zero", "Decreases", "Stays the same", "Increases"], "answer": 1}, {"q": "If the speed of an object in circular motion is doubled while radius and mass stay constant, the centripetal force becomes:", "explanation": "Since Fc ∝ v², doubling v increases Fc by a factor of 2² = 4.", "type": "mcq", "options": ["Twice as large", "Four times as large", "Half as large", "The same"], "answer": 1}, {"q": "The second hand of a clock takes 60 s to complete one revolution. What is its angular velocity?", "explanation": "ω = 2π/T = 2π/60 ≈ 0.105 rad/s.", "type": "mcq", "options": ["0.017 rad/s", "1.05 rad/s", "0.105 rad/s", "6.28 rad/s"], "answer": 2}, {"q": "The minute hand of a clock completes one revolution in 3600 s. What is its angular velocity?", "explanation": "ω = 2π/T = 2π/3600 ≈ 0.00175 rad/s.", "type": "mcq", "options": ["0.00175 rad/s", "0.105 rad/s", "0.0175 rad/s", "1.75 rad/s"], "answer": 0}, {"q": "Approximately how long does the Earth take to complete one rotation about its own axis?", "explanation": "The Earth rotates once on its axis in about 24 hours (one day).", "type": "mcq", "options": ["24 hours", "12 hours", "365 days", "1 hour"], "answer": 0}, {"q": "A geostationary satellite has an orbital period of approximately:", "explanation": "A geostationary satellite orbits with a period equal to Earth's rotation period, about 24 hours, so it stays above the same point on Earth.", "type": "mcq", "options": ["1 year", "6 hours", "1 hour", "24 hours"], "answer": 3}, {"q": "In uniform circular motion, which quantity remains constant?", "explanation": "In uniform circular motion the speed (magnitude of velocity) is constant, but the direction of velocity continuously changes.", "type": "mcq", "options": ["Direction of motion", "Acceleration direction", "Speed (magnitude of velocity)", "Velocity (as a vector)"], "answer": 2}, {"q": "At any instant, the velocity of an object in circular motion points:", "explanation": "The instantaneous velocity is always directed tangentially to the circle at the object's position.", "type": "mcq", "options": ["Toward the centre of the circle", "Tangent to the circular path", "Perpendicular to the plane of motion", "Away from the centre"], "answer": 1}, {"q": "In uniform circular motion, the acceleration of the object is directed:", "explanation": "The centripetal acceleration always points toward the centre of the circular path, causing the change in direction of velocity.", "type": "mcq", "options": ["Toward the centre of the circle", "Tangent to the path", "In the direction of velocity", "Away from the centre"], "answer": 0}, {"q": "A wheel makes 300 revolutions in 60 seconds. What is its period of rotation?", "explanation": "f = 300/60 = 5 Hz, so T = 1/f = 1/5 = 0.2 s.", "type": "mcq", "options": ["5 s", "0.2 s", "300 s", "0.1 s"], "answer": 1}, {"q": "In uniform circular motion, the speed of the object remains constant.", "explanation": "Uniform circular motion is defined by constant speed, even though velocity direction and acceleration change.", "type": "tf", "answer": true}, {"q": "In uniform circular motion, the velocity vector of the object is constant.", "explanation": "Although speed is constant, the direction of velocity continuously changes, so the velocity vector is not constant.", "type": "tf", "answer": false}, {"q": "Centripetal force acts away from the centre of the circular path.", "explanation": "Centripetal force always acts toward the centre of the circle, not away from it.", "type": "tf", "answer": false}, {"q": "Centrifugal force is a real force acting on an object observed from a stationary (inertial) frame of reference.", "explanation": "Centrifugal force is a fictitious (apparent) force that only appears to act in a rotating, non-inertial frame of reference.", "type": "tf", "answer": false}, {"q": "The period T of circular motion is inversely proportional to the frequency f.", "explanation": "Since T = 1/f, period and frequency are inversely related.", "type": "tf", "answer": true}, {"q": "The SI unit of angular velocity is ______.", "explanation": "Angular velocity is expressed in radians per second because it measures angle swept per unit time.", "type": "fill", "answer": "rad/s (radian per second)"}, {"q": "The force that keeps an object moving along a circular path, directed toward the centre, is called the ______ force.", "explanation": "This inward-directed force is necessary to continuously change the direction of the object's velocity.", "type": "fill", "answer": "centripetal"}, {"q": "One complete revolution corresponds to an angle of ______ radians.", "explanation": "A full circle subtends an angle of 2π radians (360°) at the centre.", "type": "fill", "answer": "2π"}, {"q": "The time taken for an object to complete one full revolution around a circle is called the ______.", "explanation": "The period (T) is measured in seconds and represents the duration of one complete cycle.", "type": "fill", "answer": "period"}, {"q": "In circular motion, the velocity vector at any point is always directed ______ to the circle.", "explanation": "The instantaneous velocity is tangential because it represents the direction of motion at that point on the circle.", "type": "fill", "answer": "tangent(ially)"}]}, {"unit": 2, "title": "Unit 2: Linear Momentum, Impulse and Collisions", "questions": [{"q": "Which formula correctly defines linear momentum?", "explanation": "Linear momentum is the product of an object's mass and velocity: p = mv.", "type": "mcq", "options": ["p = v/m", "p = mv", "p = m + v", "p = m/v"], "answer": 1}, {"q": "What is the SI unit of linear momentum?", "explanation": "Momentum has units of mass × velocity, giving kg·m/s (equivalent to N·s).", "type": "mcq", "options": ["J", "N", "W", "kg·m/s"], "answer": 3}, {"q": "Calculate the momentum of a 4 kg object moving at 5 m/s.", "explanation": "p = mv = 4 × 5 = 20 kg·m/s.", "type": "mcq", "options": ["1.25 kg·m/s", "9 kg·m/s", "20 kg·m/s", "45 kg·m/s"], "answer": 2}, {"q": "Which formula correctly defines impulse?", "explanation": "Impulse is the product of force and the time interval over which it acts: J = FΔt.", "type": "mcq", "options": ["J = FΔt", "J = F/Δt", "J = F + Δt", "J = mΔt"], "answer": 0}, {"q": "Impulse delivered to an object is equal to its:", "explanation": "By the impulse-momentum theorem, J = FΔt = Δp, so impulse equals the change in momentum.", "type": "mcq", "options": ["Change in speed only", "Change in mass", "Change in momentum", "Change in kinetic energy"], "answer": 2}, {"q": "What is the SI unit of impulse?", "explanation": "Impulse can be expressed in newton-seconds (N·s), which is dimensionally equal to kg·m/s.", "type": "mcq", "options": ["W/s", "kg/s", "N·s", "J·s"], "answer": 2}, {"q": "A force of 50 N acts on an object for 0.2 s. What is the impulse delivered?", "explanation": "J = FΔt = 50 × 0.2 = 10 N·s.", "type": "mcq", "options": ["50.2 N·s", "10 N·s", "2.5 N·s", "100 N·s"], "answer": 1}, {"q": "An object's momentum changes from 10 kg·m/s to 30 kg·m/s in 2 s. What is the average force acting on it?", "explanation": "Δp = 30 − 10 = 20 kg·m/s; F = Δp/Δt = 20/2 = 10 N.", "type": "mcq", "options": ["10 N", "5 N", "20 N", "40 N"], "answer": 0}, {"q": "The law of conservation of linear momentum applies to:", "explanation": "Total momentum is conserved only when the net external force on the system is zero (an isolated/closed system).", "type": "mcq", "options": ["Only explosions", "Any system, regardless of external forces", "Only elastic collisions", "An isolated system with no net external force"], "answer": 3}, {"q": "Which best describes an elastic collision?", "explanation": "In a perfectly elastic collision, both momentum and total kinetic energy are conserved, and the objects move apart afterward.", "type": "mcq", "options": ["Only heat is produced", "Objects separate after impact and total kinetic energy is conserved", "Objects stick together and kinetic energy is lost", "Momentum is not conserved"], "answer": 1}, {"q": "Which best describes a perfectly inelastic collision?", "explanation": "In a perfectly inelastic collision, the objects stick together after impact; momentum is conserved but kinetic energy is not.", "type": "mcq", "options": ["The objects bounce apart with no energy loss", "Kinetic energy is fully conserved", "Momentum is not conserved", "The colliding objects stick together and move with a common velocity"], "answer": 3}, {"q": "A 2 kg trolley moving at 5 m/s collides and sticks to a stationary 3 kg trolley. Find their common velocity after collision.", "explanation": "Using conservation of momentum: (2×5 + 3×0) = (2+3)v → 10 = 5v → v = 2 m/s.", "type": "mcq", "options": ["1 m/s", "3 m/s", "2 m/s", "5 m/s"], "answer": 2}, {"q": "A moving ball collides elastically head-on with an identical stationary ball. What happens?", "explanation": "For an elastic head-on collision between equal masses, the velocities are exchanged: the incoming ball stops and the target ball moves with the initial velocity.", "type": "mcq", "options": ["The moving ball bounces back with the same speed", "Both balls stop", "The moving ball stops and the stationary ball moves off with the original velocity", "Both balls move off together at half the speed"], "answer": 2}, {"q": "How do airbags in cars help reduce injury during a collision?", "explanation": "Airbags extend the time (Δt) over which the passenger's momentum changes, which reduces the force (F = Δp/Δt) exerted on the body.", "type": "mcq", "options": ["They reduce the driver's momentum to zero instantly", "They increase the force on the driver for a shorter time", "They prevent any momentum change at all", "They increase the time over which the driver's momentum changes, reducing the force experienced"], "answer": 3}, {"q": "How do seat belts help protect passengers in a crash?", "explanation": "Seat belts stretch slightly and restrain the body over a longer time, decreasing the force needed to stop the passenger's momentum.", "type": "mcq", "options": ["They increase the passenger's momentum", "They increase the force on the passenger instantly", "They extend the stopping time, reducing the force on the passenger's body", "They have no effect on force or time"], "answer": 2}, {"q": "Rocket propulsion works mainly on the principle of:", "explanation": "As gases are expelled backward with momentum, an equal and opposite momentum is given to the rocket, propelling it forward, in line with conservation of momentum.", "type": "mcq", "options": ["Air resistance", "Conservation of energy only", "Conservation of linear momentum", "Gravitational attraction"], "answer": 2}, {"q": "Why does a gun recoil when fired?", "explanation": "Since total momentum before firing is zero, the gun must move backward with momentum equal in magnitude but opposite in direction to the bullet's forward momentum.", "type": "mcq", "options": ["Momentum is conserved: the gun gains momentum equal and opposite to the bullet's momentum", "The bullet pushes air backward", "Friction in the barrel pushes it back", "The gun loses mass suddenly"], "answer": 0}, {"q": "A 0.02 kg bullet is fired at 400 m/s from a 4 kg gun. Find the recoil speed of the gun.", "explanation": "Momentum conservation: 0.02 × 400 = 4 × v → v = 8/4 = 2 m/s.", "type": "mcq", "options": ["2 m/s", "20 m/s", "8 m/s", "0.2 m/s"], "answer": 0}, {"q": "In an isolated system, the total momentum before a collision compared to after the collision is:", "explanation": "For an isolated system with no external forces, total momentum before equals total momentum after the collision.", "type": "mcq", "options": ["Equal (conserved)", "Unrelated", "Always greater after", "Always greater before"], "answer": 0}, {"q": "Which of the following is a vector quantity?", "explanation": "Momentum has both magnitude and direction (p = mv, and velocity is a vector), so it is a vector quantity.", "type": "mcq", "options": ["Kinetic energy", "Mass", "Speed", "Momentum"], "answer": 3}, {"q": "A 3 kg cart moving right at 4 m/s collides and sticks to a 2 kg cart moving left at 3 m/s. Taking rightward as positive, find their common velocity after collision.", "explanation": "Total momentum = 3(4) + 2(−3) = 12 − 6 = 6 kg·m/s. Combined mass = 5 kg. v = 6/5 = 1.2 m/s (to the right).", "type": "mcq", "options": ["3.0 m/s", "2.0 m/s", "0.6 m/s", "1.2 m/s"], "answer": 3}, {"q": "Newton's second law, expressed in terms of momentum, states that force equals:", "explanation": "Newton's second law can be written as F = Δp/Δt, the rate of change of momentum.", "type": "mcq", "options": ["The rate of change of momentum", "Momentum divided by mass", "The change in mass over time", "Momentum multiplied by time"], "answer": 0}, {"q": "A heavy truck and a light car travel at the same speed. Which has the greater momentum?", "explanation": "Since p = mv and both have the same v, the truck's larger mass gives it greater momentum.", "type": "mcq", "options": ["Neither has momentum", "The truck, because it has greater mass", "Both have equal momentum", "The car, because it is more agile"], "answer": 1}, {"q": "Why does a boxer 'ride the punch' by moving their head back when hit?", "explanation": "Moving back extends the time over which the momentum changes, lowering the average force (since F = Δp/Δt) and reducing injury.", "type": "mcq", "options": ["To increase the force of impact", "To increase the time of impact, which reduces the force experienced", "It has no physical effect", "To increase their opponent's momentum"], "answer": 1}, {"q": "A stationary object of mass 10 kg explodes into two fragments. What is the total momentum of the fragments immediately after the explosion?", "explanation": "Since the object was initially at rest, total initial momentum was zero; by conservation, the fragments' momenta must sum to zero (equal and opposite).", "type": "mcq", "options": ["Always positive", "Zero, since total momentum is conserved from the initial rest state", "Equal to the momentum of the larger fragment only", "Impossible to determine"], "answer": 1}, {"q": "A 10 kg object at rest explodes into two pieces: a 4 kg piece moving at 9 m/s and a 6 kg piece. Find the speed of the 6 kg piece.", "explanation": "By conservation of momentum, 4 × 9 = 6 × v → v = 36/6 = 6 m/s, moving in the opposite direction to the 4 kg piece.", "type": "mcq", "options": ["9 m/s", "4 m/s", "3 m/s", "6 m/s"], "answer": 3}, {"q": "Which type of collision conserves total kinetic energy?", "explanation": "Only elastic collisions conserve both momentum and total kinetic energy.", "type": "mcq", "options": ["Elastic collision", "Explosive collision", "Perfectly inelastic collision", "All collisions conserve kinetic energy"], "answer": 0}, {"q": "Which type of collision results in the colliding bodies moving off together?", "explanation": "In a perfectly inelastic collision, the objects stick together and move with one common velocity afterward.", "type": "mcq", "options": ["Elastic collision", "A collision with no momentum change", "Perfectly inelastic collision", "None of the above"], "answer": 2}, {"q": "If the mass of an object doubles while its velocity stays the same, its momentum:", "explanation": "Since p = mv, doubling the mass while velocity is unchanged doubles the momentum.", "type": "mcq", "options": ["Stays the same", "Doubles", "Halves", "Quadruples"], "answer": 1}, {"q": "On a force–time graph, the area under the graph represents:", "explanation": "Since impulse J = FΔt, the area under a force-time graph gives the total impulse.", "type": "mcq", "options": ["The impulse delivered to the object", "The object's velocity", "The object's kinetic energy", "The object's mass"], "answer": 0}, {"q": "Momentum is conserved only during elastic collisions.", "explanation": "Momentum is conserved in any isolated collision, whether elastic or inelastic; only kinetic energy conservation is limited to elastic collisions.", "type": "tf", "answer": false}, {"q": "In a perfectly inelastic collision, the colliding objects move together with a common velocity after impact.", "explanation": "This is the defining feature of a perfectly inelastic collision.", "type": "tf", "answer": true}, {"q": "Impulse is equal to the rate of change of momentum.", "explanation": "Impulse equals the total change in momentum (J = Δp); it is force, not impulse, that equals the rate of change of momentum.", "type": "tf", "answer": false}, {"q": "A rocket can accelerate in the vacuum of space because momentum is conserved between the rocket and the expelled exhaust gases.", "explanation": "The rocket does not need air to push against; it moves forward as expelled gases carry momentum backward, conserving total momentum.", "type": "tf", "answer": true}, {"q": "Kinetic energy is always conserved in every type of collision.", "explanation": "Kinetic energy is conserved only in elastic collisions; in inelastic collisions, some kinetic energy is converted to heat, sound, or deformation.", "type": "tf", "answer": false}, {"q": "The SI unit of momentum is ______.", "explanation": "Momentum is mass (kg) times velocity (m/s), giving units of kg·m/s.", "type": "fill", "answer": "kg·m/s"}, {"q": "The product of force and the time for which it acts is called ______.", "explanation": "Impulse (J = FΔt) measures the overall effect of a force acting over a time interval.", "type": "fill", "answer": "impulse"}, {"q": "A collision in which the colliding objects stick together and move as one is called a(n) ______ collision.", "explanation": "This type of collision conserves momentum but not kinetic energy, as the objects combine and move together.", "type": "fill", "answer": "perfectly inelastic"}, {"q": "The law of conservation of momentum states that the total momentum of an isolated system remains ______.", "explanation": "As long as no external force acts on the system, its total momentum does not change over time.", "type": "fill", "answer": "constant"}, {"q": "The backward movement of a gun when it is fired is called ______.", "explanation": "Recoil occurs because momentum is conserved: the gun moves backward with momentum equal and opposite to the bullet's forward momentum.", "type": "fill", "answer": "recoil"}]}, {"unit": 3, "title": "Unit 3: Renewable and Non-Renewable Energy Sources", "questions": [{"q": "What is meant by an 'energy source'?", "explanation": "An energy source is anything (natural or man-made) that provides energy which can be converted into a useful form, such as electricity or heat.", "type": "mcq", "options": ["A unit used to measure energy", "A machine that converts heat to work only", "A material or process from which usable energy can be obtained", "A device that stores electricity"], "answer": 2}, {"q": "Which of the following is a renewable energy source?", "explanation": "Solar energy is renewable because sunlight is continuously and naturally replenished, unlike fossil fuels.", "type": "mcq", "options": ["Natural gas", "Coal", "Oil", "Solar energy"], "answer": 3}, {"q": "Which of the following is a non-renewable energy source?", "explanation": "Coal is a fossil fuel formed over millions of years and cannot be replenished within a human lifetime, making it non-renewable.", "type": "mcq", "options": ["Coal", "Solar", "Wind", "Hydro"], "answer": 0}, {"q": "Which device converts sunlight directly into electricity?", "explanation": "Solar panels use photovoltaic cells to convert sunlight directly into electrical energy.", "type": "mcq", "options": ["Solar (photovoltaic) panel", "Biomass digester", "Wind turbine", "Hydro turbine"], "answer": 0}, {"q": "A wind turbine converts:", "explanation": "Wind turbines use blades turned by moving air to drive a generator, converting kinetic energy into electricity.", "type": "mcq", "options": ["Chemical energy into heat energy", "Kinetic energy of moving air into electrical energy", "Nuclear energy into mechanical energy", "Heat energy into light energy"], "answer": 1}, {"q": "Hydroelectric power is generated using the energy of:", "explanation": "Hydroelectric plants use the kinetic and potential energy of moving/falling water to turn turbines and generate electricity.", "type": "mcq", "options": ["Burning coal", "Geothermal heat", "Wind currents", "Falling or flowing water"], "answer": 3}, {"q": "Which of these is an example of biomass energy?", "explanation": "Biomass energy comes from organic materials such as wood, crop residues, and animal waste, which can be burned or converted into fuel.", "type": "mcq", "options": ["Uranium", "Petroleum", "Wood and crop waste", "Natural gas"], "answer": 2}, {"q": "Geothermal energy is derived from:", "explanation": "Geothermal energy comes from the natural heat produced within the Earth's crust and interior.", "type": "mcq", "options": ["Burning fossil fuels", "Heat stored inside the Earth", "The Sun's rays", "Ocean tides"], "answer": 1}, {"q": "Which gas released from burning fossil fuels is the main contributor to global warming?", "explanation": "Carbon dioxide (CO2) is a major greenhouse gas released when fossil fuels are burned, and it traps heat in the atmosphere.", "type": "mcq", "options": ["Oxygen", "Nitrogen", "Helium", "Carbon dioxide"], "answer": 3}, {"q": "Fossil fuels (coal, oil, natural gas) were formed from:", "explanation": "Fossil fuels form from the buried, decomposed remains of ancient organisms subjected to heat and pressure over millions of years.", "type": "mcq", "options": ["Remains of dead plants and animals over millions of years", "Solar radiation", "Volcanic rocks", "Ocean water evaporation"], "answer": 0}, {"q": "Why are fossil fuels considered non-renewable?", "explanation": "Because fossil fuels form over geological timescales, the supply on Earth is finite and cannot be replenished quickly.", "type": "mcq", "options": ["They can be regenerated within a year", "They are abundant and easy to find", "They take millions of years to form and exist in a finite supply", "They do not produce pollution"], "answer": 2}, {"q": "Which gases mainly cause acid rain when released from burning fossil fuels?", "explanation": "Sulfur dioxide and nitrogen oxides react with water vapour in the atmosphere to form acidic compounds that fall as acid rain.", "type": "mcq", "options": ["Carbon monoxide and helium", "Hydrogen and methane", "Sulfur dioxide and nitrogen oxides", "Oxygen and nitrogen"], "answer": 2}, {"q": "Rwanda generates a significant part of its electricity from which renewable source?", "explanation": "Rwanda relies heavily on hydropower plants (e.g., on the Rusizi, Nyabarongo, and other rivers) for a large share of its electricity.", "type": "mcq", "options": ["Tidal power", "Coal power", "Nuclear power", "Hydropower"], "answer": 3}, {"q": "What valuable energy resource is found dissolved in the deep waters of Lake Kivu?", "explanation": "Lake Kivu contains large amounts of dissolved methane gas that can be extracted and used to generate electricity.", "type": "mcq", "options": ["Uranium ore", "Coal deposits", "Methane gas", "Crude oil"], "answer": 2}, {"q": "Which renewable energy source has strong potential in Rwanda due to its sunny climate?", "explanation": "Rwanda receives abundant sunlight throughout the year, giving it strong potential for solar power generation.", "type": "mcq", "options": ["Wave energy", "Tidal energy", "Solar energy", "Nuclear energy"], "answer": 2}, {"q": "'Energy security' in the context of renewable energy transition mainly refers to:", "explanation": "Energy security means ensuring a dependable, adequate, and stable energy supply, which renewables can strengthen by reducing dependence on imported fuels.", "type": "mcq", "options": ["Reducing the price of imported fuel only", "A reliable and stable supply of energy for a country's needs", "Increasing the number of power plants regardless of source", "Having a locked storage facility for fuel"], "answer": 1}, {"q": "How can renewable energy support rural development?", "explanation": "Small-scale and off-grid renewable systems, such as solar home systems, can provide electricity to remote communities without extending the national grid.", "type": "mcq", "options": ["By discouraging the use of electricity in villages", "Through off-grid solar systems that bring electricity to remote areas", "It has no effect on rural areas", "By requiring rural areas to connect to large centralized coal plants"], "answer": 1}, {"q": "Which of the following is an economic benefit of switching to renewable energy?", "explanation": "Renewable energy projects can create local jobs and reduce a country's need to spend money importing fossil fuels.", "type": "mcq", "options": ["Reduced energy security", "Higher greenhouse gas emissions", "Increased dependence on imported fuel", "Job creation and reduced spending on imported fossil fuels"], "answer": 3}, {"q": "How does using renewable energy benefit public health?", "explanation": "Renewable sources like solar and wind produce little to no air pollution, reducing respiratory and cardiovascular illnesses linked to burning fossil fuels.", "type": "mcq", "options": ["It reduces air pollution, lowering rates of respiratory diseases", "It increases air pollution from smoke", "It increases exposure to sulfur dioxide", "It has no impact on health"], "answer": 0}, {"q": "Climate change is primarily driven by:", "explanation": "The buildup of greenhouse gases (especially CO2) from burning fossil fuels traps more heat in the atmosphere, driving climate change.", "type": "mcq", "options": ["Increased use of solar panels", "An increase in greenhouse gas emissions from human activity", "A decrease in greenhouse gases", "Reduced deforestation"], "answer": 1}, {"q": "Which of the following energy sources is NOT a fossil fuel?", "explanation": "Coal, oil, and natural gas are fossil fuels formed from ancient organic matter, while solar energy comes directly from sunlight and is renewable.", "type": "mcq", "options": ["Solar energy", "Oil", "Natural gas", "Coal"], "answer": 0}, {"q": "Wind is generated mainly due to:", "explanation": "Differences in solar heating across the Earth's surface create pressure differences that cause air to move as wind.", "type": "mcq", "options": ["The rotation of wind turbines", "Uneven heating of the Earth's atmosphere by the Sun", "Ocean currents alone", "Volcanic eruptions"], "answer": 1}, {"q": "The water cycle that powers hydroelectricity is ultimately driven by energy from:", "explanation": "Solar energy evaporates water, which later falls as rain and flows through rivers, making hydropower indirectly solar-driven.", "type": "mcq", "options": ["The Moon", "The Sun (which causes evaporation)", "The Earth's core", "Nuclear reactions in power plants"], "answer": 1}, {"q": "Which of the following is a common cause of water pollution linked to non-renewable energy sources?", "explanation": "Oil spills from drilling, transportation, or storage accidents can severely pollute rivers, lakes, and oceans.", "type": "mcq", "options": ["Geothermal drilling for heat only", "Solar panel installation", "Wind turbine operation", "Oil spills during extraction or transport"], "answer": 3}, {"q": "How is nuclear energy typically classified?", "explanation": "Nuclear power relies on uranium, a finite mineral resource, so it is generally classified as non-renewable, even though it produces low CO2 emissions.", "type": "mcq", "options": ["Renewable, because uranium is unlimited", "Non-renewable, because it relies on a finite supply of uranium", "Not an energy source at all", "The same as solar energy"], "answer": 1}, {"q": "What is a major disadvantage of solar energy as a power source?", "explanation": "Solar power generation drops at night and during cloudy weather, making it an intermittent (variable) energy source.", "type": "mcq", "options": ["It is intermittent, depending on sunlight availability and weather", "It cannot be used to generate electricity", "It produces large amounts of carbon dioxide", "It requires burning of fuel"], "answer": 0}, {"q": "What is a key advantage of wind energy over fossil fuels?", "explanation": "Wind energy generates electricity without burning any fuel and without direct greenhouse gas emissions, though it depends on wind availability.", "type": "mcq", "options": ["It requires burning of coal", "It causes more air pollution", "It produces no emissions during operation and has no fuel cost", "It is always available regardless of weather"], "answer": 2}, {"q": "Which of the following best explains 'sustainability' in relation to energy sources?", "explanation": "Sustainable energy use meets current needs while preserving resources and the environment for future generations.", "type": "mcq", "options": ["Only using non-renewable resources", "Ignoring environmental effects of energy production", "Using resources faster than they can be replenished", "Meeting present energy needs without compromising the ability of future generations to meet theirs"], "answer": 3}, {"q": "Deforestation for fuelwood in some parts of Rwanda is linked mainly to reliance on which energy source?", "explanation": "Heavy reliance on wood and charcoal (biomass) for cooking and heating can lead to deforestation if not managed sustainably.", "type": "mcq", "options": ["Biomass (wood fuel)", "Hydropower", "Solar energy", "Geothermal energy"], "answer": 0}, {"q": "Which of the following best describes 'energy transition' as taught in this unit?", "explanation": "Energy transition refers to the gradual move away from fossil fuels toward cleaner, renewable energy sources for sustainability, security, and health reasons.", "type": "mcq", "options": ["The gradual shift from relying on non-renewable sources toward renewable energy sources", "Converting electrical energy into heat", "Storing energy in batteries", "Switching entirely and instantly from renewables to fossil fuels"], "answer": 0}, {"q": "Non-renewable energy sources can be replenished within a human lifetime.", "explanation": "Non-renewable sources such as coal, oil, and natural gas take millions of years to form, so they cannot be replenished quickly.", "type": "tf", "answer": false}, {"q": "Burning coal releases carbon dioxide, which contributes to global warming.", "explanation": "Coal is a carbon-rich fossil fuel, and burning it releases significant amounts of CO2 into the atmosphere.", "type": "tf", "answer": true}, {"q": "Geothermal energy comes from heat stored inside the Earth.", "explanation": "Geothermal energy is harnessed from the natural heat found within the Earth's crust and interior.", "type": "tf", "answer": true}, {"q": "Rwanda has little to no potential for solar power because of insufficient sunlight.", "explanation": "Rwanda actually receives abundant sunlight throughout the year, giving it strong potential for solar energy development.", "type": "tf", "answer": false}, {"q": "Methane gas extracted from Lake Kivu can be used to generate electricity.", "explanation": "Methane gas dissolved in Lake Kivu is extracted and used as fuel in gas-powered plants to generate electricity for Rwanda.", "type": "tf", "answer": true}, {"q": "Energy sources that can be naturally replenished within a short period of time are called ______ energy sources.", "explanation": "Renewable sources such as solar, wind, hydro, biomass, and geothermal are continuously or quickly replenished by nature.", "type": "fill", "answer": "renewable"}, {"q": "Coal, oil, and natural gas are collectively known as ______.", "explanation": "These non-renewable resources formed from the remains of ancient organisms over millions of years.", "type": "fill", "answer": "fossil fuels"}, {"q": "The gradual increase in the Earth's average temperature caused by greenhouse gases is called ______.", "explanation": "Greenhouse gases such as CO2 trap heat in the atmosphere, leading to a rise in average global temperatures over time.", "type": "fill", "answer": "global warming (climate change)"}, {"q": "In Rwanda, ______ gas dissolved in Lake Kivu is being extracted and used to generate electricity.", "explanation": "This resource provides Rwanda with a locally available fuel for electricity generation.", "type": "fill", "answer": "methane"}, {"q": "The trapping of heat in the Earth's atmosphere by certain gases is known as the ______ effect.", "explanation": "The greenhouse effect is a natural process that becomes intensified by human emissions of gases like carbon dioxide and methane.", "type": "fill", "answer": "greenhouse"}]}, {"unit": 4, "title": "Unit 4: Quantity of Heat and Heat Transfer", "questions": [{"q": "What is meant by the 'heat capacity' of an object?", "explanation": "Heat capacity (C) is the quantity of heat required to raise the temperature of a specific object (of given mass) by 1°C, C = Q/ΔT.", "type": "mcq", "options": ["The maximum temperature an object can reach", "The rate at which an object cools down", "The amount of heat needed to raise the temperature of the whole object by 1°C", "The mass of the object"], "answer": 2}, {"q": "What is 'specific heat capacity' (c) of a substance?", "explanation": "Specific heat capacity is the amount of heat energy required to raise the temperature of 1 kg of a substance by 1°C (or 1 K).", "type": "mcq", "options": ["The heat needed to melt 1 kg of the substance", "The heat needed to raise the temperature of 1 kg of the substance by 1°C", "The heat lost when a substance cools by 1°C only", "The total heat contained in a substance"], "answer": 1}, {"q": "What is the SI unit of specific heat capacity?", "explanation": "Specific heat capacity is expressed in joules per kilogram per degree Celsius, J/(kg·°C), equivalent to J/(kg·K).", "type": "mcq", "options": ["W/(kg·°C)", "J/kg", "J·kg", "J/(kg·°C)"], "answer": 3}, {"q": "Calculate the heat required to raise the temperature of 2 kg of water (c = 4200 J/(kg·°C)) by 10°C.", "explanation": "Q = mcΔT = 2 × 4200 × 10 = 84,000 J.", "type": "mcq", "options": ["8,400 J", "84,000 J", "420,000 J", "42,000 J"], "answer": 1}, {"q": "A substance of mass 0.5 kg and specific heat capacity 2000 J/(kg·°C) absorbs 5000 J of heat. Find its temperature rise.", "explanation": "ΔT = Q/(mc) = 5000/(0.5 × 2000) = 5000/1000 = 5°C.", "type": "mcq", "options": ["5°C", "20°C", "10°C", "2.5°C"], "answer": 0}, {"q": "A 1 kg substance absorbs 8400 J of heat and its temperature rises by 2°C. What is its specific heat capacity?", "explanation": "c = Q/(mΔT) = 8400/(1 × 2) = 4200 J/(kg·°C).", "type": "mcq", "options": ["420 J/(kg·°C)", "16800 J/(kg·°C)", "2100 J/(kg·°C)", "4200 J/(kg·°C)"], "answer": 3}, {"q": "Compared to most common metals, water has a specific heat capacity that is:", "explanation": "Water's specific heat capacity (about 4200 J/(kg·°C)) is much higher than that of metals like iron (about 450 J/(kg·°C)), so water heats up and cools down more slowly.", "type": "mcq", "options": ["Much higher", "Impossible to compare", "Much lower", "About the same"], "answer": 0}, {"q": "What are the three main modes of heat transfer?", "explanation": "Heat can be transferred by conduction, convection, and radiation.", "type": "mcq", "options": ["Conduction, convection, radiation", "Melting, boiling, freezing", "Reflection, refraction, absorption", "Expansion, contraction, insulation"], "answer": 0}, {"q": "Conduction of heat mainly occurs in:", "explanation": "Conduction transfers heat through direct particle-to-particle contact, which is most effective in solids where particles are closely packed.", "type": "mcq", "options": ["A vacuum", "Gases", "Liquids only", "Solids"], "answer": 3}, {"q": "Convection of heat mainly occurs in:", "explanation": "Convection involves the physical movement of heated fluid (liquid or gas), so it occurs in fluids, not solids.", "type": "mcq", "options": ["Only in metals", "Solids", "A vacuum", "Fluids (liquids and gases)"], "answer": 3}, {"q": "Radiation as a mode of heat transfer:", "explanation": "Radiation transfers heat via electromagnetic waves and can travel through empty space (a vacuum), unlike conduction and convection.", "type": "mcq", "options": ["Requires a solid medium", "Only occurs in metals", "Requires a liquid medium", "Can occur through a vacuum, without any medium"], "answer": 3}, {"q": "Which mode of heat transfer does NOT require a medium?", "explanation": "Radiation is unique among the three modes because it can transfer heat energy through a vacuum, such as from the Sun to the Earth.", "type": "mcq", "options": ["Conduction", "All require a medium", "Radiation", "Convection"], "answer": 2}, {"q": "Heat travelling along a metal spoon left in hot soup is an example of:", "explanation": "Heat passes directly through the metal particles of the spoon by conduction.", "type": "mcq", "options": ["Convection", "Conduction", "Radiation", "Evaporation"], "answer": 1}, {"q": "The rising and circulating currents in a pot of boiling water are an example of:", "explanation": "As water is heated, warmer, less dense water rises and cooler water sinks, creating convection currents.", "type": "mcq", "options": ["Convection", "Condensation", "Radiation", "Conduction"], "answer": 0}, {"q": "Heat reaching the Earth from the Sun travels mainly by:", "explanation": "Since space is a vacuum, the Sun's heat can only reach Earth by radiation (electromagnetic waves).", "type": "mcq", "options": ["Convection", "Radiation", "Direct contact", "Conduction"], "answer": 1}, {"q": "Which of these materials is generally the best conductor of heat?", "explanation": "Metals such as copper have free electrons that allow heat to be conducted very efficiently.", "type": "mcq", "options": ["Copper", "Wood", "Air", "Plastic"], "answer": 0}, {"q": "Materials that conduct heat poorly, such as wood, plastic, and air, are called:", "explanation": "Poor conductors of heat are known as insulators, since they slow down or resist the flow of heat.", "type": "mcq", "options": ["Conductors", "Convectors", "Radiators", "Insulators"], "answer": 3}, {"q": "What is 'latent heat'?", "explanation": "Latent heat is the energy absorbed or released when a substance changes state (e.g., melting, boiling) while its temperature stays constant.", "type": "mcq", "options": ["The heat that causes a temperature change", "The heat absorbed or released during a change of state, without a change in temperature", "The heat lost through radiation only", "The heat capacity of a gas"], "answer": 1}, {"q": "Which formula is used to calculate the quantity of heat involved in a change of state?", "explanation": "The heat needed for a phase change is Q = mL, where L is the specific latent heat of fusion or vaporisation.", "type": "mcq", "options": ["Q = mL", "Q = FΔt", "Q = mcΔT", "Q = mv²/r"], "answer": 0}, {"q": "Calculate the heat required to melt 2 kg of ice completely, given the specific latent heat of fusion of ice is 334,000 J/kg.", "explanation": "Q = mL = 2 × 334,000 = 668,000 J.", "type": "mcq", "options": ["167,000 J", "1,336,000 J", "334,000 J", "668,000 J"], "answer": 3}, {"q": "Calculate the heat needed to vaporise 0.5 kg of water at its boiling point, given the specific latent heat of vaporisation is 2,260,000 J/kg.", "explanation": "Q = mL = 0.5 × 2,260,000 = 1,130,000 J.", "type": "mcq", "options": ["1,130,000 J", "565,000 J", "2,260,000 J", "4,520,000 J"], "answer": 0}, {"q": "During a change of state (e.g., ice melting to water), what happens to the temperature of the substance?", "explanation": "While a substance is changing state, all the heat energy goes into breaking or forming bonds between particles, so the temperature stays constant.", "type": "mcq", "options": ["It doubles", "It remains constant until the change is complete", "It falls steadily", "It rises steadily"], "answer": 1}, {"q": "The change of state from solid to liquid is called:", "explanation": "Melting (also called fusion) is the process by which a solid changes into a liquid when heated.", "type": "mcq", "options": ["Vaporisation", "Freezing", "Melting (fusion)", "Condensation"], "answer": 2}, {"q": "The change of state from liquid to gas is called:", "explanation": "Vaporisation is the process by which a liquid changes into a gas, occurring through boiling or evaporation.", "type": "mcq", "options": ["Melting", "Freezing", "Vaporisation", "Condensation"], "answer": 2}, {"q": "The change of state from gas to liquid is called:", "explanation": "Condensation is the process by which a gas loses energy and turns back into a liquid.", "type": "mcq", "options": ["Melting", "Condensation", "Fusion", "Sublimation"], "answer": 1}, {"q": "The change of state from liquid to solid is called:", "explanation": "Freezing (solidification) occurs when a liquid loses heat and turns into a solid.", "type": "mcq", "options": ["Melting", "Condensation", "Freezing (solidification)", "Vaporisation"], "answer": 2}, {"q": "Thermal expansion refers to:", "explanation": "When most substances are heated, their particles vibrate more and move slightly farther apart, causing the material to expand.", "type": "mcq", "options": ["A decrease in the size of a substance when heated", "An increase in the size (length, area, or volume) of a substance when its temperature rises", "A change of state without heat", "A change in the mass of a substance when heated"], "answer": 1}, {"q": "Which formula describes the linear expansion of a solid?", "explanation": "Linear expansion is given by ΔL = αL₀ΔT, where α is the coefficient of linear expansion, L₀ the original length, and ΔT the temperature change.", "type": "mcq", "options": ["ΔV = γV₀ΔT", "Q = mL", "ΔL = αL₀ΔT", "Q = mcΔT"], "answer": 2}, {"q": "A metal rod of length 2 m has a coefficient of linear expansion of 12 × 10⁻⁶ /°C. Find its increase in length when heated through 50°C.", "explanation": "ΔL = αL₀ΔT = (12×10⁻⁶) × 2 × 50 = 0.0012 m (1.2 mm).", "type": "mcq", "options": ["0.0012 m", "0.00012 m", "0.012 m", "0.12 m"], "answer": 0}, {"q": "Why are small gaps left between sections of railway tracks?", "explanation": "Gaps allow the metal rails to expand safely when heated, preventing the track from buckling or bending in hot weather.", "type": "mcq", "options": ["To reduce the weight of the track", "To increase friction between the rails", "To allow the metal to expand in hot weather without buckling", "To make the track cheaper to build"], "answer": 2}, {"q": "The specific heat capacity of water is higher than that of iron.", "explanation": "Water has a specific heat capacity of about 4200 J/(kg·°C), much higher than iron's approximately 450 J/(kg·°C).", "type": "tf", "answer": true}, {"q": "During a change of state, the temperature of a substance keeps rising as more heat is added.", "explanation": "During a change of state, temperature remains constant; the added heat (latent heat) is used to change the state, not to raise temperature.", "type": "tf", "answer": false}, {"q": "Conduction is the main mode of heat transfer in gases.", "explanation": "Convection is the main mode of heat transfer in gases and liquids, since their particles can move freely; conduction dominates in solids.", "type": "tf", "answer": false}, {"q": "A bimetallic strip bends when heated because the two metals it is made of expand at different rates.", "explanation": "Because the two metals have different coefficients of expansion, uneven expansion causes the strip to bend when heated.", "type": "tf", "answer": true}, {"q": "Radiation requires a medium, such as air or metal, to transfer heat.", "explanation": "Radiation is the only mode of heat transfer that does not need a medium; it can pass through a vacuum, as heat from the Sun does.", "type": "tf", "answer": false}, {"q": "The quantity of heat required to change the temperature of a substance without changing its state is calculated using Q = ______.", "explanation": "This formula uses the mass (m), specific heat capacity (c), and temperature change (ΔT) of the substance.", "type": "fill", "answer": "mcΔT"}, {"q": "The heat absorbed or released during a change of state at constant temperature is called ______ heat.", "explanation": "Latent heat is 'hidden' heat that changes a substance's state (solid, liquid, gas) without changing its temperature.", "type": "fill", "answer": "latent"}, {"q": "Metals allow heat to pass through them easily because they are good ______ of heat.", "explanation": "Metals have free electrons that transfer thermal energy quickly, making them good conductors.", "type": "fill", "answer": "conductors"}, {"q": "The transfer of heat through a fluid by the movement of the heated fluid itself is called ______.", "explanation": "Convection occurs when warmer, less dense fluid rises and cooler, denser fluid sinks, creating a circulating current.", "type": "fill", "answer": "convection"}, {"q": "Small gaps are left between sections of railway tracks to allow for the ______ of the metal in hot weather.", "explanation": "Without these gaps, the rails would be unable to expand safely and could buckle when heated.", "type": "fill", "answer": "(thermal) expansion"}]}, {"unit": 5, "title": "Unit 5: Atmospheric Pressure and Archimedes' Principles", "questions": [{"q": "What is atmospheric pressure?", "explanation": "Atmospheric pressure is the pressure exerted on a surface by the weight of the column of air above it.", "type": "mcq", "options": ["The pressure inside a sealed container", "The pressure exerted by the weight of the air above a given point", "The pressure exerted only by water vapour in the air", "The force of wind blowing horizontally"], "answer": 1}, {"q": "The average atmospheric pressure at sea level is approximately:", "explanation": "Standard atmospheric pressure at sea level is about 101,325 Pa, often rounded to 1.013 × 10^5 Pa (76 cmHg).", "type": "mcq", "options": ["10 Pa", "1.013 × 10^5 Pa", "1.013 × 10^8 Pa", "1.013 × 10^2 Pa"], "answer": 1}, {"q": "Which instrument is used to measure atmospheric pressure?", "explanation": "A barometer (mercury or aneroid) is the instrument used to measure atmospheric pressure.", "type": "mcq", "options": ["Thermometer", "Hydrometer", "Barometer", "Ammeter"], "answer": 2}, {"q": "In a simple mercury barometer, atmospheric pressure is measured by:", "explanation": "Atmospheric pressure pushes mercury up an evacuated tube; the height of the supported column indicates the pressure (about 76 cm at sea level).", "type": "mcq", "options": ["The diameter of the tube", "The temperature of the mercury", "The height of the mercury column it can support in a tube", "The weight of the glass tube"], "answer": 2}, {"q": "As altitude increases, atmospheric pressure:", "explanation": "At higher altitude there is less air above a point, so the weight of the overlying air column, and hence pressure, decreases.", "type": "mcq", "options": ["Stays exactly the same", "Increases", "Decreases", "Becomes negative"], "answer": 2}, {"q": "Why is it harder to breathe at the top of a very high mountain?", "explanation": "Lower atmospheric pressure at high altitude means air (and oxygen) is less dense, making breathing more difficult.", "type": "mcq", "options": ["The air is warmer", "Atmospheric pressure and oxygen density are lower", "There is no gravity", "The mountain blocks all air"], "answer": 1}, {"q": "How does an increase in air temperature generally affect atmospheric pressure in a region?", "explanation": "When air is heated it expands and its density falls, which is associated with a drop in local atmospheric pressure (rising warm air creates low-pressure zones).", "type": "mcq", "options": ["Temperature only affects underground pressure", "Warm air expands and becomes less dense, tending to lower local pressure", "It has no relation at all", "Warm air becomes heavier and increases pressure"], "answer": 1}, {"q": "A region of low atmospheric pressure is often associated with unsettled, stormy weather.", "explanation": "Low-pressure systems are linked to rising air, cloud formation and unstable, often stormy weather, while high pressure is linked to fine, settled weather.", "type": "tf", "answer": true}, {"q": "An aneroid barometer measures atmospheric pressure using:", "explanation": "An aneroid barometer contains a flexible sealed metal capsule that expands or contracts with changing atmospheric pressure, moving a needle on a scale.", "type": "mcq", "options": ["Electric current flow", "The expansion and contraction of a sealed, partially evacuated metal box", "A column of mercury", "Boiling water"], "answer": 1}, {"q": "The scientist who first demonstrated that atmospheric pressure could support a column of mercury, giving his name to the unit torr, was ______.", "explanation": "Evangelista Torricelli performed the classic mercury barometer experiment in 1643.", "type": "fill", "answer": "Torricelli"}, {"q": "When you suck on a drinking straw placed in a drink, the liquid rises because:", "explanation": "Sucking reduces the air pressure inside the straw; the higher atmospheric pressure acting on the drink's surface then pushes the liquid up into the straw.", "type": "mcq", "options": ["Sucking lowers the pressure inside the straw, so greater atmospheric pressure on the liquid's surface pushes it up", "Sucking creates a vacuum that pulls the liquid up by magic", "Air pressure inside the straw increases", "The liquid becomes lighter"], "answer": 0}, {"q": "A simple hand (lift) pump raises water from a well mainly because of:", "explanation": "As the piston rises, it lowers the pressure above the water; atmospheric pressure acting on the water in the well pushes it up into the pump.", "type": "mcq", "options": ["Atmospheric pressure pushing water up as the piston creates a low-pressure region above it", "The pump heating the water", "Gravity pulling water upward", "Magnetism"], "answer": 0}, {"q": "A siphon can be used to transfer liquid from a higher container to a lower one over an intervening rise mainly because of:", "explanation": "Once the tube is filled with liquid, atmospheric pressure and the weight of the falling liquid column maintain continuous flow from the higher to the lower level.", "type": "mcq", "options": ["Atmospheric pressure and gravity acting on a continuous tube full of liquid", "The liquid's colour", "Electrical attraction", "Magnetic fields in the tube"], "answer": 0}, {"q": "A siphon tube must be completely filled with liquid (primed) before it will work continuously.", "explanation": "Air pockets break the continuous liquid column needed for atmospheric pressure and gravity to drive the flow, so the tube must first be filled with liquid.", "type": "tf", "answer": true}, {"q": "A vacuum cleaner picks up dust because:", "explanation": "The internal fan lowers the air pressure inside the cleaner; higher atmospheric pressure outside forces air and dust in through the nozzle to equalize pressure.", "type": "mcq", "options": ["It generates static electricity to attract dust", "It pushes high-pressure air onto the floor", "It heats the dust until it evaporates", "Its fan/motor creates a region of low pressure inside, so atmospheric pressure pushes air (with dust) into the nozzle"], "answer": 3}, {"q": "A rubber sucker sticks to a smooth wall because:", "explanation": "Squeezing out the air lowers pressure under the sucker; atmospheric pressure pushing on the outer surface then holds the sucker firmly against the wall.", "type": "mcq", "options": ["It chemically reacts with the wall", "It is naturally sticky like glue", "Pressing it out removes air, creating low pressure between the sucker and wall, so atmospheric pressure on the outside holds it in place", "It uses magnetism"], "answer": 2}, {"q": "A rubber pipette works by squeezing the bulb to expel air, then releasing it so that ______ pressure pushes liquid up into the tube.", "explanation": "Releasing the squeezed bulb lowers internal pressure, and atmospheric pressure outside pushes liquid up into the pipette.", "type": "fill", "answer": "atmospheric"}, {"q": "During inhalation (breathing in), what happens inside the chest cavity?", "explanation": "Diaphragm contraction increases chest volume, lowering internal pressure below atmospheric pressure, so air flows into the lungs to equalize pressure.", "type": "mcq", "options": ["Air pressure in the lungs rises above atmospheric pressure", "The lungs push air out", "The diaphragm relaxes and the chest volume decreases", "The diaphragm contracts, chest volume increases, and lung pressure drops below atmospheric pressure, so air flows in"], "answer": 3}, {"q": "During exhalation (breathing out), the pressure inside the lungs becomes:", "explanation": "The diaphragm relaxes, chest volume decreases, and lung pressure rises above atmospheric pressure, forcing air out.", "type": "mcq", "options": ["Lower than atmospheric pressure", "Impossible to determine", "Equal to zero", "Higher than atmospheric pressure, pushing air out"], "answer": 3}, {"q": "Which of these is NOT a common application of atmospheric pressure?", "explanation": "A transformer works on electromagnetic induction, not atmospheric pressure; the other three all rely on atmospheric pressure differences.", "type": "mcq", "options": ["Vacuum cleaner", "Siphon", "Electric transformer", "Drinking straw"], "answer": 2}, {"q": "State Archimedes' principle.", "explanation": "Archimedes' principle: the upthrust on a body immersed in a fluid equals the weight of the fluid displaced by the body.", "type": "mcq", "options": ["A body fully or partly immersed in a fluid experiences an upthrust equal to the weight of the fluid it displaces", "A body in a fluid always sinks regardless of density", "A floating body has zero weight", "Pressure in a fluid acts only downward"], "answer": 0}, {"q": "The upward force exerted by a fluid on a body immersed in it is called:", "explanation": "This upward force is called upthrust or buoyant force, and results from the pressure difference between the top and bottom of the submerged body.", "type": "mcq", "options": ["Normal reaction", "Tension", "Friction", "Upthrust (buoyant force)"], "answer": 3}, {"q": "The formula for upthrust on a fully submerged object is:", "explanation": "Upthrust equals the weight of fluid displaced: U = ρ_fluid × V_displaced × g, where V_displaced is the volume of fluid pushed aside.", "type": "mcq", "options": ["U = ρ_fluid × V_displaced × g", "U = m × a", "U = mgh", "U = F/A"], "answer": 0}, {"q": "A block of volume 0.002 m³ is fully submerged in water (density 1000 kg/m³). Taking g = 10 N/kg, the upthrust on it is:", "explanation": "U = ρVg = 1000 × 0.002 × 10 = 20 N.", "type": "mcq", "options": ["0.2 N", "20 N", "200 N", "2 N"], "answer": 1}, {"q": "An object weighs 50 N in air and 30 N when fully submerged in water. The upthrust on the object is:", "explanation": "Upthrust = apparent weight loss = weight in air − weight in water = 50 N − 30 N = 20 N.", "type": "mcq", "options": ["20 N", "80 N", "50 N", "30 N"], "answer": 0}, {"q": "A body floats in a fluid when:", "explanation": "A floating object displaces just enough fluid so that the upthrust equals its weight, which happens when its average density is less than or equal to that of the fluid.", "type": "mcq", "options": ["The upthrust on it equals its weight (its average density is less than or equal to the fluid's density)", "It has no weight at all", "Its weight is greater than the upthrust it experiences", "The fluid has zero density"], "answer": 0}, {"q": "A body sinks in a fluid when:", "explanation": "If the object's density is greater than the fluid's density, even full displacement cannot produce enough upthrust to balance its weight, so it sinks.", "type": "mcq", "options": ["Its density is less than the fluid's density", "It is hollow", "The upthrust exceeds its weight", "Its weight is greater than the maximum possible upthrust (its density exceeds the fluid's density)"], "answer": 3}, {"q": "The apparent loss of weight of an object when immersed in a liquid is equal to the upthrust acting on it.", "explanation": "By Archimedes' principle, the difference between the weight in air and the weight in the liquid equals the upthrust from the displaced liquid.", "type": "tf", "answer": true}, {"q": "The upward force experienced by an object immersed in a fluid is also known as the ______ force.", "explanation": "Upthrust is commonly called the buoyant force.", "type": "fill", "answer": "buoyant"}, {"q": "The SI unit of upthrust is the:", "explanation": "Upthrust is a force, so it is measured in newtons (N), like weight.", "type": "mcq", "options": ["Kilogram", "Newton", "Joule", "Pascal"], "answer": 1}, {"q": "A stone of volume 500 cm³ (5 × 10^-4 m³) is fully submerged in water (density 1000 kg/m³, g = 10 N/kg). The upthrust on the stone is:", "explanation": "U = ρVg = 1000 × 5×10^-4 × 10 = 5 N.", "type": "mcq", "options": ["50 N", "500 N", "5 N", "0.5 N"], "answer": 2}, {"q": "Upthrust on a submerged object always acts:", "explanation": "Upthrust arises because fluid pressure increases with depth, so pressure on the bottom of the object exceeds that on top, giving a net upward force.", "type": "mcq", "options": ["Downward", "In the direction the object moves", "Sideways", "Upward, opposite to the object's weight"], "answer": 3}, {"q": "Ships made of steel, which is denser than water, are able to float mainly because:", "explanation": "The hollow hull encloses a large volume of air, so the ship's overall average density is lower than water, allowing the upthrust to balance its weight.", "type": "mcq", "options": ["Steel becomes less dense in water", "They have no weight at sea", "Their hollow shape displaces a large volume of water, so their average density (ship plus enclosed air) is less than water", "They are magnetized to repel water"], "answer": 2}, {"q": "A hydrometer is used to:", "explanation": "A hydrometer floats in a liquid; the depth to which it sinks depends on the liquid's density, and its calibrated stem reads the density directly.", "type": "mcq", "options": ["Measure atmospheric pressure", "Measure electric current in a solution", "Measure the density (relative density) of a liquid", "Measure the temperature of a liquid"], "answer": 2}, {"q": "A hydrometer floats lower (sinks deeper) in a liquid of lower density than in a liquid of higher density.", "explanation": "In a less dense liquid, more volume must be displaced to generate enough upthrust to balance the hydrometer's weight, so it sinks deeper.", "type": "tf", "answer": true}, {"q": "A hot air balloon rises because:", "explanation": "Heated air inside the envelope is less dense than the surrounding cooler air; the resulting upthrust exceeds the total weight, so the balloon rises.", "type": "mcq", "options": ["Heating the air inside lowers its density, so the upthrust from the surrounding cooler air exceeds the balloon system's weight", "It loses all its weight when heated", "Heating the air inside makes it denser than the surrounding cool air", "The balloon has an engine that pulls it up"], "answer": 0}, {"q": "A life jacket helps a person float in water mainly by:", "explanation": "The low-density buoyant material increases volume without adding much weight, lowering the average density of the wearer so that upthrust can support their weight.", "type": "mcq", "options": ["Reducing the density of the water", "Increasing the wearer's overall volume with low-density material, reducing the average density of the person-and-jacket system below that of water", "Making the person heavier", "Absorbing water to add weight"], "answer": 1}, {"q": "A solid iron nail sinks in water, but a hollow iron ship floats, because the ship's overall average ______ is lower than that of water.", "explanation": "Spreading the same mass of iron over a much larger hollow volume lowers the ship's average density below that of water, unlike a solid nail.", "type": "fill", "answer": "density"}, {"q": "When a ship is loaded beyond its safe limit, it:", "explanation": "Extra weight requires displacing more water to generate enough upthrust, so the ship sits lower; beyond the safe load line it risks taking on water and sinking.", "type": "mcq", "options": ["Rises further out of the water", "Is unaffected by loading", "Becomes lighter", "Sinks lower in the water and may risk sinking, since more water must be displaced to support the extra weight"], "answer": 3}, {"q": "Life jackets are typically made from ______-density buoyant material such as foam so that they increase volume without adding much weight.", "explanation": "Low-density foam materials give a large volume for little added mass, increasing buoyancy.", "type": "fill", "answer": "low"}]}, {"unit": 6, "title": "Unit 6: Basic Electrical Wiring and Installation", "questions": [{"q": "When resistors are connected in series in a circuit, the total resistance is:", "explanation": "For resistors in series: R_total = R1 + R2 + R3 + ... , since the same current flows through each in turn.", "type": "mcq", "options": ["The sum of all the individual resistances", "Equal to the largest resistance only", "Less than the smallest individual resistance", "The average of the resistances"], "answer": 0}, {"q": "Three resistors of 2 Ω, 3 Ω and 5 Ω are connected in series. The total resistance is:", "explanation": "In series, resistances add: 2 + 3 + 5 = 10 Ω.", "type": "mcq", "op
