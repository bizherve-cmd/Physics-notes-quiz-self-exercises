ors in power supplies charge up and discharge to smooth out ripples or fluctuations in the voltage, providing a steadier output to the rest of the circuit.", "type": "mcq", "options": ["To smooth out fluctuations in voltage by storing and releasing charge as needed", "To convert DC to light energy", "To measure the temperature of the circuit", "To permanently block all current from flowing"], "answer": 0}, {"q": "A photodiode used in devices such as remote-control receivers and light sensors works by:", "explanation": "A photodiode is a type of diode that responds to light, producing or changing an electric current when light strikes its junction, which is used in light-sensing applications.", "type": "mcq", "options": ["Emitting sound when light falls on it", "Storing electrical charge like a battery", "Generating or altering an electric current in response to light falling on it", "Amplifying radio waves into microwaves"], "answer": 2}, {"q": "A simple LED torch (flashlight) mainly demonstrates the everyday application of which type of electronic component?", "explanation": "An LED torch relies on light-emitting diodes, which convert electrical energy directly into visible light when forward biased, along with a resistor to limit current.", "type": "mcq", "options": ["Capacitor only", "Diode (specifically the light-emitting diode)", "Inductor", "Resistor only, with no diode involved"], "answer": 1}, {"q": "Solar (photovoltaic) cells, which convert light energy directly into electrical energy, are essentially a special type of:", "explanation": "A solar cell is a type of photodiode (a semiconductor diode) engineered to convert light energy efficiently into electrical energy through the photovoltaic effect.", "type": "mcq", "options": ["Resistor", "Capacitor", "Diode", "Inductor"], "answer": 2}, {"q": "Inductors and capacitors are both passive components, but they store energy in different forms: an inductor stores energy in a magnetic field while a capacitor stores energy in an electric field.", "explanation": "An inductor's energy is stored in the magnetic field around its coil due to current flow, whereas a capacitor's energy is stored in the electric field between its charged plates.", "type": "tf", "answer": true}, {"q": "Which statement correctly distinguishes passive from active electronic components?", "explanation": "The key distinction is that active components (like transistors and diodes) can control or amplify current using an external energy source, while passive components (resistors, capacitors, inductors) cannot amplify signals and only store or oppose current.", "type": "mcq", "options": ["Active components require an external power source to control or amplify signals, while passive components do not amplify signals", "Active components never allow current to flow through them", "Passive components can amplify signals, while active components cannot", "Passive components are always larger in physical size than active components"], "answer": 0}, {"q": "A rectifier circuit found inside a phone charger mainly uses which type of component to convert AC into DC?", "explanation": "Diodes arranged in a rectifier circuit allow current to pass in only one direction, converting the alternating current from the mains supply into direct current suitable for charging a phone battery.", "type": "mcq", "options": ["Resistors only", "Capacitors only", "Inductors only", "Diodes"], "answer": 3}, {"q": "A variable resistor (potentiometer), such as the one used to control the volume of a radio, works by:", "explanation": "A potentiometer (variable resistor) allows the resistance in a circuit to be adjusted manually, which changes the current or voltage supplied to a component such as a speaker, adjusting the volume.", "type": "mcq", "options": ["Switching the circuit completely off at all times", "Changing its resistance as its control (knob or slider) is adjusted, thereby varying current or voltage in the circuit", "Emitting light of varying brightness", "Storing charge that varies with temperature"], "answer": 1}, {"q": "Which of the following best explains why transistors replaced older vacuum tubes in most electronic devices?", "explanation": "Transistors offered a smaller, more durable, more energy-efficient, and cheaper alternative to bulky, fragile, power-hungry vacuum tubes, which is why they became the standard active component in modern electronics.", "type": "mcq", "options": ["Transistors are smaller, more reliable, more energy-efficient, and cheaper to mass-produce", "Transistors cannot amplify signals as well as vacuum tubes", "Transistors are much larger and heavier than vacuum tubes", "Vacuum tubes do not require any electrical power to operate"], "answer": 0}, {"q": "A component that allows current to flow easily in one direction only, commonly used in rectifier circuits, is called a ______.", "explanation": "A diode conducts in the forward direction and blocks current in the reverse direction, which makes it ideal for converting AC to DC in rectifier circuits.", "type": "fill", "answer": "diode"}, {"q": "A circuit that combines a resistor and a capacitor is often used in electronic devices to:", "explanation": "Resistor-capacitor (RC) combinations are widely used to create timing circuits (e.g., delays, oscillators) and filters that allow or block certain signal frequencies.", "type": "mcq", "options": ["Emit visible light", "Control timing delays or filter certain signal frequencies", "Generate mechanical motion", "Permanently store data like a hard disk"], "answer": 1}, {"q": "Which of these everyday devices relies heavily on basic electronic components such as resistors, capacitors, diodes and transistors working together?", "explanation": "A smartphone contains complex circuit boards packed with resistors, capacitors, diodes, transistors and integrated circuits working together to process signals, store data, and manage power.", "type": "mcq", "options": ["A plain wooden chair", "A smartphone", "A cotton cloth", "A glass window"], "answer": 1}, {"q": "On a motherboard, the small chips (integrated circuits) that combine many active and passive components into a single package are useful mainly because they:", "explanation": "Integrated circuits pack many transistors, resistors, diodes and other components onto a tiny silicon chip, enabling complex functions in a small, affordable, and reliable package.", "type": "mcq", "options": ["Eliminate the need for any electric current in the device", "Increase the physical size of circuits enormously", "Only work with alternating current above 1000 V", "Allow complex circuits with many components to be manufactured compactly, cheaply and reliably in a single unit"], "answer": 3}, {"q": "A diode allows electric current to flow equally well in both the forward and reverse directions.", "explanation": "A diode is designed to conduct current easily in the forward direction only; in reverse bias it blocks (ideally stops) current flow, which is its defining property.", "type": "tf", "answer": false}]}];

  function loadProgress(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {};
  }
  function saveProgress(p){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
  }
  var progress = loadProgress(); // { unitIndex: {correct, attempted, done} }

  var homeView = document.getElementById("homeView");
  var quizView = document.getElementById("quizView");
  var summaryView = document.getElementById("summaryView");
  var unitGrid = document.getElementById("unitGrid");
  var overallScoreVal = document.getElementById("overallScoreVal");

  var state = { unitIdx: null, qIdx: 0, correct: 0, attempted: 0, answered: false };

  function normalize(s){
    return (s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  }
  function answerVariants(ans){
    // split things like "underdamped (lightly damped)" or "rad/s (radian per second)"
    var out = [];
    var cleaned = ans.replace(/[()]/g, "|");
    cleaned.split(/[|\/,;]| or /i).forEach(function(part){
      var n = normalize(part);
      if(n) out.push(n);
    });
    var whole = normalize(ans);
    if(whole) out.push(whole);
    return out;
  }
  function fuzzyMatch(userText, correctText){
    var u = normalize(userText);
    if(!u) return false;
    var variants = answerVariants(correctText);
    for(var i=0;i<variants.length;i++){
      var v = variants[i];
      if(!v) continue;
      if(u === v) return true;
      if(v.length > 3 && (u.indexOf(v) !== -1 || v.indexOf(u) !== -1)) return true;
    }
    return false;
  }

  function totalQuestions(){
    var t=0; DATA.forEach(function(u){ t += u.questions.length; }); return t;
  }
  function overallStats(){
    var correct=0, attempted=0;
    Object.keys(progress).forEach(function(k){
      correct += progress[k].correct||0;
      attempted += progress[k].attempted||0;
    });
    return {correct:correct, attempted:attempted};
  }
  function refreshOverall(){
    var s = overallStats();
    overallScoreVal.textContent = s.correct + "/" + totalQuestions();
  }

  function renderUnitList(){
    unitGrid.innerHTML = "";
    DATA.forEach(function(unit, idx){
      var p = progress[idx];
      var btn = document.createElement("button");
      btn.className = "unit-card";
      var done = p && p.done;
      btn.innerHTML =
        '<span class="num">U' + unit.unit + '</span>' +
        '<span class="info">' +
          '<span class="t">' + escapeHtml(unit.title.replace(/^Unit \d+:\s*/,"")) + '</span>' +
          '<span class="s">' + unit.questions.length + ' questions</span>' +
        '</span>' +
        '<span class="badge' + (done ? ' done' : '') + '">' +
          (p ? (p.correct + '/' + unit.questions.length) : 'Start') +
        '</span>';
      btn.addEventListener("click", function(){ startUnit(idx); });
      unitGrid.appendChild(btn);
    });
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // ---- shuffling: new question order and answer order on every attempt ----
  function shuffleArr(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function shuffleOptions(q){
    if(q.type !== "mcq") return q;
    var idx = q.options.map(function(_, i){ return i; });
    // options like "None of the above" stay in their place at the end
    var movable = idx.filter(function(i){ return !/of the above/i.test(q.options[i]); });
    var shuffled = shuffleArr(movable.slice());
    var order = idx.slice(), k = 0;
    for(var i=0;i<idx.length;i++){ if(movable.indexOf(i) !== -1){ order[i] = shuffled[k++]; } }
    var copy = {}; for(var p in q){ copy[p] = q[p]; }
    copy.options = order.map(function(i){ return q.options[i]; });
    copy.answer = order.indexOf(q.answer);
    return copy;
  }
  function buildSession(questions){
    // questions marked "link" refer to the one before, so they stay together as a group
    var groups = [];
    questions.forEach(function(q){
      if(q.link && groups.length) groups[groups.length-1].push(q);
      else groups.push([q]);
    });
    shuffleArr(groups);
    var out = [];
    groups.forEach(function(g){ g.forEach(function(q){ out.push(shuffleOptions(q)); }); });
    return out;
  }

  function startUnit(idx){
    state.unitIdx = idx;
    state.session = buildSession(DATA[idx].questions);
    state.qIdx = 0;
    state.correct = 0;
    state.attempted = 0;
    showView("quiz");
    renderQuestion();
  }

  function showView(name){
    homeView.hidden = name !== "home";
    quizView.hidden = name !== "quiz";
    summaryView.hidden = name !== "summary";
    if(name === "home"){ renderUnitList(); refreshOverall(); }
  }

  var quizUnitTitle = document.getElementById("quizUnitTitle");
  var quizProgressLabel = document.getElementById("quizProgressLabel");
  var unitScoreVal = document.getElementById("unitScoreVal");
  var progressFill = document.getElementById("progressFill");
  var qmeta = document.getElementById("qmeta");
  var qtext = document.getElementById("qtext");
  var optionsWrap = document.getElementById("optionsWrap");
  var fillWrap = document.getElementById("fillWrap");
  var fillInput = document.getElementById("fillInput");
  var fillSubmit = document.getElementById("fillSubmit");
  var feedback = document.getElementById("feedback");
  var nextBtn = document.getElementById("nextBtn");
  var skipBtn = document.getElementById("skipBtn");
  var backBtn = document.getElementById("backBtn");

  function currentUnit(){ return DATA[state.unitIdx]; }
  function currentQuestion(){ return state.session[state.qIdx]; }

  function renderQuestion(){
    var unit = currentUnit();
    var q = currentQuestion();
    state.answered = false;
    quizUnitTitle.textContent = unit.title;
    quizProgressLabel.textContent = "Question " + (state.qIdx+1) + " of " + unit.questions.length;
    unitScoreVal.textContent = state.correct + "/" + state.attempted;
    progressFill.style.width = (100 * state.qIdx / unit.questions.length) + "%";
    qmeta.textContent = q.type === "mcq" ? "Multiple choice" : (q.type === "tf" ? "True / False" : "Fill in the blank");
    qtext.textContent = q.q;
    feedback.className = "feedback";
    feedback.innerHTML = "";
    nextBtn.disabled = true;

    optionsWrap.innerHTML = "";
    fillWrap.hidden = true;

    if(q.type === "mcq"){
      optionsWrap.hidden = false;
      q.options.forEach(function(opt, i){
        var b = document.createElement("button");
        b.className = "opt";
        b.innerHTML = '<span class="k">' + "ABCD"[i] + '</span><span>' + escapeHtml(opt) + '</span>';
        b.addEventListener("click", function(){ answerMcq(i, b); });
        optionsWrap.appendChild(b);
      });
    } else if(q.type === "tf"){
      optionsWrap.hidden = false;
      [["True", true], ["False", false]].forEach(function(pair, i){
        var b = document.createElement("button");
        b.className = "opt";
        b.innerHTML = '<span class="k">' + (i===0?"T":"F") + '</span><span>' + pair[0] + '</span>';
        b.addEventListener("click", function(){ answerTf(pair[1], b); });
        optionsWrap.appendChild(b);
      });
    } else {
      optionsWrap.hidden = true;
      fillWrap.hidden = false;
      fillInput.value = "";
      fillInput.disabled = false;
      fillSubmit.disabled = false;
      setTimeout(function(){ fillInput.focus(); }, 0);
    }
  }

  function lockOptions(){
    Array.prototype.forEach.call(optionsWrap.querySelectorAll(".opt"), function(b){ b.disabled = true; });
  }

  function showFeedback(isCorrect, explanation, correctText){
    feedback.classList.add("show");
    feedback.classList.add(isCorrect ? "correct" : "incorrect");
    var head = isCorrect
      ? '<div class="verdict v-correct">Correct.</div>'
      : '<div class="verdict v-incorrect">Not quite' + (correctText ? (" &mdash; correct answer: " + escapeHtml(correctText)) : "") + '.</div>';
    feedback.innerHTML = head + (explanation ? '<div>' + escapeHtml(explanation) + '</div>' : "");
    nextBtn.disabled = false;
  }

  function recordAnswer(isCorrect){
    state.attempted++;
    if(isCorrect) state.correct++;
    unitScoreVal.textContent = state.correct + "/" + state.attempted;
  }

  function answerMcq(i, btnEl){
    if(state.answered) return;
    state.answered = true;
    var q = currentQuestion();
    var isCorrect = i === q.answer;
    lockOptions();
    Array.prototype.forEach.call(optionsWrap.children, function(b, idx){
      if(idx === q.answer) b.classList.add("correct");
      else if(idx === i) b.classList.add("incorrect");
    });
    recordAnswer(isCorrect);
    showFeedback(isCorrect, q.explanation, null);
  }

  function answerTf(val, btnEl){
    if(state.answered) return;
    state.answered = true;
    var q = currentQuestion();
    var isCorrect = val === q.answer;
    lockOptions();
    Array.prototype.forEach.call(optionsWrap.children, function(b, idx){
      var bVal = idx === 0;
      if(bVal === q.answer) b.classList.add("correct");
      else if(bVal === val) b.classList.add("incorrect");
    });
    recordAnswer(isCorrect);
    showFeedback(isCorrect, q.explanation, null);
  }

  function answerFill(){
    if(state.answered) return;
    var q = currentQuestion();
    var val = fillInput.value.trim();
    if(!val) return;
    state.answered = true;
    fillInput.disabled = true;
    fillSubmit.disabled = true;
    var isCorrect = fuzzyMatch(val, q.answer);
    recordAnswer(isCorrect);
    showFeedback(isCorrect, q.explanation, q.answer);
  }

  fillSubmit.addEventListener("click", answerFill);
  fillInput.addEventListener("keydown", function(e){ if(e.key === "Enter") answerFill(); });

  skipBtn.addEventListener("click", function(){
    if(!state.answered){
      var q = currentQuestion();
      state.attempted++;
      unitScoreVal.textContent = state.correct + "/" + state.attempted;
      lockOptions();
      fillInput.disabled = true; fillSubmit.disabled = true;
      showFeedback(false, q.explanation, q.type === "fill" ? q.answer : (q.type === "mcq" ? q.options[q.answer] : (q.answer ? "True" : "False")));
      state.answered = true;
    } else {
      advance();
    }
  });

  nextBtn.addEventListener("click", advance);

  function advance(){
    var unit = currentUnit();
    if(state.qIdx < unit.questions.length - 1){
      state.qIdx++;
      renderQuestion();
    } else {
      finishUnit();
    }
  }

  function finishUnit(){
    var unit = currentUnit();
    progress[state.unitIdx] = {
      correct: state.correct,
      attempted: state.attempted,
      done: true
    };
    saveProgress(progress);
    document.getElementById("summaryUnitTitle").textContent = unit.title;
    document.getElementById("summaryScore").textContent = state.correct + "/" + unit.questions.length;
    var pct = Math.round(100 * state.correct / unit.questions.length);
    var sub = "You scored " + pct + "%.";
    if(pct >= 80) sub = "Excellent work &mdash; " + pct + "%. This unit is solid.";
    else if(pct >= 50) sub = "Good progress &mdash; " + pct + "%. Review the missed questions in the practice book.";
    else sub = pct + "%. Worth another pass through this unit.";
    document.getElementById("summarySub").innerHTML = sub;
    showView("summary");
    refreshOverall();
  }

  document.getElementById("retryBtn").addEventListener("click", function(){ startUnit(state.unitIdx); });
  document.getElementById("toUnitsBtn").addEventListener("click", function(){ showView("home"); });
  backBtn.addEventListener("click", function(){ showView("home"); });

  showView("home");
})();
</script>

</body></html>
