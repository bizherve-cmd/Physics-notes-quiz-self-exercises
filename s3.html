tions": ["1 Ω", "10 Ω", "30 Ω", "0.97 Ω"], "answer": 1}, {"q": "In a series circuit, the current flowing through each resistor is:", "explanation": "There is only one path for current in a series circuit, so the same current flows through every component.", "type": "mcq", "options": ["Zero", "Different for each resistor", "Dependent only on the largest resistor", "The same through every resistor"], "answer": 3}, {"q": "For resistors connected in parallel, the formula for total resistance is:", "explanation": "For resistors in parallel, the reciprocals of resistance add: 1/R_total = 1/R1 + 1/R2 + ...", "type": "mcq", "options": ["R_total = R1 × R2 × R3", "R_total = R1 + R2 + R3", "R_total = (R1 + R2 + R3)/3", "1/R_total = 1/R1 + 1/R2 + 1/R3"], "answer": 3}, {"q": "Two resistors of 4 Ω and 6 Ω are connected in parallel. The total resistance is:", "explanation": "1/R = 1/4 + 1/6 = 3/12 + 2/12 = 5/12, so R = 12/5 = 2.4 Ω.", "type": "mcq", "options": ["10 Ω", "1.5 Ω", "24 Ω", "2.4 Ω"], "answer": 3}, {"q": "In a parallel circuit, the voltage across each branch is:", "explanation": "All branches in parallel are connected between the same two points, so each branch has the same voltage as the supply.", "type": "mcq", "options": ["Different for each branch", "Equal to the total current", "Always zero", "The same as the supply voltage across every branch"], "answer": 3}, {"q": "Adding more resistors in parallel always decreases the total (equivalent) resistance of the combination.", "explanation": "Each extra parallel path provides an additional route for current, so the total resistance of a parallel combination is always less than the smallest individual resistor.", "type": "tf", "answer": true}, {"q": "The electromotive force (e.m.f.) of a cell or battery is best described as:", "explanation": "E.m.f. is the total energy per unit charge supplied by the source, measured in volts, before any internal voltage drop is subtracted.", "type": "mcq", "options": ["The total electrical energy given to each unit charge by the source, including energy used to overcome internal resistance", "The voltage drop across an external resistor only", "The resistance of the connecting wires", "The current the battery can supply"], "answer": 0}, {"q": "Internal resistance of a battery causes:", "explanation": "As current flows through the battery's internal resistance, some energy is lost inside the cell, so terminal voltage V = E.m.f. − I×r, which is less than the e.m.f.", "type": "mcq", "options": ["A drop in terminal voltage below the e.m.f. when current flows", "An increase in e.m.f. when current flows", "The battery to charge itself", "No effect on the circuit at all"], "answer": 0}, {"q": "A battery has an e.m.f. of 12 V and internal resistance of 0.5 Ω. When it delivers a current of 2 A, its terminal voltage is:", "explanation": "Terminal voltage V = E − I×r = 12 − (2 × 0.5) = 12 − 1 = 11 V.", "type": "mcq", "options": ["12 V", "1 V", "13 V", "11 V"], "answer": 3}, {"q": "The equation relating terminal voltage V, e.m.f. E, current I and internal resistance r is V = E − I × ______.", "explanation": "Terminal voltage equals e.m.f. minus the voltage drop across the internal resistance (I×r).", "type": "fill", "answer": "r"}, {"q": "Why does a battery's terminal voltage drop when it supplies a larger current?", "explanation": "A larger current causes a larger voltage drop (I×r) across the internal resistance, reducing the voltage available at the terminals.", "type": "mcq", "options": ["More energy is lost as heat across its internal resistance as current increases", "The battery gains resistance externally", "The e.m.f. decreases with current", "Current has no relationship with terminal voltage"], "answer": 0}, {"q": "In household electrical installation, the point where electricity from the supply company first enters the building is called the:", "explanation": "The service entrance, or main supply point, is where the utility's cables connect to the building's own wiring system.", "type": "mcq", "options": ["Distribution board", "Lighting point", "Service entrance (main supply point)", "Earthing rod"], "answer": 2}, {"q": "The device that records the amount of electrical energy (in kWh) consumed in a house is the:", "explanation": "The energy meter measures and records electrical energy used, in kilowatt-hours, for billing purposes.", "type": "mcq", "options": ["Energy meter", "Circuit breaker", "Distribution board", "Earthing conductor"], "answer": 0}, {"q": "The distribution board (consumer unit) in a house mainly functions to:", "explanation": "The distribution board splits the incoming supply into separate circuits (lighting, sockets, etc.), each protected by its own breaker or fuse.", "type": "mcq", "options": ["Generate electricity for the house", "Convert AC to DC", "Distribute incoming power to different circuits and house the circuit breakers/fuses for each circuit", "Measure atmospheric pressure"], "answer": 2}, {"q": "Circuit breakers and fuses in a house wiring system are mainly used to:", "explanation": "They protect the circuit and wiring by breaking the circuit if the current becomes dangerously high, for example due to a short circuit or overload.", "type": "mcq", "options": ["Measure electrical energy consumption", "Store electrical energy", "Automatically disconnect a circuit when current exceeds a safe limit, preventing fire or damage", "Increase the voltage supplied"], "answer": 2}, {"q": "The earthing (grounding) system in a house installation is designed to:", "explanation": "Earthing connects exposed metal parts of appliances to the ground, so a fault current flows safely to earth instead of through a person, and can trip protection devices.", "type": "mcq", "options": ["Make appliances run faster", "Provide a low-resistance path for fault current to flow safely into the ground, reducing risk of electric shock", "Increase the resistance of the circuit", "Reduce the voltage of the supply"], "answer": 1}, {"q": "Conduits used in electrical installation are mainly meant to:", "explanation": "Conduits are tubes (metal or plastic) that house and protect cables from mechanical damage, moisture and fire hazards.", "type": "mcq", "options": ["Generate electricity", "Measure current", "Replace the need for insulation on wires", "Protect and route cables mechanically within walls or along surfaces"], "answer": 3}, {"q": "In a house circuit, a switch is used to:", "explanation": "A switch is a control device that makes or breaks the circuit, turning the connected load on or off.", "type": "mcq", "options": ["Protect against lightning only", "Open or close (control) the flow of current to an appliance or light", "Measure the voltage of the supply", "Store electrical charge"], "answer": 1}, {"q": "Sockets (outlets) in a house wiring system serve to:", "explanation": "Sockets allow appliances to be safely connected to the household electrical supply via plugs.", "type": "mcq", "options": ["Measure current directly", "Replace the distribution board", "Provide a safe connection point for plugging in portable appliances", "Generate voltage"], "answer": 2}, {"q": "Lighting points and socket outlets in a house are typically wired as completely separate circuits from the main distribution board.", "explanation": "Lighting circuits and socket (power) circuits are usually wired separately, each with its own protective device, so a fault in one does not affect the other.", "type": "tf", "answer": true}, {"q": "A protective device that automatically opens the circuit when current exceeds a set value, and can be manually reset afterward, is called a circuit ______.", "explanation": "Unlike a fuse (which must be replaced), a circuit breaker can be reset and reused after tripping.", "type": "fill", "answer": "breaker"}, {"q": "During house wiring installation, 'termination and connection of cables' refers to:", "explanation": "Termination involves preparing cable ends and firmly and safely connecting them to terminals, ensuring good electrical contact and mechanical security.", "type": "mcq", "options": ["Properly stripping, connecting and securing cable ends at terminals, sockets, switches and distribution points", "Installing the roof of the building", "Cutting off the electricity supply permanently", "Painting the walls after wiring"], "answer": 0}, {"q": "'Mounting fixtures and accessories' in the installation process includes:", "explanation": "This stage involves physically fitting and securing switches, sockets, lamp holders and other accessories in place.", "type": "mcq", "options": ["Digging the foundation of the house", "Painting the switches a certain colour", "Fixing switches, socket outlets and light fittings securely in their designated positions", "Removing the distribution board"], "answer": 2}, {"q": "'Earthing and bonding' during installation mainly involves:", "explanation": "Bonding connects metal parts (pipes, enclosures, casings) to earth so they cannot become dangerously live during a fault.", "type": "mcq", "options": ["Increasing the voltage of the supply", "Painting metal parts of the house", "Connecting metal enclosures, pipes and exposed conductive parts to the earthing system for safety", "Removing all metal fittings from the building"], "answer": 2}, {"q": "Before energizing a newly installed house wiring system, electricians should first carry out:", "explanation": "Testing (continuity, insulation resistance, polarity, earth continuity) confirms the installation is safe and correctly wired before it is switched on.", "type": "mcq", "options": ["Painting of the walls", "Testing and inspection, such as continuity, insulation resistance and polarity tests", "Removing the earth wire", "Selling the property"], "answer": 1}, {"q": "'Energizing the system' in the installation process means:", "explanation": "Energizing is turning on the electrical supply to the installation only after it has passed all required safety tests and inspections.", "type": "mcq", "options": ["Painting the distribution board", "Switching on the power supply to the completed and tested installation", "Disconnecting the meter permanently", "Removing the circuit breakers"], "answer": 1}, {"q": "'Documentation and handover' at the end of an installation project typically includes:", "explanation": "Proper documentation (circuit diagrams, test results, certificates) is handed to the client so the installation can be maintained and understood in future.", "type": "mcq", "options": ["Disconnecting the earthing system", "Melting the fuses", "Removing all switches from the walls", "Providing wiring diagrams, test certificates and instructions to the owner"], "answer": 3}, {"q": "Testing and inspection of a house wiring installation should be done only after the system has already been energized and used for several months.", "explanation": "Testing and inspection must be carried out before energizing the system, to ensure the installation is safe prior to first use.", "type": "tf", "answer": false}, {"q": "The stage of house wiring in which metal parts are connected together and to earth to prevent dangerous voltages on exposed metal is called earthing and ______.", "explanation": "Bonding links metal parts electrically to the earthing system so they remain at the same (safe) potential.", "type": "fill", "answer": "bonding"}, {"q": "Why is earthing important for electrical safety in a house?", "explanation": "If a live wire touches an earthed metal casing, most fault current flows safely to earth rather than through a person, and the resulting large current trips the fuse or breaker.", "type": "mcq", "options": ["It provides a safe, low-resistance path for fault current, reducing the risk of electric shock and helping trip protective devices quickly", "It stores backup electrical energy", "It reduces the household electricity bill", "It increases the voltage supplied to appliances"], "answer": 0}, {"q": "A fuse protects a circuit by:", "explanation": "A fuse contains a thin wire that melts (and breaks the circuit) when current exceeds a safe rated value, preventing overheating and fire.", "type": "mcq", "options": ["Converting AC to DC", "Storing excess current for later use", "Melting and breaking the circuit when current exceeds its rated value", "Increasing resistance to slow current down gradually"], "answer": 2}, {"q": "Compared with a fuse, a circuit breaker's main advantage is that it:", "explanation": "Unlike a fuse, which must be replaced after melting, a circuit breaker is a mechanical/electromagnetic switch that can simply be reset after a fault is cleared.", "type": "mcq", "options": ["Never trips even under fault conditions", "Can be reset and reused after it trips, without needing replacement", "Only works with DC circuits", "Cannot be reset once tripped"], "answer": 1}, {"q": "An electric appliance without a properly earthed metal casing poses a danger because:", "explanation": "Without earthing, a fault connecting a live wire to the casing has no safe path to ground, so the casing stays dangerously live until someone touches it, completing the shock circuit.", "type": "mcq", "options": ["It will not work at all", "A fault could make the casing live, and anyone touching it could receive a dangerous electric shock", "It uses less electrical energy", "It will automatically switch itself off"], "answer": 1}, {"q": "Why should fuse ratings match the appliance or circuit they protect, rather than always using the highest available rating?", "explanation": "If the fuse rating is too high for the wiring or appliance, it may allow a dangerous overcurrent to continue flowing without blowing, risking overheating or fire.", "type": "mcq", "options": ["Higher-rated fuses look better", "A fuse rated too high will not blow in time to prevent overheating and possible fire in that circuit", "Lower ratings always damage appliances", "Fuse rating has no safety significance"], "answer": 1}, {"q": "Circuit breakers and fuses serve the same basic safety purpose: disconnecting a circuit when current becomes dangerously high.", "explanation": "Both devices are protection devices designed to interrupt current when it exceeds a safe level, though they differ in mechanism and reusability.", "type": "tf", "answer": true}, {"q": "A cell's internal ______ causes the terminal voltage to be lower than the e.m.f. whenever current flows through the cell.", "explanation": "Internal resistance produces a voltage drop (I×r) inside the cell itself, reducing the voltage available at its terminals.", "type": "fill", "answer": "resistance"}, {"q": "A protection device that quickly disconnects a circuit if it detects a small leakage (earth fault) current, offering extra shock protection, is called a(n):", "explanation": "An RCD (or ELCB) monitors for small imbalances in current that indicate leakage to earth and disconnects the circuit rapidly to protect against electric shock.", "type": "mcq", "options": ["Conduit", "Distribution board", "Residual current device (RCD) / earth leakage circuit breaker", "Energy meter"], "answer": 2}, {"q": "Which combination correctly matches series and parallel circuit properties?", "explanation": "In series circuits current is the same throughout while voltage splits across components; in parallel circuits voltage is the same across each branch while current splits between them.", "type": "mcq", "options": ["Series: same current, voltage divides; Parallel: same voltage, current divides", "Both series and parallel have the same current and voltage everywhere", "Series: same voltage, current divides; Parallel: same current, voltage divides", "Neither series nor parallel circuits have consistent current or voltage"], "answer": 0}, {"q": "A wiring/cable used in house installation must be correctly sized (cross-sectional area) mainly because:", "explanation": "A cable that is too thin for the current it must carry has higher resistance and heats up excessively, which can damage insulation and cause a fire; correct sizing keeps the cable within a safe current-carrying capacity.", "type": "mcq", "options": ["All cables carry the same maximum current regardless of size", "Thicker size only affects the cable's colour", "Cable size has no effect on safety", "An undersized cable for the current it carries can overheat, risking insulation damage and fire"], "answer": 3}]}, {"unit": 7, "title": "Unit 7: Electrical Power Transmission", "questions": [{"q": "A transformer is a device that mainly works on the principle of:", "explanation": "A transformer transfers electrical energy between coils through a changing magnetic field, based on electromagnetic induction (Faraday's law).", "type": "mcq", "options": ["Nuclear fission", "Friction between wires", "Chemical reaction", "Electromagnetic induction"], "answer": 3}, {"q": "The three main components of a simple transformer are:", "explanation": "A transformer consists of a primary winding, a secondary winding, and a laminated soft iron core that links them magnetically.", "type": "mcq", "options": ["Two identical batteries and a bulb", "Fuse, socket and earth wire", "Primary coil, secondary coil and a laminated soft iron core", "Resistor, capacitor and switch"], "answer": 2}, {"q": "A step-up transformer is one that:", "explanation": "A step-up transformer has more turns on the secondary than the primary (Ns > Np), producing a higher output voltage than the input voltage.", "type": "mcq", "options": ["Only works with direct current", "Decreases the voltage from primary to secondary", "Keeps voltage exactly the same on both sides", "Increases the voltage from primary to secondary, with more turns on the secondary coil"], "answer": 3}, {"q": "A step-down transformer is one that:", "explanation": "A step-down transformer has fewer turns on the secondary than the primary (Ns < Np), so it lowers the voltage from input to output.", "type": "mcq", "options": ["Decreases voltage from primary to secondary, with fewer turns on the secondary coil", "Increases voltage and decreases current", "Has no core", "Only works with batteries"], "answer": 0}, {"q": "The turns-ratio equation for an ideal transformer is:", "explanation": "For an ideal transformer, the ratio of primary to secondary voltage equals the ratio of primary to secondary number of turns: Vp/Vs = Np/Ns.", "type": "mcq", "options": ["Vp/Vs = Np/Ns", "Vp + Vs = Np + Ns", "Vp/Vs = Ns × Np", "Vp × Vs = Np × Ns"], "answer": 0}, {"q": "A transformer has 1000 turns on the primary and 100 turns on the secondary. If the primary voltage is 240 V, the secondary voltage is:", "explanation": "Vs = Vp × (Ns/Np) = 240 × (100/1000) = 24 V, so this is a step-down transformer.", "type": "mcq", "options": ["240 V", "100 V", "24 V", "2400 V"], "answer": 2}, {"q": "A step-up transformer has a primary voltage of 240 V and primary current of 2 A. If it is ideal (100% efficient) and steps the voltage up to 480 V, the secondary current is:", "explanation": "For an ideal transformer, input power = output power: Vp×Ip = Vs×Is, so Is = (240×2)/480 = 480/480 = 1 A.", "type": "mcq", "options": ["4 A", "2 A", "0.5 A", "1 A"], "answer": 3}, {"q": "In an ideal transformer, increasing the output voltage (stepping up) also increases the output current proportionally.", "explanation": "In an ideal transformer power is conserved (Vp Ip = Vs Is), so stepping up voltage causes current to decrease proportionally, not increase.", "type": "tf", "answer": false}, {"q": "The efficiency of a transformer is defined as:", "explanation": "Efficiency compares useful output power to the power supplied: Efficiency = (Output power / Input power) × 100%.", "type": "mcq", "options": ["Np/Ns × 100%", "(Output power / Input power) × 100%", "(Input power / Output power) × 100%", "Vp × Vs × 100%"], "answer": 1}, {"q": "A transformer receives 1000 W of input power and delivers 900 W of useful output power. Its efficiency is:", "explanation": "Efficiency = (900/1000) × 100% = 90%.", "type": "mcq", "options": ["100%", "10%", "900%", "90%"], "answer": 3}, {"q": "Real transformers are less than 100% efficient mainly because of:", "explanation": "Some electrical energy is converted to heat due to winding resistance (copper loss) and losses in the iron core (hysteresis and eddy current losses), reducing overall efficiency.", "type": "mcq", "options": ["Having too few components", "The turns ratio being too large", "Using alternating current instead of direct current", "Energy losses such as resistive (copper) heating in the windings and core losses (hysteresis and eddy currents)"], "answer": 3}, {"q": "In a transformer, the core is made of laminated (thin, insulated) sheets of soft iron mainly to reduce ______ current losses.", "explanation": "Laminating the core into thin insulated sheets reduces the paths for eddy currents to flow, cutting energy losses as heat.", "type": "fill", "answer": "eddy"}, {"q": "A transformer cannot be used to step up or step down a steady direct current (DC) voltage because:", "explanation": "Transformers rely on a continuously changing magnetic flux to induce voltage in the secondary coil; steady DC produces a constant flux, so no induction (and hence no transformer action) occurs.", "type": "mcq", "options": ["DC does not produce a changing magnetic field needed for electromagnetic induction", "Transformers only work with mercury", "DC is too weak", "DC has no voltage at all"], "answer": 0}, {"q": "Which quantity remains theoretically the same between the primary and secondary sides of an ideal transformer?", "explanation": "An ideal transformer has no energy losses, so input electrical power equals output electrical power (Vp Ip = Vs Is), even though voltage and current individually change.", "type": "mcq", "options": ["Electrical power", "Current", "Voltage", "Number of turns"], "answer": 0}, {"q": "Electric power is transmitted over long distances at very high voltage mainly to:", "explanation": "Since power P = VI, transmitting at high voltage allows the same power to be carried with a much smaller current, greatly reducing resistive (I²R) losses in the lines.", "type": "mcq", "options": ["Make the transmission lines heavier", "Reduce the current for a given power, thereby reducing I²R power losses in the lines", "Increase power losses for safety", "Make the electricity cheaper to generate"], "answer": 1}, {"q": "The typical order of components in an electric power transmission system, from generation to the consumer, is:", "explanation": "Power is generated at the power station, stepped up for efficient long-distance transmission, then stepped down at substations before being distributed to consumers.", "type": "mcq", "options": ["Distribution network → power station → consumer", "Power station → step-up transformer → transmission lines → step-down transformer (substation) → distribution network → consumer", "Consumer → transformer → power station", "Transmission lines → consumer → power station"], "answer": 1}, {"q": "Step-up transformers are typically located:", "explanation": "Step-up transformers at the generating station raise the voltage produced by generators to a high level suitable for efficient long-distance transmission.", "type": "mcq", "options": ["Inside every household appliance", "At the power (generating) station, to raise voltage for transmission", "At the very end user's socket only", "Underground with no connection to the grid"], "answer": 1}, {"q": "Step-down transformers are mainly found at:", "explanation": "Substations use step-down transformers to reduce the high transmission voltage to lower voltages suitable and safe for industrial, commercial and household use.", "type": "mcq", "options": ["The power station only", "Inside transmission pylons only", "Substations near consumers, to lower the high transmission voltage to safer levels for use", "Nowhere in the grid"], "answer": 2}, {"q": "Transformers are used in a national electricity grid both to step voltage up for transmission and to step it down for safe use by consumers.", "explanation": "Step-up transformers raise voltage for efficient transmission, while step-down transformers at substations lower it again to usable, safer levels for consumers.", "type": "tf", "answer": true}, {"q": "The overall system that carries electrical power from the generating station to consumers, including transformers and cables, is called the electric power ______ system.", "explanation": "This describes the electric power transmission (and distribution) system linking generation to end users.", "type": "fill", "answer": "transmission"}, {"q": "Which of the following is an advantage of overhead power transmission lines compared with underground cables?", "explanation": "Overhead lines cost less to install and it is generally easier to spot and fix faults compared with buried underground cables.", "type": "mcq", "options": ["They are cheaper to install and easier to inspect, locate faults on, and repair", "They are completely immune to weather damage", "They never require maintenance", "They have no visual impact on the landscape"], "answer": 0}, {"q": "Which of the following is a disadvantage of overhead transmission lines?", "explanation": "Overhead lines are exposed to the elements, which can cause faults during storms, and their accessibility increases the risk of accidental contact or damage.", "type": "mcq", "options": ["They cannot carry high voltage", "They require no support structures (pylons)", "They are more expensive than underground cables", "They are exposed to weather (wind, storms, lightning) and pose a greater risk of accidental contact"], "answer": 3}, {"q": "An advantage of underground power cables over overhead lines is that they:", "explanation": "Buried cables are shielded from wind, storms and lightning, and they avoid the unsightly pylons and wires of overhead lines.", "type": "mcq", "options": ["Never suffer from power losses", "Are protected from weather conditions and have less visual/environmental impact", "Are cheaper to install and repair", "Require no insulation at all"], "answer": 1}, {"q": "A major disadvantage of underground power cables compared with overhead lines is that they:", "explanation": "Underground cables require more expensive insulation, trenching and specialised techniques, making installation and fault repair more costly and time-consuming than overhead lines.", "type": "mcq", "options": ["Carry no current at all", "Cannot be insulated", "Are much more expensive to install and more difficult/costly to locate and repair faults in", "Are always less safe"], "answer": 2}, {"q": "Underground cables are generally preferred over overhead lines in busy urban areas partly because they reduce visual impact and risk of accidental contact.", "explanation": "Although more costly, underground cables are often used in cities to avoid unsightly overhead wiring and reduce the danger of people or vehicles contacting live lines.", "type": "tf", "answer": true}, {"q": "One major cause of power loss in transmission lines is:", "explanation": "As current flows through the resistance of transmission line conductors, electrical energy is converted to heat, described by the formula P = I²R.", "type": "mcq", "options": ["The presence of step-down transformers", "I²R (resistive) heating loss in the conductors", "Using very high voltage", "Using thick, low-resistance conductors"], "answer": 1}, {"q": "A transmission line has a total resistance of 5 Ω and carries a current of 10 A. The power lost as heat in the line is:", "explanation": "Power loss P = I²R = 10² × 5 = 100 × 5 = 500 W.", "type": "mcq", "options": ["5000 W", "50 W", "500 W", "0.5 W"], "answer": 2}, {"q": "If the current in a transmission line is doubled while its resistance stays the same, the I²R power loss becomes:", "explanation": "Since power loss is proportional to the square of current (P = I²R), doubling the current increases the loss by a factor of 2² = 4.", "type": "mcq", "options": ["Half as much", "Unchanged", "Twice as much", "Four times as much"], "answer": 3}, {"q": "Corona discharge, a source of power loss in high-voltage transmission lines, is best described as:", "explanation": "At very high voltages, the electric field around the conductor can ionize the surrounding air, causing a faint glow and energy loss called corona discharge, worsened by humidity.", "type": "mcq", "options": ["A type of transformer fault only", "Loss of power due to underground water damaging cables", "Loss of power due to ionization of the air surrounding the conductor at very high voltage, especially in humid conditions", "A loss that occurs only in DC circuits"], "answer": 2}, {"q": "Leakage current as a cause of transmission line power loss refers to:", "explanation": "Leakage currents pass through imperfect insulation (e.g., insulators on pylons) to earth, wasting some of the transmitted electrical energy.", "type": "mcq", "options": ["Current that flows through insulators or supports to earth instead of staying in the intended conductor path", "Current that flows perfectly through the conductor with no loss", "A type of current found only in transformers", "An increase in useful transmitted power"], "answer": 0}, {"q": "The formula used to calculate resistive power loss in a transmission line, where I is the current and R is the line's resistance, is P = I² × ______.", "explanation": "Resistive power loss is given by P = I²R, showing that loss depends on the square of the current and the line's resistance.", "type": "fill", "answer": "R"}, {"q": "Which of the following is an effective way to minimize power losses in electrical transmission lines?", "explanation": "Since P = I²R, transmitting at high voltage reduces the current needed for a given power, which greatly reduces resistive losses.", "type": "mcq", "options": ["Increasing the current while keeping voltage constant", "Reducing the cross-sectional area of the conductors", "Using conductors with very high resistivity", "Transmitting power at high voltage to keep current low"], "answer": 3}, {"q": "Using conductors made of good conducting materials with low resistivity, such as copper or aluminium, helps to minimize transmission losses because:", "explanation": "Lower resistivity conductors have lower resistance for the same dimensions, which directly reduces the I²R power lost as heat.", "type": "mcq", "options": ["It reduces the voltage available to consumers", "Lower resistivity means lower resistance for a given length and area, reducing I²R losses", "It has no effect on power loss", "It increases the resistance of the line"], "answer": 1}, {"q": "Increasing the cross-sectional area of a transmission line conductor (using a thicker cable) helps reduce power loss because it:", "explanation": "Resistance is inversely proportional to cross-sectional area (R = ρL/A), so a thicker conductor has lower resistance and therefore lower I²R power loss.", "type": "mcq", "options": ["Increases the resistance of the conductor", "Decreases the resistance of the conductor, reducing I²R losses", "Increases the voltage automatically", "Has no relation to resistance"], "answer": 1}, {"q": "Transmitting electrical power at a higher voltage for the same delivered power always reduces the current needed, which in turn reduces I²R power losses.", "explanation": "Since power P = VI, a higher transmission voltage means a lower current is needed to deliver the same power, and since losses depend on I², this significantly cuts resistive losses.", "type": "tf", "answer": true}, {"q": "Good line design to reduce transmission losses can include:", "explanation": "Proper spacing, good insulation and well-sized, well-maintained conductors reduce leakage, corona discharge and resistive losses.", "type": "mcq", "options": ["Using the smallest possible conductor regardless of current", "Poor spacing and thin, corroded conductors", "Adequate conductor spacing, quality insulation, and well-maintained, appropriately sized conductors", "Ignoring maintenance of insulators"], "answer": 2}, {"q": "A key reason high-voltage transmission is safer for reducing losses but requires strict safety measures near the lines is that:", "explanation": "Although high voltage reduces I²R losses by lowering current, it also increases the risk of electric arcing and shock, so transmission lines need proper clearance, insulation and warning measures.", "type": "mcq", "options": ["High voltage carries no risk at all", "High voltage transmission lines carry water, not electricity", "Very high voltages can cause dangerous discharge/arcing and require significant clearance and insulation for public safety", "High voltage transmission uses no electricity"], "answer": 2}, {"q": "An everyday application of transformers, besides the national grid, is:", "explanation": "Small step-down transformers (or transformer-based adapters) are used in chargers and adapters to convert mains voltage to the low voltages needed by electronic devices.", "type": "mcq", "options": ["Phone and laptop chargers, which step down mains voltage to a lower, safer voltage for electronic devices", "Cooking food directly", "Measuring atmospheric pressure", "Generating water pressure in a tap"], "answer": 0}, {"q": "A transformer whose secondary coil has fewer turns than its primary coil is called a step-______ transformer.", "explanation": "Fewer turns on the secondary than the primary means the output voltage is lower than the input, characteristic of a step-down transformer.", "type": "fill", "answer": "down"}, {"q": "In Rwanda's national grid, electricity generated at power plants is stepped up to high voltage before transmission mainly to:", "explanation": "As in any national grid, Rwanda steps up voltage for transmission across the country so that lower current is needed to deliver the same power, reducing resistive losses along the lines before substations step the voltage back down for consumers.", "type": "mcq", "options": ["Reduce transmission current and minimize I²R power losses over the long distances to substations across the country", "Make the electricity a different colour", "Prevent transformers from being used at all", "Increase the number of power stations needed"], "answer": 0}]}, {"unit": 8, "title": "Unit 8: Refraction of Light", "questions": [{"q": "What is refraction of light?", "explanation": "Refraction is the change in direction of a light ray as it crosses a boundary between two media of different optical densities, caused by a change in speed.", "type": "mcq", "options": ["The bending of light as it passes obliquely from one medium to another of different optical density", "The bouncing back of light from a surface", "The absorption of light by a medium", "The spreading of light in a vacuum"], "answer": 0}, {"q": "Which of the following is a necessary condition for refraction to occur at a boundary?", "explanation": "Refraction requires a change in optical density between the two media; a ray along the normal changes speed but does not bend.", "type": "mcq", "options": ["The light must be travelling in a vacuum only", "The two media must have the same refractive index", "The surface must be a mirror", "The two media must have different optical densities and the ray must strike the boundary obliquely"], "answer": 3}, {"q": "The refractive index of a medium is defined as:", "explanation": "Refractive index n equals the ratio of sine of angle of incidence to sine of angle of refraction, and also equals the ratio of speed of light in vacuum to speed in the medium (n = c/v).", "type": "mcq", "options": ["n = v/c only", "n = sin i / sin r = c/v", "n = i/r (angles in degrees, direct ratio)", "n = sin r / sin i"], "answer": 1}, {"q": "Light travels from air into a glass block of refractive index 1.5. If the angle of incidence is 30°, what is the angle of refraction?", "explanation": "sin r = sin i / n = sin30°/1.5 = 0.5/1.5 = 0.333, so r = sin⁻¹(0.333) ≈ 19.5°.", "type": "mcq", "options": ["30°", "11.5°", "19.5°", "45°"], "answer": 2}, {"q": "The speed of light in vacuum is c and in a medium is v. The refractive index n of the medium is given by:", "explanation": "By definition, the absolute refractive index n = c/v, where c is the speed of light in vacuum and v its speed in the medium.", "type": "mcq", "options": ["n = c/v", "n = c + v", "n = v/c", "n = c × v"], "answer": 0}, {"q": "A medium has a refractive index of 1.5. If the speed of light in vacuum is 3 × 10⁸ m/s, what is the speed of light in the medium?", "explanation": "v = c/n = (3 × 10⁸)/1.5 = 2.0 × 10⁸ m/s.", "type": "mcq", "options": ["3.0 × 10⁸ m/s", "2.0 × 10⁸ m/s", "4.5 × 10⁸ m/s", "1.5 × 10⁸ m/s"], "answer": 1}, {"q": "A ray of light striking a boundary exactly along the normal changes speed on entering the new medium but does not change direction.", "explanation": "At 0° incidence there is no bending because sin i = sin r = 0, but the speed still changes according to the refractive index of the new medium.", "type": "tf", "answer": true}, {"q": "Refraction can occur even when the two media have exactly the same optical density.", "explanation": "If the two media have the same optical density (same refractive index), the speed of light does not change, so there is no refraction/bending, even if some transmission occurs.", "type": "tf", "answer": false}, {"q": "The bending of light as it passes obliquely from one transparent medium into another of different optical density is called ______.", "explanation": "This change of direction happens because the speed of light changes when it crosses into a medium of different optical density.", "type": "fill", "answer": "refraction"}, {"q": "When light travels from air (less dense) into glass (denser medium) at an angle, it bends:", "explanation": "Light slows down when entering a denser medium, causing it to bend towards the normal.", "type": "mcq", "options": ["Along the normal only", "It does not bend", "Towards the normal", "Away from the normal"], "answer": 2}, {"q": "When light travels from glass (denser) into air (less dense) at an angle, it bends:", "explanation": "Light speeds up when leaving a denser medium for a less dense one, so it bends away from the normal.", "type": "mcq", "options": ["Away from the normal", "Towards the normal", "Back into the glass only", "Perpendicular to the surface"], "answer": 0}, {"q": "Snell's law of refraction relating two media of refractive indices n1 and n2 is written as:", "explanation": "Snell's law states that n1 sin i = n2 sin r, where i is the angle of incidence in medium 1 and r is the angle of refraction in medium 2.", "type": "mcq", "options": ["n1 sin i = n2 sin r", "n1/sin i = n2/sin r", "n1 + sin i = n2 + sin r", "n1 cos i = n2 cos r"], "answer": 0}, {"q": "Light travels from water (n = 1.33) into glass (n = 1.5) with an angle of incidence of 40°. What is the angle of refraction (to 1 d.p.)?", "explanation": "Using n1 sin i = n2 sin r: sin r = (1.33 × sin40°)/1.5 = (1.33 × 0.643)/1.5 ≈ 0.570, so r ≈ 34.8°.", "type": "mcq", "options": ["46.6°", "28.5°", "34.8°", "40.0°"], "answer": 2}, {"q": "According to the first law of refraction, the incident ray, the refracted ray and the normal at the point of incidence:", "explanation": "The first law of refraction states that the incident ray, refracted ray and the normal at the point of incidence all lie in the same plane.", "type": "mcq", "options": ["Have no fixed geometric relationship", "Must all lie along the boundary surface", "All lie in the same plane", "Are always perpendicular to each other"], "answer": 2}, {"q": "The second law of refraction (Snell's law) states that for a given pair of media, the ratio sin i / sin r is a ______ called the refractive index.", "explanation": "For any two given media, the ratio of the sine of the angle of incidence to the sine of the angle of refraction is always the same value, the refractive index.", "type": "fill", "answer": "constant"}, {"q": "The critical angle for a pair of media is defined as the angle of incidence in the denser medium for which:", "explanation": "The critical angle C is the angle of incidence in the denser medium at which the refracted ray grazes along the boundary, making the angle of refraction exactly 90°.", "type": "mcq", "options": ["The angle of refraction is 0°", "The angle of refraction is 90°", "The ray reflects straight back along its own path", "Total internal reflection is impossible"], "answer": 1}, {"q": "At the critical angle, the angle of refraction in the less dense medium is exactly ______ degrees.", "explanation": "By definition, the critical angle produces a refracted ray that travels along the boundary between the two media, at 90° to the normal.", "type": "fill", "answer": "90"}, {"q": "Total internal reflection occurs only when:", "explanation": "Total internal reflection requires light travelling from a denser medium towards a less dense one, with an angle of incidence greater than the critical angle.", "type": "mcq", "options": ["Light travels from a less dense to a denser medium at any angle", "Light strikes a boundary at exactly 0°", "Light travels from a denser to a less dense medium and the angle of incidence exceeds the critical angle", "The two media have equal refractive indices"], "answer": 2}, {"q": "A glass has a refractive index of 1.5. What is its critical angle for the glass-air boundary (to 1 d.p.)?", "explanation": "sin C = 1/n = 1/1.5 = 0.667, so C = sin⁻¹(0.667) ≈ 41.8°.", "type": "mcq", "options": ["41.8°", "36.9°", "48.8°", "60.0°"], "answer": 0}, {"q": "Water has a refractive index of 1.33. What is the critical angle for the water-air boundary (to 1 d.p.)?", "explanation": "sin C = 1/n = 1/1.33 = 0.752, so C = sin⁻¹(0.752) ≈ 48.8°.", "type": "mcq", "options": ["53.1°", "45.0°", "48.8°", "41.8°"], "answer": 2}, {"q": "Total internal reflection can occur when light travels from air into glass, provided the angle of incidence is large enough.", "explanation": "Total internal reflection can only occur when light travels from a denser medium into a less dense one (e.g. glass to air), not the reverse.", "type": "tf", "answer": false}, {"q": "Optical fibres transmit light over long distances mainly by relying on which phenomenon?", "explanation": "Light entering an optical fibre repeatedly strikes the core-cladding boundary at an angle greater than the critical angle, undergoing total internal reflection and travelling along the fibre with little loss.", "type": "mcq", "options": ["Simple reflection from a silvered mirror", "Diffraction", "Polarisation", "Total internal reflection"], "answer": 3}, {"q": "In a simple periscope built with two right-angled prisms instead of mirrors, light is redirected by:", "explanation": "Each prism is arranged so that light strikes its 45° face at an angle greater than the critical angle of glass, undergoing total internal reflection to turn the light through 90°.", "type": "mcq", "options": ["Total internal reflection at the 45° hypotenuse face of each prism", "Refraction only, with no reflection", "Absorption and re-emission of light", "Dispersion into a spectrum of colours"], "answer": 0}, {"q": "When a ray of light passes through a glass block with parallel sides (parallel-sided medium), the emergent ray compared with the original incident ray is:", "explanation": "Refraction at the first surface bends the ray towards the normal, and refraction at the second (parallel) surface bends it back by an equal amount, so the emergent ray is parallel to the incident ray but shifted sideways (laterally displaced).", "type": "mcq", "options": ["Perpendicular to it", "Totally internally reflected back", "Bent through 90°", "Parallel to it but laterally displaced"], "answer": 3}, {"q": "When light passes through a glass block with parallel surfaces, the emergent ray is parallel to the incident ray but is shifted sideways; this shift is called the lateral ______.", "explanation": "The sideways shift between the incident ray's original path and the emergent ray's path is called the lateral displacement.", "type": "fill", "answer": "displacement"}, {"q": "A converging (convex) lens is:", "explanation": "A converging lens bulges outward and is thicker in the middle than at its edges, which causes parallel rays to bend towards a focal point.", "type": "mcq", "options": ["Thinner at the centre than at the edges", "Always made of a flat sheet of glass", "Of uniform thickness throughout", "Thicker at the centre than at the edges"], "answer": 3}, {"q": "A diverging (concave) lens is:", "explanation": "A diverging lens curves inward and is thinner at the centre than at the edges, causing parallel rays to spread out (diverge) as if from a virtual focal point.", "type": "mcq", "options": ["Identical in shape to a converging lens", "Thinner at the centre than at the edges", "Thicker at the centre than at the edges", "Always used to magnify distant objects"], "answer": 1}, {"q": "A diverging lens always produces a virtual, upright and diminished image, regardless of the object's position.", "explanation": "For any real object placed in front of a diverging lens, ray diagrams always show a virtual, upright, diminished image on the same side as the object.", "type": "tf", "answer": true}, {"q": "The lens equation relating object distance u, image distance v and focal length f is:", "explanation": "The thin lens equation is 1/f = 1/u + 1/v, using the real-is-positive sign convention for a real object and real image.", "type": "mcq", "options": ["1/f = 1/u − 1/v", "f = u × v", "1/f = 1/u + 1/v", "f = u + v"], "answer": 2}, {"q": "An object is placed 30 cm from a converging lens of focal length 10 cm. Where is the image formed?", "explanation": "1/v = 1/f − 1/u = 1/10 − 1/30 = 3/30 − 1/30 = 2/30, so v = 15 cm.", "type": "mcq", "options": ["30 cm", "15 cm", "7.5 cm", "10 cm"], "answer": 1}, {"q": "An object is placed 20 cm from a lens, and a real image forms 60 cm from the lens. What is the focal length of the lens?", "explanation": "1/f = 1/u + 1/v = 1/20 + 1/60 = 3/60 + 1/60 = 4/60, so f = 15 cm.", "type": "mcq", "options": ["20 cm", "10 cm", "40 cm", "15 cm"], "answer": 3}, {"q": "A converging lens has a focal length of 25 cm (0.25 m). What is its power?", "explanation": "Power P = 1/f (f in metres) = 1/0.25 = 4 dioptres (D).", "type": "mcq", "options": ["0.25 D", "40 D", "4 D", "2.5 D"], "answer": 2}, {"q": "A diverging lens has a focal length of 50 cm. What is its power?", "explanation": "For a diverging lens, f is negative, so f = −0.5 m and P = 1/f = 1/(−0.5) = −2 D.", "type": "mcq", "options": ["+0.5 D", "−2 D", "−0.5 D", "+2 D"], "answer": 1}, {"q": "The power of a lens is measured in units called the ______.", "explanation": "Power P = 1/f, where f is the focal length in metres, and the resulting unit is the dioptre (D).", "type": "fill", "answer": "dioptre"}, {"q": "The linear magnification produced by a lens is given by:", "explanation": "Magnification m equals the ratio of image distance to object distance, which is also equal to the ratio of image height to object height (hi/ho).", "type": "mcq", "options": ["m = f/u", "m = v/u = hi/ho", "m = u/v", "m = u × v"], "answer": 1}, {"q": "An object 15 cm from a lens produces an image 45 cm from the lens. What is the magnification?", "explanation": "m = v/u = 45/15 = 3, so the image is 3 times the height of the object.", "type": "mcq", "options": ["1", "0.33", "9", "3"], "answer": 3}, {"q": "When white light passes through a glass prism, it splits into a band of colours. This splitting is called:", "explanation": "Dispersion is the separation of white light into its component colours (a spectrum) because each colour (wavelength) is refracted by a slightly different amount in the prism.", "type": "mcq", "options": ["Dispersion", "Reflection", "Diffraction", "Polarisation"], "answer": 0}, {"q": "In the spectrum produced by a prism, which colour of light is deviated (bent) the most?", "explanation": "Violet light has the shortest wavelength and is refracted by the glass more strongly (highest refractive index for that colour), so it is deviated the most; red is deviated the least.", "type": "mcq", "options": ["Orange", "Violet", "Red", "Yellow"], "answer": 1}, {"q": "Rainbows are formed in the sky mainly due to which combination of processes acting on sunlight inside water droplets?", "explanation": "Sunlight entering a water droplet is refracted (dispersed into colours), undergoes internal reflection at the back of the droplet, and is refracted again on leaving, spreading the colours out to form a rainbow.", "type": "mcq", "options": ["Reflection only", "Total absorption of sunlight by water droplets", "Diffraction of sunlight by dust particles", "Dispersion and internal reflection of sunlight within spherical water droplets"], "answer": 3}, {"q": "A coin lies at the bottom of a pool of water. To an observer looking down from directly above, the coin appears:", "explanation": "Light rays from the coin bend away from the normal as they leave the water and enter air, making the coin appear closer to the surface (shallower) than its real depth; n = real depth/apparent depth.", "type": "mcq", "options": ["Shallower than it really is, due to refraction (apparent depth)", "At exactly the same depth as it really is", "Deeper than it really is", "To have moved sideways only"], "answer": 0}]}, {"unit": 9, "title": "Unit 9: Telecommunication Channels", "questions": [{"q": "What is communication?", "explanation": "Communication is the process by which information (a message) is transferred from a sender (source) to a receiver through some channel.", "type": "mcq", "options": ["The generation of electricity", "The conversion of light into heat", "The process of sending and receiving information (a message) from one place/person to another", "The storage of data on a computer"], "answer": 2}, {"q": "Digital communication refers to the transfer of information using:", "explanation": "In digital communication, information is converted into discrete binary values (0s and 1s) before being transmitted, rather than being sent as a continuously varying signal.", "type": "mcq", "options": ["Sound waves that travel through a vacuum", "Signals represented as discrete values, usually binary (0s and 1s)", "Continuously varying electrical signals only", "Light with no encoding at all"], "answer": 1}, {"q": "In the basic block diagram of a communication system, the device that converts a message into a signal suitable for transmission is the:", "explanation": "The transmitter takes the original message (e.g. sound or data), processes it and converts it into a signal that can travel through the transmission channel.", "type": "mcq", "options": ["Receiver", "Channel", "Transmitter", "Amplifier only"], "answer": 2}, {"q": "In a communication system, the medium through which the signal travels from the sender to the receiver is called the:", "explanation": "The channel is the physical or wireless path (such as a cable, optical fibre, or the atmosphere) through which the signal travels from transmitter to receiver.", "type": "mcq", "options": ["Channel", "Decoder", "Modulator", "Transducer"], "answer": 0}, {"q": "In a communication system, the device that accepts the transmitted signal and converts it back into a usable form of the original message is the:", "explanation": "The receiver picks up the transmitted signal from the channel and converts it back into a form the destination can understand, such as sound or text.", "type": "mcq", "options": ["Transmitter", "Channel", "Receiver", "Antenna only"], "answer": 2}, {"q": "The three basic parts of any communication system, in order, are the transmitter, the ______, and the receiver.", "explanation": "The channel is the transmission path linking the transmitter that sends the signal to the receiver that picks it up.", "type": "fill", "answer": "channel"}, {"q": "Which of the following is an example of a wired (guided) communication channel?", "explanation": "Coaxial cable, copper wire and optical fibre are guided media because the signal travels along a physical conductor or fibre; radio, microwave and satellite are wireless (unguided) media.", "type": "mcq", "options": ["Radio waves", "Coaxial cable", "Satellite link", "Microwave transmission"], "answer": 1}, {"q": "Which of the following is an example of a wireless (unguided) communication channel?", "explanation": "Microwave, radio wave and satellite links are wireless channels because the signal travels through free space (the atmosphere) without a physical conductor.", "type": "mcq", "options": ["Microwave transmission", "Optical fibre cable", "Coaxial cable", "Copper twisted-pair cable"], "answer": 0}, {"q": "An optical fibre cable transmits signals using:", "explanation": "Optical fibres carry information as pulses of light that travel along the fibre core, kept inside by repeated total internal reflection at the core-cladding boundary.", "type": "mcq", "options": ["Pulses of light guided along a thin glass or plastic fibre by total internal reflection", "Radio waves broadcast through the air", "Electric current through a copper conductor", "Sound waves through a solid rod"], "answer": 0}, {"q": "Compared with an ordinary copper cable, an optical fibre cable generally offers:", "explanation": "Optical fibres can carry much more data (higher bandwidth) with less signal loss over long distances and are not affected by electromagnetic interference, unlike copper cables.", "type": "mcq", "options": ["Higher bandwidth, lower signal loss, and immunity to electrical interference", "No ability to carry digital signals", "Lower bandwidth and more signal loss", "Slower transmission speed over short distances only"], "answer": 0}, {"q": "A coaxial cable is constructed with:", "explanation": "Coaxial cable has a central copper conductor, an insulating layer, a braided or foil metal shield, and an outer protective jacket, which reduces interference compared with plain copper wire.", "type": "mcq", "options": ["A hollow tube with no conductor at all", "Two glass fibres twisted together", "A single bare copper wire only", "A central conductor surrounded by an insulating layer, a metallic shield, and an outer insulating jacket"], "answer": 3}, {"q": "Satellite communication relies mainly on:", "explanation": "In satellite communication, a ground station transmits a microwave signal up to an orbiting satellite, which amplifies it and relays it back down to another ground station, allowing communication over very long distances.", "type": "mcq", "options": ["Sound waves passing through the atmosphere", "Signals carried along undersea copper cables only", "Microwave signals relayed between ground stations via a satellite orbiting the Earth", "Light pulses travelling through optical fibres in space"], "answer": 2}, {"q": "Microwave communication is commonly used for:", "explanation": "Microwaves travel in straight lines and are used for line-of-sight links such as mobile phone tower-to-tower links and satellite uplinks/downlinks.", "type": "mcq", "options": ["Long-distance line-of-sight links such as between mobile phone towers and satellite links", "Carrying signals only inside a single building using copper wire", "Transmitting signals through solid rock over any distance", "Storing data on a hard disk"], "answer": 0}, {"q": "Radio waves, microwaves and satellite links are all examples of wireless communication channels.", "explanation": "All three transmit signals through free space (the atmosphere or space) rather than along a physical conductor, so they are classed as wireless channels.", "type": "tf", "answer": true}, {"q": "A communication channel that uses a physical conductor such as copper wire, coaxial cable, or optical fibre to carry a signal is called a ______ channel.", "explanation": "Wired (guided) channels carry the signal along a physical medium, unlike wireless channels which use free space.", "type": "fill", "answer": "wired"}, {"q": "An analog signal is best described as one that:", "explanation": "An analog signal is a continuously varying quantity (such as voltage) that can take any value within a given range, changing smoothly over time.", "type": "mcq", "options": ["Cannot be affected by noise at all", "Varies continuously over time and can take any value within a range", "Can only take the values 0 and 1", "Is always transmitted through optical fibre"], "answer": 1}, {"q": "A digital signal is best described as one that:", "explanation": "A digital signal is represented using discrete, distinct values (usually two levels corresponding to binary 0 and 1), changing abruptly between these levels rather than varying smoothly.", "type": "mcq", "options": ["Varies smoothly and continuously like a sine wave", "Takes only a limited number of discrete values, typically represented in binary form (0s and 1s)", "Is only used for analog radio broadcasting", "Cannot carry any information"], "answer": 1}, {"q": "Which characteristic is typical of a digital signal but not of an analog signal?", "explanation": "Digital signals jump abruptly between a fixed set of discrete levels (usually two, representing binary 0 and 1), unlike analog signals which vary continuously.", "type": "mcq", "options": ["Continuous variation in amplitude", "Being affected by every small amount of electrical noise", "Requiring no encoding of information", "Representation using discrete binary values with abrupt changes between levels"], "answer": 3}, {"q": "One key advantage of digital signals over analog signals is that digital signals:", "explanation": "Digital signals can be easily distinguished from noise and regenerated (reshaped) at repeater stations, so they suffer far less quality loss than analog signals over distance or after copying.", "type": "mcq", "options": ["Cannot be compressed or stored", "Degrade in quality every time they are copied or retransmitted", "Are more resistant to noise and can be regenerated without loss of quality", "Cannot be transmitted over long distances"], "answer": 2}, {"q": "Compared to digital signals, analog signals are generally:", "explanation": "Because analog signals vary continuously, noise added during transmission blends into the signal and is hard to remove, causing gradual degradation in quality, especially over long distances or after repeated amplification.", "type": "mcq", "options": ["Impossible to amplify", "More prone to gradual signal degradation and interference from noise", "Always transmitted faster over the same channel", "More resistant to noise interference"], "answer": 1}, {"q": "Digital signals are generally more resistant to noise than analog signals because their discrete levels can be clearly distinguished from noise and restored.", "explanation": "Since a digital signal only needs to be identified as one of a few fixed levels, small amounts of noise usually do not change which level is detected, allowing the original signal to be regenerated accurately.", "type": "tf", "answer": true}, {"q": "An analog signal can only take two possible values at any instant in time.", "explanation": "An analog signal can take any value within a continuous range, unlike a digital signal, which is restricted to a limited number of discrete values (commonly two, for binary).", "type": "tf", "answer": false}, {"q": "A signal that changes smoothly and continuously over time, able to take any value within a range, is called an ______ signal.", "explanation": "This continuously varying type of signal is called an analog signal, in contrast to a digital signal, which uses discrete values.", "type": "fill", "answer": "analog"}, {"q": "A signal that is represented using a limited number of discrete values, most commonly two levels representing 0 and 1, is called a ______ signal.", "explanation": "Such a signal uses fixed, distinct levels (binary digits) rather than varying continuously, and is called a digital signal.", "type": "fill", "answer": "digital"}, {"q": "In binary representation used in digital communication, information is encoded using:", "explanation": "Digital systems represent information using the binary number system, which has only two digits, 0 and 1, corresponding to two distinct voltage/signal levels.", "type": "mcq", "options": ["Letters of the alphabet only", "Ten digits, 0 to 9", "Continuous voltage levels between 0 and 5 volts", "Only two digits, 0 and 1"], "answer": 3}, {"q": "Which of the following is an advantage of digital communication over analog communication?", "explanation": "Because digital information is represented as numbers (bits), computers can easily store, compress, encrypt, and apply error-detection and correction techniques to it, which is much harder to do reliably with analog signals.", "type": "mcq", "options": ["Digital data can be easily processed, stored, compressed, and error-corrected using computers", "Digital signals always require more bandwidth than analog signals for the same information", "Digital communication cannot be encrypted", "Digital signals cannot be compressed to save transmission space"], "answer": 0}, {"q": "A major disadvantage of analog signal transmission over long distances is that:", "explanation": "Every time an analog signal is amplified or relayed, the noise picked up along the way is amplified together with the wanted signal, so the quality steadily worsens with distance.", "type": "mcq", "options": ["It cannot carry audio information", "It is impossible to amplify an analog signal", "The signal quality steadily degrades due to accumulated noise at each stage of amplification", "The signal automatically becomes digital after amplification"], "answer": 2}, {"q": "A telephone landline network historically using twisted-pair copper wires is an example of which type of communication channel?", "explanation": "Twisted-pair copper wire is a physical conductor along which the signal is guided, making it a wired communication channel.", "type": "mcq", "options": ["Satellite channel", "Wireless channel", "Wired channel", "Microwave channel"], "answer": 2}, {"q": "Optical fibre cables can carry information over much longer distances with less signal loss than copper cables of similar length.", "explanation": "Light pulses in optical fibres experience far less attenuation (signal loss) than electrical signals in copper wires, allowing much longer transmission distances between repeaters.", "type": "tf", "answer": true}, {"q": "Which of the following best explains why digital signals resist noise better than analog signals?", "explanation": "Because a digital receiver only needs to decide which of a few discrete levels (e.g. high/low) was sent, minor noise added during transmission is unlikely to push the signal past the threshold that would cause it to be misread.", "type": "mcq", "options": ["Digital signals travel faster than the speed of light", "Only a limited number of discrete levels need to be distinguished, so small noise does not usually change the interpreted value", "Digital circuits use higher voltages than analog circuits", "Digital signals are never transmitted through cables"], "answer": 1}, {"q": "Signal degradation refers to:", "explanation": "Signal degradation is the weakening or distortion of a signal (loss of quality or strength) as it travels along a transmission channel, often worsened by noise and attenuation.", "type": "mcq", "options": ["The encoding of data into binary form", "The process of converting a signal from digital to analog", "The amplification of a signal at a repeater station", "The gradual loss of quality or strength of a signal as it travels through a channel"], "answer": 3}, {"q": "Why can a digital signal be 'regenerated' (restored to its original clean form) at a repeater station more easily than an analog signal?", "explanation": "A repeater for a digital signal simply decides which discrete level (e.g. 0 or 1) was sent and outputs a fresh, clean version of that level, effectively removing accumulated noise; this is not possible for a continuously varying analog signal.", "type": "mcq", "options": ["Because digital signals are always transmitted using satellites", "Because digital signals never lose any energy while travelling", "Because analog signals are already free of noise", "Because digital receivers only need to detect which of a few discrete levels was intended, then reproduce a clean version of that exact level"], "answer": 3}, {"q": "Which of these is NOT typically listed as an advantage of digital signals over analog signals?", "explanation": "Digital signals are praised for noise immunity, ease of processing/storage, and error correction — but equipment cost is not a defining advantage and can even be higher for digital systems.", "type": "mcq", "options": ["Easier storage and processing using computers", "Ability to be compressed and error-corrected", "Better noise immunity", "Guaranteed zero cost of transmission equipment"], "answer": 3}, {"q": "A block diagram of a basic communication system is usually drawn in which order?", "explanation": "The standard order is Transmitter (sends the signal) → Channel (carries the signal) → Receiver (picks up the signal), representing the flow of the message from source to destination.", "type": "mcq", "options": ["Transmitter → Receiver → Channel", "Transmitter → Channel → Receiver", "Channel → Transmitter → Receiver", "Receiver → Channel → Transmitter"], "answer": 1}, {"q": "A device or system that converts a message signal so that it can be sent efficiently through a communication channel is called a ______.", "explanation": "The transmitter's role is to prepare and send the message signal into the channel toward the receiver.", "type": "fill", "answer": "transmitter"}, {"q": "In everyday use, a mobile phone communicates with the network's base station mainly using which type of channel?", "explanation": "Mobile phones communicate with nearby base stations using wireless radio frequency (including microwave) signals, without needing a physical cable connection.", "type": "mcq", "options": ["Optical fibre cable only", "Wireless radio/microwave signals", "Underground coaxial cable only", "Wired copper cable only"], "answer": 1}, {"q": "Household internet delivered through underground cables made of glass strands that carry pulses of light is an example of:", "explanation": "Fibre-optic internet uses thin glass or plastic strands to carry data as light pulses, making it a wired (guided) transmission channel.", "type": "mcq", "options": ["A wireless microwave channel", "A radio wave channel", "A satellite channel", "An optical fibre (wired) channel"], "answer": 3}, {"q": "A satellite communication system requires a signal to travel only along the ground between two fixed stations.", "explanation": "Satellite communication involves sending a signal up from a ground station to an orbiting satellite and then back down to another ground station, so the signal travels through space, not only along the ground.", "type": "tf", "answer": false}, {"q": "Which statement correctly compares analog and digital signals?", "explanation": "Analog signals vary smoothly and continuously, while digital signals jump between a fixed set of discrete values, which is the fundamental distinction between the two.", "type": "mcq", "options": ["Analog signals vary continuously, while digital signals use discrete values with abrupt transitions", "Digital signals cannot represent sound or images", "Analog signals are discrete, while digital signals vary continuously", "Both analog and digital signals are always identical in form"], "answer": 0}, {"q": "A key reason modern telecommunication systems (such as mobile networks and the internet) have largely shifted from analog to digital technology is:", "explanation": "Digital technology allows signals to be compressed, encrypted, error-corrected, easily processed by computers, and multiplexed (many signals sharing one channel), all while resisting noise better than analog signals.", "type": "mcq", "options": ["Digital systems offer better noise resistance, easier data processing, compression, security, and multiplexing of many signals", "Digital systems are completely immune to any signal loss and require no channel at all", "Digital signals travel only through the vacuum of space", "Analog systems cannot transmit any type of information"], "answer": 0}]}, {"unit": 10, "title": "Unit 10: Basic Electronic Components", "questions": [{"q": "Electronics is best described as the branch of science and technology dealing with:", "explanation": "Electronics deals with circuits built from components like resistors, capacitors, diodes and transistors that control small electric currents to process, store or transmit information/signals.", "type": "mcq", "options": ["The study of magnetism in permanent magnets only", "The generation of large amounts of electrical power in dams", "The chemical reactions that occur inside batteries", "The control and flow of electric current through devices such as diodes, transistors and resistors to process signals or information"], "answer": 3}, {"q": "Electronic components are generally divided into two broad categories, namely:", "explanation": "Electronic components are classified as passive (cannot amplify or control current on their own, e.g. resistors, capacitors, inductors) or active (can control/amplify current or voltage, e.g. diodes, transistors).", "type": "mcq", "options": ["Mechanical and chemical components", "Heavy components and light components", "Analog components and optical components", "Passive components and active components"], "answer": 3}, {"q": "A passive electronic component is one that:", "explanation": "Passive components such as resistors, capacitors and inductors do not amplify signals or add energy to a circuit; they only store energy, dissipate it as heat, or oppose changes in current/voltage.", "type": "mcq", "options": ["Can switch a circuit on and off using a control signal", "Can amplify an electrical signal using an external power source", "Cannot introduce net energy gain or amplify a signal; it only stores, dissipates, or opposes current", "Only works when connected to a computer"], "answer": 2}, {"q": "An active electronic component is one that:", "explanation": "Active components such as diodes and transistors can control, switch or amplify current or voltage, usually with the help of an external power supply.", "type": "mcq", "options": ["Only stores electric charge", "Never allows current to flow through it", "Is always made only of copper wire", "Can control, amplify, or switch an electric current using energy from an external source"], "answer": 3}, {"q": "Which of the following is classified as a passive electronic component?", "explanation": "Resistors, along with capacitors and inductors, are passive components; diodes, transistors and integrated circuits are active components.", "type": "mcq", "options": ["Transistor", "Resistor", "Integrated circuit", "Diode"], "answer": 1}, {"q": "Which of the following is classified as an active electronic component?", "explanation": "A transistor is an active component because it can amplify or switch electronic signals using an external power source; resistors, capacitors and inductors are passive.", "type": "mcq", "options": ["Transistor", "Resistor", "Capacitor", "Inductor"], "answer": 0}, {"q": "The main function of a resistor in an electronic circuit is to:", "explanation": "A resistor's job is to resist (limit) the flow of current in a circuit, which is used to control current levels and to divide or drop voltage as needed.", "type": "mcq", "options": ["Oppose (limit) the flow of electric current and control voltage/current levels", "Store electrical energy in an electric field", "Store electrical energy in a magnetic field", "Amplify a weak signal into a strong one"], "answer": 0}, {"q": "The unit used to measure resistance is the:", "explanation": "Resistance is measured in ohms (Ω), named after Georg Ohm; the farad is used for capacitance and the henry for inductance.", "type": "mcq", "options": ["Farad", "Henry", "Volt", "Ohm"], "answer": 3}, {"q": "A capacitor is a component that mainly:", "explanation": "A capacitor consists of two conducting plates separated by an insulating material (dielectric) and stores electrical energy in the electric field that forms between the plates when charged.", "type": "mcq", "options": ["Converts alternating current directly into light", "Stores electrical energy in an electric field between two conductive plates separated by an insulator", "Amplifies current using a control terminal", "Stores electrical energy in a magnetic field created by a coil of wire"], "answer": 1}, {"q": "The unit used to measure capacitance is the:", "explanation": "Capacitance is measured in farads (F), commonly seen as microfarads (μF) or picofarads (pF) in practical circuits.", "type": "mcq", "options": ["Henry", "Ohm", "Farad", "Ampere"], "answer": 2}, {"q": "An inductor is a passive component that mainly:", "explanation": "An inductor is typically a coil of wire that stores energy in a magnetic field created as current flows through it, and it opposes changes in current.", "type": "mcq", "options": ["Stores energy in a magnetic field when current flows through its coiled wire", "Converts light energy into electrical energy", "Stores energy purely as heat", "Blocks direct current completely while allowing no current at all"], "answer": 0}, {"q": "The unit used to measure inductance is the:", "explanation": "Inductance is measured in henries (H), named after Joseph Henry.", "type": "mcq", "options": ["Ohm", "Henry", "Farad", "Watt"], "answer": 1}, {"q": "Resistors, capacitors, and inductors are all classified as ______ electronic components because they do not amplify signals.", "explanation": "These three components store or oppose energy/current but cannot amplify a signal on their own, so they are grouped as passive components.", "type": "fill", "answer": "passive"}, {"q": "Diodes and transistors are examples of ______ electronic components because they can control or amplify current using an external power source.", "explanation": "Active components, unlike passive ones, can control, switch, or amplify electrical signals with help from a power supply.", "type": "fill", "answer": "active"}, {"q": "A diode is an active component that mainly:", "explanation": "A diode acts like a one-way valve for electric current: it conducts easily when forward biased and blocks current (ideally) when reverse biased, which is why diodes are used for rectification.", "type": "mcq", "options": ["Allows current to flow easily in only one direction and blocks it in the reverse direction", "Stores charge like a capacitor", "Only works with alternating current and never with direct current", "Allows current to flow equally well in both directions"], "answer": 0}, {"q": "A common everyday application of a diode is:", "explanation": "Diodes are commonly used in rectifier circuits to convert AC mains supply into DC, which many electronic devices need to operate.", "type": "mcq", "options": ["Amplifying a radio signal by a large factor", "Storing large amounts of electrical energy for backup power", "Converting alternating current (AC) into direct current (DC) in a rectifier circuit", "Producing a strong magnetic field for a motor"], "answer": 2}, {"q": "A light-emitting diode (LED) is a type of diode that:", "explanation": "An LED emits light when current flows through it in the forward direction, making it useful as an indicator light and in energy-efficient lighting.", "type": "mcq", "options": ["Blocks all current in both directions", "Only works when connected in reverse bias", "Stores electrical energy like a capacitor", "Converts electrical energy into light energy when forward biased"], "answer": 3}, {"q": "A transistor is an active component mainly used to:", "explanation": "Transistors can amplify small input signals into larger output signals, or switch currents on and off, forming the basis of modern electronic amplifiers, computers, and digital logic circuits.", "type": "mcq", "options": ["Amplify weak electrical signals or act as an electronic switch", "Store large amounts of charge for long periods", "Convert light directly into sound", "Only resist the flow of current, like a resistor"], "answer": 0}, {"q": "A basic bipolar transistor typically has how many terminals?", "explanation": "A standard bipolar junction transistor has three terminals: the base, the collector, and the emitter.", "type": "mcq", "options": ["Four", "One", "Three", "Two"], "answer": 2}, {"q": "A resistor can amplify a weak electrical signal into a stronger one.", "explanation": "A resistor is a passive component; it can only limit or oppose current flow and dissipate energy as heat, but it cannot amplify a signal — amplification requires an active component such as a transistor.", "type": "tf", "answer": false}, {"q": "A capacitor stores electrical energy in the form of an electric field between its plates.", "explanation": "When a capacitor is charged, opposite charges accumulate on its two plates, creating an electric field between them in which energy is stored.", "type": "tf", "answer": true}, {"q": "On a typical computer motherboard, small cylindrical or disc-shaped components with coloured bands (or numbers) that limit current in various circuits are most likely:", "explanation": "Resistors are commonly seen on circuit boards as small components, often coded with colour bands or printed numbers, used to control current flow in different parts of the circuit.", "type": "mcq", "options": ["Inductors only", "Resistors", "Diodes", "Transistors"], "answer": 1}, {"q": "On a motherboard, small cylindrical components (often with a polarity mark) that store charge and help smooth out voltage fluctuations are most likely:", "explanation": "Capacitors on motherboards are often seen as small cylindrical (electrolytic) or flat (ceramic) components, used to filter and smooth voltage supplied to other components.", "type": "mcq", "options": ["Switches", "Resistors", "Transistors", "Capacitors"], "answer": 3}, {"q": "The main integrated circuit (chip) on a motherboard, such as the central processing unit (CPU), is built up mainly from millions of tiny:", "explanation": "Modern integrated circuits like a CPU contain millions to billions of microscopic transistors that switch on and off to perform logical and arithmetic operations.", "type": "mcq", "options": ["Inductors only", "Capacitors only", "Transistors", "Resistors only"], "answer": 2}, {"q": "Which of the following is a real-life application that mainly relies on the switching/amplifying property of transistors?", "explanation": "Transistors are the building blocks of amplifiers (e.g., in phone/audio circuits) and digital logic gates (used inside computer processors), relying on their ability to amplify or switch current.", "type": "mcq", "options": ["A simple length of wire used as a fuse", "A resistor used only to complete a circuit with zero effect", "A mobile phone amplifier circuit and digital logic gates in a computer processor", "A capacitor used purely for decoration"], "answer": 2}, {"q": "A component made of a coil of wire that stores energy in a magnetic field when current passes through it is called an ______.", "explanation": "An inductor stores magnetic energy and opposes sudden changes in current, and is typically constructed as a coil of wire.", "type": "fill", "answer": "inductor"}, {"q": "Why are capacitors often used in power supply circuits of electronic devices?", "explanation": "Capacit
